<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Thiago Patrick — site pessoal em construção.">
  <meta name="theme-color" content="#111111">
  <title>Thiago Patrick — Em construção</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f7f5;
      --text: #171717;
      --muted: #6b6b6b;
      --line: #deded9;
      --accent: #171717;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --text: #f2f2ef;
        --muted: #a4a4a0;
        --line: #2c2c2a;
        --accent: #f2f2ef;
      }
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    header {
      width: 100%;
      padding: 28px clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .status::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
    }

    main {
      flex: 1;
      width: min(100%, 960px);
      margin: 0 auto;
      padding: clamp(80px, 16vh, 180px) clamp(24px, 6vw, 72px);
      display: flex;
      align-items: center;
    }

    .content {
      max-width: 700px;
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-size: clamp(46px, 8vw, 92px);
      line-height: 0.96;
      letter-spacing: -0.055em;
      font-weight: 720;
    }

    .description {
      max-width: 560px;
      margin: 30px 0 0;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 20px);
      line-height: 1.6;
    }

    .line {
      width: 100%;
      height: 1px;
      margin: 48px 0 0;
      background: var(--line);
    }

    footer {
      width: 100%;
      padding: 24px clamp(24px, 5vw, 72px);
      color: var(--muted);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 22px;
        padding-bottom: 22px;
      }

      .status {
        font-size: 12px;
      }

      main {
        padding-top: 80px;
        padding-bottom: 80px;
      }

      h1 {
        font-size: clamp(48px, 16vw, 72px);
      }

      .description {
        margin-top: 24px;
        font-size: 16px;
      }

      .line {
        margin-top: 36px;
      }

      footer {
        flex-direction: column;
        padding-top: 18px;
        padding-bottom: 18px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">Thiago Patrick</div>
    <div class="status">Em construção</div>
  </header>

  <main>
    <section class="content" aria-labelledby="title">
      <p class="eyebrow">Site pessoal</p>
      <h1 id="title">Em construção.</h1>
      <p class="description">
        Este espaço está sendo preparado. Em breve, novas ideias, textos
        e conteúdos estarão por aqui.
      </p>
      <div class="line" aria-hidden="true"></div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> Thiago Patrick</span>
    <span>Volte em breve.</span>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
