data = p, col = c(\"darkorange\", \"purple\", \"cyan4\"),\n        main = \"Massa corporal por espécie\", ylab = \"Massa (g)\")","a":"A caixa da Gentoo fica bem acima das outras duas, que se sobrepõem.","m":"plot"},{"stage":"Gráfico","x":"Faça o gráfico de dispersão nadadeira × massa, com uma cor por espécie e legenda.","dd":"col = cores[factor(p$especie)] e legend().","s":"cores <- c(\"darkorange\", \"purple\", \"cyan4\")\nesp <- factor(p$especie)\nplot(p$nadadeira, p$massa, col = cores[esp], pch = 19,\n     xlab = \"Nadadeira (mm)\", ylab = \"Massa (g)\")\nlegend(\"topleft\", legend = levels(esp), col = cores, pch = 19)","a":"Os Gentoo formam um grupo separado, no canto superior direito.","m":"plot"},{"stage":"Exportar","x":"Salve a base limpa `p` em \"pinguins_limpo.csv\" (sem números de linha) e confira que o arquivo existe.","dd":"write.csv(p, \"arquivo.csv\", row.names = FALSE).","s":"write.csv(p, \"pinguins_limpo.csv\", row.names = FALSE)\nfile.exists(\"pinguins_limpo.csv\")","a":"TRUE: arquivo criado.","out":"[1] TRUE"}]},{"id":"gapminder","emoji":"🌍","title":"Gapminder: 50 anos de desenvolvimento","level":"Médio","lang":"r","u":["https://raw.githubusercontent.com/jennybc/gapminder/main/inst/extdata/gapminder.tsv"],"f":["gapminder.tsv"],"p":"https://www.gapminder.org/data/","i":"Expectativa de vida, população e PIB per capita de 142 países, de 5 em 5 anos (1952 a 2007). O arquivo é separado por TAB (.tsv). Tamanho: 82 KB.","c":"country — país (em inglês)\ncontinent — continente\nyear — ano (1952, 1957, ..., 2007)\nlifeExp — expectativa de vida ao nascer (anos)\npop — população\ngdpPercap — PIB per capita (dólares internacionais de 2005)","steps":[{"stage":"Importar","x":"O arquivo é separado por TAB. Leia-o para `gap` e mostre as dimensões e as 3 primeiras linhas.","dd":"read.delim() já espera TAB. Também funciona read.table(..., sep = \"\\t\", header = TRUE).","s":"gap <- read.delim(\"https://raw.githubusercontent.com/jennybc/gapminder/main/inst/extdata/gapminder.tsv\")\ndim(gap)\nhead(gap, 3)","a":"1704 linhas e 6 colunas.","out":"[1] 1704    6\n      country continent year lifeExp      pop gdpPercap\n1 Afghanistan      Asia 1952  28.801  8425333  779.4453\n2 Afghanistan      Asia 1957  30.332  9240934  820.8530\n3 Afghanistan      Asia 1962  31.997 10267083  853.1007"},{"stage":"Conhecer","x":"Quantos países, continentes e anos diferentes existem?","dd":"length(unique(...)) para cada coluna.","s":"length(unique(gap$country))\nlength(unique(gap$continent))\nunique(gap$year)","a":"142 países, 5 continentes e 12 anos (de 1952 a 2007, de 5 em 5).","out":"[1] 142\n[1] 5\n [1] 1952 1957 1962 1967 1972 1977 1982 1987 1992 1997 2002 2007"},{"stage":"Responder","x":"Como evoluiu a expectativa de vida do Brasil? Mostre ano e lifeExp.","dd":"Filtre country == \"Brazil\".","s":"brasil <- gap[gap$country == \"Brazil\", c(\"year\", \"lifeExp\", \"pop\")]\nbrasil[, c(\"year\", \"lifeExp\")]","a":"De 50,9 anos em 1952 para 72,4 anos em 2007.","z":"library(dplyr)\nbrasil <- gap |> filter(country == \"Brazil\") |> select(year, lifeExp, pop)","out":"    year lifeExp\n169 1952  50.917\n170 1957  53.285\n171 1962  55.665\n172 1967  57.632\n173 1972  59.504\n174 1977  61.489\n175 1982  63.336\n176 1987  65.205\n177 1992  67.057\n178 1997  69.388\n179 2002  71.006\n180 2007  72.390"},{"stage":"Responder","x":"Em que ano o Brasil passou de 100 milhões de habitantes (nesta série de 5 em 5 anos)?","dd":"Filtre pop > 1e8 e pegue o menor ano.","s":"min(brasil$year[brasil$pop > 1e8])","a":"1972.","out":"[1] 1972"},{"stage":"Manipular","x":"Em 2007, quais os 5 países com maior expectativa de vida? E os 5 com menor?","dd":"Filtre 2007 e ordene com order().","s":"g07 <- gap[gap$year == 2007, ]\nhead(g07[order(g07$lifeExp, decreasing = TRUE), c(\"country\", \"lifeExp\")], 5)\nhead(g07[order(g07$lifeExp), c(\"country\", \"lifeExp\")], 5)","a":"Maiores: Japão (82,6), Hong Kong, Islândia, Suíça, Austrália. Menores: Suazilândia (39,6), Moçambique, Zâmbia, Serra Leoa, Lesoto.","z":"library(dplyr)\ngap |> filter(year == 2007) |> arrange(desc(lifeExp)) |> select(country, lifeExp) |> head(5)","out":"              country lifeExp\n804             Japan  82.603\n672  Hong Kong, China  82.208\n696           Iceland  81.757\n1488      Switzerland  81.701\n72          Australia  81.235\n          country lifeExp\n1464    Swaziland  39.613\n1044   Mozambique  42.082\n1692       Zambia  42.384\n1356 Sierra Leone  42.568\n888       Lesotho  42.592"},{"stage":"Manipular","x":"Crie a coluna `pib_total` = pop × gdpPercap (em bilhões: divida por 1e9). Quais os 5 maiores PIBs em 2007?","dd":"Crie a coluna na base inteira e depois filtre 2007.","s":"gap$pib_total <- gap$pop * gap$gdpPercap / 1e9\ng07 <- gap[gap$year == 2007, ]\nhead(g07[order(g07$pib_total, decreasing = TRUE), c(\"country\", \"pib_total\")], 5)","a":"Estados Unidos, China, Japão, Índia e Alemanha.","out":"           country pib_total\n1620 United States 12934.459\n300          China  6539.501\n804          Japan  4035.135\n708          India  2722.925\n576        Germany  2650.871"},{"stage":"Responder","x":"Qual a expectativa de vida média por continente em 2007? (1 casa)","dd":"aggregate(lifeExp ~ continent, data = g07, FUN = mean).","s":"r <- aggregate(lifeExp ~ continent, data = g07, FUN = mean)\nr$lifeExp <- round(r$lifeExp, 1)\nr[order(r$lifeExp), ]","a":"África 54,8 · Ásia 70,7 · Américas 73,6 · Europa 77,6 · Oceania 80,7.","out":"  continent lifeExp\n1    Africa    54.8\n3      Asia    70.7\n2  Americas    73.6\n4    Europe    77.6\n5   Oceania    80.7"},{"stage":"Manipular","x":"Qual país teve o MAIOR ganho de expectativa de vida entre 1952 e 2007? E algum país perdeu?","dd":"Faça duas tabelas (1952 e 2007), junte com merge() por country e subtraia.","s":"a <- gap[gap$year == 1952, c(\"country\", \"lifeExp\")]\nb <- gap[gap$year == 2007, c(\"country\", \"lifeExp\")]\nd <- merge(a, b, by = \"country\", suffixes = c(\"_1952\", \"_2007\"))\nd$ganho <- d$lifeExp_2007 - d$lifeExp_1952\nhead(d[order(d$ganho, decreasing = TRUE), c(\"country\", \"ganho\")], 3)\nd[d$ganho < 0, c(\"country\", \"ganho\")]","a":"Maior ganho: Omã (+38,1 anos). Perderam: Suazilândia e Zimbábue (efeito da epidemia de HIV/aids).","out":"      country  ganho\n97       Oman 38.062\n138   Vietnam 33.837\n60  Indonesia 33.182\n      country  ganho\n122 Swaziland -1.794\n142  Zimbabwe -4.964"},{"stage":"Manipular","x":"Monte uma tabela \"larga\" com a expectativa de vida de Brasil, Argentina e Chile: uma linha por ano e uma coluna por país.","dd":"Com tidyr: pivot_wider(names_from = country, values_from = lifeExp).","s":"library(dplyr)\nlibrary(tidyr)\ngap |>\n  filter(country %in% c(\"Brazil\", \"Argentina\", \"Chile\")) |>\n  select(year, country, lifeExp) |>\n  pivot_wider(names_from = country, values_from = lifeExp)","a":"12 linhas (anos) × 4 colunas (year, Argentina, Brazil, Chile).","pk":["dplyr","tidyr"]},{"stage":"Gráfico","x":"Faça a dispersão do PIB per capita (eixo x, em escala log) pela expectativa de vida em 2007 e calcule a correlação entre log(gdpPercap) e lifeExp.","dd":"plot(x, y, log = \"x\") e cor(log(x), y).","s":"plot(g07$gdpPercap, g07$lifeExp, log = \"x\", pch = 19, col = \"steelblue\",\n     xlab = \"PIB per capita (log)\", ylab = \"Expectativa de vida\")\nround(cor(log(g07$gdpPercap), g07$lifeExp), 3)","a":"r = 0,809: países mais ricos tendem a viver mais.","m":"plot"},{"stage":"Gráfico","x":"Desenhe a evolução da expectativa de vida de Brasil, Argentina e Chile no mesmo gráfico de linhas, com legenda.","dd":"plot() para o primeiro país e lines() para os outros.","s":"br <- gap[gap$country == \"Brazil\", ]\nar <- gap[gap$country == \"Argentina\", ]\ncl <- gap[gap$country == \"Chile\", ]\nplot(br$year, br$lifeExp, type = \"l\", col = \"darkgreen\", lwd = 2, ylim = c(40, 80),\n     xlab = \"Ano\", ylab = \"Expectativa de vida\")\nlines(ar$year, ar$lifeExp, col = \"skyblue3\", lwd = 2)\nlines(cl$year, cl$lifeExp, col = \"red\", lwd = 2)\nlegend(\"bottomright\", legend = c(\"Brasil\", \"Argentina\", \"Chile\"),\n       col = c(\"darkgreen\", \"skyblue3\", \"red\"), lwd = 2)","a":"As três linhas sobem; o Brasil começa mais baixo e vai se aproximando dos vizinhos.","m":"plot"}]},{"id":"municipios","emoji":"🇧🇷","title":"Municípios do Brasil: juntando tabelas","level":"Médio","lang":"r","u":["https://raw.githubusercontent.com/kelvins/Municipios-Brasileiros/main/csv/municipios.csv","https://raw.githubusercontent.com/kelvins/Municipios-Brasileiros/main/csv/estados.csv"],"f":["municipios.csv","estados.csv"],"p":"https://github.com/kelvins/Municipios-Brasileiros","i":"Duas tabelas: todos os municípios brasileiros (com código do IBGE, coordenadas, DDD, fuso) e os 27 estados (com região). Para responder às perguntas, é preciso JUNTAR as duas pela coluna codigo_uf. Tamanho: 400 KB.","c":"municipios.csv:\ncodigo_ibge — código do município no IBGE\nnome — nome do município\nlatitude / longitude — coordenadas\ncapital — 1 se é capital, 0 se não\ncodigo_uf — código do estado (liga com estados.csv)\nddd — DDD telefônico\nfuso_horario — fuso horário\nestados.csv:\ncodigo_uf — código do estado\nuf — sigla (GO, SP...)\nnome — nome do estado\nregiao — região (Norte, Nordeste, Sudeste, Sul, Centro-Oeste)","steps":[{"stage":"Importar","x":"Leia as duas tabelas em `mun` e `est`, mostre as dimensões e os nomes das colunas de `est`.","dd":"read.csv() duas vezes e names(est).","s":"mun <- read.csv(\"https://raw.githubusercontent.com/kelvins/Municipios-Brasileiros/main/csv/municipios.csv\")\nest <- read.csv(\"https://raw.githubusercontent.com/kelvins/Municipios-Brasileiros/main/csv/estados.csv\")\ndim(mun)\ndim(est)\nnames(est)","a":"5571 municípios (5570 + o Distrito Federal) e 27 estados. Atenção: no Windows, a primeira coluna de est pode aparecer com um nome estranho (\"ï..codigo_uf\" ou \"X.U.FEFF.codigo_uf\"). É um caractere invisível (BOM) no começo do arquivo; a próxima etapa resolve.","out":"[1] 5571    9\n[1] 27  6\n[1] \"codigo_uf\" \"uf\"        \"nome\"      \"latitude\"  \"longitude\" \"regiao\"   "},{"stage":"Limpar","x":"Leia de novo estados.csv avisando a codificação com fileEncoding = \"UTF-8-BOM\" (assim o nome da primeira coluna fica certo em qualquer computador) e confira os nomes.","dd":"O argumento fileEncoding resolve o caractere invisível.","s":"est <- read.csv(\"https://raw.githubusercontent.com/kelvins/Municipios-Brasileiros/main/csv/estados.csv\",\n                fileEncoding = \"UTF-8-BOM\")\nnames(est)","a":"A primeira coluna se chama codigo_uf, sem caracteres estranhos.","out":"[1] \"codigo_uf\" \"uf\"        \"nome\"      \"latitude\"  \"longitude\" \"regiao\"   "},{"stage":"Manipular","x":"Junte as tabelas pela coluna codigo_uf, trazendo para `mun` só a sigla (uf) e a região. Quantas linhas tem o resultado?","dd":"merge(mun, est[, c(\"codigo_uf\", \"uf\", \"regiao\")], by = \"codigo_uf\"). Trazer só essas colunas evita conflito entre os dois \"nome\".","s":"br <- merge(mun, est[, c(\"codigo_uf\", \"uf\", \"regiao\")], by = \"codigo_uf\")\nnrow(br)\nhead(br[, c(\"nome\", \"uf\", \"regiao\")], 3)","a":"5571 linhas: todos os municípios encontraram o seu estado.","z":"library(dplyr)\nbr <- mun |> left_join(select(est, codigo_uf, uf, regiao), by = \"codigo_uf\")","out":"[1] 5571\n                      nome uf regiao\n1 São Francisco do Guaporé RO  Norte\n2             Castanheiras RO  Norte\n3       Machadinho D'Oeste RO  Norte"},{"stage":"Responder","x":"Quantos municípios há em cada região? Ordene do maior para o menor.","dd":"sort(table(br$regiao), decreasing = TRUE).","s":"sort(table(br$regiao), decreasing = TRUE)","a":"Nordeste 1794 · Sudeste 1668 · Sul 1191 · Centro-Oeste 468 · Norte 450.","out":"\n    Nordeste      Sudeste          Sul Centro-Oeste        Norte \n        1794         1668         1191          468          450 "},{"stage":"Responder","x":"Quais os 5 estados com mais municípios? E quantos municípios tem Goiás?","dd":"table(br$uf), ordene e use head(). Para Goiás: sum(br$uf == \"GO\").","s":"head(sort(table(br$uf), decreasing = TRUE), 5)\nsum(br$uf == \"GO\")","a":"MG 853 · SP 645 · RS 497 · BA 417 · PR 399. Goiás tem 246 municípios.","out":"\n MG  SP  RS  BA  PR \n853 645 497 417 399 \n[1] 246"},{"stage":"Responder","x":"Liste as capitais com a sigla do estado, em ordem alfabética.","dd":"Filtre capital == 1 e ordene pelo nome.","s":"cap <- br[br$capital == 1, c(\"nome\", \"uf\")]\ncap[order(cap$nome), ]","a":"27 capitais, de Aracaju (SE) a Vitória (ES).","out":"               nome uf\n1804        Aracaju SE\n2591 Belo Horizonte MG\n165           Belém PA\n138       Boa Vista RR\n5571       Brasília DF\n5130   Campo Grande MS\n5216         Cuiabá MT\n4064       Curitiba PR\n4517  Florianópolis SC\n937       Fortaleza CE\n5431        Goiânia GO\n1275    João Pessoa PB\n298          Macapá AP\n1692         Maceió AL\n126          Manaus AM\n1081          Natal RN\n343          Palmas TO\n5042   Porto Alegre RS\n20      Porto Velho RO\n1624         Recife PE\n64       Rio Branco AC\n3212 Rio de Janeiro RJ\n1980       Salvador BA\n573        São Luís MA\n3902      São Paulo SP\n877        Teresina PI\n3158        Vitória ES"},{"stage":"Responder","x":"Quantos municípios começam com \"São \" ? E qual é o nome de município mais longo?","dd":"grepl(\"^São \", nome) e nchar().","s":"sum(grepl(\"^São \", br$nome))\nbr$nome[which.max(nchar(br$nome))]","a":"344 municípios começam com \"São \". O nome mais longo é \"Vila Bela da Santíssima Trindade\" (MT).","out":"[1] 344\n[1] \"Vila Bela da Santíssima Trindade\""},{"stage":"Responder","x":"Existem municípios com o MESMO nome em estados diferentes? Quantos nomes se repetem? Mostre os 3 nomes mais repetidos.","dd":"table(br$nome), depois filtre os que aparecem mais de uma vez.","s":"t <- table(br$nome)\nsum(t > 1)\nhead(sort(t, decreasing = TRUE), 3)","a":"232 nomes aparecem mais de uma vez. Os campeões: Bom Jesus (5), São Domingos (5) e Bonito (4).","out":"[1] 232\n\n   Bom Jesus São Domingos       Bonito \n           5            5            4 "},{"stage":"Responder","x":"Quais são os municípios mais ao norte, ao sul, a leste e a oeste do país?","dd":"which.max() e which.min() em latitude e longitude.","s":"br[which.max(br$latitude), c(\"nome\", \"uf\")]\nbr[which.min(br$latitude), c(\"nome\", \"uf\")]\nbr[which.max(br$longitude), c(\"nome\", \"uf\")]\nbr[which.min(br$longitude), c(\"nome\", \"uf\")]","a":"Norte: Uiramutã (RR) · Sul: Chuí (RS) · Leste: Fernando de Noronha (PE) · Oeste: Mâncio Lima (AC).","out":"        nome uf\n137 Uiramutã RR\n     nome uf\n4641 Chuí RS\n                    nome uf\n1522 Fernando de Noronha PE\n          nome uf\n60 Mâncio Lima AC"},{"stage":"Responder","x":"Quantos municípios usam cada fuso horário? E qual o DDD que atende mais municípios?","dd":"table() de fuso_horario e de ddd.","s":"sort(table(br$fuso_horario), decreasing = TRUE)\nnames(which.max(table(br$ddd)))","a":"America/Sao_Paulo 5198 · America/Porto_Velho 337 · America/Rio_Branco 35 · America/Noronha 1. O DDD que atende mais municípios é o 83 (Paraíba).","out":"\n  America/Sao_Paulo America/Porto_Velho  America/Rio_Branco     America/Noronha \n               5198                 337                  35                   1 \n[1] \"83\""},{"stage":"Gráfico","x":"Faça um \"mapa\" do Brasil: um ponto por município (longitude no x, latitude no y), uma cor por região, e as capitais em destaque.","dd":"plot(longitude, latitude, pch = \".\") e points() para as capitais.","s":"cores <- c(\"Centro-Oeste\" = \"orange\", \"Nordeste\" = \"red\", \"Norte\" = \"darkgreen\",\n           \"Sudeste\" = \"blue\", \"Sul\" = \"purple\")\nplot(br$longitude, br$latitude, pch = 20, cex = 0.3, col = cores[br$regiao],\n     asp = 1, xlab = \"Longitude\", ylab = \"Latitude\", main = \"Municípios do Brasil\")\ncapitais <- br[br$capital == 1, ]\npoints(capitais$longitude, capitais$latitude, pch = 17, cex = 1)\nlegend(\"bottomleft\", legend = names(cores), col = cores, pch = 20)","a":"O contorno do Brasil aparece só com os pontos! O litoral e o Sudeste são muito mais densos que o Norte.","m":"plot"}]},{"id":"netflix","emoji":"🎬","title":"Netflix: textos e datas bagunçados","level":"Difícil","lang":"r","u":["https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2021/2021-04-20/netflix_titles.csv"],"f":["netflix_titles.csv"],"p":"https://github.com/rfordatascience/tidytuesday/tree/main/data/2021/2021-04-20","i":"Catálogo da Netflix (até 2021) com 7787 filmes e séries: diretor, elenco, país, data de inclusão, duração e gêneros. Os textos vêm \"sujos\": datas por extenso em inglês com espaços sobrando, duração misturando minutos e temporadas, vários gêneros na mesma célula. Tamanho: 3 MB.","c":"show_id — código do título\ntype — Movie (filme) ou TV Show (série)\ntitle — título\ndirector — diretor(es)\ncast — elenco\ncountry — país (às vezes vários, separados por vírgula)\ndate_added — data em que entrou no catálogo (ex.: \"August 14, 2020\")\nrelease_year — ano de lançamento\nrating — classificação indicativa\nduration — \"93 min\" (filmes) ou \"4 Seasons\" (séries)\nlisted_in — gêneros, separados por vírgula\ndescription — sinopse","steps":[{"stage":"Importar","x":"Leia a base para `nf` já transformando células vazias em NA (na.strings = \"\"). Mostre as dimensões e os NA por coluna.","dd":"read.csv(url, na.strings = \"\") e colSums(is.na()).","s":"nf <- read.csv(\"https://raw.githubusercontent.com/rfordatascience/tidytuesday/main/data/2021/2021-04-20/netflix_titles.csv\",\n               na.strings = \"\")\ndim(nf)\ncolSums(is.na(nf))","a":"7787 títulos e 12 colunas. Mais NA em director (2389), cast (718) e country (507).","out":"[1] 7787   12\n     show_id         type        title     director         cast      country \n           0            0            0         2389          718          507 \n  date_added release_year       rating     duration    listed_in  description \n          10            0            7            0            0            0 "},{"stage":"Conhecer","x":"Quantos filmes e quantas séries? Qual o percentual de cada?","dd":"table() e prop.table().","s":"table(nf$type)\nround(prop.table(table(nf$type)) * 100, 1)","a":"5377 filmes (69,1%) e 2410 séries (30,9%).","out":"\n  Movie TV Show \n   5377    2410 \n\n  Movie TV Show \n   69.1    30.9 "},{"stage":"Limpar","x":"A coluna date_added tem espaços sobrando no começo de alguns valores. Remova-os e converta para data (o formato é \"Mês dia, ano\" em inglês). Quantas datas ficaram NA?","dd":"trimws() e depois as.Date(x, format = \"%B %d, %Y\"). Com lubridate, mdy() faz o mesmo.","s":"nf$date_added <- trimws(nf$date_added)\nnf$data <- as.Date(nf$date_added, format = \"%B %d, %Y\")\nsum(is.na(nf$data))\nrange(nf$data, na.rm = TRUE)","a":"Só 10 ficam NA (as que já eram vazias). As datas vão de 2008 a 2021.","z":"library(lubridate)\nnf$data <- mdy(trimws(nf$date_added))","out":"[1] 10\n[1] \"2008-01-01\" \"2021-01-16\""},{"stage":"Responder","x":"Em que ano a Netflix mais adicionou títulos? Faça a contagem por ano de inclusão.","dd":"format(data, \"%Y\") e table().","s":"nf$ano_inclusao <- as.numeric(format(nf$data, \"%Y\"))\ntable(nf$ano_inclusao)\nnames(which.max(table(nf$ano_inclusao)))","a":"O pico foi em 2019 (2153 títulos).","out":"\n2008 2009 2010 2011 2012 2013 2014 2015 2016 2017 2018 2019 2020 2021 \n   2    2    1   13    3   11   25   88  443 1225 1685 2153 2009  117 \n[1] \"2019\""},{"stage":"Limpar","x":"Separe a duração: crie `minutos` para os filmes (número antes de \" min\") e `temporadas` para as séries. Qual a duração média dos filmes e o filme mais longo?","dd":"as.numeric(sub(\" min\", \"\", duration)) só nas linhas de filme.","s":"filmes <- nf[nf$type == \"Movie\", ]\nfilmes$minutos <- as.numeric(sub(\" min\", \"\", filmes$duration))\nround(mean(filmes$minutos), 1)\nfilmes[which.max(filmes$minutos), c(\"title\", \"minutos\")]","a":"Média de 99,3 minutos. O mais longo: \"Black Mirror: Bandersnatch\" (312 min).","out":"[1] 99.3\n                         title minutos\n958 Black Mirror: Bandersnatch     312"},{"stage":"Responder","x":"Entre as séries, quantas têm só 1 temporada? Qual o percentual?","dd":"series$temporadas <- as.numeric(sub(\" Seasons?\", \"\", duration)). O ? torna o \"s\" opcional.","s":"series <- nf[nf$type == \"TV Show\", ]\nseries$temporadas <- as.numeric(sub(\" Seasons?\", \"\", series$duration))\nsum(series$temporadas == 1)\nround(mean(series$temporadas == 1) * 100, 1)","a":"1608 séries têm 1 temporada (66,7%).","out":"[1] 1608\n[1] 66.7"},{"stage":"Responder","x":"Quantos títulos têm \"Brazil\" entre os países? Quantos são filmes e quantos são séries?","dd":"grepl(\"Brazil\", country). Cuidado: country tem NA, então use which() ou %in%.","s":"br <- nf[grepl(\"Brazil\", nf$country), ]\nnrow(br)\ntable(br$type)","a":"88 títulos com participação do Brasil: 59 filmes e 29 séries.","out":"[1] 88\n\n  Movie TV Show \n     59      29 "},{"stage":"Manipular","x":"Qual é o gênero mais comum? Separe a coluna listed_in pelas vírgulas, junte tudo num vetor e conte.","dd":"strsplit(listed_in, \", \") devolve uma lista; unlist() junta tudo.","s":"generos <- unlist(strsplit(nf$listed_in, \", \"))\nhead(sort(table(generos), decreasing = TRUE), 5)","a":"International Movies (2437), Dramas (2106), Comedies (1471), International TV Shows (1199), Documentaries (786).","z":"library(dplyr)\nlibrary(tidyr)\nnf |> separate_rows(listed_in, sep = \", \") |> count(listed_in, sort = TRUE) |> head(5)","out":"generos\n  International Movies                 Dramas               Comedies \n                  2437                   2106                   1471 \nInternational TV Shows          Documentaries \n                  1199                    786 "},{"stage":"Responder","x":"Quais os 3 diretores com mais títulos (ignorando NA)?","dd":"head(sort(table(nf$director), decreasing = TRUE), 3). table() ignora NA por padrão.","s":"head(sort(table(nf$director), decreasing = TRUE), 3)","a":"Raúl Campos e Jan Suter (18, juntos), Marcus Raboy (16), Jay Karas (14).","out":"\nRaúl Campos, Jan Suter           Marcus Raboy              Jay Karas \n                    18                     16                     14 "},{"stage":"Responder","x":"Quanto tempo (em anos) os títulos levam, em mediana, entre o lançamento e a entrada na Netflix?","dd":"ano_inclusao - release_year e median(..., na.rm = TRUE).","s":"nf$espera <- nf$ano_inclusao - nf$release_year\nmedian(nf$espera, na.rm = TRUE)\nsummary(nf$espera)","a":"Mediana de 1 ano. Mas há títulos com décadas de espera (filmes antigos).","out":"[1] 1\n   Min. 1st Qu.  Median    Mean 3rd Qu.    Max.     NAs \n -3.000   0.000   1.000   4.557   5.000  93.000      10 "},{"stage":"Gráfico","x":"Faça um gráfico de barras com o número de títulos adicionados por ano, separando filmes e séries (barras empilhadas, com legenda).","dd":"barplot(table(type, ano_inclusao), legend.text = TRUE).","s":"tab <- table(nf$type, nf$ano_inclusao)\nbarplot(tab, col = c(\"firebrick\", \"gray40\"), legend.text = TRUE,\n        args.legend = list(x = \"topleft\"), las = 2,\n        main = \"Títulos adicionados por ano\")","a":"As barras crescem rápido a partir de 2016, com pico em 2019.","m":"plot"},{"stage":"Gráfico","x":"Faça o histograma da duração dos filmes e marque a média com uma linha vertical.","dd":"hist() e abline(v = média).","s":"hist(filmes$minutos, breaks = 40, col = \"lightblue\", main = \"Duração dos filmes\", xlab = \"Minutos\")\nabline(v = mean(filmes$minutos), col = \"red\", lwd = 2)","a":"A maioria dos filmes fica entre 80 e 120 minutos; há uma cauda de filmes curtos (especiais) e longos.","m":"plot"}]},{"id":"chinook","emoji":"🎵","title":"Chinook: a loja de música em SQL","level":"Médio","lang":"sql","u":["https://raw.githubusercontent.com/lerocha/chinook-database/master/ChinookDatabase/DataSources/Chinook_Sqlite.sqlite"],"f":["Chinook_Sqlite.sqlite"],"p":"https://github.com/lerocha/chinook-database","i":"Banco de dados de uma loja de música digital: artistas, álbuns, faixas, gêneros, clientes, funcionários e vendas (notas fiscais). São 11 tabelas ligadas por chaves — perfeito para treinar SELECT, JOIN, GROUP BY e HAVING. Aqui no navegador o banco é carregado sozinho; no RStudio, use o código da primeira etapa. Tamanho: 1 MB.","c":"Artist (ArtistId, Name) — artistas\nAlbum (AlbumId, Title, ArtistId) — álbuns\nTrack (TrackId, Name, AlbumId, GenreId, Milliseconds, UnitPrice...) — faixas\nGenre (GenreId, Name) — gêneros\nCustomer (CustomerId, FirstName, LastName, City, Country, SupportRepId...) — clientes\nEmployee (EmployeeId, FirstName, LastName, Title, ReportsTo...) — funcionários\nInvoice (InvoiceId, CustomerId, InvoiceDate, BillingCountry, Total) — notas fiscais\nInvoiceLine (InvoiceLineId, InvoiceId, TrackId, UnitPrice, Quantity) — itens de cada nota","steps":[{"stage":"Importar","x":"Liste as tabelas do banco. (No RStudio: baixe o arquivo com download.file(url, \"chinook.sqlite\", mode = \"wb\"), conecte com dbConnect(RSQLite::SQLite(), \"chinook.sqlite\") e rode as consultas com dbGetQuery().)","dd":"A tabela sqlite_master guarda o \"catálogo\" do banco.","s":"SELECT name FROM sqlite_master WHERE type = 'table' ORDER BY name","a":"11 tabelas: Album, Artist, Customer, Employee, Genre, Invoice, InvoiceLine, MediaType, Playlist, PlaylistTrack, Track.","sql":{"c":["name"],"v":[["Album"],["Artist"],["Customer"],["Employee"],["Genre"],["Invoice"],["InvoiceLine"],["MediaType"],["Playlist"],["PlaylistTrack"],["Track"]]}},{"stage":"Conhecer","x":"Quantos clientes, faixas e notas fiscais existem? (uma consulta com 3 subconsultas)","dd":"SELECT (SELECT COUNT(*) FROM Customer) AS clientes, ...","s":"SELECT (SELECT COUNT(*) FROM Customer) AS clientes,\n       (SELECT COUNT(*) FROM Track) AS faixas,\n       (SELECT COUNT(*) FROM Invoice) AS notas","a":"59 clientes, 3503 faixas e 412 notas fiscais.","sql":{"c":["clientes","faixas","notas"],"v":[[59,3503,412]]}},{"stage":"Responder","x":"Quais os 5 países com mais clientes?","dd":"GROUP BY Country, ORDER BY e LIMIT.","s":"SELECT Country, COUNT(*) AS clientes\nFROM Customer\nGROUP BY Country\nORDER BY clientes DESC, Country\nLIMIT 5","a":"USA 13 · Canada 8 · Brazil 5 · France 5 · Germany 4.","sql":{"c":["Country","clientes"],"v":[["USA",13],["Canada",8],["Brazil",5],["France",5],["Germany",4]]}},{"stage":"Responder","x":"Qual o faturamento total da loja e o valor médio por nota? (2 casas)","dd":"SUM(Total), AVG(Total) e ROUND().","s":"SELECT ROUND(SUM(Total), 2) AS faturamento, ROUND(AVG(Total), 2) AS ticket_medio\nFROM Invoice","a":"Faturamento de 2328,60 e ticket médio de 5,65.","sql":{"c":["faturamento","ticket_medio"],"v":[[2328.6,5.65]]}},{"stage":"Responder","x":"Qual o faturamento por ano?","dd":"strftime('%Y', InvoiceDate) extrai o ano.","s":"SELECT strftime('%Y', InvoiceDate) AS ano, ROUND(SUM(Total), 2) AS faturamento\nFROM Invoice\nGROUP BY ano\nORDER BY ano","a":"Nesta versão do banco as datas vão de 2021 a 2025, sempre entre 449 e 482 por ano (2022 é o maior: 481,45).","sql":{"c":["ano","faturamento"],"v":[["2021",449.46],["2022",481.45],["2023",469.58],["2024",477.53],["2025",450.58]]}},{"stage":"Responder","x":"Quais os 5 países que mais faturaram?","dd":"Invoice tem BillingCountry.","s":"SELECT BillingCountry AS pais, ROUND(SUM(Total), 2) AS faturamento\nFROM Invoice\nGROUP BY BillingCountry\nORDER BY faturamento DESC\nLIMIT 5","a":"USA 523,06 · Canada 303,96 · France 195,10 · Brazil 190,10 · Germany 156,48.","sql":{"c":["pais","faturamento"],"v":[["USA",523.06],["Canada",303.96],["France",195.1],["Brazil",190.1],["Germany",156.48]]}},{"stage":"Manipular","x":"Quais os 5 artistas com mais faixas no catálogo? (JOIN de 3 tabelas)","dd":"Track → Album (AlbumId) → Artist (ArtistId).","s":"SELECT ar.Name AS artista, COUNT(*) AS faixas\nFROM Track t\nJOIN Album al ON t.AlbumId = al.AlbumId\nJOIN Artist ar ON al.ArtistId = ar.ArtistId\nGROUP BY ar.ArtistId, ar.Name\nORDER BY faixas DESC, artista\nLIMIT 5","a":"Iron Maiden 213 · U2 135 · Led Zeppelin 114 · Metallica 112 · Deep Purple 92 (empatado com Lost).","sql":{"c":["artista","faixas"],"v":[["Iron Maiden",213],["U2",135],["Led Zeppelin",114],["Metallica",112],["Deep Purple",92]]}},{"stage":"Responder","x":"Quais os 5 gêneros mais vendidos (em quantidade de faixas vendidas)?","dd":"InvoiceLine → Track → Genre; some Quantity.","s":"SELECT g.Name AS genero, SUM(il.Quantity) AS vendidas\nFROM InvoiceLine il\nJOIN Track t ON il.TrackId = t.TrackId\nJOIN Genre g ON t.GenreId = g.GenreId\nGROUP BY g.GenreId, g.Name\nORDER BY vendidas DESC\nLIMIT 5","a":"Rock 835 · Latin 386 · Metal 264 · Alternative & Punk 244 · Jazz 80.","sql":{"c":["genero","vendidas"],"v":[["Rock",835],["Latin",386],["Metal",264],["Alternative & Punk",244],["Jazz",80]]}},{"stage":"Responder","x":"Quem são os 5 clientes que mais gastaram? Mostre nome completo, país e total.","dd":"Customer JOIN Invoice; nome completo = FirstName || ' ' || LastName.","s":"SELECT c.FirstName || ' ' || c.LastName AS cliente, c.Country AS pais,\n       ROUND(SUM(i.Total), 2) AS total\nFROM Customer c\nJOIN Invoice i ON c.CustomerId = i.CustomerId\nGROUP BY c.CustomerId\nORDER BY total DESC, cliente\nLIMIT 5","a":"Helena Holý (República Tcheca) 49,62 · Richard Cunningham (EUA) 47,62 · Luis Rojas (Chile) 46,62 · Hugh O'Reilly (Irlanda) e Ladislav Kovács (Hungria) 45,62.","sql":{"c":["cliente","pais","total"],"v":[["Helena Holý","Czech Republic",49.62],["Richard Cunningham","USA",47.62],["Luis Rojas","Chile",46.62],["Hugh O'Reilly","Ireland",45.62],["Ladislav Kovács","Hungary",45.62]]}},{"stage":"Responder","x":"Qual a duração média das faixas (em minutos, 2 casas) por gênero? Mostre só os gêneros com mais de 100 faixas.","dd":"Milliseconds / 60000.0 dá minutos. HAVING filtra os grupos.","s":"SELECT g.Name AS genero, COUNT(*) AS faixas,\n       ROUND(AVG(t.Milliseconds) / 60000.0, 2) AS minutos\nFROM Track t\nJOIN Genre g ON t.GenreId = g.GenreId\nGROUP BY g.GenreId, g.Name\nHAVING COUNT(*) > 100\nORDER BY minutos DESC","a":"Só 5 gêneros têm mais de 100 faixas: Metal (5,16 min), Jazz (4,86), Rock (4,73), Alternative & Punk (3,91) e Latin (3,88).","sql":{"c":["genero","faixas","minutos"],"v":[["Metal",374,5.16],["Jazz",130,4.86],["Rock",1297,4.73],["Alternative & Punk",332,3.91],["Latin",579,3.88]]}},{"stage":"Responder","x":"Liste os clientes do Brasil com cidade.","dd":"WHERE Country = 'Brazil'.","s":"SELECT FirstName || ' ' || LastName AS cliente, City AS cidade\nFROM Customer\nWHERE Country = 'Brazil'\nORDER BY cidade","a":"5 clientes: Fernanda Ramos (Brasília), Roberto Almeida (Rio de Janeiro), Luís Gonçalves (São José dos Campos), Eduardo Martins e Alexandre Rocha (São Paulo).","sql":{"c":["cliente","cidade"],"v":[["Fernanda Ramos","Brasília"],["Roberto Almeida","Rio de Janeiro"],["Luís Gonçalves","São José dos Campos"],["Eduardo Martins","São Paulo"],["Alexandre Rocha","São Paulo"]]}},{"stage":"Manipular","x":"Mostre cada funcionário e o nome do seu chefe (a tabela Employee se liga a ela mesma pela coluna ReportsTo).","dd":"LEFT JOIN Employee chefe ON e.ReportsTo = chefe.EmployeeId (é um \"self join\").","s":"SELECT e.FirstName || ' ' || e.LastName AS funcionario, e.Title AS cargo,\n       chefe.FirstName || ' ' || chefe.LastName AS chefe\nFROM Employee e\nLEFT JOIN Employee chefe ON e.ReportsTo = chefe.EmployeeId","a":"8 funcionários; Andrew Adams (General Manager) não tem chefe (NULL).","sql":{"c":["funcionario","cargo","chefe"],"v":[["Andrew Adams","General Manager",null],["Nancy Edwards","Sales Manager","Andrew Adams"],["Jane Peacock","Sales Support Agent","Nancy Edwards"],["Margaret Park","Sales Support Agent","Nancy Edwards"],["Steve Johnson","Sales Support Agent","Nancy Edwards"],["Michael Mitchell","IT Manager","Andrew Adams"],["Robert King","IT Staff","Michael Mitchell"],["Laura Callahan","IT Staff","Michael Mitchell"]]}}]},{"id":"nascimentos","emoji":"👶","title":"Nascimentos nos EUA (2014): estimar e testar","level":"Médio","lang":"r","u":["https://raw.githubusercontent.com/vincentarelbundock/Rdatasets/master/csv/openintro/births14.csv"],"f":["births14.csv"],"p":"https://www.openintro.org/data/index.php?data=births14","i":"Amostra aleatória de 1000 nascimentos registrados nos Estados Unidos em 2014 (base births14, do pacote openintro, publicada no repositório Rdatasets). É muito parecida com o SINASC da Atividade 9: idade da mãe e do pai, semanas de gestação, peso do bebê, sexo, consultas pré-natais e hábito de fumar. Ótima para treinar intervalos de confiança e testes de hipóteses. Tamanho: 80 KB.","c":"rownames — número da linha\nfage — idade do pai (anos; tem NA)\nmage — idade da mãe (anos)\nmature — \"mature mom\" (35 anos ou mais) ou \"younger mom\"\nweeks — semanas de gestação\npremie — \"premie\" (prematuro, menos de 37 semanas) ou \"full term\"\nvisits — nº de consultas pré-natais (tem NA)\ngained — peso ganho pela mãe na gestação (libras; tem NA)\nweight — peso do bebê ao nascer (libras: 1 lb = 0,4536 kg)\nlowbirthweight — \"low\" (baixo peso) ou \"not low\"\nsex — sexo do bebê (\"male\" ou \"female\")\nhabit — mãe fumante (\"smoker\") ou não (\"nonsmoker\"); tem NA\nmarital — \"married\" ou \"not married\"\nwhitemom — mãe branca (\"white\") ou não (\"not white\")","steps":[{"stage":"Importar","x":"Leia a base para `nasc` e mostre as dimensões e as 3 primeiras linhas.","dd":"read.csv(url) e head(nasc, 3).","s":"nasc <- read.csv(\"https://raw.githubusercontent.com/vincentarelbundock/Rdatasets/master/csv/openintro/births14.csv\")\ndim(nasc)\nhead(nasc, 3)","a":"1000 linhas e 14 colunas.","out":"[1] 1000   14\n  rownames fage mage      mature weeks    premie visits gained weight\n1        1   34   34 younger mom    37 full term     14     28   6.96\n2        2   36   31 younger mom    41 full term     12     41   8.86\n3        3   37   36  mature mom    37 full term     10     28   7.51\n  lowbirthweight    sex     habit marital  whitemom\n1        not low   male nonsmoker married     white\n2        not low female nonsmoker married     white\n3        not low female nonsmoker married not white"},{"stage":"Conhecer","x":"Conte os NA de cada coluna e faça o resumo (summary) da idade do pai (fage). Algum valor parece erro?","dd":"colSums(is.na(nasc)) e summary(nasc$fage).","s":"colSums(is.na(nasc))\nsummary(nasc$fage)","a":"NA em fage (114), visits (56) e gained (42). A coluna habit aparece com 0 NA, mas tem 19 células VAZIAS (\"\"), que o R lê como texto e não como NA: confira com sum(nasc$habit == \"\"). E a idade máxima do pai é 85 anos: valor suspeito, que vale investigar antes de usar a coluna.","out":"      rownames           fage           mage         mature          weeks \n             0            114              0              0              0 \n        premie         visits         gained         weight lowbirthweight \n             0             56             42              0              0 \n           sex          habit        marital       whitemom \n             0              0              0              0 \n   Min. 1st Qu.  Median    Mean 3rd Qu.    Max.     NAs \n  15.00   26.00   31.00   31.13   35.00   85.00     114 "},{"stage":"Limpar","x":"Crie a coluna `peso_kg` (weight × 0,4536) e mostre média, desvio padrão, mínimo e máximo do peso em kg (3 casas).","dd":"nasc$peso_kg <- nasc$weight * 0.4536.","s":"nasc$peso_kg <- nasc$weight * 0.4536\nround(c(media = mean(nasc$peso_kg), dp = sd(nasc$peso_kg),\n        min = min(nasc$peso_kg), max = max(nasc$peso_kg)), 3)","a":"Média 3,265 kg, desvio padrão 0,593 kg, mínimo 0,340 kg e máximo 4,817 kg.","out":"media    dp   min   max \n3.265 0.593 0.340 4.817 "},{"stage":"Responder","x":"Estime a idade média das mães com um intervalo de 95% de confiança.","dd":"t.test(nasc$mage)$conf.int, ou à mão com qt().","s":"mean(nasc$mage)\nt.test(nasc$mage)$conf.int","a":"Média 28,45 anos; IC de 95%: de 28,09 a 28,81 anos.","out":"[1] 28.449\n[1] 28.09158 28.80642\nattr(,\"conf.level\")\n[1] 0.95"},{"stage":"Responder","x":"Como na Atividade 9: teste se a idade média das mães é 27 anos (H0: μ = 27 vs H1: μ ≠ 27). Qual a decisão com α = 0,05?","dd":"t.test(nasc$mage, mu = 27). Rejeite H0 se o valor-p ≤ 0,05.","s":"teste <- t.test(nasc$mage, mu = 27)\nteste\nifelse(teste$p.value <= 0.05, \"Rejeita H0\", \"Não rejeita H0\")","a":"t = 7,96 com 999 gl e valor-p = 4,8e-15 (praticamente zero): rejeitamos H0. A idade média das mães é diferente de 27 anos (é maior: 28,45).","out":"\n\tOne Sample t-test\n\ndata:  nasc$mage\nt = 7.9555, df = 999, p-value = 4.815e-15\nalternative hypothesis: true mean is not equal to 27\n95 percent confidence interval:\n 28.09158 28.80642\nsample estimates:\nmean of x \n   28.449 \n\n[1] \"Rejeita H0\""},{"stage":"Responder","x":"Metade dos bebês são meninas? Calcule a proporção de meninas e teste H0: p = 0,5 com prop.test().","dd":"n_fem <- sum(nasc$sex == \"female\"); prop.test(n_fem, nrow(nasc), p = 0.5).","s":"n_fem <- sum(nasc$sex == \"female\")\nn_fem\nprop.test(n_fem, nrow(nasc), p = 0.5)","a":"495 meninas (49,5%). Valor-p = 0,78: não rejeitamos H0; os dados são compatíveis com metade meninas.","out":"[1] 495\n\n\t1-sample proportions test with continuity correction\n\ndata:  n_fem out of nrow(nasc), null probability 0.5\nX-squared = 0.081, df = 1, p-value = 0.7759\nalternative hypothesis: true p is not equal to 0.5\n95 percent confidence interval:\n 0.4635925 0.5264464\nsample estimates:\n    p \n0.495 \n"},{"stage":"Responder","x":"Estime a proporção de bebês prematuros (premie == \"premie\") com um IC de 95% pela fórmula de Wald (3 casas).","dd":"p̂ ± 1,96 · √(p̂(1 − p̂)/n).","s":"n <- nrow(nasc)\np_hat <- mean(nasc$premie == \"premie\")\nE <- qnorm(0.975) * sqrt(p_hat * (1 - p_hat) / n)\nround(c(p_hat = p_hat, inf = p_hat - E, sup = p_hat + E), 3)","a":"p̂ = 0,124; IC de 95%: 0,104 a 0,144.","out":"p_hat   inf   sup \n0.124 0.104 0.144 "},{"stage":"Responder","x":"A taxa de prematuridade nos EUA costuma ser citada como 10%. Teste se a proporção nesta população é MAIOR que 10% (α = 0,05), sem a correção de continuidade.","dd":"H1: p > 0,10 → alternative = \"greater\"; correct = FALSE.","s":"x <- sum(nasc$premie == \"premie\")\nprop.test(x, nrow(nasc), p = 0.10, alternative = \"greater\", correct = FALSE)$p.value","a":"Valor-p ≈ 0,0058 < 0,05: rejeitamos H0; há evidência de prematuridade acima de 10% nesta amostra.","out":"[1] 0.005706018"},{"stage":"Responder","x":"Calcule o IC de 95% para a variância e para o desvio padrão do peso em kg (fórmula da qui-quadrado).","dd":"(n − 1)s² / qchisq(c(0.975, 0.025), n − 1); raiz para o desvio padrão.","s":"n <- nrow(nasc)\ns2 <- var(nasc$peso_kg)\nic_var <- (n - 1) * s2 / qchisq(c(0.975, 0.025), n - 1)\nround(ic_var, 4)\nround(sqrt(ic_var), 4)","a":"Variância entre 0,3225 e 0,3843 kg²; desvio padrão entre 0,568 e 0,620 kg.","out":"[1] 0.3225 0.3843\n[1] 0.5679 0.6199"},{"stage":"Responder","x":"Supondo que o peso em kg seja normal, com a média e o desvio da amostra, qual seria a probabilidade de um bebê pesar menos de 2,5 kg? Compare com a proporção observada de \"low\".","dd":"pnorm(2.5, mean, sd) e mean(nasc$lowbirthweight == \"low\").","s":"pnorm(2.5, mean = mean(nasc$peso_kg), sd = sd(nasc$peso_kg))\nmean(nasc$lowbirthweight == \"low\")","a":"O modelo normal dá ≈ 0,098 e a base tem 0,081 com baixo peso. Parecidos, mas não iguais: a distribuição real tem cauda esquerda mais longa (prematuros muito pequenos).","out":"[1] 0.09839836\n[1] 0.081"},{"stage":"Responder","x":"Se 8,1% dos bebês nascem com baixo peso, qual a probabilidade de, entre 20 nascimentos, pelo menos 3 terem baixo peso?","dd":"Binomial: 1 − pbinom(2, 20, 0.081).","s":"1 - pbinom(2, size = 20, prob = 0.081)","a":"Aproximadamente 0,217 (cerca de 22%).","out":"[1] 0.2173747"},{"stage":"Manipular","x":"Como na Atividade 9, trate as 1000 linhas como a \"população\": com set.seed(123), tire uma amostra de 50 nascimentos, calcule o IC de 95% para a idade média da mãe e veja se ele contém a média da \"população\".","dd":"amostra <- nasc[sample(nrow(nasc), 50), ]; t.test(amostra$mage)$conf.int; mean(nasc$mage).","s":"set.seed(123)\namostra <- nasc[sample(nrow(nasc), 50), ]\nic <- t.test(amostra$mage)$conf.int\nround(ic, 2)\nmean(nasc$mage)\nmean(nasc$mage) >= ic[1] & mean(nasc$mage) <= ic[2]","a":"O IC da amostra de 50 vai de 26,01 a 29,59 anos e contém a média da \"população\" (28,45). Mude a semente: em cerca de 95% das vezes o intervalo acerta.","out":"[1] 26.01 29.59\nattr(,\"conf.level\")\n[1] 0.95\n[1] 28.449\n[1] TRUE"},{"stage":"Gráfico","x":"Faça o histograma (densidade) do peso em kg e sobreponha a curva normal com a média e o desvio da amostra.","dd":"hist(..., freq = FALSE) e curve(dnorm(x, m, s), add = TRUE).","s":"hist(nasc$peso_kg, freq = FALSE, breaks = 25, col = \"lightblue\",\n     main = \"Peso ao nascer\", xlab = \"Peso (kg)\")\ncurve(dnorm(x, mean = mean(nasc$peso_kg), sd = sd(nasc$peso_kg)), add = TRUE, col = \"red\", lwd = 2)","a":"A curva acompanha bem o centro, mas o histograma tem uma cauda à esquerda (bebês muito pequenos) que a normal não captura.","m":"plot"},{"stage":"Gráfico","x":"Compare o peso dos bebês de mães fumantes e não fumantes com um box-plot e com a média de cada grupo. Antes, tire as 19 linhas com habit vazio.","dd":"fum <- nasc[nasc$habit != \"\", ]; boxplot(peso_kg ~ habit, data = fum) e tapply().","s":"fum <- nasc[nasc$habit != \"\", ]\nboxplot(peso_kg ~ habit, data = fum, col = c(\"seagreen\", \"tomato\"), ylab = \"Peso (kg)\")\nround(tapply(fum$peso_kg, fum$habit, mean), 3)","a":"Bebês de mães fumantes pesam, em média, menos: 3,03 kg contra 3,30 kg das não fumantes.","m":"plot"}]},{"id":"probabilidade","emoji":"🎲","title":"Laboratório de probabilidade: simulações","level":"Fácil","lang":"r","u":[],"f":[],"p":"","i":"Um desafio sem base de dados: você cria os dados sorteando no R (dados, moedas, portas, aniversários) e compara o resultado da simulação com a conta exata da aula. É a definição frequentista de probabilidade e a Lei dos Grandes Números na prática. Roda inteiro aqui no navegador.","c":"Funções principais: sample(), expand.grid(), mean() de condições, cumsum(), choose(), prod()\nDistribuições: dbinom()/pbinom(), dpois()/ppois(), pnorm()/qnorm()","steps":[{"stage":"Conhecer","x":"Monte o espaço amostral do lançamento de 2 dados com expand.grid() em `dois` e mostre quantos resultados existem.","dd":"expand.grid(d1 = 1:6, d2 = 1:6) e nrow().","s":"dois <- expand.grid(d1 = 1:6, d2 = 1:6)\nnrow(dois)","a":"36 resultados possíveis.","out":"[1] 36"},{"stage":"Responder","x":"Usando `dois`, calcule a probabilidade exata de a soma ser 7 e de a soma ser 12.","dd":"mean(dois$d1 + dois$d2 == 7).","s":"mean(dois$d1 + dois$d2 == 7)\nmean(dois$d1 + dois$d2 == 12)","a":"P(soma = 7) = 6/36 = 0,1667 e P(soma = 12) = 1/36 = 0,0278.","out":"[1] 0.1666667\n[1] 0.02777778"},{"stage":"Manipular","x":"Com set.seed(2026), simule 10.000 lançamentos de 2 dados e estime P(soma = 7). Ficou perto do valor exato?","dd":"Sorteie d1 e d2 com sample(1:6, 10000, replace = TRUE).","s":"set.seed(2026)\nd1 <- sample(1:6, 10000, replace = TRUE)\nd2 <- sample(1:6, 10000, replace = TRUE)\nmean(d1 + d2 == 7)","a":"A simulação fica perto de 0,167, mas não exatamente igual.","out":"[1] 0.1651"},{"stage":"Gráfico","x":"Mostre a Lei dos Grandes Números: com os mesmos d1 e d2, desenhe a frequência acumulada de \"soma = 7\" ao longo dos 10.000 lançamentos, com uma linha em 1/6.","dd":"cumsum(d1 + d2 == 7) / (1:10000).","s":"freq <- cumsum(d1 + d2 == 7) / (1:10000)\nplot(freq, type = \"l\", ylim = c(0, 0.4), xlab = \"Lançamentos\", ylab = \"Frequência de soma 7\")\nabline(h = 1/6, col = \"red\", lty = 2)","a":"A linha oscila muito no começo e vai se acomodando perto de 1/6.","m":"plot"},{"stage":"Responder","x":"Problema do aniversário: numa sala com 23 pessoas, qual a probabilidade de pelo menos duas fazerem aniversário no mesmo dia (365 dias, sem bissexto)? Calcule pela conta exata.","dd":"P(todos diferentes) = 365/365 · 364/365 · ... · 343/365 = prod(365:343) / 365^23. A resposta é o complementar.","s":"p_diferentes <- prod(365:343) / 365^23\n1 - p_diferentes","a":"≈ 0,507: mais de 50%, com só 23 pessoas!","out":"[1] 0.5072972"},{"stage":"Manipular","x":"Confirme o problema do aniversário por simulação: com set.seed(1), sorteie 10.000 salas de 23 aniversários e calcule a proporção de salas com alguma repetição.","dd":"replicate(10000, anyDuplicated(sample(1:365, 23, replace = TRUE)) > 0).","s":"set.seed(1)\nrepete <- replicate(10000, anyDuplicated(sample(1:365, 23, replace = TRUE)) > 0)\nmean(repete)","a":"A simulação fica perto de 0,507.","out":"[1] 0.5026"},{"stage":"Responder","x":"Monty Hall: com set.seed(42), simule 10.000 jogos e compare a chance de ganhar ficando com a porta e trocando.","dd":"Ficar ganha quando a escolha = carro; trocar ganha quando a escolha ≠ carro.","s":"set.seed(42)\ncarro <- sample(1:3, 10000, replace = TRUE)\nescolha <- sample(1:3, 10000, replace = TRUE)\nc(ficar = mean(escolha == carro), trocar = mean(escolha != carro))","a":"Ficar ≈ 1/3 e trocar ≈ 2/3.","out":" ficar trocar \n0.3454 0.6546 "},{"stage":"Responder","x":"Teste diagnóstico (Bayes): prevalência de 2%, sensibilidade 95% e especificidade 90%. Qual a probabilidade de estar doente dado um resultado positivo?","dd":"P(D|+) = P(+|D)P(D) / [P(+|D)P(D) + P(+|S)P(S)], com P(+|S) = 1 − especificidade.","s":"prior <- c(doente = 0.02, saudavel = 0.98)\np_pos <- c(0.95, 0.10)\nround(prior * p_pos / sum(prior * p_pos), 4)","a":"P(doente | +) ≈ 0,1624: só uns 16% dos positivos estão doentes.","out":"  doente saudavel \n  0.1624   0.8376 "},{"stage":"Responder","x":"Uma prova tem 10 questões com 5 alternativas. Chutando tudo, qual a probabilidade de acertar 6 ou mais? E o número esperado de acertos?","dd":"X ~ b(10; 0,2). P(X ≥ 6) = 1 − pbinom(5, 10, 0.2).","s":"1 - pbinom(5, size = 10, prob = 0.2)\n10 * 0.2","a":"P(X ≥ 6) ≈ 0,0064 (menos de 1%) e E(X) = 2 acertos.","out":"[1] 0.006369382\n[1] 2"},{"stage":"Responder","x":"Um pronto-socorro recebe em média 4 pacientes por hora. Qual a probabilidade de chegarem mais de 6 numa hora? E nenhum?","dd":"Poisson(4): P(X > 6) = 1 − ppois(6, 4); P(X = 0) = dpois(0, 4).","s":"1 - ppois(6, lambda = 4)\ndpois(0, lambda = 4)","a":"P(X > 6) ≈ 0,111 e P(X = 0) ≈ 0,018.","out":"[1] 0.110674\n[1] 0.01831564"},{"stage":"Responder","x":"Alturas de adultos ~ N(170, 7²) cm. Qual a proporção acima de 185 cm? E a altura que separa os 10% mais altos?","dd":"1 − pnorm(185, 170, 7) e qnorm(0.9, 170, 7).","s":"1 - pnorm(185, mean = 170, sd = 7)\nqnorm(0.9, mean = 170, sd = 7)","a":"≈ 1,6% acima de 185 cm; os 10% mais altos têm mais de ≈ 179 cm.","out":"[1] 0.01606229\n[1] 178.9709"},{"stage":"Gráfico","x":"TLC com dados: com set.seed(7), calcule a média de 30 lançamentos de um dado, repita 1000 vezes e faça o histograma das médias.","dd":"replicate(1000, mean(sample(1:6, 30, replace = TRUE))).","s":"set.seed(7)\nmedias <- replicate(1000, mean(sample(1:6, 30, replace = TRUE)))\nround(c(media = mean(medias), dp = sd(medias)), 3)\nhist(medias, freq = FALSE, main = \"Médias de 30 lançamentos\", xlab = \"Média\")\ncurve(dnorm(x, mean = 3.5, sd = sqrt(35/12) / sqrt(30)), add = TRUE, col = \"red\", lwd = 2)","a":"Média das médias ≈ 3,5 e desvio ≈ 0,31 (= 1,708/√30). O histograma tem forma de sino, embora cada lançamento seja uniforme.","m":"plot"}]}],"schema":"CREATE TABLE MEDICO (id_medico INTEGER PRIMARY KEY, nome TEXT NOT NULL, especialidade TEXT NOT NULL, crm TEXT UNIQUE NOT NULL);\nCREATE TABLE PACIENTE (id_paciente INTEGER PRIMARY KEY, nome TEXT NOT NULL, data_nasc DATE NOT NULL, sexo TEXT NOT NULL CHECK (sexo IN ('M','F')), cidade TEXT, id_medico INTEGER NOT NULL, FOREIGN KEY (id_medico) REFERENCES MEDICO(id_medico));\nCREATE TABLE INTERNACAO (id_internacao INTEGER PRIMARY KEY, data_entrada DATE NOT NULL, data_saida DATE, cid10_principal TEXT NOT NULL, id_paciente INTEGER NOT NULL, FOREIGN KEY (id_paciente) REFERENCES PACIENTE(id_paciente));\nINSERT INTO MEDICO (nome,especialidade,crm) VALUES ('Dra. Carla Lima','Oncologia','CRM-GO-12345'),('Dr. Rafael Sousa','Pneumologia','CRM-GO-67890'),('Dra. Fernanda Neves','Cardiologia','CRM-GO-11223');\nINSERT INTO PACIENTE (nome,data_nasc,sexo,cidade,id_medico) VALUES ('Ana Silva','1981-04-12','F','Brasília',1),('Carlos Mendes','1956-09-03','M','Goiânia',2),('Beatriz Costa','1968-07-25','F','Brasília',1),('José Almeida','1985-11-30','M','Anápolis',3),('Márcia Rocha','1952-03-18','F','Goiânia',2);\nINSERT INTO INTERNACAO (data_entrada,data_saida,cid10_principal,id_paciente) VALUES ('2024-01-10','2024-01-15','J18.1',1),('2024-01-12','2024-01-20','E11',2),('2024-02-03','2024-02-08','I10',3),('2024-03-01',NULL,'J45',1),('2024-03-15','2024-03-22','I21',5);"}</script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtTxt=s=>esc(s).replace(/`([^`]+)`/g,'<code>$1</code>');
const DATA=JSON.parse($('data').textContent);
const LEVEL=['Aquecimento','Prática','Desafio do comando'];
/* ---------- progresso salvo no navegador ---------- */
let ST={done:{},code:{}};
try{const s=localStorage.getItem('pratica.v1');if(s)ST=Object.assign(ST,JSON.parse(s))}catch(e){}
function save(){try{localStorage.setItem('pratica.v1',JSON.stringify(ST))}catch(e){}}
let saveT=null;function saveSoon(){clearTimeout(saveT);saveT=setTimeout(save,400)}
/* ---------- índices ---------- */
const CMDS=[];DATA.groups.forEach((g,gi)=>g.cmds.forEach((c,ci)=>{c.g=g;c.gi=gi;c.ci=ci;c.ex.forEach((e,k)=>{e.id=g.lang+'|'+c.name+'|'+k;e.k=k;e.cmd=c});CMDS.push(c)}));
const TOTAL=CMDS.reduce((s,c)=>s+c.ex.length,0);
const DSTEPS=DATA.des.reduce((s,d)=>s+d.steps.length,0);
DATA.des.forEach(d=>d.steps.forEach((s,k)=>{s.id='D|'+d.id+'|'+k;s.k=k;s.d=d}));
function updProg(){
  const ne=CMDS.reduce((s,c)=>s+c.ex.filter(e=>ST.done[e.id]).length,0);
  const nd=DATA.des.reduce((s,d)=>s+d.steps.filter(x=>ST.done[x.id]).length,0);
  $('prog').innerHTML=`Exercícios <b>${ne}</b>/${TOTAL} · Desafios <b>${nd}</b>/${DSTEPS}`;
}
/* ---------- estado da tela ---------- */
let tab='E',lang='R',cur=null,curD=null;
try{const u=JSON.parse(localStorage.getItem('pratica.ui')||'{}');if(u.lang)lang=u.lang;if(u.cmd)cur=CMDS.find(c=>c.g.lang+'|'+c.name===u.cmd)||null}catch(e){}
function saveUI(){try{localStorage.setItem('pratica.ui',JSON.stringify({lang,cmd:cur?cur.g.lang+'|'+cur.name:null}))}catch(e){}}
function aba(t){tab=t;$('tE').className=t==='E'?'on':'';$('tD').className=t==='D'?'on':'';render();window.scrollTo({top:0})}
function render(){updProg();if(tab==='E')renderE();else if(curD)renderD1();else renderD()}

/* ================= EXERCÍCIOS ================= */
function cmdsOf(l){return CMDS.filter(c=>c.g.lang===l)}
function dots(c){return '<span class="dots">'+c.ex.map(e=>`<i class="${ST.done[e.id]?'d':''}">${ST.done[e.id]?'●':'○'}</i>`).join('')+'</span>'}
function renderE(){
  if(!cur||cur.g.lang!==lang)cur=cmdsOf(lang)[0];
  const gs=DATA.groups.filter(g=>g.lang===lang);
  let side=`<div class="lang"><button class="${lang==='R'?'on':''}" onclick="setLang('R')">R</button><button class="q ${lang==='Q'?'on':''}" onclick="setLang('Q')">SQL</button></div>`;
  let opt='';
  gs.forEach(g=>{
    const tot=g.cmds.reduce((s,c)=>s+c.ex.length,0),dn=g.cmds.reduce((s,c)=>s+c.ex.filter(e=>ST.done[e.id]).length,0);
    const open=g.cmds.includes(cur);
    side+=`<div class="sg" style="--a:${g.color}"><button onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${esc(g.title)}<span>${dn}/${tot}</span></button><ul ${open?'':'hidden'}>`+
      g.cmds.map(c=>`<li class="${c===cur?'on':''}" onclick="goCmd(${CMDS.indexOf(c)})"><span>${esc(c.name)}</span>${dots(c)}</li>`).join('')+'</ul></div>';
    opt+=`<optgroup label="${esc(g.title)}">`+g.cmds.map(c=>`<option value="${CMDS.indexOf(c)}" ${c===cur?'selected':''}>${esc(c.name)} ${c.ex.every(e=>ST.done[e.id])?'✓':''}</option>`).join('')+'</optgroup>';
  });
  const c=cur,list=cmdsOf(lang),i=list.indexOf(c);
  let h=`<div class="ex-layout"><aside class="side">${side}</aside><section>`;
  h+=`<div class="lang mlang"><button class="${lang==='R'?'on':''}" onclick="setLang('R')">R</button><button class="q ${lang==='Q'?'on':''}" onclick="setLang('Q')">SQL</button></div><select class="msel" onchange="goCmd(+this.value)">${opt}</select>`;
  h+=`<div class="cmdh" style="--a:${c.g.color}"><div class="grp">${esc(c.g.title)} · ${lang==='R'?'R':'SQL'}</div><h2>${esc(c.name)}</h2><p>${esc(c.o)}</p>${c.s?`<code>${esc(c.s)}</code>`:''}<p class="hint" style="margin-top:8px">Detalhes no <a href="https://thiagopx1.github.io/blog/dicionario_comandos.html" target="_blank" rel="noopener">dicionário</a>. Atalho: <b>Ctrl + Enter</b> roda o código do exercício.</p></div>`;
  if(i===0&&lang==='R'&&!ST.seenIntro)h+=`<div class="intro">👋 <b>Como funciona:</b> escreva o código na caixa e clique em <b>▶ Rodar</b>. O R roda aqui mesmo, no navegador (na primeira vez demora uns segundos para carregar). Depois compare com a saída da solução. Travou? Use <b>💡 Dica</b> e, por último, <b>👀 Solução</b>. Seu progresso fica salvo neste navegador. <a href="#" onclick="ST.seenIntro=1;save();render();return false">Entendi</a></div>`;
  c.ex.forEach(e=>{h+=exCard(e)});
  h+=`<div class="nav2"><button class="bt" ${i>0?'':'disabled'} onclick="goCmd(${CMDS.indexOf(list[i-1])})">← ${i>0?esc(list[i-1].name):''}</button><button class="bt" ${i<list.length-1?'':'disabled'} onclick="goCmd(${CMDS.indexOf(list[i+1])})">${i<list.length-1?esc(list[i+1].name):''} →</button></div>`;
  h+='</section></div>';
  $('main').innerHTML=h;
  c.ex.forEach(e=>bindEd(e));
}
function setLang(l){lang=l;cur=null;saveUI();renderE();window.scrollTo({top:0})}
function goCmd(i){cur=CMDS[i];lang=cur.g.lang;saveUI();renderE();window.scrollTo({top:0})}
function flags(e){return (e.m||'').split(/\s+/)}
function exCard(e){
  const f=flags(e),norun=f.includes('norun'),id=e.id.replace(/[^a-z0-9]/gi,'_')+'_'+e.k;
  e.dom=id;
  const badges=[];
  if(e.pk&&e.pk.length)badges.push(`<span class="badge pk" title="O pacote é instalado automaticamente aqui no navegador. No RStudio, instale com install.packages() antes.">📦 ${esc(e.pk.join(', '))}</span>`);
  if(norun)badges.push('<span class="badge nr" title="Precisa do RStudio (teclado, janelas, internet ou arquivos do seu computador). Escreva aqui e confira com a solução.">🖥️ testar no RStudio</span>');
  if(f.includes('plot'))badges.push('<span class="badge st">📊 gráfico</span>');
  if(f.includes('erro'))badges.push('<span class="badge st">💥 o erro é esperado</span>');
  const code=ST.code[e.id]??e.t??'';
  return `<div class="card ${ST.done[e.id]?'done':''}" id="c_${id}">
   <div class="ch"><span class="num">Exercício ${e.k+1}</span><span class="badge">${LEVEL[e.k]||'Extra'}</span>${badges.join('')}<span class="ok-tag" id="ok_${id}">${ST.done[e.id]?'✔ feito':''}</span></div>
   <div class="enun">${fmtTxt(e.x)}</div>
   <textarea class="ed" id="ed_${id}" spellcheck="false" placeholder="${lang==='Q'?'-- escreva sua consulta SQL aqui':'# escreva seu código R aqui'}">${esc(code)}</textarea>
   <div class="bar">
    <button class="bt run" onclick="runEx('${esc(e.id)}')" ${norun?'disabled title="Este exercício precisa do RStudio"':''}>▶ Rodar</button>
    <button class="bt" onclick="tog('tip_${id}')">💡 Dica</button>
    <button class="bt" onclick="tog('sol_${id}')">👀 Solução</button>
    <button class="bt mk ${ST.done[e.id]?'on':''}" id="mk_${id}" onclick="marca('${esc(e.id)}')">${ST.done[e.id]?'✔ Feito':'Marcar como feito'}</button>
   </div>
   <div class="box tip" id="tip_${id}" hidden><h4>Dica</h4>${fmtTxt(e.d||'Releia o molde do comando no topo da página.')}</div>
   <div class="box sol" id="sol_${id}" hidden><h4>Solução</h4><pre class="code">${esc(e.s)}</pre>
     <div class="bar"><button class="bt" onclick="usaSol('${esc(e.id)}')">Copiar para a caixa</button></div>
     ${expectedHTML(e)}</div>
   <div class="out" id="out_${id}"></div>
  </div>`;
}
function expectedHTML(e){
  if(e.sql)return `<h4 style="margin-top:10px">Resultado da solução</h4>${tableHTML(e.sql.c,e.sql.v)}`;
  if(e.err)return `<h4 style="margin-top:10px">O que acontece</h4><pre class="out err">${esc(e.err)}</pre>`;
  if(e.out!=null&&!flags(e).includes('plot'))return `<h4 style="margin-top:10px">Saída da solução</h4><pre>${esc(e.out)||'(nada aparece)'}</pre>`;
  return '';
}
function tog(id){const el=$(id);el.hidden=!el.hidden}
function findEx(id){for(const c of CMDS)for(const e of c.ex)if(e.id===id)return e}
function usaSol(id){const e=findEx(id);const ed=$('ed_'+e.dom);ed.value=e.s;ST.code[e.id]=e.s;saveSoon();ed.focus()}
function marca(id,force){const e=findEx(id)||findStep(id);const on=force===undefined?!ST.done[id]:force;if(on)ST.done[id]=1;else delete ST.done[id];save();
  const d=e.dom;const mk=$('mk_'+d),ok=$('ok_'+d),cd=$('c_'+d);if(mk){mk.className='bt mk'+(on?' on':'');mk.textContent=on?'✔ Feito':'Marcar como feito'}if(ok)ok.textContent=on?'✔ feito':'';if(cd)cd.classList.toggle('done',on);
  updProg();if(tab==='E')refreshSide()}
function refreshSide(){document.querySelectorAll('.sg li.on .dots').forEach(el=>{el.outerHTML=dots(cur)})}
function bindEd(e){
  const ed=$('ed_'+e.dom);if(!ed)return;
  ed.addEventListener('input',()=>{ST.code[e.id]=ed.value;saveSoon();autosize(ed)});
  ed.addEventListener('keydown',ev=>{
    if(ev.key==='Tab'&&!ev.shiftKey){ev.preventDefault();const s=ed.selectionStart;ed.setRangeText('  ',s,ed.selectionEnd,'end')}
    if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)){ev.preventDefault();e.steps?runStep(e.id):runEx(e.id)}
  });
  autosize(ed);
}
function autosize(ed){ed.style.height='auto';ed.style.height=Math.max(96,Math.min(ed.scrollHeight+4,520))+'px'}

/* ================= MOTOR R (webR) ================= */
let webR=null,webRP=null,shelter=null;const installed=new Set();
function eng(txt,cls){const el=$('engR');el.textContent=txt;el.className='eng '+(cls||'')}
async function getR(){
  if(webR)return webR;
  if(webRP)return webRP;
  webRP=(async()=>{
    eng('R: carregando… (só na 1ª vez)','wait');
    let mod=null,err=null;
    for(const u of ['https://webr.r-wasm.org/v0.6.1/webr.mjs','https://webr.r-wasm.org/latest/webr.mjs']){try{mod=await import(u);break}catch(e){err=e}}
    if(!mod)throw err||new Error('não foi possível baixar o webR');
    const w=new mod.WebR({channelType:(window.crossOriginIsolated?mod.ChannelType.Automatic:mod.ChannelType.PostMessage),interactive:false});
    await w.init();
    shelter=await new w.Shelter();
    try{await w.evalRVoid('options(width = 80); webr::shim_install()')}catch(e){}
    webR=w;eng('R: pronto ✓','ok');return w;
  })().catch(e=>{webRP=null;eng('R: indisponível','bad');throw e});
  return webRP;
}
async function ensurePkgs(pk,status){
  for(const p of pk||[]){if(installed.has(p))continue;status(`📦 Instalando o pacote ${p} no navegador… (só na primeira vez)`);
    await webR.installPackages([p],{quiet:true});installed.add(p)}
}
async function runR(code,{fresh,pk,status}){
  await getR();
  await ensurePkgs(pk,status);
  if(fresh)await webR.evalRVoid('rm(list = ls(envir = globalenv()), envir = globalenv())');
  status('⏳ Rodando…');
  const r=await shelter.captureR(code,{withAutoprint:true,captureStreams:true,captureConditions:false,captureGraphics:{width:640,height:440}});
  const res={out:r.output.map(o=>({t:o.type,d:String(o.data)})),images:r.images||[]};
  await shelter.purge();
  return res;
}
function outHTML(res){
  const lines=res.out.map(o=>{const isErr=o.t==='stderr'&&/^Error/i.test(o.d),isW=o.t==='stderr'&&!isErr;return `<span class="${isErr?'err':isW?'warn':''}">${esc(o.d)}</span>`});
  return (lines.length?`<pre>${lines.join('\n')}</pre>`:(res.images.length?'':'<pre class="hint">(o código rodou e não mostrou nada na tela: para ver um valor, escreva o nome dele numa linha ou use print())</pre>'));
}
function drawImgs(el,imgs){imgs.forEach(im=>{const cv=document.createElement('canvas');cv.className='plot';cv.width=im.width;cv.height=im.height;cv.getContext('2d').drawImage(im,0,0);el.appendChild(cv)})}
const norm=s=>String(s).split('\n').map(l=>l.replace(/\s+$/,'')).filter(l=>l.trim()!=='').join('\n');
function stdoutOf(res){return norm(res.out.filter(o=>o.t==='stdout').map(o=>o.d).join('\n'))}
function hasErr(res){return res.out.some(o=>o.t==='stderr'&&/^Error/i.test(o.d))}
const expCache={};

/* ================= MOTOR SQL (sql.js) ================= */
let SQLP=null;const dbCache={};
function loadScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('falha ao baixar '+src));document.head.appendChild(s)})}
async function getSQL(){
  if(!SQLP)SQLP=(async()=>{await loadScript('https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/sql-wasm.js');return initSqlJs({locateFile:f=>'https://cdn.jsdelivr.net/npm/sql.js@1.12.0/dist/'+f})})().catch(e=>{SQLP=null;throw e});
  return SQLP;
}
async function newDB(kind){
  const SQL=await getSQL();
  if(kind&&kind.url){
    if(!dbCache[kind.url]){const r=await fetch(kind.url);if(!r.ok)throw new Error('não consegui baixar o banco ('+r.status+')');dbCache[kind.url]=new Uint8Array(await r.arrayBuffer())}
    return new SQL.Database(dbCache[kind.url]);
  }
  const db=new SQL.Database();db.exec('PRAGMA foreign_keys = ON;');db.exec(DATA.schema);return db;
}
async function runSQL(code,kind){
  const db=await newDB(kind);
  try{const r=db.exec(code);const last=r.length?r[r.length-1]:null;return {res:last?{c:last.columns,v:last.values}:null,n:r.length}}
  catch(e){return {error:String(e.message||e)}}
  finally{db.close()}
}
function tableHTML(c,v){
  if(!c)return '<pre class="hint">(o comando rodou e não devolveu linhas)</pre>';
  const cap=200,rows=v.slice(0,cap);
  return `<table class="res"><tr>${c.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>x===null?'<td class="null">NULL</td>':`<td>${esc(typeof x==='number'&&!Number.isInteger(x)?+x.toFixed(6):x)}</td>`).join('')}</tr>`).join('')}</table><div class="hint">${v.length} linha(s)${v.length>cap?' · mostrando as primeiras '+cap:''}</div>`;
}
const sameTable=(a,b)=>a&&b&&JSON.stringify(a.c.map(s=>s.toLowerCase()))===JSON.stringify(b.c.map(s=>s.toLowerCase()))&&JSON.stringify(a.v)===JSON.stringify(b.v);
const sameValues=(a,b)=>a&&b&&JSON.stringify(a.v)===JSON.stringify(b.v);

/* ================= RODAR UM EXERCÍCIO ================= */
async function runEx(id){
  const e=findEx(id),out=$('out_'+e.dom),code=$('ed_'+e.dom).value,f=flags(e);
  if(!code.trim()){out.innerHTML='<div class="verdict info">Escreva algum código antes de rodar 🙂</div>';return}
  const st=t=>{out.innerHTML=`<div class="verdict info">${t}</div>`};
  if(e.cmd.g.lang==='Q'&&f.includes('sql')){
    st('⏳ Rodando a consulta…');
    let r;try{r=await runSQL(code)}catch(x){out.innerHTML=`<div class="verdict bad">Não consegui carregar o SQL no navegador (${esc(x.message)}). Verifique a internet.</div>`;return}
    if(r.error){
      const good=f.includes('erro');
      out.innerHTML=`<pre class="out"><span class="err">Erro: ${esc(r.error)}</span></pre><div class="verdict ${good?'good':'bad'}">${good?'✅ Deu erro, como esperado! A regra do banco barrou o comando. Leia a mensagem: ela diz qual regra foi violada.':'❌ O SQL acusou um erro. Leia a mensagem acima, confira vírgulas, aspas simples e nomes de tabelas/colunas.'}</div>`;
      if(good)marca(id,true);return}
    let v='';
    if(f.includes('erro'))v='<div class="verdict diff">🤔 Rodou sem erro, mas aqui o objetivo era ver o banco recusar o comando. Confira a solução.</div>';
    else if(e.sql){if(sameTable(r.res,e.sql)){v='<div class="verdict good">✅ Resultado igual ao da solução!</div>';marca(id,true)}else if(sameValues(r.res,e.sql))v='<div class="verdict good">✅ Mesmos valores da solução (só os nomes das colunas mudaram).</div>',marca(id,true);else v='<div class="verdict diff">🤔 O resultado está diferente do da solução. Compare com o "Resultado da solução" (botão 👀).</div>'}
    else{v='<div class="verdict good">✅ Rodou sem erro!</div>';marca(id,true)}
    out.innerHTML=tableHTML(r.res?.c,r.res?.v||[])+v;return;
  }
  // R
  try{
    const res=await runR(code,{fresh:true,pk:[...new Set([...(e.pk||[]),...pkgsIn(code)])],status:st});
    out.innerHTML=outHTML(res);drawImgs(out,res.images);
    let v='';
    if(hasErr(res))v='<div class="verdict bad">❌ O R mostrou um erro. Leia a mensagem em vermelho: ela costuma dizer o problema (nome errado, parêntese faltando, objeto que não existe).</div>';
    else if(f.includes('plot')){v=res.images.length?'<div class="verdict good">📊 Gráfico desenhado! Compare com o que o exercício pediu (título, cores, eixos).</div>':'<div class="verdict diff">Nenhum gráfico apareceu. Confira se você chamou plot(), hist(), barplot()...</div>'}
    else if(f.includes('nocheck'))v='<div class="verdict info">Este resultado muda conforme o dia ou a internet, então não dá para comparar. Confira se faz sentido.</div>';
    else{
      let exp=e.out;
      if(exp==null){
        if(expCache[id]==null){st('⏳ Rodando a solução para comparar…');const r2=await runR(e.s,{fresh:true,pk:e.pk,status:st});expCache[id]=stdoutOf(r2);out.innerHTML=outHTML(res);drawImgs(out,res.images)}
        exp=expCache[id];
      }
      if(norm(exp)===stdoutOf(res)){v='<div class="verdict good">✅ Saída igual à da solução!</div>';marca(id,true)}
      else v=`<div class="verdict diff">🤔 A saída é diferente da solução. Às vezes é só o jeito de mostrar; compare:</div><pre style="margin-top:6px">${esc(exp)||'(a solução não mostra nada)'}</pre>`;
    }
    out.insertAdjacentHTML('beforeend',v);
  }catch(x){out.innerHTML=`<div class="verdict bad">Não consegui rodar o R aqui (${esc(x.message||x)}). Sem internet ou navegador antigo? Copie o código para o RStudio e compare com a solução (👀).</div>`;console.error(x)}
}

/* ================= DESAFIOS ================= */
const LVC={'Fácil':'f','Médio':'m','Difícil':'d'};
function renderD(){
  let h=`<div class="intro">🏆 <b>Desafios</b> usam bases de dados reais e públicas. Cada desafio tem uma sequência de objetivos: <b>importar → conhecer → limpar → manipular → responder → gráficos</b>. As etapas usam os objetos criados nas anteriores (como num script). Dá para fazer tudo aqui ou no RStudio, baixando o arquivo.</div><div class="dgrid">`;
  DATA.des.forEach((d,i)=>{const dn=d.steps.filter(s=>ST.done[s.id]).length;
    h+=`<div class="dc" onclick="openD(${i})"><div class="em">${d.emoji}</div><h3>${esc(d.title)}</h3><p>${esc(d.i.split('. ')[0])}.</p><p><span class="lv ${LVC[d.level]||'m'}">● ${esc(d.level)}</span> · ${d.lang==='sql'?'SQL':'R'} · ${d.steps.length} objetivos</p><div class="pbar"><i style="width:${Math.round(dn/d.steps.length*100)}%"></i></div><p>${dn}/${d.steps.length} feitos</p></div>`});
  $('main').innerHTML=h+'</div>';
}
function openD(i){curD=DATA.des[i];renderD1();window.scrollTo({top:0})}
function findStep(id){for(const d of DATA.des)for(const s of d.steps)if(s.id===id)return s}
function renderD1(){
  const d=curD;
  let h=`<button class="bt" onclick="curD=null;render()">← Todos os desafios</button>
  <div class="dhead" style="margin-top:10px"><div style="font-size:34px">${d.emoji}</div><h2>${esc(d.title)}</h2><p><span class="lv ${LVC[d.level]||'m'}">● ${esc(d.level)}</span> · ${d.lang==='sql'?'SQL':'R'} · ${d.steps.length} objetivos</p><p>${esc(d.i)}</p>
  ${d.u.length?`<p>🔗 Fonte: <a href="${esc(d.p)}" target="_blank" rel="noopener">${esc(d.p)}</a></p>
  <p>${d.u.map((u,k)=>`<a class="bt" style="text-decoration:none;display:inline-block;margin:2px 6px 2px 0" href="${esc(u)}" target="_blank" rel="noopener" download>⬇ Baixar ${esc(d.f[k])}</a>`).join('')}</p>
  <p class="hint">O botão abre o arquivo no navegador: use Ctrl + S para salvar. Ou baixe direto pelo R: <code>download.file("${esc(d.u[0])}", "${esc(d.f[0])}"${d.lang==='sql'?', mode = "wb"':''})</code></p>`:'<p class="hint">🧪 Este desafio não usa arquivo: os dados são criados por sorteio no próprio R.</p>'}
  <details><summary>Colunas / tabelas da base</summary><ul class="cols">${d.c.split('\n').map(x=>`<li>${esc(x)}</li>`).join('')}</ul></details>
  ${d.lang==='sql'?'<p class="hint" style="margin-top:8px">Aqui no navegador, cada consulta roda direto no banco (que é baixado sozinho na primeira vez).</p>':'<p class="hint" style="margin-top:8px">Aqui no navegador, os objetos que você cria ficam guardados entre as etapas. Abriu o desafio agora e quer pular para uma etapa? Use <b>⏩ Rodar as soluções anteriores</b>.</p>'}
  </div>`;
  d.steps.forEach(s=>{h+=stepCard(s)});
  $('main').innerHTML=h;
  d.steps.forEach(s=>bindEd(s));
}
function stepCard(s){
  const d=s.d,id='st_'+d.id+'_'+s.k;s.dom=id;s.steps=true;
  const pk=s.pk||[],code=ST.code[s.id]??'';
  return `<div class="card ${ST.done[s.id]?'done':''}" id="c_${id}">
   <div class="ch"><span class="num">${s.k+1}.</span><span class="stage">${esc(s.stage)}</span>${pk.length?`<span class="badge pk">📦 ${esc(pk.join(', '))}</span>`:''}${(s.m||'').includes('plot')?'<span class="badge st">📊 gráfico</span>':''}<span class="ok-tag" id="ok_${id}">${ST.done[s.id]?'✔ feito':''}</span></div>
   <div class="enun">${fmtTxt(s.x)}</div>
   <textarea class="ed" id="ed_${id}" spellcheck="false" placeholder="${d.lang==='sql'?'-- escreva sua consulta SQL aqui':'# escreva seu código R aqui'}">${esc(code)}</textarea>
   <div class="bar">
    <button class="bt run" onclick="runStep('${esc(s.id)}')">▶ Rodar</button>
    ${d.lang!=='sql'&&s.k>0?`<button class="bt" onclick="prepStep('${esc(s.id)}')" title="Roda as soluções das etapas 1 a ${s.k}, para os objetos existirem">⏩ Rodar as soluções anteriores</button>`:''}
    <button class="bt" onclick="tog('tip_${id}')">💡 Dica</button>
    <button class="bt" onclick="tog('sol_${id}')">👀 Solução</button>
    <button class="bt" onclick="tog('ans_${id}')">🎯 Resposta</button>
    <button class="bt mk ${ST.done[s.id]?'on':''}" id="mk_${id}" onclick="marca('${esc(s.id)}')">${ST.done[s.id]?'✔ Feito':'Marcar como feito'}</button>
   </div>
   <div class="box tip" id="tip_${id}" hidden><h4>Dica</h4>${fmtTxt(s.dd||'Releia o enunciado e as colunas da base.')}</div>
   <div class="box sol" id="sol_${id}" hidden><h4>Solução${s.z?' (R base)':''}</h4><pre class="code">${esc(s.s)}</pre>${s.z?`<h4 style="margin-top:10px">Alternativa com dplyr / tidyverse</h4><pre class="code">${esc(s.z)}</pre>`:''}<div class="bar"><button class="bt" onclick="usaSolD('${esc(s.id)}')">Copiar para a caixa</button></div></div>
   <div class="box ans" id="ans_${id}" hidden><h4>Resposta esperada</h4><p style="margin:0 0 6px">${fmtTxt(s.a)}</p>${s.sql?tableHTML(s.sql.c,s.sql.v):(s.out?`<pre>${esc(s.out)}</pre>`:'')}</div>
   <div class="out" id="out_${id}"></div>
  </div>`;
}
function usaSolD(id){const s=findStep(id);const ed=$('ed_'+s.dom);ed.value=s.s;ST.code[s.id]=s.s;saveSoon();autosize(ed);ed.focus()}
async function prepStep(id){
  const s=findStep(id),d=s.d,out=$('out_'+s.dom),st=t=>{out.innerHTML=`<div class="verdict info">${t}</div>`};
  try{
    const prev=d.steps.slice(0,s.k);const pk=[...new Set(prev.flatMap(x=>x.pk||[]))];
    await runR(prev.map(x=>x.s).join('\n'),{fresh:false,pk,status:st});
    out.innerHTML=`<div class="verdict good">⏩ Pronto: as soluções das etapas 1 a ${s.k} foram rodadas. Os objetos já existem; agora faça esta etapa.</div>`;
  }catch(x){out.innerHTML=`<div class="verdict bad">Não consegui rodar (${esc(x.message||x)}).</div>`}
}
async function runStep(id){
  const s=findStep(id),d=s.d,out=$('out_'+s.dom),code=$('ed_'+s.dom).value;
  if(!code.trim()){out.innerHTML='<div class="verdict info">Escreva algum código antes de rodar 🙂</div>';return}
  const st=t=>{out.innerHTML=`<div class="verdict info">${t}</div>`};
  if(d.lang==='sql'){
    st('⏳ Rodando a consulta (na 1ª vez o banco é baixado)…');
    let r;try{r=await runSQL(code,{url:d.u[0]})}catch(x){out.innerHTML=`<div class="verdict bad">Não consegui carregar o banco (${esc(x.message)}).</div>`;return}
    if(r.error){out.innerHTML=`<pre class="out"><span class="err">Erro: ${esc(r.error)}</span></pre><div class="verdict bad">❌ O SQL acusou um erro. Confira nomes de tabelas e colunas (eles diferenciam o que está escrito na lista de colunas acima).</div>`;return}
    let v='';if(s.sql){if(sameValues(r.res,s.sql)){v='<div class="verdict good">✅ Resultado igual ao esperado!</div>';marca(id,true)}else v='<div class="verdict diff">🤔 Diferente do esperado. Compare com 🎯 Resposta.</div>'}
    out.innerHTML=tableHTML(r.res?.c,r.res?.v||[])+v;return;
  }
  try{
    const res=await runR(code,{fresh:false,pk:pkgsIn(code),status:st});
    out.innerHTML=outHTML(res);drawImgs(out,res.images);
    let v='';
    const miss=res.out.find(o=>o.t==='stderr'&&/object '.*' not found|objeto '.*' não encontrado/.test(o.d));
    if(miss&&s.k>0)v='<div class="verdict bad">❌ Um objeto não existe ainda. Rode as etapas anteriores primeiro (ou clique em ⏩ Rodar as soluções anteriores).</div>';
    else if(hasErr(res))v='<div class="verdict bad">❌ O R mostrou um erro. Leia a mensagem em vermelho.</div>';
    else if((s.m||'').includes('plot'))v=res.images.length?'<div class="verdict good">📊 Gráfico desenhado! Compare com a 🎯 Resposta.</div>':'<div class="verdict diff">Nenhum gráfico apareceu.</div>';
    else if(s.out!=null&&norm(s.out)===stdoutOf(res)){v='<div class="verdict good">✅ Saída igual à esperada!</div>';marca(id,true)}
    else v='<div class="verdict info">Rodou! Compare o resultado com a 🎯 Resposta esperada e marque como feito quando estiver certo.</div>';
    out.insertAdjacentHTML('beforeend',v);
  }catch(x){out.innerHTML=`<div class="verdict bad">Não consegui rodar o R aqui (${esc(x.message||x)}). Baixe a base e faça no RStudio.</div>`;console.error(x)}
}
function pkgsIn(code){const s=new Set();const re=/(?:library|require)\(\s*([A-Za-z0-9.]+)\s*\)|\b([A-Za-z][A-Za-z0-9.]*)::/g;let m;const base=['base','stats','utils','datasets','graphics','grDevices','methods','tools','webr'];while((m=re.exec(code))){const p=m[1]||m[2];if(!base.includes(p))s.add(p)}return [...s]}
render();
</script>
