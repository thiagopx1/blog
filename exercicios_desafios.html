 as suas funções.","s":"source(\"caminho/arquivo.R\")","ex":[{"x":"Crie um arquivo \"funcoes.R\" com a função triplo e carregue-o com source(). Depois use triplo(5).","d":"writeLines() cria o arquivo; source() executa o que está nele.","s":"writeLines(\"triplo <- function(x) x * 3\", \"funcoes.R\")\nsource(\"funcoes.R\")\ntriplo(5)","out":"[1] 15"},{"x":"Crie um script \"config.R\" que define taxa <- 0.05, rode-o com source() e calcule 1000 * taxa.","d":"Os objetos criados no script ficam disponíveis.","s":"writeLines(\"taxa <- 0.05\", \"config.R\")\nsource(\"config.R\")\n1000 * taxa","out":"[1] 50"},{"x":"Rode com source() um script que mostra uma mensagem com cat(), usando echo = TRUE para ver o código também.","d":"echo = TRUE mostra cada linha antes do resultado.","s":"writeLines('cat(\"Script rodou!\\\\n\")', \"msg.R\")\nsource(\"msg.R\", echo = TRUE)","out":"\n> cat(\"Script rodou!\\n\")\nScript rodou!"}]},{"name":"install.packages() e library()","o":"install.packages() baixa e instala um pacote no computador (uma vez só); library() carrega o pacote na sessão (toda vez que abrir o R).","s":"install.packages(\"nome\")        # com aspas, uma vez","ex":[{"x":"Escreva o código para instalar e depois carregar o pacote dplyr.","d":"install.packages() só uma vez (com aspas); library() a cada sessão.","s":"install.packages(\"dplyr\")\nlibrary(dplyr)","m":"norun","pk":["dplyr"]},{"x":"Carregue o pacote dplyr e use a função glimpse() na mtcars.","d":"Depois do library(), as funções do pacote ficam disponíveis.","s":"library(dplyr)\nglimpse(mtcars)","pk":["dplyr"]},{"x":"Instale de uma vez os pacotes \"readxl\" e \"writexl\".","d":"Passe um vetor com os nomes.","s":"install.packages(c(\"readxl\", \"writexl\"))","m":"norun"}]},{"name":"search() e installed.packages()","o":"search() mostra os pacotes carregados agora; installed.packages() lista todos os instalados no computador.","s":"search()","ex":[{"x":"Veja quais pacotes estão carregados na sessão.","d":"search() lista o que está \"anexado\".","s":"search()","out":"[1] \".GlobalEnv\"        \"package:stats\"     \"package:graphics\" \n[4] \"package:grDevices\" \"package:utils\"     \"package:datasets\" \n[7] \"package:methods\"   \"Autoloads\"         \"package:base\"     "},{"x":"Mostre quantos pacotes estão instalados no seu computador.","d":"installed.packages() devolve uma tabela: uma linha por pacote.","s":"nrow(installed.packages())","out":"[1] 16"},{"x":"Verifique se o pacote \"stats\" está instalado.","d":"Os nomes das linhas são os nomes dos pacotes.","s":"\"stats\" %in% rownames(installed.packages())","out":"[1] TRUE"}]},{"name":"update.packages()","o":"Verifica e atualiza os pacotes instalados para a versão mais recente.","s":"update.packages()","ex":[{"x":"Escreva o comando para atualizar todos os pacotes instalados.","d":"Ele pergunta pacote por pacote.","s":"update.packages()","m":"norun"},{"x":"Atualize tudo sem o R ficar perguntando.","d":"ask = FALSE.","s":"update.packages(ask = FALSE)","m":"norun"},{"x":"Veja quais pacotes têm versão nova disponível, sem atualizar.","d":"old.packages() só lista.","s":"old.packages()","m":"norun"}]},{"name":"devtools::install_github()","o":"Instala um pacote direto do GitHub (pacotes que ainda não estão no CRAN ou versões em desenvolvimento).","s":"install.packages(\"devtools\")              # uma vez","ex":[{"x":"Escreva o código para instalar o pacote \"devtools\".","d":"O devtools vem do CRAN.","s":"install.packages(\"devtools\")","m":"norun"},{"x":"Instale o pacote do GitHub \"tidyverse/dplyr\" usando devtools sem carregar o devtools.","d":"usuario/repositorio.","s":"devtools::install_github(\"tidyverse/dplyr\")","m":"norun","pk":["devtools"]},{"x":"Instale o pacote \"allisonhorst/palmerpenguins\" do GitHub e carregue-o.","d":"Depois de instalar, library() normal.","s":"devtools::install_github(\"allisonhorst/palmerpenguins\")\nlibrary(palmerpenguins)","m":"norun","pk":["devtools","palmerpenguins"]}]},{"name":"pacote::funcao","o":"Os dois pontos duplos chamam uma função de um pacote específico sem precisar do library().","s":"pacote::funcao(argumentos)","ex":[{"x":"Use a função median do pacote stats escrevendo stats::median em c(3, 1, 2).","d":"pacote::funcao usa a função sem library().","s":"stats::median(c(3, 1, 2))","out":"[1] 2"},{"x":"Use utils::head para ver 2 linhas da mtcars.","d":"Útil quando dois pacotes têm funções com o mesmo nome.","s":"utils::head(mtcars, 2)","out":"              mpg cyl disp  hp drat    wt  qsec vs am gear carb\nMazda RX4      21   6  160 110  3.9 2.620 16.46  0  1    4    4\nMazda RX4 Wag  21   6  160 110  3.9 2.875 17.02  0  1    4    4"},{"x":"Use dplyr::filter para pegar os carros com 8 cilindros, sem carregar o dplyr, e conte as linhas.","d":"stats::filter é outra função; por isso o dplyr:: evita confusão.","s":"nrow(dplyr::filter(mtcars, cyl == 8))","pk":["dplyr"]}]},{"name":"vignette() e browseVignettes()","o":"Abrem os tutoriais (vignettes) que acompanham os pacotes, com exemplos de uso.","s":"vignette(package = \"nome\")","ex":[{"x":"Liste os tutoriais (vignettes) do pacote dplyr.","d":"vignette(package = \"...\").","s":"vignette(package = \"dplyr\")","m":"norun"},{"x":"Abra o tutorial \"dplyr\" do pacote dplyr.","d":"O primeiro argumento é o nome do tutorial.","s":"vignette(\"dplyr\", package = \"dplyr\")","m":"norun"},{"x":"Abra no navegador todos os tutoriais do pacote tidyr.","d":"browseVignettes() abre uma página com a lista.","s":"browseVignettes(\"tidyr\")","m":"norun"}]}]},{"lang":"R","title":"Pastas, importação e exportação","color":"#ff8fab","cmds":[{"name":"getwd() e setwd()","o":"getwd() mostra em qual pasta o R está trabalhando; setwd() muda essa pasta.","s":"getwd()","ex":[{"x":"Mostre a pasta de trabalho atual.","d":"getwd() = get working directory.","s":"getwd()","out":"[1] \"/home/web_user\""},{"x":"Crie a pasta \"dados\" (dir.create), entre nela com setwd(), mostre getwd() e volte para a pasta anterior.","d":"Guarde a pasta inicial numa variável para voltar.","s":"inicio <- getwd()\ndir.create(\"dados\", showWarnings = FALSE)\nsetwd(\"dados\")\ngetwd()\nsetwd(inicio)","out":"[1] \"/home/web_user/dados\""},{"x":"Escreva como mudar para a pasta C:/Users/thiago/Documents/pos no Windows.","d":"No R, use barra normal / (ou \\\\ dupla) nos caminhos.","s":"setwd(\"C:/Users/thiago/Documents/pos\")","m":"norun"}]},{"name":"file.exists() e list.files()","o":"file.exists() confere se um arquivo está onde você acha que está; list.files() lista os arquivos da pasta de trabalho.","s":"file.exists(\"arquivo.csv\")","ex":[{"x":"Crie o arquivo \"teste.txt\" com writeLines() e confira com file.exists().","d":"file.exists() devolve TRUE/FALSE.","s":"writeLines(\"olá\", \"teste.txt\")\nfile.exists(\"teste.txt\")","out":"[1] TRUE"},{"x":"Crie dois arquivos .csv (\"a.csv\" e \"b.csv\") e liste apenas os arquivos .csv da pasta.","d":"pattern filtra pelo nome.","s":"write.csv(head(iris), \"a.csv\")\nwrite.csv(head(mtcars), \"b.csv\")\nlist.files(pattern = \"\\\\.csv$\")","out":"[1] \"a.csv\" \"b.csv\""},{"x":"Verifique se \"nao_existe.csv\" existe; se não existir, mostre a mensagem \"Arquivo não encontrado\".","d":"Combine com if e !.","s":"if (!file.exists(\"nao_existe.csv\")) cat(\"Arquivo não encontrado\\n\")","out":"Arquivo não encontrado"}]},{"name":"file.choose()","o":"Abre a janela do sistema para você escolher um arquivo com o mouse e devolve o caminho dele.","s":"read.csv(file.choose())","ex":[{"x":"Escreva o código para escolher um arquivo CSV numa janela e lê-lo.","d":"A janela de escolha abre no seu computador.","s":"dados <- read.csv(file.choose())","m":"norun"},{"x":"Escolha um arquivo pela janela e mostre só o caminho completo dele.","d":"file.choose() devolve o caminho como texto.","s":"caminho <- file.choose()\ncaminho","m":"norun"},{"x":"Escolha um arquivo Excel pela janela e leia com read_excel().","d":"file.choose() pode ser usado dentro de qualquer função de leitura.","s":"library(readxl)\ndados <- read_excel(file.choose())","m":"norun","pk":["readxl"]}]},{"name":"read.csv() e read.csv2()","o":"Leem um arquivo CSV (planilha em texto) e transformam em data frame.","s":"dados <- read.csv(\"arquivo.csv\", header = TRUE, sep = \",\", dec = \".\")","ex":[{"x":"Salve head(iris) em \"flores.csv\" e leia de volta com read.csv(). Mostre o resultado.","d":"row.names = FALSE evita uma coluna extra de números.","s":"write.csv(head(iris), \"flores.csv\", row.names = FALSE)\nflores <- read.csv(\"flores.csv\")\nflores","out":"  Sepal.Length Sepal.Width Petal.Length Petal.Width Species\n1          5.1         3.5          1.4         0.2  setosa\n2          4.9         3.0          1.4         0.2  setosa\n3          4.7         3.2          1.3         0.2  setosa\n4          4.6         3.1          1.5         0.2  setosa\n5          5.0         3.6          1.4         0.2  setosa\n6          5.4         3.9          1.7         0.4  setosa"},{"x":"Crie um CSV no padrão brasileiro (separador ; e vírgula decimal) e leia com read.csv2().","d":"read.csv2 já espera ; e vírgula decimal.","s":"writeLines(c(\"nome;altura\", \"Ana;1,62\", \"Bia;1,75\"), \"br.csv\")\nread.csv2(\"br.csv\")","out":"  nome altura\n1  Ana   1.62\n2  Bia   1.75"},{"x":"Leia a base Titanic direto da internet e mostre as dimensões: https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv","d":"read.csv() aceita um endereço da internet.","s":"titanic <- read.csv(\"https://raw.githubusercontent.com/datasciencedojo/datasets/master/titanic.csv\")\ndim(titanic)","m":"nocheck"}]},{"name":"read.table(), read.delim() e read.fwf()","o":"Leem arquivos de texto (.txt): read.table() com qualquer separador, read.delim() separado por tabulação e read.fwf() de largura fixa.","s":"read.table(\"arquivo.txt\", header = TRUE, sep = \" \")","ex":[{"x":"Crie um arquivo separado por TAB e leia com read.delim().","d":"\\t é o TAB.","s":"writeLines(c(\"nome\\tidade\", \"Ana\\t20\", \"Caio\\t35\"), \"tab.txt\")\nread.delim(\"tab.txt\")","out":"  nome idade\n1  Ana    20\n2 Caio    35"},{"x":"Crie um arquivo separado por espaço, com cabeçalho, e leia com read.table().","d":"header = TRUE diz que a primeira linha tem os nomes.","s":"writeLines(c(\"x y\", \"1 10\", \"2 20\"), \"esp.txt\")\nread.table(\"esp.txt\", header = TRUE)","out":"  x  y\n1 1 10\n2 2 20"},{"x":"Leia um arquivo de largura fixa onde os 3 primeiros caracteres são o código e os 2 seguintes a idade.","d":"widths diz quantos caracteres tem cada coluna.","s":"writeLines(c(\"A0125\", \"B0231\"), \"fixo.txt\")\nread.fwf(\"fixo.txt\", widths = c(3, 2), col.names = c(\"codigo\", \"idade\"))","out":"  codigo idade\n1    A01    25\n2    B02    31"}]},{"name":"read_excel() e excel_sheets()","o":"read_excel() lê planilhas do Excel (.xlsx e .xls); excel_sheets() lista as abas do arquivo.","s":"library(readxl)","ex":[{"x":"Salve head(mtcars) num Excel com writexl e leia de volta com read_excel().","d":"read_excel() vem do pacote readxl.","s":"library(writexl)\nlibrary(readxl)\nwrite_xlsx(head(mtcars), \"carros.xlsx\")\nread_excel(\"carros.xlsx\")","pk":["readxl","writexl"]},{"x":"Crie um Excel com duas abas (iris e mtcars) e liste as abas com excel_sheets().","d":"Uma lista nomeada vira várias abas.","s":"library(writexl)\nlibrary(readxl)\nwrite_xlsx(list(flores = head(iris), carros = head(mtcars)), \"duas_abas.xlsx\")\nexcel_sheets(\"duas_abas.xlsx\")","pk":["readxl","writexl"]},{"x":"Leia apenas a aba \"carros\" do arquivo do exercício anterior.","d":"Use o argumento sheet.","s":"library(writexl)\nlibrary(readxl)\nwrite_xlsx(list(flores = head(iris), carros = head(mtcars)), \"duas_abas.xlsx\")\nread_excel(\"duas_abas.xlsx\", sheet = \"carros\")","pk":["readxl","writexl"]}]},{"name":"write.csv() e write.table()","o":"Salvam (exportam) um data frame para um arquivo CSV ou TXT.","s":"write.csv(tabela, \"arquivo.csv\", row.names = FALSE)","ex":[{"x":"Salve a base mtcars em \"carros.csv\" e confira que o arquivo existe.","d":"write.csv(objeto, \"nome.csv\").","s":"write.csv(mtcars, \"carros.csv\")\nfile.exists(\"carros.csv\")","out":"[1] TRUE"},{"x":"Salve head(iris, 3) sem os números das linhas e veja o conteúdo do arquivo com readLines().","d":"readLines() mostra o arquivo linha a linha.","s":"write.csv(head(iris, 3), \"iris3.csv\", row.names = FALSE)\nreadLines(\"iris3.csv\")","out":"[1] \"\\\"Sepal.Length\\\",\\\"Sepal.Width\\\",\\\"Petal.Length\\\",\\\"Petal.Width\\\",\\\"Species\\\"\"\n[2] \"5.1,3.5,1.4,0.2,\\\"setosa\\\"\"                                                   \n[3] \"4.9,3,1.4,0.2,\\\"setosa\\\"\"                                                     \n[4] \"4.7,3.2,1.3,0.2,\\\"setosa\\\"\"                                                   "},{"x":"Salve head(iris, 3) separado por ponto e vírgula com write.table() e veja o arquivo.","d":"sep define o separador.","s":"write.table(head(iris, 3), \"iris3.txt\", sep = \";\", row.names = FALSE)\nreadLines(\"iris3.txt\")","out":"[1] \"\\\"Sepal.Length\\\";\\\"Sepal.Width\\\";\\\"Petal.Length\\\";\\\"Petal.Width\\\";\\\"Species\\\"\"\n[2] \"5.1;3.5;1.4;0.2;\\\"setosa\\\"\"                                                   \n[3] \"4.9;3;1.4;0.2;\\\"setosa\\\"\"                                                     \n[4] \"4.7;3.2;1.3;0.2;\\\"setosa\\\"\"                                                   "}]},{"name":"write_xlsx()","o":"Salva um data frame (ou vários, em abas) num arquivo Excel .xlsx.","s":"library(writexl)","ex":[{"x":"Salve a base iris em \"iris.xlsx\" com writexl.","d":"O pacote é writexl.","s":"library(writexl)\nwrite_xlsx(iris, \"iris.xlsx\")\nfile.exists(\"iris.xlsx\")","pk":["writexl"]},{"x":"Salve iris e mtcars em abas diferentes do mesmo arquivo.","d":"Passe uma lista nomeada.","s":"library(writexl)\nwrite_xlsx(list(flores = iris, carros = mtcars), \"bases.xlsx\")\nfile.exists(\"bases.xlsx\")","pk":["writexl"]},{"x":"Salve mtcars incluindo o nome dos carros como coluna (write_xlsx ignora rownames).","d":"Transforme os rownames numa coluna antes.","s":"library(writexl)\ncarros <- cbind(modelo = rownames(mtcars), mtcars)\nwrite_xlsx(carros, \"carros_nomes.xlsx\")\nfile.exists(\"carros_nomes.xlsx\")","pk":["writexl"]}]},{"name":"saveRDS() e readRDS()","o":"Salvam e leem UM objeto do R no formato próprio do R (.rds), exatamente como ele estava.","s":"saveRDS(objeto, \"arquivo.rds\")","ex":[{"x":"Salve a base iris em \"iris.rds\" e leia de volta para `flores`. Confira com identical().","d":"RDS guarda o objeto exatamente como estava.","s":"saveRDS(iris, \"iris.rds\")\nflores <- readRDS(\"iris.rds\")\nidentical(iris, flores)","out":"[1] TRUE"},{"x":"Crie um fator ordenado, salve em RDS, leia de volta e confira que a ordem dos níveis foi mantida.","d":"Diferente do CSV, o RDS mantém tipos e níveis.","s":"f <- factor(c(\"baixo\", \"alto\"), levels = c(\"baixo\", \"alto\"), ordered = TRUE)\nsaveRDS(f, \"fator.rds\")\nreadRDS(\"fator.rds\")","out":"[1] baixo alto \nLevels: baixo < alto"},{"x":"Salve uma lista com dois objetos em RDS e leia só o segundo elemento depois.","d":"O objeto lido é a lista inteira.","s":"saveRDS(list(a = 1:3, b = \"texto\"), \"lista.rds\")\nreadRDS(\"lista.rds\")$b","out":"[1] \"texto\""}]},{"name":"save() e load()","o":"save() guarda VÁRIOS objetos num arquivo .RData; load() traz todos de volta com os nomes originais.","s":"save(obj1, obj2, file = \"arquivo.RData\")","ex":[{"x":"Crie x <- 1:5 e y <- \"oi\", salve os dois em \"objetos.RData\", apague-os e carregue de volta.","d":"load() recria os objetos com os nomes originais.","s":"x <- 1:5\ny <- \"oi\"\nsave(x, y, file = \"objetos.RData\")\nrm(x, y)\nload(\"objetos.RData\")\nx\ny","out":"[1] 1 2 3 4 5\n[1] \"oi\""},{"x":"Salve todo o ambiente com save.image() e confira que o arquivo existe.","d":"save.image() salva todos os objetos.","s":"a <- 10\nsave.image(\"tudo.RData\")\nfile.exists(\"tudo.RData\")","out":"[1] TRUE"},{"x":"Carregue \"objetos.RData\" (criado como no primeiro exercício) e liste o que foi carregado.","d":"load() devolve os nomes dos objetos carregados.","s":"x <- 1:5; y <- \"oi\"\nsave(x, y, file = \"objetos.RData\")\nrm(list = ls())\ncarregados <- load(\"objetos.RData\")\ncarregados","out":"[1] \"x\" \"y\""}]},{"name":"data() e datasets::","o":"Carregam as bases de dados que já vêm com o R (mtcars, iris, airquality…), ótimas para praticar.","s":"data()                    # lista todas","ex":[{"x":"Carregue a base \"airquality\" com data() e mostre as 3 primeiras linhas.","d":"data(\"nome\") carrega uma base que vem com o R.","s":"data(airquality)\nhead(airquality, 3)","out":"  Ozone Solar.R Wind Temp Month Day\n1    41     190  7.4   67     5   1\n2    36     118  8.0   72     5   2\n3    12     149 12.6   74     5   3"},{"x":"Mostre as dimensões da base ToothGrowth usando datasets::ToothGrowth.","d":"datasets:: é o pacote das bases de exemplo.","s":"dim(datasets::ToothGrowth)","out":"[1] 60  3"},{"x":"Veja a lista de bases disponíveis no pacote datasets e conte quantas são.","d":"data(package = ...) devolve uma lista com a tabela results.","s":"d <- data(package = \"datasets\")\nnrow(d$results)","out":"[1] 108"}]}]},{"lang":"R","title":"Gráficos (R base)","color":"#ff6b6b","cmds":[{"name":"plot()","o":"Desenha o gráfico básico: pontos (dispersão), linhas ou os dois.","s":"plot(x, y, type = \"p\", main = \"Título\", xlab = \"Eixo X\", ylab = \"Eixo Y\", col = \"blue\")","ex":[{"x":"Faça um gráfico de dispersão do peso (wt) no eixo x pelo consumo (mpg) no eixo y da mtcars.","d":"plot(x, y).","s":"plot(mtcars$wt, mtcars$mpg)","m":"plot"},{"x":"Refaça o gráfico com título \"Peso x Consumo\", rótulos nos eixos e pontos vermelhos cheios.","d":"main, xlab, ylab, col e pch.","s":"plot(mtcars$wt, mtcars$mpg, main = \"Peso x Consumo\",\n     xlab = \"Peso (1000 lb)\", ylab = \"Milhas por galão\",\n     col = \"red\", pch = 19)","m":"plot"},{"x":"Faça um gráfico de linha de x = 1:10 por y = x^2.","d":"type = \"l\" liga os pontos com ira aparição não conta como duplicada.","s":"duplicated(c(1, 2, 2, 3, 1))","out":"[1] FALSE FALSE  TRUE FALSE  TRUE"},{"x":"Remova as linhas repetidas do data frame abaixo.","d":"! inverte: ficam as linhas que NÃO são duplicadas.","s":"df <- data.frame(id = c(1, 2, 2, 3), nome = c(\"Ana\", \"Bia\", \"Bia\", \"Caio\"))\ndf[!duplicated(df), ]","t":"df <- data.frame(id = c(1, 2, 2, 3), nome = c(\"Ana\", \"Bia\", \"Bia\", \"Caio\"))","out":"  id nome\n1  1  Ana\n2  2  Bia\n4  3 Caio"},{"x":"Verifique se há algum valor repetido em mtcars$mpg e quantos são.","d":"anyDuplicated() devolve 0 se não houver repetidos.","s":"anyDuplicated(mtcars$mpg) > 0\nsum(duplicated(mtcars$mpg))","out":"[1] TRUE\n[1] 7"}]},{"name":"suppressWarnings()","o":"Roda um comando escondendo os avisos (warnings) que ele geraria.","s":"suppressWarnings(comando)","ex":[{"x":"Converta c(\"1\", \"x\", \"3\") para número sem mostrar o aviso.","d":"Envolva a expressão com suppressWarnings().","s":"suppressWarnings(as.numeric(c(\"1\", \"x\", \"3\")))","out":"[1]  1 NA  3"},{"x":"Calcule a média de idade <- c(\"20\", \"trinta\", \"40\") convertendo para número, sem aviso e ignorando o NA.","d":"O texto \"trinta\" vira NA.","s":"idade <- c(\"20\", \"trinta\", \"40\")\nmean(suppressWarnings(as.numeric(idade)), na.rm = TRUE)","out":"[1] 30"},{"x":"Conte quantos valores de c(\"5\", \"abc\", \"7\", \"?\") não puderam ser convertidos para número.","d":"Os que falharam viram NA.","s":"x <- suppressWarnings(as.numeric(c(\"5\", \"abc\", \"7\", \"?\")))\nsum(is.na(x))","out":"[1] 2"}]},{"name":"apply()","o":"Aplica uma função em cada linha ou em cada coluna de uma matriz (ou data frame), sem precisar escrever um laço.","s":"apply(X, MARGIN, FUN, ...)","ex":[{"x":"Calcule a soma de cada linha de matrix(1:6, nrow = 2) com apply().","d":"1 = linhas.","s":"m <- matrix(1:6, nrow = 2)\napply(m, 1, sum)","out":"[1]  9 12"},{"x":"Calcule a média de cada coluna das 4 colunas numéricas da iris.","d":"2 = colunas.","s":"apply(i [[1]]","out":"[1] \"12\"  \"7\"   \"350\""}]},{"name":"gsub() e sub()","o":"Substituem um trecho de texto por outro: gsub() troca todas as ocorrências; sub() só a primeira.","s":"gsub(\"antigo\", \"novo\", texto)","ex":[{"x":"Troque todos os espaços de \"dados de saúde\" por \"_\".","d":"gsub() troca todas as ocorrências.","s":"gsub(\" \", \"_\", \"dados de saúde\")","out":"[1] \"dados_de_saúde\""},{"x":"Troque só o primeiro \"a\" de \"banana\" por \"A\".","d":"sub() troca só a primeira.","s":"sub(\"a\", \"A\", \"banana\")","out":"[1] \"bAnana\""},{"x":"Limpe o preço \"R$ 1.250,90\" para o número 1250.9.","d":"$ e . são especiais: use \\\\$ ou fixed = TRUE.","s":"p <- \"R$ 1.250,90\"\np <- gsub(\"R\\\\$ \", \"\", p)\np <- gsub(\".\", \"\", p, fixed = TRUE)\np <- sub(\",\", \".\", p)\nas.numeric(p)","out":"[1] 1250.9"}]},{"name":"trimws()","o":"Remove os espaços em branco do início e do fim do texto.","s":"trimws(texto)","ex":[{"x":"Remova os espaços das pontas de \"   Goiânia  \".","d":"trimws() limpa as pontas.","s":"trimws(\"   Goiânia  \")","out":"[1] \"Goiânia\""},{"x":"Remova só os espaços do início de \"   texto  \".","d":"which = \"left\".","s":"trimws(\"   texto  \", which = \"left\")","out":"[1] \"texto  \""},{"x":"Padronize c(\" SP\", \"SP \", \"sp\") para \"SP\" e conte quantos são.","d":"Combine trimws() e toupper().","s":"uf <- c(\" SP\", \"SP \", \"sp\")\ntable(toupper(trimws(uf)))","out":"\nSP \n 3 "}]},{"name":"str_length() e str_sub()","o":"Versões do stringr para contar caracteres (str_length) e recortar um pedaço do texto (str_sub).","s":"str_length(texto)","ex":[{"x":"Com stringr, conte os caracteres de c(\"R\", \"SQL\", \"Python\").","d":"str_length() é o nchar() do stringr.","s":"library(stringr)\nstr_length(c(\"R\", \"SQL\", \"Python\"))","pk":["stringr"]},{"x":"Com str_sub(), pegue os 3 últimos caracteres de \"relatorio.csv\".","d":"Números negativos contam do fim.","s":"library(stringr)\nstr_sub(\"relatorio.csv\", -3, -1)","pk":["stringr"]}, lve uma lista.","s":"library(stringr)\nstr_split(\"a;b;c\", \";\")","pk":["stringr"]},{"x":"Junte \"Dra.\" e \"Carla\" com espaço usando str_c().","d":"str_c() é o paste() do stringr.","s":"library(stringr)\nstr_c(\"Dra.\", \"Carla\", sep = \" \")","pk":["stringr"]},{"x":"Junte c(\"x\", \"y\", \"z\") num único texto \"x-y-z\".","d":"collapse junta tudo.","s":"library(stringr)\nstr_c(c(\"x\", \"y\", \"z\"), collapse = \"-\")","pk":["stringr"]}]},{"name":"str_dup(), str_pad() e str_trim()","o":"str_dup() repete um texto; str_pad() completa com caracteres até um tamanho; str_trim() tira espaços das pontas.","s":"str_dup(texto, vezes)","ex":[{"x":"Repita \"ha\" 3 vezes.","d":"str_dup(texto, vezes).","s":"library(stringr)\nstr_dup(\"ha\", 3)","pk":["stringr"]},{"x":"Deixe os códigos c(\"7\", \"42\", \"315\") com 4 dígitos, completando com zeros à esquerda.","d":"str_pad() completa até o tamanho width.","s":"library(stringr)\nstr_pad(c(\"7\", \"42\", \"315\"), width = 4, pad = \"0\")","pk":["stringr"]},{"x":"Remova os espaços das pontas de \"  texto  \" com str_trim().","d":"Igual ao trimws().","s":"library(stringr)\nstr_trim(\"  texto  \")","pk":["stringr"]}]},{"name":"str_detect(), str_locate() e str_count()","o":"str_detect() responde se o padrão existe (TRUE/FALSE); str_locate() diz onde começa e termina; str_count() conta quantas vezes aparece.","s":"str_detect(texto, \"padrão\")","ex":[{"x":"Teste quais frutas contêm \"an\": c(\"banana\", \"maçã\", \"manga\").","d":"Devolve TRUE/FALSE.","s":"library(stringr)\nstr_detect(c(\"banana\", \"maçã\", \"manga\"), \"an\")","pk":["stringr"]},{"x":"Encontre a posição de \"rio\" em \"Rio de Janeiro e rio Vermelho\" (diferencia maiúscula).","d":"Devolve início e fim da primeira ocorrência.","s":"library(stringr)\nstr_locate(\"Rio de Janeiro e rio Vermelho\", \"rio\")","pk":["stringr"]},{"x":"Conte quantas vezes a letra \"s\" aparece em \"sassafrás\".","d":"str_count() conta ocorrências.","s":"library(stringr)\nstr_count(\"sassafrás\", \"s\")","pk":["stringr"]}]},{"name":"str_subset()","o":"Devolve só os textos de um vetor que contêm o padrão.","s":"str_subset(vetor, \"padrão\")","ex":[{"x":"De c(\"arroz\", \"feijão\", \"farinha\"), fique só com os que começam com \"f\".","d":"^ significa \"começa com\".","s":"library(stringr)\nstr_subset(c(\"arroz\", \"feijão\", \"farinha\"), \"^f\")","pk":["stringr"]},{"x":"Fique só com os arquivos .csv de c(\"a.csv\", \"b.xlsx\", \"c.csv\").","d":"$ significa \"termina com\"; \\\\. é o ponto literal.","s":"library(stringr)\nstr_subset(c(\"a.csv\", \"b.xlsx\", \"c.csv\"), \"\\\\.csv$\")","pk":["stringr"]},{"x":"Mostre os nomes de carros da mtcars que têm algum número no nome.","d":"[0-9] = qualquer dígito.","s":"library(stringr)\nstr_subset(rownames(mtcars), \"[0-9]\")","pk":["stringr"]}]}]},{"lang":"R","title":"Datas","color":"#5ac8fa","cmds":[{"name":"as.Date()","o":"Converte um texto numa data de verdade (tipo Date), informando em que formato o texto está escrito.","s":"as.Date(texto, format = \"%d/%m/%Y\")","ex":[{"x":"Converta \"2024-03-15\" em data e mostre a classe.","d":"O formato padrão é ano-mês-dia.","s":"d <- as.Date(\"2024-03-15\")\nclass(d)","out":"[1] \"Date\""},{"x":"Converta a data brasileira \"15/03/2024\" usando o argumento format.","d":"%d dia, %m mês, %Y ano com 4 dígitos.","s":"as.Date(\"15/03/2024\", format = \"%d/%m/%Y\")","out":"[1] \"2024-03-15\""},{"x":"Quantos dias se passaram entre \"2024-01-10\" e \"2024-03-01\"?","d":"Datas podem ser subtraídas.","s":"as.Date(\"2024-03-01\") - as.Date(\"2024-01-10\")","out":"Time difference of 51 days"}]},{"name":"format()","o":"Mostra uma data (que já é do tipo Date) no formato de texto que você quiser.","s":"format(data, \"%d/%m/%Y\")","ex":[{"x":"Mostre a data as.Date(\"2024-03-15\") no formato \"15/03/2024\".","d":"format(data, molde).","s":"format(as.Date(\"2024-03-15\"), \"%d/%m/%Y\")","out":"[1] \"15/03/2024\""},{"x":"Mostre só o ano da mesma data.","d":"%Y.","s":"format(as.Date(\"202 ra \"15/03/2024\".","d":"dmy = day-month-year.","s":"library(lubridate)\ndmy(\"15/03/2024\")","pk":["lubridate"]},{"x":"Converta a data americana \"March 15, 2024\".","d":"mdy = month-day-year.","s":"library(lubridate)\nmdy(\"March 15, 2024\")","pk":["lubridate"]}]},{"name":"year(), month() e day()","o":"Extraem partes de uma data: ano, mês, dia (e hour, minute, second para horas).","s":"year(data)  month(data)  day(data)  hour(dh)  minute(dh)  second(dh)","ex":[{"x":"Extraia o ano, o mês e o dia de ymd(\"2024-03-15\").","d":"Uma função para cada parte.","s":"library(lubridate)\nd <- ymd(\"2024-03-15\")\nyear(d)\nmonth(d)\nday(d)","pk":["lubridate"]},{"x":"Mostre o nome do mês por extenso de ymd(\"2024-07-01\").","d":"label = TRUE devolve o nome.","s":"library(lubridate)\nmonth(ymd(\"2024-07-01\"), label = TRUE, abbr = FALSE)","pk":["lubridate"]},{"x":"Descubra o dia da semana de ymd(\"2024-03-15\") com wday().","d":"wday() = dia da semana.","s":"library(lubridate)\nwday(ymd(\"2024-03-15\"), label = TRUE)","pk":["lubridate"]}]},{"name":"days(), months() e years()","o":"Criam períodos de tempo para somar ou subtrair de datas.","s":"data + days(n)   data - months(n)   data + years(n)   dh + hours(n)","ex":[{"x":"Some 10 dias a ymd(\"2024-01-25\").","d":"days(n) é um período de n dias.","s":"library(lubridate)\nymd(\"2024-01-25\") + days(10)","pk":["lubridate"]},{"x":"Some 1 mês a ymd(\"2024-01-31\"). O que acontece?","d":"31 de fevereiro não existe: o resultado é NA.","s":"library(lubridate)\nymd(\"2024-01-31\") + months(1)","pk":["lubridate"]},{"x":"Some 18 anos à data de nascimento ymd(\"2006-05-20\").","d":"years(18).","s":"library(lubridate)\nymd(\"2006-05-20\") + years(18)","pk":["lubridate"]}]},{"name":"interval(), duration() e period()","o":"interval() guarda o intervalo entre duas datas; duration() mede tempo exato em segundos; period() mede em unidades \"humanas\" (dias, meses).","s":"interval(inicio, fim)","ex":[{"x":"Crie o intervalo entre ymd(\"2024-01-01\  a mais próxima (round).","s":"floor_date(data, \"month\")","ex":[{"x":"Arredonde ymd(\"2024-03-15\") para o primeiro dia do mês.","d":"floor_date(data, \"month\").","s":"library(lubridate)\nfloor_date(ymd(\"2024-03-15\"), \"month\")","pk":["lubridate"]},{"x":"Arredonde a mesma data para o início do ano.","d":"Unidade \"year\".","s":"library(lubridate)\nfloor_date(ymd(\"2024-03-15\"), \"year\")","pk":["lubridate"]},{"x":"Arredonde ymd_hms(\"2024-03-15 14:47:10\") para a hora mais próxima e para a hora de cima.","d":"round_date() vai para a mais próxima; ceiling_date() para cima.","s":"library(lubridate)\nh <- ymd_hms(\"2024-03-15 14:47:10\")\nround_date(h, \"hour\")\nceiling_date(h, \"hour\")","pk":["lubridate"]}]},{"name":"today() e leap_year()","o":"today() devolve a data de hoje; leap_year() diz se um ano é bissexto.","s":"today()   leap_year(ano)","ex":[{"x":"Mostre a data de hoje com lubridate.","d":"today() é o Sys.Date() do lubridate.","s":"library(lubridate)\ntoday()","m":"nocheck","pk":["lubridate"]},{"x":"Teste se 2024 e 2025 são anos bissextos.","d":"leap_year() aceita anos.","s":"library(lubridate)\nleap_year(c(2024, 2025))","pk":["lubridate"]},{"x":"Liste os anos bissextos entre 2000 e 2030.","d":"Filtre com leap_year().","s":"library(lubridate)\nanos <- 2000:2030\nanos[leap_year(anos)]","pk":["lubridate"]}]}]},{"lang":"R","title":"dplyr: manipulação de tabelas","color":"#ff9f43","cmds":[{"name":"%>% e |> (pipe)","o":"O pipe passa o resultado do que está à esquerda como primeiro argumento da função à direita, permitindo encadear passos.","s":"dados %>% funcao1() %>% funcao2()","ex":[{"x":"Reescreva head(mtcars, 3) usando o pipe |>.","d":"O que está à esquerda vira o primeiro argumento da função da direita.","s":"mtcars |> head(3)","out":"               mpg cyl disp  hp drat    wt  qsec vs am gear carb\nMazda RX4     21.0   6  160 110 3.90 2.620 16.46  0  1    4    4\nMazda RX4 Wag 21.0   6  160 110 3.90 2.875 17.02  0  1    4    4\nDatsun 710    22.8   4  108  93 3.85 2.320 18.61  1  1    4    1"},{"x":"Calcule round(mean(mtcars$mpg), 1) usando pipes, sem funções uma dentro da outra.","d":"Leia como \"e então\": pegue mpg, e então tire a média, e então arredonde.","s":"mtcars$mpg |> mean() |> round(1)","out":"[1] 20.1"},{"x":"Com dplyr e %>%, filtre os carros com 6 cilindros e conte as linhas com nrow().","d":"%>% vem do dplyr (magrittr); |> é do R base.","s":"library(dplyr)\nmtcars %>% filter(cyl == 6) %>% nrow()","pk":["dplyr"]}]},{"name":"filter()","o":"Mantém só as linhas que obedecem a uma ou mais condições.","s":"filter(tabela, condição1, condição2, ...)","ex":[{"x":"Com dplyr, fique só com as flores \"virginica\" da iris e conte as linhas.","d":"filter(tabela, condição).","s":"library(dplyr)\niris |> filter(Species == \"virginica\") |> nrow()","pk":["dplyr"]},{"x":"Filtre os carros com mpg > 25 OU hp > 250.","d":"| é \"ou\".","s":"library(dplyr)\nmtcars |> filter(mpg > 25 | hp > 250)","pk":["dplyr"]},{"x":"Na base starwars, filtre os personagens humanos (species == \"Human\") com altura (height) maior que 180.","d":"Vírgula dentro do filter() funciona como E.","s":"library(dplyr)\nstarwars |> filter(species == \"Human\", height > 180) |> select(name, height)","pk":["dplyr"]}]},{"name":"select()","o":"Escolhe quais colunas manter (ou remover, com sinal de menos).","s":"select(tabela, col1, col2)","ex":[{"x":"Selecione só as colunas mpg, cyl e hp da mtcars (3 primeiras linhas).","d":"Os nomes vão sem aspas.","s":"library(dplyr)\nmtcars |> select(mpg, cyl, hp) |> head(3)","pk":["dplyr"]},{"x":"Selecione todas as colunas da iris MENOS Species.","d":"O sinal de menos remove.","s":"library(dplyr)\niris |> select(-Species) |> head(3)","pk":["dplyr"]},{"x":"Selecione da iris as colunas que começam com \"Petal\".","d":"starts_with() ajuda a escolher várias.","s":"library(dplyr)\niris |> select(starts_with(\"Petal\")) |> head(3)","pk":["dplyr"]}]},{"name":"mutate()","o":"Cria colunas novas ou altera colunas existentes, geralmente a partir de cálculos com outras colunas.","s":"mutate(tabela, nova = expressão, outra = expressão)","ex":[{"x":"Crie a coluna kml = mpg * 0.425 na mtcars e mostre mpg e kml (3 linhas).","d":"mutate(nova = conta).","s":"library(dplyr)\nmtcars |> mutate(kml = mpg * 0.425) |> select(mpg, kml) |> head(3)","pk":["dplyr"]},{"x":"Na starwars, crie o IMC = mass / (height / 100)^2 e mostre name e imc dos 5 primeiros.","d":"height está em cm: divida por 100.","s":"library(dplyr)\nstarwars |> mutate(imc = mass / (height / 100)^2) |> select(name, imc) |> head(5)","pk":["dplyr"]},{"x":"Na iris, crie duas colunas de uma vez: area_petala = Petal.Length * Petal.Width e grande = area_petala > 5.","d":"Uma coluna criada no mutate() já pode ser usada na próxima.","s":"library(dplyr)\niris |> mutate(area_petala = Petal.Length * Petal.Width,\n               grande = area_petala > 5) |> head()","pk":["dplyr"]}]},{"name":"arrange() e desc()","o":"Ordena as linhas por uma ou mais colunas; desc() inverte para ordem decrescente.","s":"arrange(tabela, coluna)","ex":[{"x":"Ordene a mtcars pelo mpg (do menor ao maior) e mostre 3 linhas.","d":"arrange() ordena crescente por padrão.","s":"library(dplyr)\nmtcars |> arrange(mpg) |> head(3)","pk":["dplyr"]},{"x":"Ordene a mtcars por hp decrescente.","d":"desc() inverte.","s":"library(dplyr)\nmtcars |> arrange(desc(hp)) |> head(3)","pk":["dplyr"]},{"x":"Ordene por cyl e, dentro de cada cyl, por mpg decrescente.","d":"Várias colunas: o desempate é a segunda.","s":"library(dplyr)\nmtcars |> arrange(cyl, desc(mpg)) |> select(cyl, mpg) |> head(6)","pk":["dplyr"]}]},{"name":"group_by() e summarise()","o":"group_by() separa a tabela em grupos; summarise() resume cada grupo numa linha (média, soma, contagem…).","s":"tabela %>%","ex":[{"x":"Calcule a média de mpg por cilindros (cyl).","d":"group_by() separa; summarise() resume cada grupo.","s":"library(dplyr)\nmtcars |> group_by(cyl) |> summarise(media_mpg = mean(mpg))","pk":["dplyr"]},{"x":"Calcule por espécie da iris: média e máximo de Petal.Length.","d":"Várias medidas no mesmo summarise().","s":"library(dplyr)\niris |> group_by(Species) |>\n  summarise(media = mean(Petal.Length), maximo = max(Petal.Length))","pk":["dplyr"]},{"x":"Na starwars, calcule a altura média por gênero (gender), ignorando NA.","d":"na.rm = TRUE dentro do mean().","s":"library(dplyr)\nstarwars |> group_by(gender) |> summarise(altura_media = mean(height, na.rm = TRUE))","pk":["dplyr"]}]},{"name":"n() e ungroup()","o":"n() conta linhas dentro de summarise() ou mutate(); ungroup() remove o agrupamento ativo.","s":"summarise(n = n())","ex":[{"x":"Conte quantos carros há em cada número de marchas (gear) usando n().","d":"n() conta as linhas do grupo.","s":"library(dplyr)\nmtcars |> group_by(gear) |> summarise(qtd = n())","pk":["dplyr"]},{"x":"Na iris, calcule por espécie a quantidade e a média de Sepal.Width.","d":"n() junto com outras medidas.","s":"library(dplyr)\niris |> group_by(Species) |> summarise(n = n(), media = mean(Sepal.Width))","pk":["dplyr"]},{"x":"Calcule, para cada carro, a diferença entre o seu mpg e a média do seu grupo de cyl; depois desagrupe.","d":"mutate() com grupo calcula a média do grupo em cada linha; ungroup() desfaz o grupo.","s":"library(dplyr)\nmtcars |> group_by(cyl) |> mutate(dif = mpg - mean(mpg)) |> ungroup() |>\n  select(cyl, mpg, dif) |> head()","pk":["dplyr"]}]},{"name":"count()","o":"Conta quantas linhas há para cada valor de uma coluna. É um atalho para group_by() + summarise(n = n()).","s":"count(tabela, coluna, sort = FALSE)","ex":[{"x":"Conte os carros por número de cilindros com count().","d":"count(coluna) = group_by + summarise(n()).","s":"library(dplyr)\nmtcars |> count(cyl)","pk":["dplyr"]},{"x":"Conte os personagens da starwars por espécie, do mais comum ao menos comum (5 primeiros).","d":"sort = TRUE ordena.","s":"library(dplyr)\nstarwars |> count(species, sort = TRUE) |> head(5)","pk":["dplyr"]},{"x":"Conte os carros por cyl e am juntos.","d":"Duas colunas: uma linha por combinação.","s":"library(dplyr)\nmtcars |> count(cyl, am)","pk":["dplyr"]}]},{"name":"if_else()","o":"Cria um valor (ou coluna) com duas possibilidades: uma quando a condição é verdadeira e outra quando é falsa.","s":"if_else(condição, valor_se_TRUE, valor_se_FALSE, missing = NULL)","ex":[{"x":"Crie a coluna tipo = \"automático\" se am == 0, senão \"manual\".","d":"if_else(condição, se verdadeiro, se falso).","s":"library(dplyr)\nmtcars |> mutate(tipo = if_else(am == 0, \"automático\", \"manual\")) |> count(tipo)","pk":["dplyr"]},{"x":"Na iris, crie tamanho = \"grande\" se Sepal.Length > 6, senão \"pequena\", e conte.","d":"Combine com count().","s":"library(dplyr)\niris |> mutate(tamanho = if_else(Sepal.Length > 6, \"grande\", \"pequena\")) |> count(tamanho)","pk":["dplyr"]},{"x":"Na starwars, crie altura_txt: \"sem dado\" se height é NA, senão \"com dado\". Conte.","d":"A condição é is.na(height).","s":"library(dplyr)\nstarwars |> mutate(altura_txt = if_else(is.na(height), \"sem dado\", \"com dado\")) |> count(altura_txt)","pk":["dplyr"]}]},{"name":"case_when()","o":"Cria um valor com várias possibilidades, testando condições em sequência; substitui vários if_else() aninhados.","s":"case_when(","ex":[{"x":"Classifique mpg da mtcars: < 15 \"baixo\", < 25 \"médio\", senão \"alto\". Conte as classes.","d":"condição ~ valor; TRUE pega \"todo o resto\".","s":"library(dplyr)\nmtcars |> mutate(consumo = case_when(\n  mpg < 15 ~ \"baixo\",\n  mpg < 25 ~ \"médio\",\n  TRUE ~ \"alto\"\n)) |> count(consumo)","pk":["dplyr"]},{"x":"Classifique as notas c(3, 6.5, 8, 9.5): < 5 \"Insuficiente\", < 7 \"Regular\", < 9 \"Bom\", senão \"Ótimo\".","d":"Funciona também fora do mutate(), com vetores.","s":"library(dplyr)\nnotas <- c(3, 6.5, 8, 9.5)\ncase_when(notas < 5 ~ \"Insuficiente\",\n          notas < 7 ~ \"Regular\",\n          notas < 9 ~ \"Bom\",\n          TRUE ~ \"Ótimo\")","pk":["dplyr"]},{"x":"Na starwars, crie porte: altura < 100 \"pequeno\", < 180 \"médio\", ≥ 180 \"alto\" e NA para quem não tem altura.","d":"Sem a linha TRUE ~ ..., quem não se encaixa vira NA.","s":"library(dplyr)\nstarwars |> mutate(porte = case_when(\n  height < 100 ~ \"pequeno\",\n  height < 180 ~ \"médio\",\n  height >= 180 ~ \"alto\"\n)) |> count(porte)","pk":["dplyr"]}]},{"name":"rename()","o":"Troca o nome de colunas: novo = antigo.","s":"rename(tabela, novo_nome = nome_antigo)","ex":[{"x":"Renomeie mpg para milhas_galao na mtcars.","d":"rename(novo = antigo).","s":"library(dplyr)\nmtcars |> rename(milhas_galao = mpg) |> head(2)","pk":["dplyr"]},{"x":"Renomeie Sepal.Length para comp_sepala e Species para especie na iris.","d":"Vários de uma vez, separados por vírgula.","s":"library(dplyr)\niris |> rename(comp_sepala = Sepal.Length, especie = Species) |> head(2)","pk":["dplyr"]},{"x":"Renomeie uma coluna com espaço no nome: \"Nome Completo\" para nome.","d":"Nomes com espaço vão entre crases ` `.","s":"library(dplyr)\ndf <- data.frame(`Nome Completo` = c(\"Ana\", \"Bia\"), check.names = FALSE)\ndf |> rename(nome = `Nome Completo`)","t":"df <- data.frame(`Nome Completo` = c(\"Ana\", \"Bia\"), check.names = FALSE)","pk":["dplyr"]}]},{"name":"distinct()","o":"Remove linhas duplicadas ou mostra os valores únicos de uma coluna.","s":"distinct(tabela)            # remove linhas inteiras repetidas","ex":[{"x":"Mostre as combinações únicas de cyl e gear da mtcars.","d":"distinct(colunas).","s":"library(dplyr)\nmtcars |> distinct(cyl, gear)","pk":["dplyr"]},{"x":"Remova as linhas repetidas do data frame abaixo.","d":"Sem colunas, considera a linha inteira.","s":"library(dplyr)\ndf <- data.frame(id = c(1, 1, 2), nome = c(\"Ana\", \"Ana\", \"Bia\"))\ndf |> distinct()","t":"df <- data.frame(id = c(1, 1, 2), nome = c(\"Ana\", \"Ana\", \"Bia\"))","pk":["dplyr"]},{"x":"Quantos mundos natais (homeworld) diferentes há na starwars?","d":"distinct() e depois nrow().","s":"library(dplyr)\nstarwars |> distinct(homeworld) |> nrow()","pk":["dplyr"]}]},{"name":"slice(), slice_head() e slice_sample()","o":"Escolhem linhas pela posição: slice(n) pega a linha n; slice_head(n = k) as k primeiras; slice_sample(n = k) k linhas sorteadas.","s":"slice(tabela, posição)","ex":[{"x":"Pegue as linhas 5 a 8 da mtcars com slice().","d":"slice() escolhe pela posição.","s":"library(dplyr)\nmtcars |> slice(5:8)","pk":["dplyr"]},{"x":"Pegue as 3 primeiras flores de cada espécie da iris.","d":"slice_head() respeita o group_by().","s":"library(dplyr)\niris |> group_by(Species) |> slice_head(n = 3)","pk":["dplyr"]},{"x":"Sorteie 5 carros da mtcars (use set.seed(10) para repetir o sorteio).","d":"slice_sample(n = quantidade).","s":"library(dplyr)\nset.seed(10)\nmtcars |> slice_sample(n = 5)","pk":["dplyr"]}]},{"name":"left_join(), inner_join(), right_join(), full_join()","o":"Juntam duas tabelas por uma coluna-chave em comum, como os JOINs do SQL.","s":"left_join(x, y, by = \"chave\")","ex":[{"x":"Junte clientes e compras mantendo todos os clientes (left_join).","d":"Bia não comprou: valor fica NA.","s":"library(dplyr)\nclientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 4), valor = c(50, 20, 99))\nleft_join(clientes, compras, by = \"id\")","t":"clientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 4), valor = c(50, 20, 99))","pk":["dplyr"]},{"x":"Com as mesmas tabelas, fique só com quem aparece nas duas (inner_join).","d":"inner = interseção.","s":"library(dplyr)\nclientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 4), valor = c(50, 20, 99))\ninner_join(clientes, compras, by = \"id\")","t":"clientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 4), valor = c(50, 20, 99))","pk":["dplyr"]},{"x":"Agora mantenha TODAS as linhas das duas tabelas (full_join). Quantas linhas saem?","d":"full = união: ids 1, 2, 3 e 4.","s":"library(dplyr)\nclientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 4), valor = c(50, 20, 99))\nfull_join(clientes, compras, by = \"id\")","t":"clientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 4), valor = c(50, 20, 99))","pk":["dplyr"]}]},{"name":"semi_join() e anti_join()","o":"Filtram a tabela da esquerda conforme a da direita, sem trazer colunas: semi_join mantém quem TEM par; anti_join mantém quem NÃO tem.","s":"semi_join(x, y, by = \"chave\")","ex":[{"x":"Mostre os clientes que fizeram alguma compra (semi_join).","d":"semi_join não acrescenta colunas nem duplica linhas.","s":"library(dplyr)\nclientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 3), valor = c(50, 20, 35))\nsemi_join(clientes, compras, by = \"id\")","t":"clientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 3), valor = c(50, 20, 35))","pk":["dplyr"]},{"x":"Mostre os clientes que NÃO compraram (anti_join).","d":"anti_join = quem está na primeira e não está na segunda.","s":"library(dplyr)\nclientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 3), valor = c(50, 20, 35))\nanti_join(clientes, compras, by = \"id\")","t":"clientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 3), valor = c(50, 20, 35))","pk":["dplyr"]},{"x":"Mostre as compras que têm id de cliente inexistente (auditoria).","d":"Inverta a ordem das tabelas.","s":"library(dplyr)\nclientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 7), valor = c(50, 20, 35))\nanti_join(compras, clientes, by = \"id\")","t":"clientes <- data.frame(id = c(1, 2, 3), nome = c(\"Ana\", \"Bia\", \"Caio\"))\ncompras <- data.frame(id = c(1, 3, 7), valor = c(50, 20, 35))","pk":["dplyr"]}]},{"name":"bind_rows()","o":"Empilha tabelas uma embaixo da outra (como rbind), mas aceita colunas diferentes, completando com NA.","s":"bind_rows(tab1, tab2, .id = \"origem\")","ex":[{"x":"Empilhe as tabelas jan e fev.","d":"bind_rows() junta uma tabela embaixo da outra.","s":"library(dplyr)\njan <- data.frame(mes = \"jan\", vendas = c(10, 12))\nfev <- data.frame(mes = \"fev\", vendas = c(15, 9))\nbind_rows(jan, fev)","t":"jan <- data.frame(mes = \"jan\", vendas = c(10, 12))\nfev <- data.frame(mes = \"fev\", vendas = c(15, 9))","pk":["dplyr"]},{"x":"Empilhe duas tabelas com colunas diferentes e veja o que acontece com a coluna que falta.","d":"Colunas que faltam viram NA.","s":"library(dplyr)\na <- data.frame(id = 1, nome = \"Ana\")\nb <- data.frame(id = 2, idade = 30)\nbind_rows(a, b)","pk":["dplyr"]},{"x":"Empilhe jan e fev criando uma coluna \"origem\" que diz de qual tabela veio cada linha.","d":"Dê nomes às tabelas e use .id.","s":"library(dplyr)\njan <- data.frame(vendas = c(10, 12))\nfev <- data.frame(vendas = c(15, 9))\nbind_rows(janeiro = jan, fevereiro = fev, .id = \"origem\")","pk":["dplyr"]}]}]},{"lang":"R","title":"tibble e tidyr: arrumar tabelas","color":"#f4a261","cmds":[{"name":"tibble() e tribble()","o":"Criam tibbles: tibble() a partir de colunas (como data.frame); tribble() escrevendo linha por linha, como uma tabela.","s":"tibble(col1 = c(...), col2 = c(...))","ex":[{"x":"Crie um tibble com x = 1:3 e y = x * 10.","d":"No tibble, uma coluna pode usar a anterior.","s":"library(tibble)\ntibble(x = 1:3, y = x * 10)","pk":["tibble"]},{"x":"Crie a mesma tabela escrevendo linha a linha com tribble().","d":"Os nomes das colunas começam com ~.","s":"library(tibble)\ntribble(\n  ~x, ~y,\n  1, 10,\n  2, 20,\n  3, 30\n)","pk":["tibble"]},{"x":"Crie um tibble com nome (Ana, Bia) e cidade (Goiânia, Brasília) e veja a classe.","d":"Um tibble também é um data.frame.","s":"library(tibble)\nt <- tibble(nome = c(\"Ana\", \"Bia\"), cidade = c(\"Goiânia\", \"Brasília\"))\nclass(t)","pk":["tibble"]}]},{"name":"as_tibble(), add_row() e add_column()","o":"as_tibble() converte um data frame em tibble (e as.data.frame() faz o inverso); add_row() e add_column() acrescentam linhas e colunas.","s":"as_tibble(df)","ex":[{"x":"Transforme a mtcars em tibble mantendo o nome dos carros numa coluna.","d":"rownames = \"nome da coluna\".","s":"library(tibble)\nas_tibble(mtcars, rownames = \"modelo\")","pk":["tibble"]},{"x":"Acrescente a linha nome = \"Caio\", nota = 7 ao tibble abaixo.","d":"add_row(tabela, coluna = valor).","s":"library(tibble)\nt <- tibble(nome = c(\"Ana\", \"Bia\"), nota = c(8, 9))\nadd_row(t, nome = \"Caio\", nota = 7)","t":"library(tibble)\nt <- tibble(nome = c(\"Ana\", \"Bia\"), nota = c(8, 9))","pk":["tibble"]},{"x":"Acrescente a coluna aprovado = nota >= 8, na primeira posição.","d":".before = 1 coloca no começo.","s":"library(tibble)\nt <- tibble(nome = c(\"Ana\", \"Bia\"), nota = c(7, 9))\nadd_column(t, aprovado = t$nota >= 8, .before = 1)","t":"library(tibble)\nt <- tibble(nome = c(\"Ana\", \"Bia\"), nota = c(7, 9))","pk":["tibble"]}]},{"name":"pivot_longer() e pivot_wider()","o":"Mudam o formato da tabela: pivot_longer() transforma várias colunas em duas (nome e valor), deixando a tabela \"longa\"; pivot_wider() faz o caminho inverso, deixando-a \"larga\".","s":"pivot_longer(tabela, cols = colunas, names_to = \"nome\", values_to = \"valor\")","ex":[{"x":"Transforme a tabela larga em longa (colunas jan e fev viram linhas).","d":"names_to = nome da nova coluna de categorias; values_to = dos valores.","s":"library(tidyr)\nvendas <- data.frame(loja = c(\"A\", \"B\"), jan = c(10, 20), fev = c(15, 25))\npivot_longer(vendas, cols = c(jan, fev), names_to = \"mes\", values_to = \"valor\")","t":"library(tidyr)\nvendas <- data.frame(loja = c(\"A\", \"B\"), jan = c(10, 20), fev = c(15, 25))","pk":["tidyr"]},{"x":"Volte a tabela longa para o formato largo.","d":"names_from vira colunas.","s":"library(tidyr)\nlonga <- data.frame(loja = c(\"A\", \"A\", \"B\", \"B\"), mes = c(\"jan\", \"fev\", \"jan\", \"fev\"), valor = c(10, 15, 20, 25))\npivot_wider(longa, names_from = mes, values_from = valor)","t":"library(tidyr)\nlonga <- data.frame(loja = c(\"A\", \"A\", \"B\", \"B\"), mes = c(\"jan\", \"fev\", \"jan\", \"fev\"), valor = c(10, 15, 20, 25))","pk":["tidyr"]},{"x":"Com dplyr + tidyr, conte os carros por cyl e am e deixe am nas colunas.","d":"Monte a contagem longa e depois alargue.","s":"library(dplyr)\nlibrary(tidyr)\nmtcars |> count(cyl, am) |> pivot_wider(names_from = am, values_from = n)","pk":["dplyr","tidyr"]}]},{"name":"separate() e unite()","o":"separate() divide uma coluna em várias usando um separador; unite() junta várias colunas numa só.","s":"separate(tabela, coluna, into = c(\"nova1\", \"nova2\"), sep = \" \")","ex":[{"x":"Separe a coluna data (\"2024-03-15\") em ano, mes e dia.","d":"into = nomes das novas colunas.","s":"library(tidyr)\ndf <- data.frame(data = c(\"2024-03-15\", \"2023-11-02\"))\nseparate(df, data, into = c(\"ano\", \"mes\", \"dia\"), sep = \"-\")","t":"library(tidyr)\ndf <- data.frame(data = c(\"2024-03-15\", \"2023-11-02\"))","pk":["tidyr"]},{"x":"Separe \"nome\" em primeiro e sobrenome.","d":"sep = \" \".","s":"library(tidyr)\ndf <- data.frame(nome = c(\"Ana Silva\", \"Caio Souza\"))\nseparate(df, nome, into = c(\"primeiro\", \"sobrenome\"), sep = \" \")","t":"library(tidyr)\ndf <- data.frame(nome = c(\"Ana Silva\", \"Caio Souza\"))","pk":["tidyr"]},{"x":"Junte cidade e uf numa coluna local no formato \"Goiânia/GO\".","d":"unite(tabela, nova, colunas, sep).","s":"library(tidyr)\ndf <- data.frame(cidade = c(\"Goiânia\", \"Brasília\"), uf = c(\"GO\", \"DF\"))\nunite(df, local, cidade, uf, sep = \"/\")","t":"library(tidyr)\ndf <- data.frame(cidade = c(\"Goiânia\", \"Brasília\"), uf = c(\"GO\", \"DF\"))","pk":["tidyr"]}]},{"name":"fill()","o":"Preenche os NA de uma coluna repetindo o último valor conhecido (para baixo) ou o seguinte (para cima).","s":"fill(tabela, coluna, .direction = \"down\")","ex":[{"x":"Preencha para baixo os NA da coluna mes.","d":"fill() repete o último valor conhecido.","s":"library(tidyr)\ndf <- data.frame(mes = c(\"jan\", NA, NA, \"fev\", NA), valor = 1:5)\nfill(df, mes)","t":"library(tidyr)\ndf <- data.frame(mes = c(\"jan\", NA, NA, \"fev\", NA), valor = 1:5)","pk":["tidyr"]},{"x":"Preencha para cima (o NA recebe o próximo valor).","d":".direction = \"up\".","s":"library(tidyr)\ndf <- data.frame(grupo = c(NA, \"A\", NA, \"B\"), x = 1:4)\nfill(df, grupo, .direction = \"up\")","t":"library(tidyr)\ndf <- data.frame(grupo = c(NA, \"A\", NA, \"B\"), x = 1:4)","pk":["tidyr"]},{"x":"Preencha a temperatura que faltou com o último valor medido.","d":"Funciona com números também.","s":"library(tidyr)\nmed <- data.frame(dia = 1:5, temp = c(22, NA, 25, NA, NA))\nfill(med, temp)","t":"library(tidyr)\nmed <- data.frame(dia = 1:5, temp = c(22, NA, 25, NA, NA))","pk":["tidyr"]}]},{"name":"drop_na()","o":"Remove as linhas que têm NA: em qualquer coluna ou só nas colunas que você indicar.","s":"drop_na(tabela)","ex":[{"x":"Remova as linhas com NA de airquality e conte quantas sobraram.","d":"drop_na() sem colunas olha todas.","s":"library(tidyr)\nairquality |> drop_na() |> nrow()","pk":["tidyr"]},{"x":"Remova só as linhas com NA em Ozone (ignore NA nas outras colunas) e conte.","d":"Passe a coluna dentro do drop_na().","s":"library(tidyr)\nairquality |> drop_na(Ozone) |> nrow()","pk":["tidyr"]},{"x":"Na starwars, remova quem não tem altura nem massa e conte os personagens restantes.","d":"Várias colunas separadas por vírgula.","s":"library(dplyr)\nlibrary(tidyr)\nstarwars |> drop_na(height, mass) |> nrow()","pk":["dplyr","tidyr"]}]},{"name":"replace_na()","o":"Substitui os NA por valores que você escolhe, coluna por coluna.","s":"replace_na(tabela, list(coluna1 = valor1, coluna2 = valor2))","ex":[{"x":"Troque os NA de c(3, NA, 5) por 0.","d":"replace_na(vetor, valor).","s":"library(tidyr)\nreplace_na(c(3, NA, 5), 0)","pk":["tidyr"]},{"x":"Na tabela abaixo, troque NA de nota por 0 e NA de turma por \"sem turma\".","d":"Num data frame, use uma lista: coluna = valor.","s":"library(tidyr)\ndf <- data.frame(nota = c(7, NA, 9), turma = c(\"A\", NA, \"B\"))\nreplace_na(df, list(nota = 0, turma = \"sem turma\"))","t":"library(tidyr)\ndf <- data.frame(nota = c(7, NA, 9), turma = c(\"A\", NA, \"B\"))","pk":["tidyr"]},{"x":"Troque os NA de Ozone pela mediana de Ozone (airquality) e confira que não há mais NA.","d":"Combine com mutate().","s":"library(dplyr)\nlibrary(tidyr)\naq <- airquality |> mutate(Ozone = replace_na(Ozone, median(Ozone, na.rm = TRUE)))\nsum(is.na(aq$Ozone))","pk":["dplyr","tidyr"]}]},{"name":"expand()","o":"Cria uma tabela com todas as combinações possíveis dos valores das colunas indicadas.","s":"expand(tabela, col1, col2)","ex":[{"x":"Mostre todas as combinações possíveis de cyl e gear da mtcars.","d":"expand() cria todas as combinações, mesmo as que não existem nos dados.","s":"library(tidyr)\nexpand(mtcars, cyl, gear)","pk":["tidyr"]},{"x":"Crie todas as combinações de loja (A, B) e mes (jan, fev, mar).","d":"expand_grid() cria a grade a partir de vetores.","s":"library(tidyr)\nexpand_grid(loja = c(\"A\", \"B\"), mes = c(\"jan\", \"fev\", \"mar\"))","pk":["tidyr"]},{"x":"Descubra quais combinações de cyl e gear NÃO existem na mtcars.","d":"Compare todas as combinações com as existentes usando anti_join().","s":"library(dplyr)\nlibrary(tidyr)\nexpand(mtcars, cyl, gear) |> anti_join(distinct(mtcars, cyl, gear), by = c(\"cyl\", \"gear\"))","pk":["dplyr","tidyr"]}]}]},{"lang":"R","title":"Diagnóstico de dados","color":"#9b8cff","cmds":[{"name":"skim()","o":"Faz um diagnóstico completo da base: separa as variáveis por tipo e mostra NA, taxa de preenchimento, média, quartis e até um mini-histograma.","s":"skim(tabela)","ex":[{"x":"Faça o diagnóstico completo da base airquality com skim().","d":"skim() mostra NA, média, desvio, quantis e mini-histograma.","s":"library(skimr)\nskim(airquality)","pk":["skimr"]},{"x":"Faça o skim() só das colunas Sepal.Length e Species da iris.","d":"Passe as colunas depois da tabela.","s":"library(skimr)\nskim(iris, Sepal.Length, Species)","pk":["skimr"]},{"x":"Faça o skim() da mtcars agrupada por cyl.","d":"skim() respeita o group_by().","s":"library(dplyr)\nlibrary(skimr)\nmtcars |> group_by(cyl) |> skim(mpg)","pk":["dplyr","skimr"]}]},{"name":"vis_dat() e vis_miss()","o":"Desenham a base como uma imagem: vis_dat() pinta cada célula pela cor do tipo; vis_miss() destaca onde estão os NA.","s":"vis_dat(tabela)","ex":[{"x":"Visualize os tipos de cada coluna de airquality com vis_dat().","d":"Cada cor é um tipo; cinza = NA.","s":"library(visdat)\nvis_dat(airquality)","m":"plot","pk":["visdat"]},{"x":"Visualize onde estão os NA de airquality com vis_miss().","d":"Mostra o percentual de NA por coluna.","s":"library(visdat)\nvis_miss(airquality)","m":"plot","pk":["visdat"]},{"x":"Visualize os NA da starwars (só as colunas name a species).","d":"Selecione as colunas antes.","s":"library(dplyr)\nlibrary(visdat)\nvis_miss(select(starwars, name:species))","m":"plot","pk":["dplyr","visdat"]}]},{"name":"kable() e kable_styling()","o":"Transformam um data frame numa tabela formatada e bonita no relatório (HTML ou PDF) do R Markdown.","s":"tabela %>%","ex":[{"x":"Mostre head(mtcars, 3) como tabela formatada com kable().","d":"kable() gera uma tabela pronta para relatório.","s":"library(knitr)\nkable(head(mtcars, 3))","pk":["knitr"]},{"x":"Mostre a média de mpg por cyl com kable(), com 1 casa decimal e títulos de colunas em português.","d":"digits e col.names.","s":"library(knitr)\nr <- aggregate(mpg ~ cyl, data = mtcars, FUN = mean)\nkable(r, digits = 1, col.names = c(\"Cilindros\", \"Média de mpg\"))","pk":["knitr"]},{"x":"Escreva o código de uma tabela estilizada com listras usando kableExtra.","d":"kable_styling() funciona em relatórios HTML.","s":"library(knitr)\nlibrary(kableExtra)\nkable(head(iris, 4)) |> kable_styling(bootstrap_options = \"striped\", full_width = FALSE)","m":"norun","pk":["kableExtra","knitr"]}]}]},{"lang":"R","title":"R Markdown (relatórios)","color":"#7cc7e8","cmds":[{"name":"YAML (cabeçalho do .Rmd)","o":"É o bloco entre três tracinhos no topo do arquivo: guarda título, autor, data e o formato de saída do relatório.","s":"---","ex":[{"x":"Escreva o cabeçalho YAML de um relatório com título \"Análise SINASC\", seu nome como autor e saída em HTML.","d":"O YAML fica entre duas linhas com três traços.","s":"---\ntitle: \"Análise SINASC\"\nauthor: \"Thiago\"\noutput: html_document\n---","m":"norun"},{"x":"Escreva um cabeçalho com data e saída em Word.","d":"word_document gera .docx.","s":"---\ntitle: \"Relatório\"\ndate: \"2026-11-17\"\noutput: word_document\n---","m":"norun"},{"x":"Escreva um cabeçalho em HTML com sumário (índice) automático.","d":"Opções da saída ficam indentadas abaixo dela.","s":"---\ntitle: \"Relatório\"\noutput:\n  html_document:\n    toc: true\n---","m":"norun"}]},{"name":"Chunk de código ```{r}","o":"Bloco de código R dentro do relatório. O código roda no Knit e o resultado aparece logo abaixo.","s":"```{r nome-opcional, echo = TRUE}","ex":[{"x":"Escreva um chunk que mostre summary(mtcars$mpg).","d":"Três crases + {r} abre; três crases fecha.","s":"```{r}\nsummary(mtcars$mpg)\n```","m":"norun"},{"x":"Escreva um chunk chamado \"grafico\" que faz hist(mtcars$mpg) sem mostrar o código no relatório.","d":"echo=FALSE esconde o código e mostra só o resultado.","s":"```{r grafico, echo=FALSE}\nhist(mtcars$mpg)\n```","m":"norun"},{"x":"Escreva um chunk que carrega pacotes sem mostrar mensagens nem avisos.","d":"message=FALSE e warning=FALSE.","s":"```{r, message=FALSE, warning=FALSE}\nlibrary(dplyr)\n```","m":"norun","pk":["dplyr"]}]},{"name":"Código em linha `r `","o":"Coloca o resultado de um código R no meio de uma frase do texto.","s":"`r expressão`","ex":[{"x":"Escreva uma frase que mostre o número de linhas da mtcars dentro do texto.","d":"`r código` no meio do texto.","s":"A base tem `r nrow(mtcars)` carros.","m":"norun"},{"x":"Escreva uma frase com a média de mpg arredondada em 1 casa.","d":"Qualquer expressão R entra no `r `.","s":"O consumo médio é de `r round(mean(mtcars$mpg), 1)` milhas por galão.","m":"norun"},{"x":"Escreva uma frase que diga quantos NA tem a coluna Ozone.","d":"Combine sum() e is.na().","s":"A coluna Ozone tem `r sum(is.na(airquality$Ozone))` valores ausentes.","m":"norun"}]},{"name":"Sintaxe Markdown (texto)","o":"Símbolos simples para formatar o texto do relatório: títulos, negrito, itálico, listas, links e imagens.","s":"# Título   ## Subtítulo   ### Sub-subtítulo","ex":[{"x":"Escreva um título de nível 1 \"Resultados\" e um subtítulo de nível 2 \"Medidas\".","d":"Um # por nível.","s":"# Resultados\n## Medidas","m":"norun"},{"x":"Escreva uma frase com uma palavra em **negrito** e outra em *itálico*.","d":"**dois asteriscos** e *um asterisco*.","s":"Esta é uma palavra em **negrito** e esta em *itálico*.","m":"norun"},{"x":"Escreva uma lista com três itens e um link para o dicionário.","d":"Itens com \"- \"; links com [texto](endereço).","s":"- Média\n- Mediana\n- Moda\n\n[Dicionário](https://thiagopx1.github.io/blog/dicionario_comandos.html)","m":"norun"}]},{"name":"Knit e rmarkdown::render()","o":"Gera o relatório final (HTML, PDF ou Word) a partir do .Rmd: roda todos os chunks e monta o documento.","s":"Botão \"Knit\" no RStudio (Ctrl + Shift + K)","ex":[{"x":"Escreva o comando para gerar o relatório \"analise.Rmd\" sem clicar em Knit.","d":"render() faz o mesmo que o botão Knit.","s":"rmarkdown::render(\"analise.Rmd\")","m":"norun","pk":["rmarkdown"]},{"x":"Gere o mesmo relatório em Word.","d":"output_format muda a saída.","s":"rmarkdown::render(\"analise.Rmd\", output_format = \"word_document\")","m":"norun","pk":["rmarkdown"]},{"x":"Gere o relatório com o nome de arquivo \"relatorio_final.html\".","d":"output_file define o nome do arquivo.","s":"rmarkdown::render(\"analise.Rmd\", output_file = \"relatorio_final.html\")","m":"norun","pk":["rmarkdown"]}]}]},{"lang":"R","title":"Estatística: tabelas de frequência","color":"#4cc9f0","cmds":[{"name":"Número de classes e amplitude (h)","o":"Receita para decidir em quantas faixas (classes) dividir uma variável numérica e qual o tamanho (h) de cada faixa.","s":"n <- length(x)                 # quantas observações","ex":[{"x":"Para x <- mtcars$mpg, calcule n, o número de classes k pelo critério da raiz (arredondado para cima) e a amplitude total.","d":"k = ceiling(sqrt(n)).","s":"x <- mtcars$mpg\nn <- length(x)\nk <- ceiling(sqrt(n))\nn\nk\nmax(x) - min(x)","out":"[1] 32\n[1] 6\n[1] 23.5"},{"x":"Continue: calcule a amplitude de cada classe h = amplitude total ÷ k, arredondada para cima em 1 casa (use ceiling(h * 10) / 10).","d":"Arredondar para cima garante que as classes cubram todos os dados.","s":"x <- mtcars$mpg\nk <- ceiling(sqrt(length(x)))\nh <- (max(x) - min(x)) / k\nceiling(h * 10) / 10","out":"[1] 4"},{"x":"Para a iris$Sepal.Length, calcule k e h e gere os limites das classes com seq(min, by = h, length.out = k + 1).","d":"Com k classes há k + 1 limites.","s":"x <- iris$Sepal.Length\nk <- ceiling(sqrt(length(x)))\nh <- (max(x) - min(x)) / k\nk\nround(h, 3)\nround(seq(min(x), by = h, length.out = k + 1), 2)","out":"[1] 13\n[1] 0.277\n [1] 4.30 4.58 4.85 5.13 5.41 5.68 5.96 6.24 6.52 6.79 7.07 7.35 7.62 7.90"}]},{"name":"cut()","o":"Transforma uma variável numérica em faixas (categorias), como \"0 a 18 anos\", \"19 a 40 anos\".","s":"cut(x, breaks = c(...), labels = c(...), right = TRUE, include.lowest = FALSE)","ex":[{"x":"Agrupe as idades c(5, 17, 23, 45, 67, 80) nas faixas (0,18], (18,60] e (60,100] e conte com table().","d":"breaks são os pontos de corte.","s":"idade <- c(5, 17, 23, 45, 67, 80)\nfaixa <- cut(idade, breaks = c(0, 18, 60, 100))\ntable(faixa)","out":"faixa\n  (0,18]  (18,60] (60,100] \n       2        2        2 "},{"x":"Refaça com os nomes \"Jovem\", \"Adulto\" e \"Idoso\".","d":"labels tem um nome para cada faixa.","s":"idade <- c(5, 17, 23, 45, 67, 80)\ntable(cut(idade, breaks = c(0, 18, 60, 100), labels = c(\"Jovem\", \"Adulto\", \"Idoso\")))","out":"\n Jovem Adulto  Idoso \n     2      2      2 "},{"x":"Agrupe mtcars$mpg em classes de 10 a 35 de 5 em 5, fechadas à esquerda [a, b), e conte.","d":"right = FALSE fecha à esquerda.","s":"table(cut(mtcars$mpg, breaks = seq(10, 35, 5), right = FALSE))","out":"\n[10,15) [15,20) [20,25) [25,30) [30,35) \n      5      13       8       2       4 "}]},{"name":"fdt() (pacote fdth)","o":"Monta, de uma vez, a tabela de frequências de uma variável numérica: classes, frequência absoluta (f), relativa (rf), percentual (rf%) e acumuladas (cf).","s":"library(fdth)","ex":[{"x":"Faça a tabela de frequências de mtcars$mpg com fdt(), deixando o pacote escolher as classes.","d":"fdt() já traz f, rf, rf(%), cf e cf(%).","s":"library(fdth)\nfdt(mtcars$mpg)","pk":["fdth"]},{"x":"Faça a tabela de mtcars$mpg com classes de 10 a 35 e amplitude 5.","d":"start, end e h.","s":"library(fdth)\nfdt(mtcars$mpg, start = 10, end = 35, h = 5)","pk":["fdth"]},{"x":"Faça a tabela de airquality$Ozone (com NA) de 0 a 175 com h = 25.","d":"na.rm = TRUE ignora os NA.","s":"library(fdth)\nfdt(airquality$Ozone, na.rm = TRUE, start = 0, end = 175, h = 25)","pk":["fdth"]}]},{"name":"Tabela de frequências feita à mão","o":"Receita para montar a tabela completa (f, fr, fr%, F, Fr%) de uma variável com table(), prop.table() e cumsum().","s":"f <- table(x)                      # frequência absoluta","ex":[{"x":"Para filhos <- c(0, 1, 1, 2, 2, 2, 3), monte f (contagem) e fr (proporção).","d":"table() e prop.table().","s":"filhos <- c(0, 1, 1, 2, 2, 2, 3)\nf <- table(filhos)\nf\nprop.table(f)","out":"filhos\n0 1 2 3 \n1 2 3 1 \nfilhos\n        0         1         2         3 \n0.1428571 0.2857143 0.4285714 0.1428571 "},{"x":"Acrescente a frequência acumulada (F) e a acumulada percentual.","d":"cumsum() acumula.","s":"filhos <- c(0, 1, 1, 2, 2, 2, 3)\nf <- table(filhos)\ncumsum(f)\nround(cumsum(prop.table(f)) * 100, 1)","out":"0 1 2 3 \n1 3 6 7 \n    0     1     2     3 \n 14.3  42.9  85.7 100.0 "},{"x":"Monte um data.frame com as colunas valor, f, fr_pct e F para mtcars$gear.","d":"as.vector() tira os nomes.","s":"f <- table(mtcars$gear)\ndata.frame(valor = names(f),\n           f = as.vector(f),\n           fr_pct = round(as.vector(prop.table(f)) * 100, 1),\n           F = as.vector(cumsum(f)))","out":"  valor  f fr_pct  F\n1     3 15   46.9 15\n2     4 12   37.5 27\n3     5  5   15.6 32"}]},{"name":"addmargins()","o":"Acrescenta os TOTAIS (linha \"Sum\" e/ou coluna \"Sum\") a uma tabela feita com table().","s":"addmargins(tabela)","ex":[{"x":"Faça a tabela cruzada cyl × am da mtcars com os totais.","d":"addmargins() acrescenta \"Sum\".","s":"tab <- table(mtcars$cyl, mtcars$am)\naddmargins(tab)","out":"     \n       0  1 Sum\n  4    3  8  11\n  6    4  3   7\n  8   12  2  14\n  Sum 19 13  32"},{"x":"Acrescente só a coluna de totais (soma de cada linha).","d":"margin = 2 = coluna de totais.","s":"tab <- table(mtcars$cyl, mtcars$am)\naddmargins(tab, margin = 2)","out":"   \n     0  1 Sum\n  4  3  8  11\n  6  4  3   7\n  8 12  2  14"},{"x":"Calcule os percentuais por linha (prop.table(tab, 1) * 100, 1 casa) e acrescente a coluna de totais (100%).","d":"Primeiro os percentuais, depois addmargins.","s":"tab <- table(mtcars$cyl, mtcars$am)\naddmargins(round(prop.table(tab, 1) * 100, 1), margin = 2)","out":"   \n        0     1   Sum\n  4  27.3  72.7 100.0\n  6  57.1  42.9 100.0\n  8  85.7  14.3 100.0"}]},{"name":"tabyl() e adorn_*() (janitor)","o":"Faz tabelas de frequência e tabelas cruzadas já \"bonitas\", com totais e percentuais, em formato de data.frame.","s":"library(janitor)","ex":[{"x":"Conte os carros por cyl com tabyl().","d":"tabyl() já traz n e percent.","s":"library(janitor)\ntabyl(mtcars, cyl)","pk":["janitor"]},{"x":"Faça a tabela cruzada cyl × am com totais de linha e coluna.","d":"adorn_totals().","s":"library(janitor)\ntabyl(mtcars, cyl, am) |> adorn_totals(c(\"row\", \"col\"))","pk":["janitor"]},{"x":"Mostre a tabela cyl × am em percentual por linha, formatado com 1 casa.","d":"adorn_percentages(\"row\") e adorn_pct_formatting().","s":"library(janitor)\ntabyl(mtcars, cyl, am) |> adorn_percentages(\"row\") |> adorn_pct_formatting(digits = 1)","pk":["janitor"]}]},{"name":"write.xlsx() (pacote openxlsx)","o":"Salva um data.frame (ou tabela) em um arquivo Excel .xlsx.","s":"library(openxlsx)","ex":[{"x":"Salve head(iris) em \"flores.xlsx\" com openxlsx e confira que o arquivo existe.","d":"write.xlsx(objeto, \"arquivo.xlsx\").","s":"library(openxlsx)\nwrite.xlsx(head(iris), \"flores.xlsx\")\nfile.exists(\"flores.xlsx\")","pk":["openxlsx"]},{"x":"Salve a contagem de carros por cyl (como data frame) em Excel.","d":"as.data.frame(table(...)) transforma a contagem em tabela.","s":"library(openxlsx)\ncont <- as.data.frame(table(mtcars$cyl))\nnames(cont) <- c(\"cilindros\", \"n\")\nwrite.xlsx(cont, \"cilindros.xlsx\")\nfile.exists(\"cilindros.xlsx\")","pk":["openxlsx"]},{"x":"Salve iris e mtcars em abas diferentes de \"bases.xlsx\".","d":"Uma lista nomeada vira várias abas.","s":"library(openxlsx)\nwrite.xlsx(list(flores = iris, carros = mtcars), \"bases.xlsx\")\nfile.exists(\"bases.xlsx\")","pk":["openxlsx"]}]}]},{"lang":"R","title":"Estatística: medidas resumo","color":"#f72585","cmds":[{"name":"mfv() (moda)","o":"Devolve a MODA: o valor que mais se repete (most frequent value).","s":"library(modeest)","ex":[{"x":"Calcule a moda de c(2, 3, 3, 4, 4, 4, 5).","d":"mfv = most frequent value.","s":"library(modeest)\nmfv(c(2, 3, 3, 4, 4, 4, 5))","pk":["modeest"]},{"x":"Calcule a moda de mtcars$cyl.","d":"Confira com table(mtcars$cyl).","s":"library(modeest)\nmfv(mtcars$cyl)","pk":["modeest"]},{"x":"Calcule a moda de c(\"A\", \"B\", \"A\", \"B\", \"C\"). Quantas modas existem?","d":"Empate: mfv() devolve todas.","s":"library(modeest)\nmfv(c(\"A\", \"B\", \"A\", \"B\", \"C\"))","pk":["modeest"]}]},{"name":"var() e sd()","o":"var() calcula a variância e sd() o desvio padrão: medidas de quanto os dados se espalham em torno da média.","s":"var(x, na.rm = FALSE)","ex":[{"x":"Calcule a variância e o desvio padrão de c(3, 6, 5, 7, 9).","d":"sd() é a raiz da var().","s":"x <- c(3, 6, 5, 7, 9)\nvar(x)\nsd(x)","out":"[1] 5\n[1] 2.236068"},{"x":"Calcule o desvio padrão de mtcars$mpg arredondado em 2 casas.","d":"Envolva com round().","s":"round(sd(mtcars$mpg), 2)","out":"[1] 6.03"},{"x":"Calcule a variância \"na mão\" de x <- c(2, 4, 4, 4, 5, 5, 7, 9): soma dos quadrados dos desvios ÷ (n − 1). Confira com var().","d":"Os dois resultados devem ser iguais.","s":"x <- c(2, 4, 4, 4, 5, 5, 7, 9)\nsum((x - mean(x))^2) / (length(x) - 1)\nvar(x)","out":"[1] 4.571429\n[1] 4.571429"}]},{"name":"Coeficiente de variação (CV)","o":"Receita para calcular o CV: o desvio padrão como percentual da média. Serve para comparar a dispersão de variáveis em unidades diferentes.","s":"CV <- sd(x, na.rm = TRUE) / mean(x, na.rm = TRUE) * 100","ex":[{"x":"Calcule o CV (%) de c(3, 6, 5, 7, 9).","d":"CV = dp ÷ média × 100.","s":"x <- c(3, 6, 5, 7, 9)\nsd(x) / mean(x) * 100","out":"[1] 37.2678"},{"x":"Compare o CV de mtcars$mpg e de mtcars$hp (1 casa). Qual varia mais?","d":"O maior CV indica maior dispersão relativa.","s":"round(sd(mtcars$mpg) / mean(mtcars$mpg) * 100, 1)\nround(sd(mtcars$hp) / mean(mtcars$hp) * 100, 1)","out":"[1] 30\n[1] 46.7"},{"x":"Crie a função cv(x) que calcula o CV ignorando NA e aplique em airquality$Ozone (1 casa).","d":"na.rm = TRUE nos dois.","s":"cv <- function(x) sd(x, na.rm = TRUE) / mean(x, na.rm = TRUE) * 100\nround(cv(airquality$Ozone), 1)","out":"[1] 78.3"}]},{"name":"diff() (amplitude total)","o":"diff() calcula a diferença entre valores vizinhos. Aplicada a range(), dá a AMPLITUDE TOTAL (maior − menor).","s":"diff(x)","ex":[{"x":"Calcule a amplitude total de c(12, 7, 25, 3) com diff(range()).","d":"range() dá mínimo e máximo; diff() subtrai.","s":"diff(range(c(12, 7, 25, 3)))","out":"[1] 22"},{"x":"Calcule a amplitude de iris$Petal.Length.","d":"Mesma ideia.","s":"diff(range(iris$Petal.Length))","out":"[1] 5.9"},{"x":"Calcule as diferenças entre valores vizinhos de c(10, 13, 19, 30).","d":"diff() sozinho subtrai cada valor do seguinte.","s":"diff(c(10, 13, 19, 30))","out":"[1]  3  6 11"}]},{"name":"IQR() e limites dos outliers","o":"Calcula a distância interquartílica (DI = Q3 − Q1) e, com ela, os limites para identificar outliers (valores muito fora do padrão).","s":"IQR(x, type = 2)","ex":[{"x":"Calcule a distância interquartílica de d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40) pelo método do curso.","d":"type = 2 = método dos slides.","s":"d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40)\nIQR(d, type = 2)","out":"[1] 5"},{"x":"Calcule os limites inferior e superior (Q1 − 1,5·DI e Q3 + 1,5·DI) para d.","d":"unname() tira os nomes \"25%\" e \"75%\".","s":"d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40)\nq <- unname(quantile(d, c(0.25, 0.75), type = 2))\ndi <- q[2] - q[1]\nc(q[1] - 1.5 * di, q[2] + 1.5 * di)","out":"[1] -3.5 16.5"},{"x":"Encontre os outliers de mtcars$hp pelo mesmo critério (type = 2).","d":"Filtre os valores fora dos limites.","s":"x <- mtcars$hp\nq <- unname(quantile(x, c(0.25, 0.75), type = 2))\ndi <- q[2] - q[1]\nx[x < q[1] - 1.5 * di | x > q[2] + 1.5 * di]","out":"[1] 335"}]},{"name":"tapply()","o":"Aplica uma função (mean, sd, length, summary...) a uma variável NUMÉRICA, separadamente para cada categoria de outra variável.","s":"tapply(variavel_numerica, variavel_categorica, funcao)","ex":[{"x":"Calcule a média de mpg por número de cilindros com tapply().","d":"tapply(valor, grupo, função).","s":"tapply(mtcars$mpg, mtcars$cyl, mean)","out":"       4        6        8 \n26.66364 19.74286 15.10000 "},{"x":"Calcule o desvio padrão de Sepal.Length por espécie (2 casas).","d":"Troque mean por sd.","s":"round(tapply(iris$Sepal.Length, iris$Species, sd), 2)","out":"    setosa versicolor  virginica \n      0.35       0.52       0.64 "},{"x":"Conte quantos dias de medição há por mês em airquality.","d":"length conta as linhas de cada grupo.","s":"tapply(airquality$Temp, airquality$Month, length)","out":" 5  6  7  8  9 \n31 30 31 31 30 "}]},{"name":"cor()","o":"Calcula o coeficiente de correlação (de Pearson) entre duas variáveis numéricas: um número de −1 a +1 que mede a força da relação linear.","s":"cor(x, y, use = \"complete.obs\")","ex":[{"x":"Calcule a correlação entre wt e mpg na mtcars (2 casas).","d":"Negativa: carro mais pesado faz menos milhas por galão.","s":"round(cor(mtcars$wt, mtcars$mpg), 2)","out":"[1] -0.87"},{"x":"Calcule a correlação entre Petal.Length e Petal.Width da iris.","d":"Perto de 1 = relação forte e positiva.","s":"round(cor(iris$Petal.Length, iris$Petal.Width), 3)","out":"[1] 0.963"},{"x":"Calcule a correlação entre Ozone e Temp em airquality, ignorando linhas com NA.","d":"use = \"complete.obs\".","s":"round(cor(airquality$Ozone, airquality$Temp, use = \"complete.obs\"), 3)","out":"[1] 0.698"}]}]},{"lang":"R","title":"Estatística: gráficos","color":"#fca311","cmds":[{"name":"hist(): densidade, classes e quebras","o":"Versão \"de estatística\" do histograma: altura em DENSIDADE (freq = FALSE) e com você escolhendo o número de classes ou os cortes.","s":"hist(x, freq = FALSE, main = \"\", xlab = \"\", ylab = \"\", col = \"\")","ex":[{"x":"Faça o histograma de densidade de mtcars$mpg.","d":"freq = FALSE coloca densidade no eixo y.","s":"hist(mtcars$mpg, freq = FALSE)","m":"plot"},{"x":"Faça o histograma de mtcars$mpg com quebras de 10 a 35 de 5 em 5, fechadas à esquerda.","d":"breaks = seq(...) e right = FALSE.","s":"hist(mtcars$mpg, breaks = seq(10, 35, 5), right = FALSE, col = \"lightblue\")","m":"plot"},{"x":"Faça o histograma de densidade de iris$Sepal.Length e acrescente a curva de densidade com lines(density()).","d":"density() estima a curva suave.","s":"hist(iris$Sepal.Length, freq = FALSE, col = \"gray90\")\nlines(density(iris$Sepal.Length), col = \"red\", lwd = 2)","m":"plot"}]},{"name":"boxplot()","o":"Desenha o box-plot (diagrama de caixa), que resume uma variável em cinco números e mostra os outliers como pontinhos.","s":"boxplot(x, horizontal = FALSE, main = \"\", col = \"\")","ex":[{"x":"Faça o box-plot de mtcars$hp.","d":"Pontos isolados são outliers.","s":"boxplot(mtcars$hp)","m":"plot"},{"x":"Faça o box-plot comparativo de mpg por cyl.","d":"numérica ~ categórica.","s":"boxplot(mpg ~ cyl, data = mtcars, col = c(\"tomato\", \"gold\", \"skyblue\"))","m":"plot"},{"x":"Descubra os valores que o boxplot considera outliers em mtcars$hp, sem desenhar.","d":"plot = FALSE e depois $out.","s":"boxplot(mtcars$hp, plot = FALSE)$out","out":"[1] 335"}]},{"name":"Gráficos de dispersão (plot)","o":"Usa plot() de dois jeitos: (1) dispersão unidimensional, com uma variável quantitativa discreta; (2) dispersão entre duas variáveis quantitativas.","s":"plot(table(x))                       # dispersão unidimensional (segmentos)","ex":[{"x":"Faça a dispersão de Petal.Length (x) por Petal.Width (y) na iris.","d":"plot(x, y).","s":"plot(iris$Petal.Length, iris$Petal.Width, pch = 19)","m":"plot"},{"x":"Faça a dispersão unidimensional (hastes) da quantidade de carros por número de marchas.","d":"plot() de uma table() desenha hastes.","s":"plot(table(mtcars$gear), xlab = \"Marchas\", ylab = \"Frequência\")","m":"plot"},{"x":"Faça a dispersão de wt × mpg e acrescente uma linha vertical na média de wt.","d":"abline(v = valor) é vertical.","s":"plot(mtcars$wt, mtcars$mpg, pch = 19)\nabline(v = mean(mtcars$wt), lty = 2, col = \"red\")","m":"plot"}]},{"name":"Ogiva e polígono de frequências","o":"Gráficos de linha feitos a partir de uma tabela fdt(): a ogiva (frequência ACUMULADA) e o polígono de frequências.","s":"tab <- fdt(x, start = , end = , h = )","ex":[{"x":"Faça a ogiva de mtcars$mpg com fdt (de 10 a 35, h = 5).","d":"type = \"cfp\" = frequência acumulada.","s":"library(fdth)\ntab <- fdt(mtcars$mpg, start = 10, end = 35, h = 5)\nplot(tab, type = \"cfp\")","m":"plot","pk":["fdth"]},{"x":"Faça a ogiva em porcentagem acumulada da mesma tabela.","d":"type = \"cfpp\".","s":"library(fdth)\ntab <- fdt(mtcars$mpg, start = 10, end = 35, h = 5)\nplot(tab, type = \"cfpp\")","m":"plot","pk":["fdth"]},{"x":"Faça o polígono de frequências da mesma tabela.","d":"type = \"fp\".","s":"library(fdth)\ntab <- fdt(mtcars$mpg, start = 10, end = 35, h = 5)\nplot(tab, type = \"fp\")","m":"plot","pk":["fdth"]}]},{"name":"brewer.pal() (pacote RColorBrewer)","o":"Devolve paletas de cores prontas (combinações bonitas) para usar em gráficos.","s":"library(RColorBrewer)","ex":[{"x":"Mostre 4 cores da paleta \"Set2\".","d":"brewer.pal(n, \"paleta\").","s":"library(RColorBrewer)\nbrewer.pal(4, \"Set2\")","pk":["RColorBrewer"]},{"x":"Faça um barplot de table(mtcars$cyl) com 3 cores da paleta \"Pastel1\".","d":"Use as cores no argumento col.","s":"library(RColorBrewer)\nbarplot(table(mtcars$cyl), col = brewer.pal(3, \"Pastel1\"))","m":"plot","pk":["RColorBrewer"]},{"x":"Faça um box-plot de Sepal.Length por espécie com a paleta \"Dark2\".","d":"Uma cor para cada caixa.","s":"library(RColorBrewer)\nboxplot(Sepal.Length ~ Species, data = iris, col = brewer.pal(3, \"Dark2\"))","m":"plot","pk":["RColorBrewer"]}]},{"name":"png() e dev.off()","o":"png() abre um \"arquivo de imagem\"; os gráficos seguintes são desenhados nele; dev.off() fecha e grava o arquivo.","s":"png(\"nome.png\", width = 800, height = 600)","ex":[{"x":"Salve um histograma de mtcars$mpg em \"hist.png\" e confira que o arquivo existe.","d":"Abra com png(), desenhe, feche com dev.off().","s":"png(\"hist.png\")\nhist(mtcars$mpg)\ninvisible(dev.off())\nfile.exists(\"hist.png\")","out":"[1] TRUE"},{"x":"Salve um box-plot em \"box.png\" com 800 × 600 pixels.","d":"width e height em pixels.","s":"png(\"box.png\", width = 800, height = 600)\nboxplot(mpg ~ cyl, data = mtcars)\ninvisible(dev.off())\nfile.exists(\"box.png\")","out":"[1] TRUE"},{"x":"Salve dois gráficos em PDF (\"graficos.pdf\"), um em cada página.","d":"pdf() funciona do mesmo jeito; cada gráfico vira uma página.","s":"pdf(\"graficos.pdf\")\nhist(mtcars$mpg)\nboxplot(mtcars$hp)\ninvisible(dev.off())\nfile.exists(\"graficos.pdf\")","out":"[1] TRUE"}]}]},{"lang":"R","title":"Probabilidade e contagem","color":"#e76f51","cmds":[{"name":"sample()","o":"Sorteia elementos de um vetor: simula dados, moedas, urnas e também tira uma amostra aleatória das linhas de uma base.","s":"sample(x, size, replace = FALSE, prob = NULL)","ex":[{"x":"Fixe a semente 1 e simule 10 lançamentos de um dado (valores de 1 a 6, com reposição).","d":"sample(1:6, quantidade, replace = TRUE).","s":"set.seed(1)\nsample(1:6, 10, replace = TRUE)","out":" [1] 1 4 1 2 5 3 6 2 3 3"},{"x":"Fixe a semente 2026 e sorteie 6 números distintos de 1 a 60 (um jogo da Mega-Sena), mostrando-os em ordem crescente.","d":"Sem replace, os números não se repetem. sort() ordena.","s":"set.seed(2026)\nsort(sample(1:60, 6))","out":"[1] 29 33 38 45 47 57"},{"x":"Fixe a semente 10 e simule 1000 lançamentos de uma moeda viciada com 70% de chance de cara (\"K\"). Mostre a proporção de caras.","d":"Use o argumento prob e depois mean(moeda == \"K\").","s":"set.seed(10)\nmoeda <- sample(c(\"K\", \"C\"), 1000, replace = TRUE, prob = c(0.7, 0.3))\nmean(moeda == \"K\")","out":"[1] 0.685"}]},{"name":"choose()","o":"Calcula a combinação C(N, n): de quantas maneiras dá para escolher n itens entre N, sem importar a ordem e sem repetir.","s":"choose(N, n)","ex":[{"x":"Quantas comissões de 3 pessoas podem ser formadas com 10 pessoas?","d":"Comissão: a ordem não importa e ninguém se repete.","s":"choose(10, 3)","out":"[1] 120"},{"x":"Calcule a probabilidade de ganhar a Mega-Sena com uma aposta simples de 6 números e mostre o valor sem notação científica.","d":"P = 1 / choose(60, 6).","s":"format(1 / choo
