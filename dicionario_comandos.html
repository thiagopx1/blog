<script type="text/plain" id="d-rcmd">@G Primeiros passos no R | #4aa3ff | Os comandos mais básicos: mostrar coisas na tela, guardar valores em variáveis, ler o que o usuário digita e pedir ajuda.
@@ <- (atribuição)
::k base
::f Programação · Aula 7
::o Guarda um valor dentro de um nome (uma variável) para usar depois.
::q Pense numa caixinha com etiqueta: o nome é a etiqueta e o valor é o que vai dentro. A seta aponta para onde o valor vai: idade <- 30 significa "coloque 30 na caixa idade".
::s
nome <- valor
::p nome | o nome que você inventa para a variável. Pode ter letras, números, ponto e _, mas não pode começar com número. Maiúscula ≠ minúscula (Idade e idade são caixas diferentes).
::p <- | a "seta de atribuição": um sinal de menor seguido de um tracinho, sem espaço no meio. Atalho no RStudio: Alt + - (Alt e a tecla de menos).
::p valor | o que vai ser guardado: um número, um texto entre aspas, um resultado de conta, um vetor…
::e
idade <- 30            # guarda o número 30
nome <- "Thiago"       # textos sempre entre aspas
dobro <- idade * 2     # pode guardar o resultado de uma conta
idade                  # digitar só o nome mostra o conteúdo
dobro
::r
[1] 30
[1] 60
::a Atribuir não mostra nada na tela. Para ver o conteúdo, digite o nome da variável sozinho ou use print().
::a Se você guardar outro valor no mesmo nome, o anterior é apagado sem aviso: idade <- 31 substitui o 30.
::a Também funcionam = (idade = 30) e -> (30 -> idade), mas o padrão do curso é <-. Dentro de funções, = é usado para argumentos: round(x, digits = 2).
::a Cuidado para não usar nomes que já existem no R, como pi, c, T ou F. Ex.: pi <- 15 "esconde" o valor 3,14159 até você apagar com rm(pi).
::v print() | ls() e rm() | class() e typeof()
@@ print()
::k base
::f Programação · Aula 7
::o Mostra na tela (no Console) o conteúdo de um valor ou de uma variável.
::q É o "me mostre o que tem aqui". No Console, digitar o nome já mostra; o print() é necessário dentro de laços (for, while), funções e scripts rodados de uma vez.
::s
print(x)
::p print | o nome da função ("imprimir").
::p ( ) | os parênteses de toda função: dentro deles vai o que a função vai usar (os argumentos).
::p x | o que você quer ver: um número, um texto entre aspas ou o nome de uma variável.
::e
print("Olá, mundo!")
nota <- 8.5
print(nota)
for (i in 1:3) print(i)   # dentro do for, sem print nada aparece
::r
[1] "Olá, mundo!"
[1] 8.5
[1] 1
[1] 2
[1] 3
::a O [1] no começo da linha não faz parte do valor: ele só indica a posição do primeiro elemento mostrado naquela linha.
::a print() mostra um objeto por vez. Para juntar texto e variável na mesma linha, use cat() ou paste().
::v cat() | paste() e paste0()
@@ cat()
::k base
::f Programação · Aula 8
::o Junta vários pedaços (textos e variáveis) e escreve tudo numa linha só, sem aspas e sem o [1].
::q Use quando quiser montar uma frase para o usuário: "O resultado é 10". É o jeito mais "limpo" de mostrar mensagens.
::s
cat(item1, item2, ..., sep = " ")
::p item1, item2, ... | os pedaços, separados por vírgula: textos entre aspas e/ou nomes de variáveis.
::p sep = " " | (opcional) o que colocar entre os pedaços. O padrão é um espaço. sep = "" cola tudo sem espaço.
::p "\n" | um pedaço especial que significa "pule de linha". Coloque no final para a próxima saída não grudar.
::e
nome <- "Ana"
idade <- 27
cat("Olá,", nome, "- você tem", idade, "anos\n")
cat("a", "b", "c", sep = "-")
::r
Olá, Ana - você tem 27 anos
a-b-c
::a Sem o "\n" no final, a próxima coisa que aparecer no Console vai grudar na mesma linha.
::a cat() só mostra; não guarda o resultado. Se quiser guardar a frase numa variável, use paste().
::v print() | paste() e paste0()
@@ readline()
::k base
::f Programação · Aula 8
::o Pausa o programa, mostra uma pergunta e espera a pessoa digitar algo e apertar Enter.
::q É o "pergunte ao usuário". O que a pessoa digitar volta SEMPRE como texto, mesmo que seja um número; por isso quase sempre vem junto com as.numeric() ou as.integer().
::s
variavel <- readline("pergunta: ")
::p "pergunta: " | o texto que aparece no Console antes do cursor.
::p variavel <- | guarda o que foi digitado. Sem isso, a resposta se perde.
::e
nome <- readline("Digite seu nome: ")
idade <- as.numeric(readline("Digite sua idade: "))   # converte para número
cat("Olá,", nome, "! Daqui a 10 anos você terá", idade + 10, "anos.\n")
::r
Digite seu nome: Ana
Digite sua idade: 27
Olá, Ana ! Daqui a 10 anos você terá 37 anos.
::a Sem as.numeric(), "27" + 10 dá erro: non-numeric argument to binary operator (argumento não numérico).
::a Ao rodar um script inteiro de uma vez, o RStudio para em cada readline() esperando você digitar no Console.
::a No R Markdown (Knit), readline() não espera digitação. Nos relatórios, dê o valor direto: idade <- 27.
::v as.numeric(), as.integer() e outros as.* | scan()
@@ # (comentário)
::k base
::f Programação · Aula 7
::o Tudo o que vem depois do # na mesma linha é ignorado pelo R. Serve para escrever anotações no código.
::q Comentar é deixar bilhetes para você mesmo no futuro: "aqui eu converto a idade", "decisão: excluir NA". Os professores pedem para documentar cada decisão.
::s
# seu texto aqui
::e
# Calcula a média das notas
notas <- c(7, 8, 9)
mean(notas)   # o comentário também pode vir no fim da linha
::r
[1] 8
::a No RStudio, selecione várias linhas e aperte Ctrl + Shift + C para comentar ou descomentar tudo de uma vez.
::a Dentro de aspas o # é texto normal: "item #1" não vira comentário.
@@ ls() e rm()
::k base
::f Programação · Aula 7
::o ls() lista as variáveis que existem na memória; rm() apaga uma variável.
::q É o "o que tenho guardado?" e o "jogue fora". As mesmas variáveis aparecem no painel Environment, no canto superior direito do RStudio.
::s
ls()
rm(variavel)
rm(list = ls())     # apaga TUDO
::p ls() | não recebe nada; devolve os nomes das variáveis em ordem alfabética.
::p rm(x) | apaga a variável x. Pode passar várias: rm(a, b).
::p rm(list = ls()) | apaga todas as variáveis. Útil para "começar do zero".
::e
a <- 1
b <- 2
ls()
rm(a)
ls()
::r
[1] "a" "b"
[1] "b"
::a rm() não tem desfazer. Se apagou sem querer, rode de novo a linha que criou a variável.
::a Clássico da aula: pi <- 15 cria uma variável sua que esconde a constante. rm(pi) apaga a sua e o pi volta a valer 3.141593.
::v <- (atribuição)
@@ class() e typeof()
::k base
::f Programação · Aula 7
::o Dizem de que tipo é um valor: número, texto, lógico, fator, data frame…
::q Antes de fazer qualquer conta, confira o tipo. Muitos erros vêm de um número que, na verdade, está guardado como texto.
::s
class(x)
typeof(x)
::p class(x) | o tipo "de alto nível": "numeric", "integer", "character", "logical", "factor", "data.frame", "matrix", "list", "Date"…
::p typeof(x) | o tipo "interno": "double" (decimal), "integer", "character", "logical", "list"…
::e
class(4.5)
class(10L)
class("R")
class(TRUE)
typeof(4.5)
class(data.frame(a = 1))
::r
[1] "numeric"
[1] "integer"
[1] "character"
[1] "logical"
[1] "double"
[1] "data.frame"
::a Os 4 tipos básicos: numeric (números, com ou sem vírgula), integer (inteiros com L, como 10L), character (texto, entre aspas) e logical (TRUE/FALSE).
::a Um data frame tem class "data.frame" mas typeof "list"; um fator tem class "factor" mas typeof "integer". Para saber o que é, use class().
::v is.numeric(), is.character() e outros is.* | as.numeric(), as.integer() e outros as.* | str()
@@ is.numeric(), is.character() e outros is.*
::k base
::f Programação · Aula 9
::o Perguntam "este valor é deste tipo?" e respondem TRUE (sim) ou FALSE (não).
::q São perguntas de sim/não. Muito usadas dentro de if para decidir o que fazer: "se for número, calcule; senão, avise".
::s
is.numeric(x)    is.integer(x)    is.character(x)
is.logical(x)    is.vector(x)     is.na(x)
::p is. | o começo comum: "é…?"
::p numeric / integer / character / logical | o tipo que você está testando.
::e
y <- 12L
is.integer(y)
is.character(y)
if (is.integer(y)) print("Y é um número inteiro.")
::r
[1] TRUE
[1] FALSE
[1] "Y é um número inteiro."
::a 12 (sem L) é numeric, não integer: is.integer(12) dá FALSE. Para ser inteiro, escreva 12L ou use as.integer(12).
::v class() e typeof() | as.numeric(), as.integer() e outros as.* | is.na() e !is.na()
@@ as.numeric(), as.integer() e outros as.*
::k base
::f Programação · Aula 7
::o Convertem um valor de um tipo para outro: texto para número, número para texto, lógico para número…
::q É a "tradução" entre tipos. O caso mais comum: o readline() ou o read.csv() trazem um número como texto e você precisa transformá-lo em número para fazer contas.
::s
as.numeric(x)     as.integer(x)
as.character(x)   as.logical(x)
as.factor(x)      as.Date(x)
::p as. | "transforme em…"
::p numeric | número decimal. integer = inteiro (corta as casas decimais, não arredonda).
::p character | texto (qualquer coisa vira texto).
::p logical | TRUE/FALSE: 0 vira FALSE e qualquer outro número vira TRUE; os textos "TRUE", "T", "FALSE" e "F" também convertem.
::e
as.numeric("12.5")
as.integer("123.99")      # corta, não arredonda
as.character(134.35)
as.logical(0)
as.numeric(TRUE)
as.numeric("Pedro")       # não dá para converter
::r
[1] 12.5
[1] 123
[1] "134.35"
[1] FALSE
[1] 1
[1] NA
Warning message:
NAs introduced by coercion
::a Quando o texto não é um número válido, o resultado vira NA e aparece o aviso "NAs introduced by coercion" (em português: "NAs introduzidos por coerção"). É um aviso, não um erro: o código continua.
::a Decimal no R usa ponto: as.numeric("12,5") vira NA. Troque a vírgula por ponto antes (gsub(",", ".", x)).
::a Nas aulas de limpeza, suppressWarnings(as.numeric(x)) converte escondendo o aviso; depois conte os NA com sum(is.na(x)).
::v class() e typeof() | suppressWarnings() | is.na() e !is.na()
@@ 10L, 1E4 e 6+4i (literais)
::k base
::f Programação · Aula 7
::o Formas especiais de escrever números: L marca inteiro, E é notação científica e i indica número complexo.
::q Raramente você vai precisar disso, mas aparece nos exercícios. O L é o mais útil: 10L garante que o número é integer.
::s
10L     # inteiro
1E4     # 1 × 10⁴ = 10000
6+4i    # número complexo
::p L | depois do número, transforma em integer.
::p E (ou e) | "vezes 10 elevado a". 2.5E-3 = 0,0025.
::p i | parte imaginária de um complexo.
::e
x <- 10L
class(x)
1E4
2.5e-3
::r
[1] "integer"
[1] 10000
[1] 0.0025
::a Números muito grandes ou pequenos são mostrados em notação científica automaticamente: 1e+05 significa 100000.
::v class() e typeof() | Re(), Im(), Mod() (números complexos)
@@ Re(), Im(), Mod() (números complexos)
::k base
::f Programação · Aula 7
::o Separam as partes de um número complexo: parte real, parte imaginária, módulo, ângulo e conjugado.
::q Assunto de matemática; só aparece em exercícios pontuais. Se não usa complexos, pode pular.
::s
Re(z)   Im(z)   Mod(z)   Arg(z)   Conj(z)
::p Re | parte real. Im | parte imaginária.
::p Mod | módulo (distância até a origem). Arg | ângulo em radianos.
::p Conj | conjugado (troca o sinal da parte imaginária).
::e
z <- 6 + 4i
Re(z)
Im(z)
Mod(z)
Conj(z)
::r
[1] 6
[1] 4
[1] 7.211103
[1] 6-4i
@@ help(), ? e args()
::k base
::f Programação · Aula 7 · Linguagem R · Aula 2
::o Abrem a documentação (manual) de uma função ou pacote, ou mostram quais argumentos ela aceita.
::q Esqueceu como usa uma função? Pergunte ao próprio R. A ajuda abre na aba Help do RStudio, com descrição, argumentos e exemplos no final.
::s
?nome_da_funcao
help(nome_da_funcao)
args(nome_da_funcao)
help(package = "nome_do_pacote")
example(nome_da_funcao)
::p ? | atalho para help().
::p args() | mostra só a "assinatura": os argumentos e seus valores padrão.
::p help(package=) | abre a página do pacote com a lista de funções.
::p example() | roda os exemplos que estão no final da ajuda.
::e
?round
args(round)
::r
function (x, digits = 0, ...)
NULL

@G Operadores e matemática | #ff9f43 | Contas, comparações e lógica. O R funciona como uma calculadora poderosa.
@@ + - * / ^ (aritmética)
::k base
::f Programação · Aula 7
::o As quatro operações básicas e a potência.
::q Igual à calculadora. A ordem é a da matemática: primeiro potência, depois multiplicação/divisão, depois soma/subtração. Use parênteses para mudar a ordem.
::s
a + b    a - b    a * b    a / b    a ^ b
::p + e - | soma e subtração.
::p * | multiplicação (não use x).
::p / | divisão com casas decimais.
::p ^ ou ** | potência: 6^2 = 36.
::p ( ) | mudam a ordem das operações.
::p . (ponto) | separador decimal. 2.5 é dois e meio; 2,5 dá erro.
::e
2 + 6 * 5
(2 + 6) * 5
5 / 2
6^2
c(1, 2, 3) * 10      # a conta vale para cada elemento do vetor
::r
[1] 32
[1] 40
[1] 2.5
[1] 36
[1] 10 20 30
::a Vírgula NÃO é decimal no R: 2,5 dá erro ou é interpretado como dois valores separados.
::a Ordem de precedência (da maior para a menor): ^ → sinal negativo → %% e %/% → * e / → + e - → comparações → ! → & → |.
::v %/% e %% | sqrt(), abs() e exp() | round(), ceiling() e floor()
@@ %/% e %%
::k base
::f Programação · Aula 7
::o %/% é a divisão inteira (só o quociente) e %% é o resto da divisão.
::q Lembra da conta armada de divisão da escola? 7 ÷ 2 dá 3 e sobra 1. %/% devolve o 3 e %% devolve o 1. O %% é o truque para saber se um número é par (resto 0 na divisão por 2) ou se é divisível por outro.
::s
a %/% b     # quociente
a %% b      # resto
::p %/% | quantas vezes b cabe inteiro em a.
::p %% | o que sobra. Se der 0, a é divisível por b.
::e
101 %/% 10
101 %% 10
8 %% 2 == 0        # 8 é par?
15 %% 5 == 0       # 15 é divisível por 5?
::r
[1] 10
[1] 1
[1] TRUE
[1] TRUE
::a São dois sinais de porcentagem: %% (com só um % dá erro).
::v == != > < >= <= (comparação) | if e else
@@ == != > < >= <= (comparação)
::k base
::f Programação · Aula 7
::o Comparam dois valores e respondem TRUE (verdadeiro) ou FALSE (falso).
::q São as perguntas: "é igual?", "é maior?". O resultado TRUE/FALSE é o que alimenta o if, os filtros de tabela e a seleção de elementos.
::s
a == b   a != b   a > b   a < b   a >= b   a <= b
::p == | igual a (DOIS sinais de igual).
::p != | diferente de.
::p > e < | maior e menor que.
::p >= e <= | maior ou igual, menor ou igual (o sinal de igual vem depois).
::e
a <- 2
b <- 3
a == b
a != b
a < b
notas <- c(56, 89, 90, 47)
notas >= 60              # compara cada elemento
::r
[1] FALSE
[1] TRUE
[1] TRUE
[1] FALSE  TRUE  TRUE FALSE
::a O erro mais comum de todos: usar = no lugar de ==. Um = guarda valor; dois == comparam.
::a Comparar com NA dá NA (não TRUE nem FALSE). Para testar ausência use is.na(x), nunca x == NA.
::a Textos são comparados em ordem alfabética: "abacate" < "banana" é TRUE.
::v & | ! (lógicos E, OU, NÃO) | if e else | Filtro lógico: v[condição]
@@ & | ! (lógicos E, OU, NÃO)
::k base
::f Programação · Aula 7
::o Combinam testes: & (E) exige que todos sejam verdadeiros; | (OU) exige pelo menos um; ! (NÃO) inverte.
::q "Tem mais de 18 E é do sexo F" → idade > 18 & sexo == "F". "É de Goiânia OU de Anápolis" → cidade == "Goiânia" | cidade == "Anápolis".
::s
teste1 & teste2     # E
teste1 | teste2     # OU
!teste              # NÃO
teste1 && teste2    # E "curto" (só para um valor, em if)
::p & | verdadeiro só se os dois forem verdadeiros. Funciona elemento a elemento em vetores.
::p | | verdadeiro se pelo menos um for verdadeiro (é a barra vertical, tecla ao lado do Z ou Shift + \).
::p ! | inverte: !TRUE é FALSE.
::p && e || | versões que comparam um único valor e só avaliam o 2º teste se precisar. Use dentro de if.
::e
idade <- 25
idade > 18 & idade < 60
idade < 18 | idade > 60
!(idade > 18)
x <- c(5, 15, 25)
x > 10 & x < 20        # elemento a elemento
::r
[1] TRUE
[1] FALSE
[1] FALSE
[1] FALSE  TRUE FALSE
::a Em vetores (filtros de tabela, filter()), use & e |. Em if com um valor só, prefira && e ||.
::a Ao misturar & e |, use parênteses para deixar a ordem clara: sexo == "F" & (cidade == "A" | cidade == "B").
::a 20 < x < 90 não funciona como na matemática. Escreva x > 20 & x < 90.
::v == != > < >= <= (comparação) | %in%
@@ sqrt(), abs() e exp()
::k base
::f Programação · Aula 7
::o Raiz quadrada, valor absoluto (tira o sinal) e exponencial (número e elevado a x).
::q Funções matemáticas prontas: você coloca o número dentro dos parênteses e recebe o resultado.
::s
sqrt(x)   abs(x)   exp(x)
::p sqrt | square root = raiz quadrada (√x).
::p abs | valor absoluto |x|: -89.65 vira 89.65.
::p exp | eˣ, sendo e ≈ 2,718.
::e
sqrt(9)
abs(-89.65)
exp(1)
16^(1/4)              # raiz quarta: potência fracionária
::r
[1] 3
[1] 89.65
[1] 2.718282
[1] 2
::a sqrt(-1) não dá erro: devolve NaN com o aviso "NaNs produced".
::a Para outras raízes use potência fracionária: raiz quinta de x é x^(1/5).
::v log(), log10(), log2() e factorial() | + - * / ^ (aritmética)
@@ log(), log10(), log2() e factorial()
::k base
::f Programação · Aula 7
::o Logaritmos (natural, base 10 e base 2) e fatorial.
::q log() sozinho é o logaritmo natural (o "ln" da calculadora). factorial(4) é 4! = 4 × 3 × 2 × 1.
::s
log(x)   log10(x)   log2(x)   log(x, base = b)   factorial(n)
::p log | logaritmo natural (base e).
::p log10 e log2 | bases 10 e 2.
::p base = | escolhe outra base qualquer.
::p factorial | n! (fatorial).
::e
log(10)
log10(1000)
log2(8)
factorial(4)
::r
[1] 2.302585
[1] 3
[1] 3
[1] 24
::a log(0) dá -Inf (menos infinito) e log de número negativo dá NaN.
::v sqrt(), abs() e exp()
@@ sin(), cos(), tan() e pi
::k base
::f Programação · Aula 7
::o Funções trigonométricas. O R trabalha SEMPRE em radianos, não em graus.
::q Para usar graus, converta: radianos = graus × pi / 180. O pi já vem pronto no R.
::s
sin(x)  cos(x)  tan(x)  asin(x)  acos(x)  atan(x)  pi
::p sin / cos / tan | seno, cosseno e tangente (sen no português vira sin).
::p asin / acos / atan | funções inversas (arco-seno etc.): devolvem o ângulo em radianos.
::p pi | 3.141593…
::e
sin(pi / 2)
cos(2 * pi)
sin(30 * pi / 180)       # seno de 30 graus
asin(1) / pi * 180       # converte o resultado para graus
::r
[1] 1
[1] 1
[1] 0.5
[1] 90
::a tan(pi) mostra -1.224647e-16 em vez de 0: é um "quase zero" causado pela forma como o computador guarda decimais.
@@ round(), ceiling() e floor()
::k base
::f Programação · Aula 7
::o Arredondam números: para o mais próximo, sempre para cima ou sempre para baixo.
::q round() é o arredondamento normal (com casas decimais à sua escolha); ceiling() é o "teto" (sobe); floor() é o "piso" (desce).
::s
round(x, digits = 0)
ceiling(x)
floor(x)
::p round(x, 2) | arredonda x com 2 casas decimais. Sem o número, arredonda para inteiro.
::p ceiling | teto: 4.1 vira 5.
::p floor | piso: 4.9 vira 4.
::e
round(4.3478, 2)
round(4.3478)
ceiling(4.3478)
floor(4.3478)
round(100 * 3 / 7, 1)    # percentual com 1 casa
::r
[1] 4.35
[1] 4
[1] 5
[1] 4
[1] 42.9
::a round() só muda o que você vê se você guardar o resultado: x <- round(x, 2).
::a round(2.5) dá 2 e round(3.5) dá 4: o R arredonda o .5 para o par mais próximo (regra do padrão IEEE).
::v + - * / ^ (aritmética) | format()
@@ Inf, NaN e NA
::k base
::f Programação · Aula 7
::o Valores especiais: Inf é infinito, NaN é "não é um número" (conta indeterminada) e NA é "valor ausente" (dado faltando).
::q NA é o mais importante para análise de dados: é a célula vazia da planilha. Qualquer conta com NA dá NA, a não ser que você mande ignorar (na.rm = TRUE).
::s
Inf    -Inf    NaN    NA
::p Inf | infinito (ex.: 1/0).
::p NaN | Not a Number: conta sem resultado definido (ex.: 0/0).
::p NA | Not Available: dado ausente/desconhecido.
::e
1 / 0
0 / 0
2 * NA
x <- c(10, NA, 30)
sum(x)
sum(x, na.rm = TRUE)
::r
[1] Inf
[1] NaN
[1] NA
[1] NA
[1] 40
::a Nunca teste com x == NA (sempre dá NA). Use is.na(x).
::a NA (sem aspas) é ausência; "NA" (com aspas) é um texto de duas letras. Na importação, informe com na.strings quais textos devem virar NA.
::v is.na() e !is.na() | sum(), mean(), prod() e cumsum() | na.omit()

@G Controle de fluxo (decisões e repetições) | #6bd66b | Como fazer o programa tomar decisões (if, switch) e repetir tarefas (for, while, repeat).
@@ if e else
::k base
::f Programação · Aula 9
::o Executa um bloco de código só SE uma condição for verdadeira; o else diz o que fazer caso contrário.
::q É o "se… então… senão…" do dia a dia: SE chover, levo guarda-chuva; SENÃO, vou de boné.
::s
if (condição) {
  # roda se a condição for TRUE
} else {
  # roda se a condição for FALSE
}
::p if | "se".
::p (condição) | um teste que dá TRUE ou FALSE, sempre entre parênteses: idade < 18.
::p { } | as chaves delimitam o bloco: tudo o que está dentro roda junto.
::p else | "senão" (opcional). Precisa estar na MESMA linha da chave } que fecha o if.
::e
idade <- 20
if (idade < 18) {
  print("Você tem menos de 18 anos.")
} else {
  print("Você tem 18 anos ou mais.")
}
::r
[1] "Você tem 18 anos ou mais."
::a Erro clássico: colocar o else no começo de uma linha nova. Escreva "} else {" na mesma linha.
::a O if só aceita UM valor TRUE/FALSE. Para testar um vetor inteiro de uma vez, use ifelse() ou if_else().
::a Se o bloco tem uma linha só, as chaves são opcionais: if (n %% 2 == 0) print("par") else print("ímpar").
::v else if | ifelse() | switch() | if_else()
@@ else if
::k base
::f Programação · Aula 9
::o Encadeia vários testes em sequência quando há mais de duas possibilidades.
::q O R testa de cima para baixo e PARA no primeiro verdadeiro. Por isso, em faixas (de idade, de nota), basta escrever o limite superior de cada faixa.
::s
if (teste1) {
  ...
} else if (teste2) {
  ...
} else {
  # nenhum dos anteriores
}
::p else if (teste2) | só é testado se o teste1 deu FALSE.
::p else final | "qualquer outro caso". É opcional, mas evita ficar sem resposta.
::e
idade <- 17
if (idade < 16) {
  print("Não é eleitor")
} else if (idade < 18) {
  print("Eleitor facultativo")
} else if (idade > 65) {
  print("Eleitor facultativo")
} else {
  print("Eleitor obrigatório")
}
::r
[1] "Eleitor facultativo"
::a A ordem importa: se você testar idade < 65 antes de idade < 18, os menores de 18 caem na faixa errada.
::v if e else | case_when()
@@ switch()
::k base
::f Programação · Aula 9
::o Escolhe um resultado de uma lista conforme um número (posição) ou um texto (nome).
::q Funciona como um cardápio numerado: switch(2, "café", "suco", "água") devolve o item 2, "suco". Com texto, você escolhe pelo nome.
::s
switch(expressão, opção1, opção2, ...)
switch("nome", "nome1" = valor1, "nome2" = valor2)
::p expressão | um número (a posição desejada) ou um texto (o nome da opção).
::p opções | as alternativas, separadas por vírgula.
::e
switch(2, "João", "Alice", "Pedro")
switch("idade", "nome" = "João", "idade" = 20, "país" = "Brasil")
x <- switch(5, "João", "Alice")     # posição que não existe
print(x)
::r
[1] "Alice"
[1] 20
NULL
::a Número fora do intervalo devolve NULL (nada), sem erro.
::v if e else | else if
@@ for
::k base
::f Programação · Aula 11
::o Repete um bloco de código uma vez para cada valor de uma sequência.
::q "Para cada aluno da lista, calcule a média." O contador (i) assume um valor diferente a cada volta: 1, depois 2, depois 3…
::s
for (contador in sequência) {
  # repete isto
}
::p contador | nome da variável que muda a cada volta (costuma ser i, mas pode ser qualquer nome).
::p in | "dentro de".
::p sequência | os valores que o contador vai assumir: 1:10, c(5, 8, 2), um vetor de nomes…
::p { } | o corpo: o que se repete.
::e
for (i in 1:3) {
  print(i * 10)
}
soma <- 0                          # acumulador começa em zero
for (i in 1:100) soma <- soma + i
soma
::r
[1] 10
[1] 20
[1] 30
[1] 5050
::a Dentro do for, o resultado só aparece com print() ou cat().
::a Padrão "acumulador": crie a variável ANTES do laço (soma <- 0) e atualize dentro (soma <- soma + i).
::a Muitas vezes nem precisa de laço: sum(1:100) faz a mesma coisa. O R é vetorizado.
::v while | repeat | break e next | seq() e :
@@ while
::k base
::f Programação · Aula 11
::o Repete um bloco ENQUANTO a condição for verdadeira. Testa antes de cada volta.
::q "Enquanto houver pratos sujos, lave um prato." Se a condição já começar falsa, o bloco não roda nenhuma vez.
::s
while (condição) {
  # repete isto
  # e muda algo para a condição um dia ficar FALSE
}
::p condição | teste verificado ANTES de cada repetição.
::p corpo | precisa alterar a variável testada; senão o laço não para nunca.
::e
y <- 1
while (y < 4) {
  print(y)
  y <- y + 1          # sem esta linha, o laço seria infinito
}
::r
[1] 1
[1] 2
[1] 3
::a Laço infinito: se a condição nunca ficar FALSE, o R trava. Clique no botão vermelho STOP do Console ou aperte Esc.
::v for | repeat | break e next
@@ repeat
::k base
::f Programação · Aula 11
::o Repete para sempre, até encontrar um break. Roda pelo menos uma vez.
::q Útil quando você só sabe se deve parar depois de executar, como "peça números até o usuário digitar 0".
::s
repeat {
  # faz algo
  if (condição_de_parada) break
}
::p repeat | não tem condição no começo.
::p break | é obrigatório lá dentro; é o que encerra o laço.
::e
contador <- 1
repeat {
  print(contador)
  contador <- contador + 1
  if (contador > 3) break
}
::r
[1] 1
[1] 2
[1] 3
::a Diferença para o while: o repeat executa ao menos uma vez, porque o teste vem dentro, depois das tarefas.
::v while | break e next
@@ break e next
::k base
::f Programação · Aula 11
::o break sai do laço imediatamente; next pula para a próxima volta.
::q break = "chega, pode parar". next = "esse eu pulo, vamos para o próximo".
::s
for (i in sequência) {
  if (teste) next     # pula o resto desta volta
  if (teste) break    # sai do laço
}
::e
for (i in 1:6) {
  if (i %% 2 == 0) next   # pula os pares
  if (i > 5) break
  print(i)
}
::r
[1] 1
[1] 3
[1] 5
::a O break sai só do laço mais interno, quando há um laço dentro de outro.
::v for | while | repeat
@@ ifelse()
::k base
::f Linguagem R · Aula 25
::o Versão do if que testa um vetor inteiro de uma vez e devolve um resultado para cada elemento.
::q Perfeito para criar uma coluna nova: "se a nota ≥ 7, Aprovado; senão, Reprovado", para cada aluno.
::s
ifelse(teste, valor_se_TRUE, valor_se_FALSE)
::p teste | condição aplicada a cada elemento.
::p valor_se_TRUE | o que entra onde o teste deu TRUE.
::p valor_se_FALSE | o que entra onde deu FALSE.
::e
notas <- c(8, 5, 7, 4)
ifelse(notas >= 7, "Aprovado", "Reprovado")
::r
[1] "Aprovado"  "Reprovado" "Aprovado"  "Reprovado"
::a No dplyr, o curso usa if_else() (com underline), que é mais rigoroso com tipos e NA.
::v if e else | if_else() | case_when()

@G Vetores | #e056a0 | O vetor é a estrutura mais básica do R: uma fila de valores do mesmo tipo, guardados sob um único nome. No R, até um número sozinho é um vetor de tamanho 1.
@@ c()
::k base
::f Programação · Aula 15
::o Cria um vetor juntando (combinando) vários valores numa fila só.
::q O "c" vem de combine (combinar). É como uma fileira de gavetas numeradas: notas <- c(4, 5, 2, 8) cria 4 gavetas, da posição 1 à 4.
::s
nome <- c(valor1, valor2, valor3, ...)
::p c | "combinar".
::p valores | separados por vírgula. Todos ficam do mesmo tipo.
::e
notas <- c(4, 5, 2, 8)
nomes <- c("Ana", "Bruno", "Carla")
notas
nomes
c(notas, 10)          # junta um vetor com um valor novo
::r
[1] 4 5 2 8
[1] "Ana"   "Bruno" "Carla"
[1]  4  5  2  8 10
::a Misturar tipos converte tudo para o tipo "mais geral": c(1, "a", TRUE) vira tudo texto: "1" "a" "TRUE".
::a O c também é usado para passar vários valores a um argumento: levels = c("P", "M", "G"), by = c("id", "ano").
::v seq() e : | rep() | Acessar posições: v[ ] | length()
@@ seq() e :
::k base
::f Programação · Aula 15
::o Geram sequências de números: de um valor inicial até um final, com o passo ou o tamanho que você escolher.
::q 1:10 é o atalho para "de 1 a 10, de um em um". seq() é a versão completa, em que você escolhe o passo (de 0,5 em 0,5, de 10 em 10…).
::s
inicio:fim
seq(from = inicio, to = fim, by = passo)
seq(from = inicio, to = fim, length = quantos)
::p : | de… até…, de 1 em 1.
::p from | onde começa.
::p to | onde termina (no máximo).
::p by | o passo (de quanto em quanto).
::p length (ou length.out) | quantos números você quer; o R calcula o passo.
::e
2:6
seq(1, 5, by = 0.5)
seq(2, 10, length = 5)
seq(from = 3, by = 10, length = 4)
10:7                     # decrescente também funciona
::r
[1] 2 3 4 5 6
[1] 1.0 1.5 2.0 2.5 3.0 3.5 4.0 4.5 5.0
[1]  2  4  6  8 10
[1]  3 13 23 33
[1] 10  9  8  7
::a Não use by e length juntos com from e to: são informações que podem se contradizer. Escolha um dos dois.
::a seq() também gera datas: seq(as.Date("2026-07-01"), by = "day", length.out = 7).
::v c() | rep() | for
@@ rep()
::k base
::f Programação · Aula 15
::o Repete um valor (ou um vetor) várias vezes.
::q Útil para criar vetores iniciais, como 10 zeros, ou rótulos repetidos.
::s
rep(x, times = n)
rep(x, each = n)
::p x | o que será repetido.
::p times | quantas vezes repetir o conjunto todo.
::p each | quantas vezes repetir cada elemento, antes de passar ao próximo.
::e
rep(5, 4)
rep("UFG", times = 3)
rep(c(1, 2), times = 3)
rep(c(1, 2), each = 3)
::r
[1] 5 5 5 5
[1] "UFG" "UFG" "UFG"
[1] 1 2 1 2 1 2
[1] 1 1 1 2 2 2
::v c() | seq() e :
@@ scan()
::k base
::f Programação · Aula 15
::o Lê vários números digitados no Console, um por linha, e monta um vetor.
::q É como o readline(), mas para vários números de uma vez. A digitação termina quando você aperta Enter numa linha vazia.
::s
v <- scan()
v <- scan(n = 3)        # para depois de 3 números
v <- scan(nlines = 1)   # lê só uma linha
::p n | quantidade máxima de valores.
::p nlines | quantidade de linhas.
::e
valores <- scan()
# digite 6 [Enter] 12 [Enter] 7 [Enter] 9 [Enter] e Enter vazio
valores
::r
1: 6
2: 12
3: 7
4: 9
5:
Read 4 items
[1]  6 12  7  9
::a scan() só aceita números por padrão. Para texto use scan(what = "character").
::v readline() | c()
@@ Acessar posições: v[ ]
::k base
::f Programação · Aula 15
::o Os colchetes [ ] pegam (ou alteram) elementos de um vetor pela posição. A primeira posição é a 1.
::q Pense no número da gaveta. v[2] abre a gaveta 2. Número negativo quer dizer "todas, menos esta".
::s
v[posição]          # um elemento
v[c(1, 3)]          # vários elementos
v[2:4]              # uma fatia
v[-3]               # todos menos o 3º
v[posição] <- novo  # altera
::p [n] | o elemento da posição n.
::p [c(…)] | vários, na ordem pedida.
::p [a:b] | da posição a até a b.
::p [-n] | remove a posição n do resultado (não do vetor original).
::p <- | com a atribuição, troca o valor daquela posição.
::e
notas <- c(4, 5, 2, 8)
notas[2]
notas[c(1, 4)]
notas[2:3]
notas[-3]
notas[2] <- 6
notas
::r
[1] 5
[1] 4 8
[1] 5 2
[1] 4 5 8
[1] 4 6 2 8
::a A contagem começa em 1, não em 0 (diferente de outras linguagens como Python).
::a Atribuir numa posição que não existe aumenta o vetor e preenche o meio com NA: v <- c(1, 2); v[5] <- 9 dá 1 2 NA NA 9.
::a v[-3] não apaga nada de verdade. Para remover de vez: v <- v[-3].
::v Filtro lógico: v[condição] | names() | length()
@@ Filtro lógico: v[condição]
::k base
::f Programação · Aula 15
::o Coloca uma condição dentro dos colchetes para ficar só com os elementos que a obedecem.
::q O R testa a condição em cada elemento, gera TRUE/FALSE e mantém só os TRUE. É a base de todos os filtros de tabela que você vai fazer depois.
::s
v[v > valor]
outro_vetor[condição_no_vetor]
::p condição | qualquer comparação que gere TRUE/FALSE do mesmo tamanho do vetor.
::e
notas <- c(56, 89, 90, 100, 47)
alunos <- c("João", "Maria", "Pedro", "Tereza", "Carlos")
notas >= 60
notas[notas >= 60]
alunos[notas >= 60]        # o teste num vetor seleciona o outro
sum(notas >= 60)           # conta quantos TRUE
::r
[1] FALSE  TRUE  TRUE  TRUE FALSE
[1]  89  90 100
[1] "Maria"  "Pedro"  "Tereza"
[1] 3
::a sum(teste) conta quantos TRUE existem, porque TRUE vale 1 e FALSE vale 0. mean(teste) dá a proporção.
::a Se houver NA, o filtro gera NA no resultado. Combine com !is.na(): v[v > 60 & !is.na(v)].
::v Acessar posições: v[ ] | which() | & | ! (lógicos E, OU, NÃO)
@@ length()
::k base
::f Programação · Aula 15
::o Diz quantos elementos um vetor (ou uma lista) tem.
::s
length(x)
::e
alunos <- c("João", "Maria", "Pedro", "Tereza", "Carlos")
length(alunos)
length(1:100)
::r
[1] 5
[1] 100
::a Num data frame, length() devolve o número de COLUNAS. Para linhas use nrow().
::a Para contar caracteres de um texto use nchar(), não length(): length("banana") é 1.
::v nrow(), ncol() e dim() | nchar()
@@ str()
::k base
::f Programação · Aula 15 · Banco de Dados · Aula 14
::o Mostra a "radiografia" de um objeto: o tipo, o tamanho e os primeiros valores.
::q É o primeiro comando a rodar depois de importar dados. Em uma tela você vê quantas linhas e colunas existem e se cada coluna veio com o tipo certo.
::s
str(objeto)
::p chr | texto (character). num | decimal. int | inteiro. logi | lógico. Factor | categoria.
::e
notas <- c(56, 89, 90)
str(notas)
df <- data.frame(nome = c("Ana", "Bruno"), idade = c(23, 35))
str(df)
::r
 num [1:3] 56 89 90
'data.frame':	2 obs. of  2 variables:
 $ nome : chr  "Ana" "Bruno"
 $ idade: num  23 35
::a O que procurar: número aparecendo como chr (tem texto misturado), categoria como int (código sem rótulo, como SEXO = 1/2), data como chr (precisa converter com as.Date).
::v class() e typeof() | summary() | skim() | head() e tail()
@@ min(), max(), which.min() e which.max()
::k base
::f Programação · Aula 15
::o min() e max() dão o menor e o maior valor; which.min() e which.max() dizem EM QUE POSIÇÃO eles estão.
::q max(notas) responde "qual a maior nota?"; which.max(notas) responde "qual aluno tirou a maior nota?" (a posição dele).
::s
min(x)   max(x)
which.min(x)   which.max(x)
::p which. | "em qual posição…".
::e
notas <- c(56, 89, 90, 100, 47)
alunos <- c("João", "Maria", "Pedro", "Tereza", "Carlos")
max(notas)
which.max(notas)
alunos[which.max(notas)]
min(notas)
::r
[1] 100
[1] 4
[1] "Tereza"
[1] 47
::a Se houver NA, min() e max() devolvem NA. Use max(x, na.rm = TRUE).
::a Se o vetor tem nomes, which.max() devolve o nome junto. Para pegar só o nome: names(which.max(x)).
::a Em empate, which.max() devolve só a primeira ocorrência.
::v range() | which() | sort() e order()
@@ sum(), mean(), prod() e cumsum()
::k base
::f Programação · Aula 15 · Linguagem R · Aula 19
::o Soma, média, produto (multiplica tudo) e soma acumulada dos elementos.
::q cumsum() mostra o "saldo" passo a passo: o 1º, o 1º + 2º, o 1º + 2º + 3º…
::s
sum(x, na.rm = FALSE)
mean(x, na.rm = FALSE)
prod(x)
cumsum(x)
::p x | o vetor (ou uma coluna: df$coluna).
::p na.rm = TRUE | "remova os NA antes de calcular". Sem isso, um único NA faz o resultado virar NA.
::e
x <- c(1, 2, 3, 4, 5)
sum(x)
mean(x)
prod(x)
cumsum(x)
y <- c(10, NA, 30)
mean(y)
mean(y, na.rm = TRUE)
::r
[1] 15
[1] 3
[1] 120
[1]  1  3  6 10 15
[1] NA
[1] 20
::a sum() pode receber vários vetores: sum(x1, x2) soma tudo junto.
::v median() | Inf, NaN e NA | colSums() e rowSums() | summarise()
@@ median()
::k base
::f Banco de Dados · Aula 17 · Linguagem R · Aula 18
::o Calcula a mediana: o valor do meio quando os números estão em ordem.
::q Metade dos valores fica abaixo da mediana e metade acima. Ao contrário da média, ela não é "puxada" por valores extremos, e por isso é muito usada para substituir NA.
::s
median(x, na.rm = FALSE)
::e
x <- c(1, 3, 5, 100)
mean(x)
median(x)
median(c(4, NA, 8), na.rm = TRUE)
::r
[1] 27.25
[1] 4
[1] 6
::a Com quantidade par de valores, a mediana é a média dos dois do meio: (3 + 5) / 2 = 4.
::v sum(), mean(), prod() e cumsum() | summary()
@@ range()
::k base
::f Linguagem R · Aula 14
::o Devolve o menor e o maior valor juntos, num vetor de 2 posições.
::s
range(x, na.rm = FALSE)
::e
range(c(56, 89, 90, 100, 47))
::r
[1]  47 100
::a Muito usado em gráficos: ylim = range(c(y1, y2)) garante que as duas linhas caibam no eixo.
::v min(), max(), which.min() e which.max()
@@ sort() e order()
::k base
::f Programação · Aula 15
::o sort() devolve os valores em ordem; order() devolve as POSIÇÕES que colocariam os valores em ordem.
::q sort() serve para ver o vetor ordenado. order() é usado para ordenar uma tabela inteira pelas linhas: df[order(df$idade), ].
::s
sort(x, decreasing = FALSE)
order(x, decreasing = FALSE)
::p decreasing = TRUE | do maior para o menor. O padrão (FALSE) é do menor para o maior.
::e
notas <- c(56, 89, 90, 100, 47)
sort(notas)
sort(notas, decreasing = TRUE)
order(notas)
notas[order(notas)]        # o mesmo que sort()
::r
[1]  47  56  89  90 100
[1] 100  90  89  56  47
[1] 5 1 2 3 4
[1]  47  56  89  90 100
::a order(notas) = 5 1 2 3 4 quer dizer: "o menor está na posição 5, depois vem o da posição 1…".
::a Para ordem decrescente com order(), também dá para usar o sinal de menos: order(-x).
::v rev() | arrange() | ORDER BY ASC / DESC
@@ rev()
::k base
::f Programação · Aula 17
::o Inverte a ordem de um vetor (o último vira o primeiro).
::s
rev(x)
::e
rev(c(1, 2, 3, 4))
rev(c("a", "b", "c"))
::r
[1] 4 3 2 1
[1] "c" "b" "a"
::v sort() e order()
@@ unique()
::k base
::f Banco de Dados · Aula 17
::o Devolve os valores sem repetição (cada valor diferente aparece uma vez).
::q Ótimo para conferir quais códigos existem numa coluna: "SEXO só tem 1 e 2 ou apareceu algum 9?".
::s
unique(x)
::e
sexo <- c(1, 2, 2, 1, 9, 1)
unique(sexo)
sort(unique(sexo))
length(unique(sexo))      # quantos valores diferentes
::r
[1] 1 2 9
[1] 1 2 9
[1] 3
::v duplicated() | distinct() | table()
@@ which()
::k base
::f Programação · Aula 17
::o Diz em quais posições uma condição é verdadeira.
::s
which(condição)
::e
notas <- c(56, 89, 90, 100, 47)
which(notas >= 60)
which(notas == max(notas))
::r
[1] 2 3 4
[1] 4
::v Filtro lógico: v[condição] | min(), max(), which.min() e which.max()
@@ is.na() e !is.na()
::k base
::f Programação · Aula 15 · Linguagem R · Aula 17
::o is.na() pergunta "este valor está faltando?" para cada elemento; !is.na() pergunta o contrário: "está preenchido?".
::q É o detector de células vazias. Combinado com sum() conta quantos NA existem; com colSums() conta por coluna.
::s
is.na(x)
!is.na(x)
sum(is.na(x))
::p is.na | TRUE onde há NA.
::p ! | inverte: TRUE onde há valor.
::e
notas <- c(56, 89, NA, 100, NA)
is.na(notas)
sum(is.na(notas))
notas[!is.na(notas)]
notas[is.na(notas)] <- 0      # troca os NA por 0
notas
::r
[1] FALSE FALSE  TRUE FALSE  TRUE
[1] 2
[1]  56  89 100
[1]  56  89   0 100   0
::a Num data frame, sum(is.na(df)) conta os NA da tabela toda e colSums(is.na(df)) conta por coluna.
::a is.na() não enxerga texto vazio "" nem "NA" entre aspas. Esses só viram NA de verdade com na.strings na importação ou com conversão de tipo.
::v Inf, NaN e NA | colSums() e rowSums() | na.omit() | drop_na()
@@ names()
::k base
::f Programação · Aula 15
::o Dá nomes às posições de um vetor (ou mostra os nomes que já existem).
::q Em vez de lembrar que a altura do Carlos está na posição 1, você pede alt["Carlos"].
::s
names(x) <- c("nome1", "nome2", ...)
names(x)
::e
alt <- c(172, 171, 168)
names(alt) <- c("Carlos", "Ricardo", "Sofia")
alt
alt["Carlos"]
names(alt)
::r
 Carlos Ricardo   Sofia
    172     171     168
Carlos
   172
[1] "Carlos"  "Ricardo" "Sofia"
::a O vetor de nomes precisa ter o mesmo tamanho do vetor de valores.
::a Num data frame, names(df) devolve os nomes das colunas (igual a colnames()).
::v Acessar posições: v[ ] | colnames() e rownames()
@@ table()
::k base
::f Linguagem R · Aulas 8 e 19
::o Conta quantas vezes cada valor aparece (tabela de frequência).
::q "Quantos homens e quantas mulheres?", "Quantos pacientes por cidade?". Se passar duas variáveis, monta uma tabela cruzada.
::s
table(x)
table(x, useNA = "ifany")
table(x, y)
::p x | vetor, fator ou coluna (df$coluna).
::p useNA = "ifany" | também conta os NA, se existirem. O padrão ignora os NA.
::p x, y | tabela cruzada (linhas de x, colunas de y).
::e
x <- c("A", "B", "A", "C", "B", "A")
table(x)
y <- c("A", "B", NA, "A", NA)
table(y, useNA = "ifany")
::r
x
A B C
3 2 1
y
   A    B <NA>
   2    1    2
::a Para proporções: prop.table(table(x)). Para percentuais: round(prop.table(table(x)) * 100, 1).
::a O resultado de table() vai direto para barplot() e pie().
::v prop.table() | count() | summary() | barplot()
@@ prop.table()
::k base
::f Linguagem R · Aula 15
::o Transforma contagens em proporções (cada valor dividido pelo total).
::s
prop.table(tabela)
::e
x <- c("A", "B", "A", "C", "B", "A")
prop.table(table(x))
round(prop.table(table(x)) * 100, 1)

x
        A         B         C
0.5000000 0.3333333 0.1666667
x
   A    B    C
50.0 33.3 16.7
::v table() | pie()
@@ summary()
::k base
::f Linguagem R · Aula 19 · Banco de Dados · Aula 14
::o Faz um resumo estatístico rápido: mínimo, quartis, mediana, média, máximo e quantidade de NA.
::q Para números mostra a distribuição; para fatores conta cada categoria; para um data frame resume coluna por coluna. Valores mínimo ou máximo absurdos (idade 999) denunciam erro de digitação.
::s
summary(objeto)
::p Min. / Max. | menor e maior valor.
::p 1st Qu. / 3rd Qu. | 1º e 3º quartis: 25% e 75% dos dados estão abaixo deles.
::p Median / Mean | mediana e média. Se forem muito diferentes, a distribuição é assimétrica.
::p NA's | só aparece se houver dados ausentes.
::e
x <- 1:10
summary(x)
sexo <- factor(c("F", "M", "M", "F", NA))
summary(sexo)
::r
   Min. 1st Qu.  Median    Mean 3rd Qu.    Max.
   1.00    3.25    5.50    5.50    7.75   10.00
   F    M NA's
   2    2    1
::v str() | table() | skim() | quantile()
@@ quantile()
::k base
::f Banco de Dados · Aula 14
::o Calcula quartis ou qualquer percentil de um vetor numérico.
::s
quantile(x, probs = c(0.25, 0.5, 0.75), na.rm = FALSE)
::p probs | as proporções desejadas (0.9 = percentil 90).
::e
quantile(1:10)
quantile(1:10, probs = 0.9)
::r
   0%   25%   50%   75%  100%
 1.00  3.25  5.50  7.75 10.00
 90%
 9.1
::v summary() | median()
@@ runif(), rnorm() e set.seed()
::k base
::f Programação · Aula 16 · Aula 13 (R Markdown)
::o Geram números aleatórios: runif() sorteia entre um mínimo e um máximo; rnorm() segue a curva normal. set.seed() fixa o sorteio para ele se repetir.
::q Muito usado nos exercícios para "criar 5 notas aleatórias". Sem set.seed(), cada vez que você roda sai um resultado diferente.
::s
set.seed(numero)
runif(n, min = 0, max = 1)
rnorm(n, mean = 0, sd = 1)
::p n | quantos números sortear.
::p min / max | limites do sorteio (runif).
::p mean / sd | média e desvio padrão (rnorm).
::p set.seed(123) | qualquer número inteiro; o mesmo número gera sempre os mesmos sorteios.
::e
set.seed(123)
notas <- round(runif(5, min = 0, max = 10), 1)
notas
mean(notas)
::r
[1] 2.9 7.9 4.1 8.8 9.4
[1] 6.62
::a Os números do resultado acima só se repetem no seu computador se você usar o mesmo set.seed(123) antes.
::v round(), ceiling() e floor() | sum(), mean(), prod() e cumsum()

@G Matrizes | #b48cff | Matriz é um vetor com duas dimensões: linhas e colunas, todas do mesmo tipo. Acesso sempre por [linha, coluna].
@@ matrix()
::k base
::f Programação · Aula 17
::o Cria uma matriz (tabela de números do mesmo tipo) a partir de um vetor, dizendo quantas linhas e colunas ela tem.
::q Imagine pegar uma fila de números e "dobrar" em formato de tabela. Por padrão o R preenche COLUNA por coluna (de cima para baixo); com byrow = TRUE preenche LINHA por linha.
::s
matrix(dados, nrow = linhas, ncol = colunas, byrow = FALSE)
::p dados | o vetor com os valores (1:9, c(...), etc.).
::p nrow | número de linhas.
::p ncol | número de colunas (basta informar um dos dois: o R calcula o outro).
::p byrow = TRUE | preenche por linha. O padrão (FALSE) preenche por coluna.
::e
m1 <- matrix(1:9, nrow = 3)
m1
m2 <- matrix(1:9, nrow = 3, byrow = TRUE)
m2
::r
     [,1] [,2] [,3]
[1,]    1    4    7
[2,]    2    5    8
[3,]    3    6    9
     [,1] [,2] [,3]
[1,]    1    2    3
[2,]    4    5    6
[3,]    7    8    9
::a [2,] na margem quer dizer "linha 2"; [,3] quer dizer "coluna 3". É a mesma notação usada para acessar.
::a Se o número de dados não for múltiplo de linhas × colunas, o R recicla os valores e dá um aviso.
::v Acessar matriz: m[linha, coluna] | rbind() e cbind() | dim()
@@ Acessar matriz: m[linha, coluna]
::k base
::f Programação · Aula 17
::o Pega (ou altera) um elemento, uma linha, uma coluna ou um pedaço da matriz.
::q Igual batalha naval: primeiro a linha, depois a coluna, separadas por vírgula. Deixar um lado vazio quer dizer "todas".
::s
m[i, j]       # elemento da linha i, coluna j
m[i, ]        # linha i inteira
m[ , j]       # coluna j inteira
m[1:2, 2:3]   # um bloco
m[i, j] <- novo
::p antes da vírgula | linha(s).
::p depois da vírgula | coluna(s).
::p vazio | todas.
::p número negativo | exclui: m[-2, ] é tudo menos a linha 2.
::e
m <- matrix(1:9, nrow = 3, byrow = TRUE)
m[2, 3]
m[1, ]
m[ , 2]
m[1:2, 1:2]
::r
[1] 6
[1] 1 2 3
[1] 2 5 8
     [,1] [,2]
[1,]    1    2
[2,]    4    5
::a Esquecer a vírgula muda tudo: m[2] não é a linha 2, é o 2º elemento contando por coluna.
::a Se a matriz tem nomes, dá para usar: temp_mat["ano1990", "Fev"].
::v matrix() | colnames() e rownames()
@@ nrow(), ncol() e dim()
::k base
::f Programação · Aula 17 · Linguagem R · Aula 4
::o Contam linhas (nrow), colunas (ncol) ou as duas coisas juntas (dim) de uma matriz ou data frame.
::q Logo depois de importar dados: dim(dados) responde "quantos registros e quantas variáveis eu tenho?".
::s
nrow(x)   ncol(x)   dim(x)
::e
m <- matrix(1:12, nrow = 3)
dim(m)
nrow(m)
ncol(m)
nrow(mtcars)
::r
[1] 3 4
[1] 3
[1] 4
[1] 32
::a dim(x)[1] é o número de linhas e dim(x)[2] o de colunas.
::a Boa prática ao filtrar ou juntar tabelas: compare nrow() antes e depois para saber quantas linhas saíram ou entraram.
::v length() | str()
@@ t()
::k base
::f Programação · Aula 17
::o Transpõe a matriz: linhas viram colunas e colunas viram linhas.
::s
t(m)
::e
m <- matrix(1:6, nrow = 2, byrow = TRUE)
m
t(m)
::r
     [,1] [,2] [,3]
[1,]    1    2    3
[2,]    4    5    6
     [,1] [,2]
[1,]    1    4
[2,]    2    5
[3,]    3    6
::v matrix() | as.vector() e c(m)
@@ diag() e solve()
::k base
::f Programação · Aula 17
::o diag(n) cria a matriz identidade n×n; diag(m) extrai a diagonal de uma matriz; solve(m) calcula a matriz inversa.
::s
diag(n)       # identidade
diag(m)       # diagonal de m
solve(m)      # inversa de m
::e
diag(3)
m <- matrix(1:9, nrow = 3)
diag(m)
solve(diag(2) * 2)
::r
     [,1] [,2] [,3]
[1,]    1    0    0
[2,]    0    1    0
[3,]    0    0    1
[1] 1 5 9
     [,1] [,2]
[1,]  0.5  0.0
[2,]  0.0  0.5
::a solve() só funciona com matriz quadrada e que tenha inversa. Caso contrário aparece o erro "system is exactly singular".
::v %*% (multiplicação de matrizes)
@@ %*% (multiplicação de matrizes)
::k base
::f Programação · Aula 17
::o Faz a multiplicação de matrizes da álgebra linear (linha × coluna).
::q Cuidado: * multiplica elemento por elemento (posição com posição); %*% faz a multiplicação "de verdade" da matemática.
::s
A %*% B
::p A %*% B | o número de colunas de A precisa ser igual ao número de linhas de B.
::e
A <- matrix(c(1, 2, 3, 4), nrow = 2)
B <- matrix(c(5, 6, 7, 8), nrow = 2)
A * B        # elemento a elemento
A %*% B      # multiplicação matricial
::r
     [,1] [,2]
[1,]    5   21
[2,]   12   32
     [,1] [,2]
[1,]   23   31
[2,]   34   46
::a Erro "non-conformable arguments" significa que as dimensões não batem para a multiplicação.
::v + - * / ^ (aritmética) | diag() e solve()
@@ colSums() e rowSums()
::k base
::f Programação · Aula 17 · Linguagem R · Aula 19
::o Somam cada coluna (colSums) ou cada linha (rowSums) de uma matriz ou data frame.
::q Truque muito usado: colSums(is.na(dados)) conta quantos NA há em cada coluna.
::s
colSums(x)   rowSums(x)   colMeans(x)   rowMeans(x)
::p colSums / rowSums | soma por coluna / por linha.
::p colMeans / rowMeans | média por coluna / por linha.
::p na.rm = TRUE | ignora os NA.
::e
m <- matrix(1:9, nrow = 3, byrow = TRUE)
rowSums(m)
colSums(m)
rowMeans(m)
colSums(is.na(airquality))     # NA por coluna
::r
[1]  6 15 24
[1] 12 15 18
[1] 2 5 8
  Ozone Solar.R    Wind    Temp   Month     Day
     37       7       0       0       0       0
::v apply() | is.na() e !is.na() | sum(), mean(), prod() e cumsum()
@@ rbind() e cbind()
::k base
::f Programação · Aula 17 · Banco de Dados · Aula 15
::o rbind() empilha vetores/tabelas como LINHAS (um embaixo do outro); cbind() junta como COLUNAS (lado a lado).
::q r = row (linha) e c = column (coluna). Para acrescentar uma linha de totais embaixo use rbind(); para uma coluna de totais ao lado, cbind().
::s
rbind(a, b, ...)
cbind(a, b, ...)
::p rbind | as colunas precisam ser compatíveis (mesmo número de colunas e, em data frames, mesmos nomes).
::p cbind | precisam ter o mesmo número de linhas.
::e
v1 <- c(1, 2, 3)
v2 <- c(4, 5, 6)
rbind(v1, v2)
cbind(v1, v2)
m <- matrix(1:4, nrow = 2)
cbind(m, total = rowSums(m))   # coluna de totais
::r
   [,1] [,2] [,3]
v1    1    2    3
v2    4    5    6
     v1 v2
[1,]  1  4
[2,]  2  5
[3,]  3  6
         total
[1,] 1 3     4
[2,] 2 4     6
::a Em data frames, rbind() exige colunas com os mesmos nomes. Para tabelas com colunas diferentes use bind_rows() (dplyr), que preenche com NA.
::v matrix() | bind_rows() | colSums() e rowSums()
@@ colnames() e rownames()
::k base
::f Programação · Aula 17 · Linguagem R · Aula 4
::o Mostram ou definem os nomes das colunas e das linhas de uma matriz ou data frame.
::s
colnames(x) <- c("nome1", "nome2", ...)
rownames(x) <- c("nome1", "nome2", ...)
::e
m <- matrix(c(25, 23.2, 24.9, 24.1), nrow = 2, byrow = TRUE)
rownames(m) <- c("ano1990", "ano1991")
colnames(m) <- c("Jan", "Fev")
m
m["ano1991", "Fev"]
::r
         Jan  Fev
ano1990 25.0 23.2
ano1991 24.9 24.1
[1] 24.1
::a O vetor de nomes precisa ter exatamente o mesmo número de colunas (ou linhas).
::a Para renomear UMA coluna de um data frame: names(df)[names(df) == "antigo"] <- "novo" (ou rename() do dplyr).
::v names() | rename()
@@ as.matrix(), as.vector() e c(m)
::k base
::f Programação · Aula 17
::o Convertem entre vetor e matriz: as.matrix() transforma em matriz; as.vector() ou c() "desmancham" a matriz num vetor.
::q Ao desmanchar, o R lê coluna por coluna. Para ler linha por linha, transponha antes: c(t(m)).
::s
as.matrix(x)
as.vector(m)
c(m)
c(t(m))
::e
m <- matrix(1:6, nrow = 2, byrow = TRUE)
c(m)
c(t(m))
as.matrix(c(1, 3, 5))

[1] 1 4 2 5 3 6
[1] 1 2 3 4 5 6
     [,1]
[1,]    1
[2,]    3
[3,]    5

@G Data frames (tabelas) | #2ec4b6 | O data frame é a "planilha" do R: cada coluna é uma variável (pode ter tipos diferentes) e cada linha é uma observação.
@@ data.frame()
::k base
::f Linguagem R · Aula 4
::o Cria uma tabela juntando vetores; cada vetor vira uma coluna.
::q Diferente da matriz, cada coluna pode ter um tipo: nome (texto), idade (número), aprovado (lógico). Todas as colunas precisam ter o mesmo número de linhas.
::s
tabela <- data.frame(
  coluna1 = vetor1,
  coluna2 = vetor2
)
::p coluna1 = | o nome que a coluna vai ter.
::p vetor1 | os valores daquela coluna.
::p stringsAsFactors = FALSE | (opcional) mantém textos como texto. No R 4.0 ou mais novo, esse já é o padrão.
::e
df <- data.frame(
  nome   = c("Ana", "Bruno", "Carla"),
  idade  = c(23, 35, 30),
  cidade = c("Goiânia", "Anápolis", "Goiânia")
)
df
::r
   nome idade   cidade
1   Ana    23  Goiânia
2 Bruno    35 Anápolis
3 Carla    30  Goiânia
::a Erro "arguments imply differing number of rows" = as colunas têm tamanhos diferentes.
::a Os números à esquerda (1, 2, 3) são os nomes das linhas, não uma coluna de dados.
::v Acessar colunas: df$coluna | Acessar partes: df[linha, coluna] | head() e tail() | tibble() e tribble()
@@ Acessar colunas: df$coluna
::k base
::f Linguagem R · Aula 4
::o O cifrão $ pega uma coluna do data frame pelo nome, como um vetor.
::q Leia como "a coluna idade DA tabela df". Depois de pegar a coluna, todas as funções de vetor funcionam: mean(df$idade), max(df$idade)…
::s
tabela$coluna
tabela$coluna[posição]
::e
df <- data.frame(nome = c("Ana", "Bruno", "Carla"), idade = c(23, 35, 30))
df$idade
mean(df$idade)
df$nome[2]
::r
[1] 23 35 30
[1] 29.33333
[1] "Bruno"
::a Se o nome tiver espaço ou acento estranho, use crases: df$`nome completo`.
::a Coluna que não existe devolve NULL (nada), sem erro. Confira a grafia com names(df).
::v Acessar partes: df[linha, coluna] | Criar e remover colunas | attach() e detach()
@@ Acessar partes: df[linha, coluna]
::k base
::f Linguagem R · Aula 4
::o Com colchetes você pega linhas, colunas ou células específicas do data frame, igual à matriz.
::q [linhas, colunas]. O truque mais importante: colocar uma CONDIÇÃO antes da vírgula filtra linhas. df[df$idade > 25, ] = "as linhas em que a idade é maior que 25, todas as colunas".
::s
df[i, j]                 # célula
df[i, ]                  # linha i
df[ , "coluna"]          # coluna
df[df$col > valor, ]     # filtro de linhas
df[i, j] <- novo         # altera
::p antes da vírgula | quais linhas (número, vetor de números ou condição).
::p depois da vírgula | quais colunas (número ou nome entre aspas).
::p vazio | todas.
::e
df <- data.frame(nome = c("Ana", "Bruno", "Carla"), idade = c(23, 35, 30))
df[2, ]
df[ , "nome"]
df[df$idade > 25, ]
df[2, "idade"] <- 36
df
::r
   nome idade
2 Bruno    35
[1] "Ana"   "Bruno" "Carla"
   nome idade
2 Bruno    35
3 Carla    30
   nome idade
1   Ana    23
2 Bruno    36
3 Carla    30
::a Esquecer a vírgula no filtro (df[df$idade > 25]) dá erro ou resultado estranho. A vírgula diz "estas linhas, todas as colunas".
::a Atribuir sem indicar a linha altera a coluna inteira: df[ , "idade"] <- 0 zera todas as idades.
::v Acessar colunas: df$coluna | subset() | filter()
@@ head() e tail()
::k base
::f Linguagem R · Aulas 4 e 12
::o Mostram só as primeiras (head) ou as últimas (tail) linhas de uma tabela. O padrão é 6 linhas.
::q Para "dar uma espiada" numa tabela grande sem encher a tela. tail() ajuda a achar lixo no fim do arquivo (linhas de total, rodapés).
::s
head(tabela, n = 6)
tail(tabela, n = 6)
::p n | quantas linhas mostrar.
::e
head(mtcars, 3)
::r
               mpg cyl disp  hp drat    wt  qsec vs am gear carb
Mazda RX4     21.0   6  160 110 3.90 2.620 16.46  0  1    4    4
Mazda RX4 Wag 21.0   6  160 110 3.90 2.875 17.02  0  1    4    4
Datsun 710    22.8   4  108  93 3.85 2.320 18.61  1  1    4    1
::v View() | str() | nrow(), ncol() e dim()
@@ Criar e remover colunas
::k base
::f Linguagem R · Aula 4
::o Para criar uma coluna nova, atribua um valor a um nome de coluna que ainda não existe; para remover, atribua NULL.
::q df$nova <- ... funciona como "adicione esta coluna". O valor pode ser fixo (2000 para todos) ou calculado a partir de outras colunas.
::s
df$nova <- valor_ou_conta
df$coluna <- NULL
::e
df <- data.frame(nome = c("Ana", "Bruno"), salario = c(3000, 5000))
df$bonus <- df$salario * 0.10      # coluna calculada
df$ano <- 2026                     # mesmo valor em todas as linhas
df
df$ano <- NULL                     # remove
names(df)
::r
   nome salario bonus  ano
1   Ana    3000   300 2026
2 Bruno    5000   500 2026
[1] "nome"    "salario" "bonus"
::a O valor precisa ter 1 elemento ou exatamente o mesmo número de linhas da tabela.
::a Também funciona com colchetes: df["serie"] <- c(2, 3) e df["serie"] <- NULL. No dplyr, use mutate() e select(-coluna).
::v mutate() | select() | cbind()
@@ subset()
::k base
::f Linguagem R · Aula 4
::o Filtra as linhas de um data frame por uma condição, escrevendo só o nome da coluna (sem df$).
::s
subset(tabela, condição, select = c(colunas))
::p condição | teste usando os nomes das colunas.
::p select | (opcional) quais colunas manter.
::e
df <- data.frame(nome = c("Ana", "Bruno", "Carla"), idade = c(23, 35, 30))
subset(df, idade > 25)
subset(df, idade > 25, select = nome)
::r
   nome idade
2 Bruno    35
3 Carla    30
   nome
2 Bruno
3 Carla
::v Acessar partes: df[linha, coluna] | filter()
@@ merge()
::k base
::f Linguagem R · Aula 4 · Banco de Dados · Aula 15
::o Junta duas tabelas usando uma coluna em comum (a "chave"), como o JOIN do SQL.
::q Uma tabela tem id e nome; a outra tem id e nota. merge() cola as informações das duas na mesma linha quando o id é igual.
::s
merge(A, B, by = "chave")                 # só quem tem par (INNER)
merge(A, B, by = "chave", all.x = TRUE)   # todos de A (LEFT)
merge(A, B, by = "chave", all = TRUE)     # todos (FULL)
::p by | o nome da coluna em comum.
::p all.x = TRUE | mantém todas as linhas da 1ª tabela, mesmo sem par (completa com NA).
::p all = TRUE | mantém todas as linhas das duas.
::p by.x / by.y | quando a chave tem nomes diferentes: by.x = "id_pac", by.y = "codigo".
::e
a <- data.frame(id = 1:3, nome = c("Ana", "Bruno", "Carla"))
b <- data.frame(id = c(2, 3, 4), nota = c(8, 9, 7))
merge(a, b, by = "id")
merge(a, b, by = "id", all.x = TRUE)
::r
  id  nome nota
1  2 Bruno    8
2  3 Carla    9
  id  nome nota
1  1   Ana   NA
2  2 Bruno    8
3  3 Carla    9
::a Se a chave se repete numa das tabelas, as linhas se multiplicam. Compare nrow() antes e depois.
::a A chave precisa ter o mesmo tipo nas duas tabelas (número com número, texto com texto).
::v left_join(), inner_join(), right_join(), full_join() | INNER JOIN | LEFT JOIN
@@ attach() e detach()
::k base
::f Linguagem R · Aula 4
::o attach() deixa você usar as colunas de um data frame pelo nome direto, sem escrever df$; detach() desfaz.
::s
attach(tabela)
detach(tabela)
::e
df <- data.frame(nome = c("Ana", "Bruno"), idade = c(23, 35))
attach(df)
idade
detach(df)
::r
[1] 23 35
::a As "variáveis virtuais" do attach() são cópias: alterar idade não altera df$idade. Para mudar de verdade, altere a tabela.
::a É fácil esquecer o detach() e confundir nomes. Hoje em dia prefere-se df$coluna ou o dplyr.
::v Acessar colunas: df$coluna
@@ aggregate()
::k base
::f Linguagem R · Aulas 5 e 20
::o Calcula um resumo (soma, média…) de uma coluna para cada grupo de outra coluna.
::q "Soma das vendas POR produto", "média de salário POR departamento". O ~ se lê "em função de" ou "agrupado por".
::s
aggregate(valor ~ grupo, data = tabela, FUN = funcao)
::p valor | a coluna numérica que será resumida.
::p ~ | til: "por".
::p grupo | a coluna que define os grupos.
::p data | a tabela.
::p FUN | a função de resumo: sum, mean, max, length (contagem)…
::e
vendas <- data.frame(
  produto = c("A", "B", "A", "C", "B", "A"),
  vendas  = c(100, 150, 200, 250, 120, 180)
)
aggregate(vendas ~ produto, data = vendas, FUN = sum)
::r
  produto vendas
1       A    480
2       B    270
3       C    250
::a O equivalente no dplyr é group_by(produto) |> summarise(total = sum(vendas)). No SQL, GROUP BY.
::v tapply() | group_by() | summarise() | GROUP BY

@G Listas e fatores | #00b8a9 | Listas guardam coisas de tipos diferentes juntas; fatores representam categorias (sexo, tamanho, estado civil).
@@ list()
::k base
::f Linguagem R · Aula 6
::o Cria uma lista: uma "caixa de caixas" que guarda elementos de qualquer tipo, até vetores, tabelas e outras listas.
::q Um vetor só aceita um tipo. A lista aceita tudo misturado: o nome de uma pessoa (texto), a idade (número) e os hobbies (vetor de textos).
::s
lista <- list(elemento1, elemento2, ...)
lista <- list(nome1 = valor1, nome2 = valor2)
::p nome = valor | dar nomes facilita o acesso depois (lista$nome).
::e
pessoa <- list(nome = "Ana", idade = 27, hobbies = c("Cinema", "Música"))
str(pessoa)
pessoa$hobbies
::r
List of 3
 $ nome   : chr "Ana"
 $ idade  : num 27
 $ hobbies: chr [1:2] "Cinema" "Música"
[1] "Cinema" "Música"
::v Acessar listas: [[ ]] e $ | append(), unlist() e as.list() | lapply(), sapply(), tapply() e mapply()
@@ Acessar listas: [[ ]] e $
::k base
::f Linguagem R · Aula 6
::o [[ ]] e $ tiram o elemento de dentro da lista; [ ] devolve uma lista menor (a "caixa" com o elemento dentro).
::q Pense num trem: lista[2] é o vagão 2 (ainda engatado, é uma lista); lista[[2]] é a carga que está dentro do vagão 2.
::s
lista[[posição]]
lista[["nome"]]
lista$nome
lista$nome <- novo     # altera ou cria
lista$nome <- NULL     # remove
::e
pessoa <- list(nome = "Ana", idade = 27)
pessoa[[2]]
pessoa[["nome"]]
pessoa$idade <- 28
pessoa$cidade <- "Goiânia"     # cria um elemento novo
pessoa$nome <- NULL            # remove
str(pessoa)
::r
[1] 27
[1] "Ana"
List of 2
 $ idade : num 28
 $ cidade: chr "Goiânia"
::a Ao remover um elemento do meio, os seguintes "andam" uma posição para trás.
::v list() | Acessar colunas: df$coluna
@@ append(), unlist() e as.list()
::k base
::f Linguagem R · Aula 6
::o append() adiciona um item no fim de uma lista (ou vetor); unlist() achata a lista num vetor; as.list() faz o contrário.
::s
append(lista, novo_item)
unlist(lista)
as.list(vetor)
c(lista1, lista2)    # junta duas listas
::e
l <- list(1, 2, 3)
length(append(l, 4))
unlist(l)
unlist(list(1, "a", TRUE))     # tipos misturados viram texto
::r
[1] 4
[1] 1 2 3
[1] "1"    "a"    "TRUE"
::a unlist() de uma lista com tipos diferentes converte tudo para texto. Use só quando os elementos forem do mesmo tipo.
::v list() | c()
@@ %in%
::k base
::f Linguagem R · Aula 6 · Banco de Dados · Aula 17
::o Pergunta "este valor está dentro daquele conjunto?" e responde TRUE ou FALSE para cada elemento.
::q É o IN do SQL. Em vez de escrever cidade == "A" | cidade == "B" | cidade == "C", escreva cidade %in% c("A", "B", "C").
::s
valor %in% conjunto
::p valor | o que você procura (pode ser um vetor: testa cada um).
::p conjunto | onde procurar.
::e
"Pedro" %in% c("Ana", "Pedro", "Maria")
sexo <- c(1, 2, 9, 1, 0)
sexo %in% c(1, 2)
sexo[!sexo %in% c(1, 2)]        # valores inválidos
::r
[1] TRUE
[1]  TRUE  TRUE FALSE  TRUE FALSE
[1] 9 0
::a Para "não está em", coloque o ! antes de tudo: !x %in% c(...).
::v == != > < >= <= (comparação) | filter() | IN e NOT IN
@@ factor()
::k base
::f Linguagem R · Aula 8
::o Transforma um vetor em fator: uma variável de categorias com níveis (levels) definidos.
::q Categorias como sexo, tipo sanguíneo ou tamanho P/M/G. Com levels você define a ordem; com labels troca os códigos por nomes legíveis (1 → "Masculino"); com ordered = TRUE as categorias passam a ter ordem (P < M < G).
::s
factor(x, levels = c(...), labels = c(...), ordered = FALSE)
::p x | o vetor original (texto ou número).
::p levels | os valores possíveis, na ordem desejada. Valores fora da lista viram NA.
::p labels | os nomes que vão substituir cada nível, na mesma ordem.
::p ordered = TRUE | cria uma variável ordinal (permite comparar com < e >).
::e
sexo <- c(1, 2, 2, 1)
f <- factor(sexo, levels = c(1, 2), labels = c("Masculino", "Feminino"))
f
tam <- factor(c("M", "P", "G"), levels = c("P", "M", "G"), ordered = TRUE)
tam
tam[1] > tam[2]          # M é maior que P?
::r
[1] Masculino Feminino  Feminino  Masculino
Levels: Masculino Feminino
[1] M P G
Levels: P < M < G
[1] TRUE
::a Sem levels, o R coloca as categorias em ordem alfabética.
::a Para converter um fator de números de volta para número, use as.numeric(as.character(f)). Só as.numeric(f) devolve os códigos internos (1, 2, 3…).
::a No summary() de um data frame, fatores mostram a contagem de cada categoria, e não média.
::v levels() e nlevels() | table() | gl() | as.numeric(), as.integer() e outros as.*
@@ levels() e nlevels()
::k base
::f Linguagem R · Aula 8
::o levels() mostra (ou renomeia) as categorias de um fator; nlevels() diz quantas são.
::s
levels(f)
nlevels(f)
levels(f) <- c("novo1", "novo2")
::e
estado <- factor(c("casado", "solteiro", "solteiro", "divorciado"))
levels(estado)
nlevels(estado)
length(estado)          # quantidade de elementos, não de níveis
::r
[1] "casado"     "divorciado" "solteiro"
[1] 3
[1] 4
::v factor() | table()
@@ gl()
::k base
::f Linguagem R · Aula 8
::o Gera um fator com níveis que se repetem num padrão (n níveis, cada um repetido k vezes).
::s
gl(n, k, labels = c(...))
::p n | quantos níveis.
::p k | quantas vezes cada nível se repete.
::p labels | os nomes dos níveis.
::e
gl(3, 2, labels = c("Goiânia", "Anápolis", "Rio Verde"))
::r
[1] Goiânia   Goiânia   Anápolis  Anápolis  Rio Verde Rio Verde
Levels: Goiânia Anápolis Rio Verde
::v factor() | rep()

@G Funções, pacotes e ajuda | #ffd166 | Como criar suas próprias funções e como instalar, carregar e conhecer pacotes (conjuntos de funções extras).
@@ function()
::k base
::f Programação · Aula 19
::o Cria a sua própria função: um bloco de código com nome que recebe entradas (argumentos) e devolve um resultado.
::q É uma "receita" reutilizável: você escreve uma vez (por exemplo, o cálculo de juros) e depois só chama pelo nome com valores diferentes.
::s
nome <- function(arg1, arg2 = valor_padrao) {
  # instruções
  return(resultado)
}
::p nome <- | o nome da função (como uma variável).
::p function( ) | a palavra-chave e, entre parênteses, os argumentos (entradas).
::p arg2 = valor_padrao | argumento com valor padrão: se você não informar, usa esse.
::p { } | o corpo: o que a função faz.
::p return( ) | o que a função devolve. Sem return, ela devolve o resultado da última linha.
::e
juros <- function(capital, taxa = 0.05, tempo = 12) {
  j <- capital * ((1 + taxa)^tempo - 1)
  return(round(j, 2))
}
juros(1000, 0.05, 1.5)     # pela ordem dos argumentos
juros(capital = 1000)      # usa taxa e tempo padrão
::r
[1] 75.93
[1] 795.86
::a A função só existe depois que você roda o bloco que a cria. Se mudou o código dela, rode de novo.
::a Variáveis criadas dentro da função não aparecem fora dela.
::a Defina as funções no começo do script; se uma depende da outra, a "chamada" deve vir depois.
::v source() | help(), ? e args()
@@ source()
::k base
::f Programação · Aula 19
::o Roda todo o código de outro arquivo .R, por exemplo um arquivo só com as suas funções.
::q Em vez de copiar e colar as mesmas funções em vários scripts, guarde-as num arquivo e "importe" com source(). Se corrigir a função, todos os scripts passam a usar a versão nova.
::s
source("caminho/arquivo.R")
::e
source("minhas_funcoes.R")      # procura na pasta de trabalho
source("C:/Users/thiago/Desktop/minhas_funcoes.R")
::r
(não mostra nada; as funções do arquivo passam a existir na memória)
::a No Windows, use / no caminho (C:/Users/...) e não a barra invertida \.
::v function() | getwd() e setwd()
@@ install.packages() e library()
::k base
::f Linguagem R · Aula 2
::o install.packages() baixa e instala um pacote no computador (uma vez só); library() carrega o pacote na sessão (toda vez que abrir o R).
::q Instalar é como comprar um livro e colocar na estante; library() é tirar o livro da estante e abrir na mesa. Só precisa comprar uma vez, mas precisa abrir sempre que for usar.
::s
install.packages("nome")        # com aspas, uma vez
library(nome)                   # sem aspas, toda sessão
install.packages(c("dplyr", "readxl"))
::p "nome" | o nome do pacote entre aspas, exatamente como no CRAN (maiúsculas importam).
::p library(nome) | sem aspas.
::p c(...) | instala vários de uma vez.
::e
install.packages("dplyr")
library(dplyr)
packageVersion("dplyr")
::r
[1] '1.1.4'
::a Erro "there is no package called 'xxx'" = o pacote não está instalado. Rode install.packages("xxx").
::a Erro "could not find function 'filter'" = esqueceu o library(dplyr) nesta sessão.
::a Não coloque install.packages() dentro de arquivos .Rmd: o Knit tentaria reinstalar toda vez. Instale no Console.
::a Pelo menu do RStudio: Tools → Install Packages… ou aba Packages → Install.

@G Pastas, importação e exportação | #ff8fab | Como dizer ao R onde estão os arquivos, ler CSV/Excel/TXT e salvar resultados.
@@ getwd() e setwd()
::k base
::f Banco de Dados · Aula 6
::o getwd() mostra em qual pasta o R está trabalhando; setwd() muda essa pasta.
::q O R é como uma pessoa sentada numa mesa: só enxerga os arquivos que estão naquela mesa (a pasta de trabalho). Se o arquivo está em outra pasta, ou você muda de mesa (setwd) ou informa o caminho completo.
::s
getwd()
setwd("C:/caminho/da/pasta")
::p "C:/…" | o caminho da pasta, com barras normais /.
::e
getwd()
setwd("C:/Users/thiago/Documents/pos_graduacao")
getwd()
::r
[1] "C:/Users/thiago/Documents"
[1] "C:/Users/thiago/Documents/pos_graduacao"
::a O Windows mostra caminhos com \ (barra invertida), mas o R não aceita \ simples. Troque por / ou use \\.
::a setwd() vale só para a sessão atual. Alternativas: menu Session → Set Working Directory → Choose Directory…, ou criar um Projeto do RStudio (File → New Project), que já define a pasta automaticamente.
::a Regra de ouro das aulas: deixe o arquivo de dados na mesma pasta do seu .Rmd. Assim basta o nome do arquivo.
::v file.exists() e list.files() | read.csv() e read.csv2()
@@ file.exists() e list.files()
::k base
::f Banco de Dados · Aula 6
::o file.exists() confere se um arquivo está onde você acha que está; list.files() lista os arquivos da pasta de trabalho.
::q Antes de importar, pergunte ao R se ele está vendo o arquivo. Se der FALSE, o problema é o endereço, não o seu código.
::s
file.exists("arquivo.csv")
list.files()
list.files(pattern = ".csv")
::p pattern | filtra os arquivos cujo nome contém aquele trecho.
::e
file.exists("cancer_pulmao.csv")
list.files(pattern = ".csv")
::r
[1] TRUE
[1] "cancer_pulmao.csv"
::a Se der FALSE, confira: o arquivo está na pasta mostrada por getwd()? O nome está igual, inclusive maiúsculas e extensão (.csv e não .CSV ou .xlsx)?
::v getwd() e setwd() | file.choose()
@@ file.choose()
::k base
::f Linguagem R · Aula 10
::o Abre a janela do sistema para você escolher um arquivo com o mouse e devolve o caminho dele.
::s
read.csv(file.choose())
::e
dados <- read.csv(file.choose(), sep = ";")
::a Prático para testar, mas não funciona no Knit do R Markdown e não fica registrado qual arquivo foi usado. Em relatórios, escreva o nome do arquivo.
::v read.csv() e read.csv2()
@@ read.csv() e read.csv2()
::k base
::f Linguagem R · Aula 10 · Banco de Dados · Aula 6
::o Leem um arquivo CSV (planilha em texto) e transformam em data frame.
::q read.csv() é para o padrão americano (separador vírgula e decimal ponto). read.csv2() é para o padrão brasileiro do Excel (separador ponto e vírgula e decimal vírgula).
::s
dados <- read.csv("arquivo.csv", header = TRUE, sep = ",", dec = ".")
dados <- read.csv2("arquivo.csv")
::p "arquivo.csv" | nome (ou caminho) do arquivo, entre aspas.
::p header = TRUE | a 1ª linha tem os nomes das colunas.
::p sep | o separador de colunas: "," ou ";" ou "\t" (tab).
::p dec | o separador decimal: "." ou ",".
::p na.strings | quais textos devem virar NA: c("", "NA", "N/A", "NULL").
::p encoding / fileEncoding | a codificação, por exemplo "UTF-8", para acentos aparecerem certo.
::p stringsAsFactors = FALSE | mantém os textos como texto.
::e
dados <- read.csv("cancer_pulmao.csv")
head(dados, 3)
dim(dados)
::r

1    2005    59    2        0     0      0    21       1      C34
2    2001    58    1        0     0      1  1086       1      C34
3    2001    68    1        0     0      1   142       1      C34
[1] 28665     9
::a Erro "cannot open file … No such file or directory" = o R não achou o arquivo. Veja getwd() e list.files().
::a Todos os dados apareceram numa única coluna? O separador está errado: troque para read.csv2() ou sep = ";".
::a Acentos estranhos (GoiÃ¢nia)? Informe encoding = "UTF-8" (ou "latin1").
::a Depois de importar, sempre rode head(), dim() e str() para conferir.
::v read.table(), read.delim() e read.fwf() | read_excel() e excel_sheets() | write.csv() e write.table() | str()
@@ read.table(), read.delim() e read.fwf()
::k base
::f Linguagem R · Aulas 10 e 16
::o Leem arquivos de texto (.txt): read.table() com qualquer separador, read.delim() separado por tabulação e read.fwf() de largura fixa.
::q read.csv() é um "atalho" do read.table(). Use read.table() quando o separador for espaço ou algo diferente; read.fwf() quando cada coluna ocupar um número fixo de caracteres.
::s
read.table("arquivo.txt", header = TRUE, sep = " ")
read.delim("arquivo.txt")
read.fwf("arquivo.txt", widths = c(8, 2, 10), col.names = c(...))
::p sep | separador (" " espaço, "\t" tab, "|" barra…).
::p widths | (read.fwf) quantos caracteres cada coluna ocupa.
::p na.strings | textos que viram NA.
::p fill = TRUE | completa com NA as linhas mais curtas.
::p strip.white = TRUE | tira espaços extras.
::p skip / nrows | pula linhas do início / lê só n linhas.
::p quote | quais aspas delimitam textos.
::e
dados <- read.table(
  "dados.txt",
  sep = "\t", header = TRUE,
  na.strings = c("NA", ""),
  fileEncoding = "UTF-8",
  fill = TRUE, strip.white = TRUE
)
fwf <- read.fwf("data_fwf.txt", widths = c(8, 2, 10),
                col.names = c("Nome", "Idade", "Profissao"))
fwf$Nome <- trimws(fwf$Nome)     # tira espaços que sobram
::a Em largura fixa, os textos costumam vir com espaços sobrando: use trimws() depois.
::v read.csv() e read.csv2() | trimws()
@@ read_excel() e excel_sheets()
::k readxl
::f Linguagem R · Aula 10 · Banco de Dados · Aula 6
::o read_excel() lê planilhas do Excel (.xlsx e .xls); excel_sheets() lista as abas do arquivo.
::s
library(readxl)
dados <- read_excel("arquivo.xlsx", sheet = 1)
excel_sheets("arquivo.xlsx")
::p sheet | a aba: pelo número (1 = primeira) ou pelo nome ("Planilha1").
::p range | só um pedaço: range = "A1:C10".
::p skip | pula linhas do topo (cabeçalhos decorativos).
::e
library(readxl)
excel_sheets("funcionarios_empresa.xlsx")
dados <- read_excel("funcionarios_empresa.xlsx", sheet = "Planilha1")
::r
[1] "Planilha1" "Planilha2"
::a O resultado é um tibble (uma tabela "moderna"), que funciona como data frame.
::a Instale o pacote uma vez: install.packages("readxl").
::v read.csv() e read.csv2() | write_xlsx()
@@ write.csv() e write.table()
::k base
::f Linguagem R · Aula 10
::o Salvam (exportam) um data frame para um arquivo CSV ou TXT.
::s
write.csv(tabela, "arquivo.csv", row.names = FALSE)
write.csv2(tabela, "arquivo.csv", row.names = FALSE)   # padrão Brasil
write.table(tabela, "arquivo.txt", sep = "\t", row.names = FALSE)
::p tabela | o data frame a salvar.
::p "arquivo.csv" | o nome do arquivo que será criado (na pasta de trabalho).
::p row.names = FALSE | não grava a coluna com os números das linhas (quase sempre é o que você quer).
::p sep / dec | separador de colunas e decimal (no write.table).
::e
df <- data.frame(nome = c("Ana", "Bruno"), nota = c(8.5, 7))
write.csv(df, "notas.csv", row.names = FALSE)
file.exists("notas.csv")
::r
[1] TRUE
::a Se já existir um arquivo com esse nome, ele é substituído sem aviso.
::a Para abrir direto no Excel brasileiro sem bagunçar, prefira write.csv2().
::v write_xlsx() | saveRDS() e readRDS() | read.csv() e read.csv2()
@@ write_xlsx()
::k writexl
::f Linguagem R · Aula 10
::o Salva um data frame (ou vários, em abas) num arquivo Excel .xlsx.
::s
library(writexl)
write_xlsx(tabela, "arquivo.xlsx")
write_xlsx(list(Aba1 = tab1, Aba2 = tab2), "arquivo.xlsx")
::e
library(writexl)
dados1 <- data.frame(A = 1:3, B = letters[1:3])
dados2 <- data.frame(C = 4:6, D = letters[4:6])
write_xlsx(list(Vendas = dados1, Clientes = dados2), "meu_arquivo.xlsx")
::v write.csv() e write.table() | read_excel() e excel_sheets()
@@ saveRDS() e readRDS()
::k base
::f Linguagem R · Aula 10 · Banco de Dados · Aula 6
::o Salvam e leem UM objeto do R no formato próprio do R (.rds), exatamente como ele estava.
::q Depois de limpar uma base, salve em .rds: na próxima aula você carrega em segundos, com os tipos e fatores preservados (o CSV perde essas informações).
::s
saveRDS(objeto, "arquivo.rds")
objeto <- readRDS("arquivo.rds")
::e
saveRDS(dados, "cancer_pulmao.rds")
dados <- readRDS("cancer_pulmao.rds")
::a O .rds só é aberto pelo R (não abre no Excel).
::a readRDS() precisa de uma variável para receber: dados <- readRDS(...). Você escolhe o nome.
::v save() e load() | write.csv() e write.table()
@@ save() e load()
::k base
::f Linguagem R · Aula 10
::o save() guarda VÁRIOS objetos num arquivo .RData; load() traz todos de volta com os nomes originais.
::s
save(obj1, obj2, file = "arquivo.RData")
load("arquivo.RData")
::e
nomes <- c("Alice", "Bob")
idades <- c(25, 30)
save(nomes, idades, file = "meus_dados.RData")
rm(nomes, idades)
load("meus_dados.RData")
nomes
::r
[1] "Alice" "Bob"
::a load() recria as variáveis com os nomes antigos e sobrescreve variáveis que já existam com o mesmo nome.
::v saveRDS() e readRDS()
@@ data() e datasets::
::k base
::f Linguagem R · Aula 12
::o Carregam as bases de dados que já vêm com o R (mtcars, iris, airquality…), ótimas para praticar.
::s
data()                    # lista todas
data("mtcars")            # carrega com o nome original
x <- datasets::mtcars     # carrega com o nome que você quiser
?airquality               # explica as colunas
::p mtcars | 32 carros, 11 variáveis (consumo mpg, cilindros cyl, potência hp…).
::p iris | 150 flores de 3 espécies, medidas de pétalas e sépalas.
::p airquality | qualidade do ar em Nova York (1973), com NA em Ozone e Solar.R.
::p starwars | personagens de Star Wars (vem com o pacote dplyr).
::e
data("iris")
nrow(iris)
table(iris$Species)
::r
[1] 150

    setosa versicolor  virginica
        50         50         50
::a Se você alterar mtcars e quiser a original de volta: rm(mtcars) ou mtcars <- datasets::mtcars.
