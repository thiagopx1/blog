<template id="t-start"><h2>Como usar este guia</h2>
<div class="card">
<h3>As quatro abas</h3>
<ul>
<li><b>💡 Conceitos</b>: a teoria da Estatística Descritiva (média, mediana, desvio padrão, quartis…) e da Análise Estatística (probabilidade, distribuições, intervalos de confiança, testes de hipóteses) em forma de <b>trilha de lições interativas</b>: cada conceito começa com uma pergunta para você dar um palpite, tem missões para cumprir mexendo nas figuras e exercícios com correção na hora. Você ganha pontos (XP), acompanha o progresso e pode fazer uma <b>revisão rápida</b> com as perguntas que mais errou. O botão “📖 Ler” abre a explicação completa, com analogias e exemplos resolvidos.</li>
<li><b>📘 Dicionário</b>: todos os comandos do curso, separados por assunto. Clique em qualquer linha para abrir os detalhes.</li>
<li><b>🧩 Problemas e soluções</b>: os exercícios das listas e gabaritos, resolvidos e explicados linha a linha.</li>
<li><b>📖 Glossário</b>: o significado das palavras técnicas (vetor, argumento, NA, chave primária…).</li>
<li>Os botões <b>R</b> e <b>SQL</b> trocam a linguagem. A <b>busca</b> procura em tudo (nome, explicação, exemplos) e ignora acentos: experimente "media", "juntar", "texto", "NA".</li>
</ul>
</div>
<div class="card">
<h3>O que tem em cada "Ver detalhes"</h3>
<ol>
<li><b>O que faz</b>, em uma frase, e um quadro 💡 com uma comparação do dia a dia e quando usar.</li>
<li><b>Como se escreve</b>: o "molde" do comando. As palavras em português são as partes que você troca pelos seus dados.</li>
<li><b>Peça por peça</b>: cada parte do molde explicada.</li>
<li><b>Exemplo para copiar</b> (botão 📋) e <b>o que aparece no Console</b> quando você roda.</li>
<li><b>⚠️ Cuidado</b>: os erros mais comuns com aquele comando.</li>
<li><b>🔗 Veja também</b>: comandos parecidos ou que costumam andar juntos (clique para pular até eles).</li>
</ol>
<p>No topo de cada detalhe aparece se o comando já vem no R (<i>R base</i>) ou se precisa de <code>library(pacote)</code>, e de qual aula ele veio. Dentro dos detalhes, as setas ← → do teclado passam para o comando anterior/seguinte e Esc fecha.</p>
</div>

<h2>O RStudio em 1 minuto</h2>
<div class="card">
<h3>Os quatro painéis</h3>
<ul>
<li><b>Script</b> (em cima, à esquerda): onde você escreve e salva o código (.R ou .Rmd). Nada roda sozinho aqui.</li>
<li><b>Console</b> (embaixo, à esquerda): onde o código roda e as respostas aparecem.</li>
<li><b>Environment</b> (em cima, à direita): as variáveis e tabelas que existem na memória.</li>
<li><b>Files / Plots / Packages / Help</b> (embaixo, à direita): arquivos da pasta, gráficos, pacotes e a ajuda.</li>
</ul>
<h3>Atalhos que valem ouro</h3>
<ul>
<li><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span>: roda a linha onde está o cursor (ou o trecho selecionado).</li>
<li><span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">Enter</span>: roda o script inteiro.</li>
<li><span class="kbd">Alt</span> + <span class="kbd">-</span>: escreve a seta <code>&lt;-</code>. &nbsp; <span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">M</span>: escreve o pipe <code>%&gt;%</code>.</li>
<li><span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">C</span>: comenta/descomenta as linhas selecionadas. &nbsp; <span class="kbd">Ctrl</span> + <span class="kbd">Alt</span> + <span class="kbd">I</span>: novo chunk no .Rmd.</li>
<li><span class="kbd">Tab</span>: completa nomes de funções, variáveis e arquivos. &nbsp; <span class="kbd">Esc</span>: cancela um comando travado ou incompleto.</li>
</ul>
<h3>Lendo o Console</h3>
<ul>
<li><code>&gt;</code> no começo da linha: o R está pronto para receber um comando.</li>
<li><code>+</code> no começo da linha: o comando anterior ficou incompleto (faltou fechar um parêntese, uma aspa ou uma chave). Complete ou aperte Esc.</li>
<li><code>[1]</code> antes do resultado: só indica a posição do primeiro valor mostrado naquela linha; não faz parte do resultado.</li>
</ul>
</div>

<h2>Anatomia de um comando</h2>
<div class="card">
<pre>media_turma &lt;- mean(notas, na.rm = TRUE)
<span class="cm">    (1)         (2)   (3)      (4)</span></pre>
<ol>
<li><b>media_turma</b>: o nome da variável que vai guardar o resultado (opcional; sem ele, o resultado só aparece no Console).</li>
<li><b>mean</b>: o nome da função (o "verbo": calcular a média).</li>
<li><b>notas</b>: o primeiro argumento, o dado em que a função vai trabalhar.</li>
<li><b>na.rm = TRUE</b>: um argumento com nome, que ajusta o comportamento (aqui: "ignore os NA").</li>
</ol>
<p>Parênteses sempre abrem e fecham em pares; vírgulas separam argumentos; textos ficam entre aspas; nomes de variáveis e colunas, não.</p>
</div>

<h2>As mensagens de erro mais comuns</h2>
<div class="card">
<ul>
<li><code>Error: object 'x' not found</code>: a variável não existe. Você rodou a linha que a cria? O nome está escrito igual (maiúsculas importam)?</li>
<li><code>could not find function "filter"</code>: faltou carregar o pacote (<code>library(dplyr)</code>) ou o nome da função está errado.</li>
<li><code>there is no package called 'xxx'</code>: o pacote não está instalado. Rode <code>install.packages("xxx")</code>.</li>
<li><code>unexpected symbol</code> / <code>unexpected ','</code> / <code>unexpected ')'</code>: erro de digitação: vírgula sobrando ou faltando, parêntese ou aspas sem par.</li>
<li><code>non-numeric argument to binary operator</code>: tentou fazer conta com texto. Converta com <code>as.numeric()</code>.</li>
<li><code>cannot open file 'x.csv': No such file or directory</code>: o R não achou o arquivo. Confira <code>getwd()</code> e <code>list.files()</code>.</li>
<li><code>Warning: NAs introduced by coercion</code>: <b>aviso</b>, não erro. Alguns textos não viraram número e se tornaram NA.</li>
<li>SQL: <code>no such table</code> (nome da tabela errado ou banco errado), <code>no such column</code> (coluna digitada errada), <code>ambiguous column name</code> (coluna existe nas duas tabelas do JOIN: use o apelido, ex.: <code>p.nome</code>).</li>
</ul>
</div>

<h2>Roteiro para qualquer base nova</h2>
<div class="card">
<ol>
<li><b>Achar o arquivo</b>: <code>getwd()</code>, <code>file.exists("arquivo.csv")</code>.</li>
<li><b>Importar</b>: <code>dados &lt;- read.csv("arquivo.csv")</code> (ou <code>read.csv2</code>, <code>read_excel</code>).</li>
<li><b>Conferir</b>: <code>head(dados)</code>, <code>dim(dados)</code>, <code>str(dados)</code>.</li>
<li><b>Diagnosticar</b>: <code>summary(dados)</code>, <code>colSums(is.na(dados))</code>, <code>skim(dados)</code>, <code>count(dados, coluna)</code>.</li>
<li><b>Limpar</b> (documentando cada decisão com #): converter tipos, excluir inválidos, tratar NA, remover duplicatas.</li>
<li><b>Criar variáveis</b>: <code>mutate()</code> com <code>if_else()</code> e <code>case_when()</code>.</li>
<li><b>Analisar</b>: <code>group_by()</code> + <code>summarise()</code>, gráficos, ou SQL com <code>dbGetQuery()</code>.</li>
<li><b>Salvar</b>: <code>saveRDS(dados, "base_tratada.rds")</code>.</li>
</ol>
</div>

<script>
/* ===== Conceitos: ferramentas comuns ===== */
const NS='http://www.w3.org/2000/svg';
function S(tag,at,par){const e=document.createElementNS(NS,tag);for(const k in (at||{}))e.setAttribute(k,at[k]);if(par)par.appendChild(e);return e}
function X(tag,cls,html,par){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;if(par)par.appendChild(e);return e}
const fm=(x,d=2)=>{if(!isFinite(x))return '–';return Number(x.toFixed(d)).toString().replace('.',',')};

function mk(el,title){el.innerHTML='';const b=X('div','vh','🎮 '+title,el);const c=X('div','vctl','',el);const s=X('div','vsvg','',el);const r=X('div','vro','',el);return{c,s,r}}
function btn(par,txt,fn){const b=X('button','vb',txt,par);b.onclick=fn;return b}
function sl(par,label,min,max,val,step,fn){const w=X('label','vsl',label+' ',par);const i=X('input','',null,w);i.type='range';i.min=min;i.max=max;i.step=step;i.value=val;const o=X('b','',String(val).replace('.',','),w);i.oninput=()=>{o.textContent=String(i.value).replace('.',',');fn(+i.value)};return i}
function nums(t){return (t.match(/-?\d+(?:[.,]\d+)?/g)||[]).map(s=>+s.replace(',','.'))}
function mkSvg(par,h){const s=S('svg',{viewBox:'0 0 640 '+h,width:'100%',style:'display:block;touch-action:none'});par.appendChild(s);return s}
function axis(svg,x0,x1,y,min,max,step,px){ // eixo horizontal com marcas

}

/* ===== Motor 1: pontos arrastáveis numa reta numérica ===== */
function DotEngine(el,o){
  const {c,s,r}=mk(el,o.title||'Arraste os pontos');

    const cnt={},idx=pts.map((v,i)=>({v,i})).sort((a,b)=>a.v-b.v||a.i-b.i);
    const m=mean(pts),md=median(pts),L2=o.layers;
    if(L2.includes('dev'))pts.forEach((v,i)=>{S('line',{x1:px(v),x2:px(m),y1:base-14,y2:base-14,stroke:v>=m?'#ff9f43':'#4aa3ff','stroke-width':1.5,'stroke-dasharray':'3 3',opacity:.8},svg)});
    if(L2.includes('range')&&pts.length){const a=Math.min(...pts),b=Math.max(...pts);S('rect',{x:px(a),y:base-70,width:Math.max(px(b)-px(a),1),height:6,rx:3,fill:'#ffd166',opacity:.9},svg);S('line',{x1:px(a),x2:px(a),y1:base-76,y2:base,stroke:'#ffd166','stroke-dasharray':'3 3'},svg);S('line',{x1:px(b),x2:px(b),y1:base-76,y2:base,stroke:'#ffd166','stroke-dasharray':'3 3'},svg);const t=S('text',{x:(px(a)+px(b))/2,y:base-80,'text-anchor':'middle',fill:'#ffd166'},svg);t.textContent='amplitude = '+fm(b-a)}
    if(L2.includes('median')){S('line',{x1:px(md),x2:px(md),y1:base-110,y2:base+2,stroke:'#4aa3ff','stroke-width':2,'stroke-dasharray':'5 3'},svg);const t=S('text',{x:px(md),y:base-114,'text-anchor':'middle',fill:'#4aa3ff'},svg);t.textContent='mediana'}
    idx.forEach(({v,i})=>{cnt[v]=(cnt[v]||0)+1;const cy=base-10-(cnt[v]-1)*15;const pd=e=>{drag=i;svg.setPointerCapture(e.pointerId);e.preventDefault();render()};S('circle',{cx:px(v),cy:cy,r:22,fill:'transparent',style:'cursor:grab'},svg).addEventListener('pointerdown',pd);const ci=S('circle',{cx:px(v),cy:cy,r:7,fill:i===drag?'#ffd166':'#7ee07e',stroke:'#0b0d13','stroke-width':1.5,style:'cursor:grab'},svg);ci.addEventListener('pointerdown',pd)});
    if(L2.includes('mean')){const x=px(m);S('polygon',{points:`${x},${base+3} ${x-9},${base+22} ${x+9},${base+22}`,fill:'#ff6b6b'},svg);const t=S('text',{x:x,y:base+38,'text-anchor':'middle',fill:'#ff6b6b'},svg);t.textContent='média';S('line',{x1:x,x2:x,y1:base-100,y2:base,stroke:'#ff6b6b','stroke-width':2},svg)}
    if(L2.includes('box')&&pts.length>1){
      const q1=q2(pts,.25),q3=q2(pts,.75),di=q3-q1,lo=q1-1.5*di,hi=q3+1.5*di,inn=pts.filter(v=>v>=lo&&v<=hi),wl=Math.min(...inn),wh=Math.max(...inn),y=40,h=34;
      S('rect',{x:px(lo),y:y-4,width:Math.max(px(hi)-px(lo),1),height:h+8,fill:'none',stroke:'#6b7389','stroke-dasharray':'2 4'},svg);
      S('line',{x1:px(wl),x2:px(q1),y1:y+h/2,y2:y+h/2,stroke:'#cfd5e3','stroke-width':2},svg);S('line',{x1:px(q3),x2:px(wh),y1:y+h/2,y2:y+h/2,stroke:'#cfd5e3','stroke-width':2},svg);
      S('line',{x1:px(wl),x2:px(wl),y1:y+8,y2:y+h-8,stroke:'#cfd5e3','stroke-width':2},svg);S('line',{x1:px(wh),x2:px(wh),y1:y+8,y2:y+h-8,stroke:'#cfd5e3','stroke-width':2},svg);
      S('rect',{x:px(q1),y:y,width:Math.max(px(q3)-px(q1),1),height:h,fill:'#4aa3ff55',stroke:'#4aa3ff','stroke-width':2},svg);
      S('line',{x1:px(q2(pts,.5)),x2:px(q2(pts,.5)),y1:y,y2:y+h,stroke:'#ffd166','stroke-width':3},svg);
      pts.filter(v=>v<lo||v>hi).forEach(v=>S('circle',{cx:px(v),cy:y+h/2,r:5,fill:'none',stroke:'#ff6b6b','stroke-width':2},svg));
      const t=S('text',{x:L,y:18,fill:'#9aa1b4'},svg);t.textContent='tracejado = limites Q1−1,5·DI e Q3+1,5·DI';
    }
    {const q1=q2(pts,.25),q3=q2(pts,.75),di=q3-q1;el.st={pts:pts.slice(),n:pts.length,mean:m,median:md,min:Math.min(...pts),max:Math.max(...pts),range:Math.max(...pts)-Math.min(...pts),sd:sdev(pts),vr:vari(pts),q1,q3,di,out:pts.filter(v=>v<q1-1.5*di||v>q3+1.5*di).length}}

/* ===== Motor 2: histograma ===== */
function bins(data,edges){const c=edges.slice(1).map(()=>0);data.forEach(v=>{for(let k=0;k<c.length;k++){if(v>=edges[k]&&(v<edges[k+1]||(k===c.length-1&&v<=edges[k+1]))){c[k]++;break}}});return c}
function evenEdges(a,b,k){const o=[];for(let i=0;i<=k;i++)o.push(a+(b-a)*i/k);return o}
function drawHist(svg,edges,cnt,n,mode,opt){
  opt=opt||{};const W=640,L=48,R=620,T=14,B=190,lo=edges[0],hi=edges[edges.length-1],px=v=>L+(R-L)*(v-lo)/(hi-lo);
  const hs=cnt.map((c,i)=>mode==='dens'?c/(n*(edges[i+1]-edges[i])):c),mx=(mode==='dens'?Math.max(...hs)*1.15:Math.ceil(Math.max(...hs)*1.1/4)*4)||1,py=v=>B-(B-T)*v/mx;
  svg.innerHTML='';
  for(let i=0;i<=4;i++){const v=mx*i/4,y=py(v);S('line',{x1:L,x2:R,y1:y,y2:y,stroke:'#2a2f3d'},svg);const t=S('text',{x:L-6,y:y+4,'text-anchor':'end'},svg);t.textContent=mode==='dens'?v.toExponential(1).replace('.',','):fm(v,v<10?1:0)}
  hs.forEach((h,i)=>{const x=px(edges[i]),w=px(edges[i+1])-x;const rc=S('rect',{x:x+1,y:py(h),width:Math.max(w-2,1),height:B-py(h),fill:opt.sel===i?'#ffd166':'#4aa3ffcc',stroke:'#0b0d13',style:'cursor:pointer'},svg);rc.addEventListener('click',()=>opt.onsel&&opt.onsel(i));if(cnt.length<=14){const t=S('text',{x:x+w/2,y:py(h)-4,'text-anchor':'middle'},svg);t.textContent=mode==='dens'?'':cnt[i]}});
  S('line',{x1:L,x2:R,y1:B,y2:B,stroke:'#6b7389'},svg);
  const step=(hi-lo)/ (cnt.length>10?5:cnt.length);
  edges.forEach((e,i)=>{if(cnt.length>10&&i%2)return;const t=S('text',{x:px(e),y:B+16,'text-anchor':'middle'},svg);t.textContent=fm(e,Math.abs(e)<10?1:0)});
  return {px,py,mx};
}

const W={};

/* ---- Fundamentos ---- */
W.amostra=function(el){
  const {c,s,r}=mk(el,'Sorteie amostras de uma população');
  const N=200,rn=rng(3),pop=[];for(let i=0;i<N;i++)pop.push(i<70?1:0);
  for(let i=N-1;i>0;i--){const j=Math.floor(rn()*(i+1));[pop[i],pop[j]]=[pop[j],pop[i]]}
  const svg=mkSvg(s,150);let sel=new Set(),hist=[],n=30;
  const dots=pop.map((v,i)=>{const x=30+(i%40)*14.5,y=18+Math.floor(i/40)*26;return S('circle',{cx:x,cy:y,r:5.5,fill:v?'#ff7b7b':'#6b7389'},svg)});
  function paint(){dots.forEach((d,i)=>{d.setAttribute('stroke',sel.has(i)?'#ffd166':'none');d.setAttribute('stroke-width',sel.has(i)?3:0);d.setAttribute('opacity',sel.size&&!sel.has(i)?.35:1)})}
  function note(){el.st={n:sel.size,pct:sel.size?[...sel].filter(i=>pop[i]).length/sel.size*100:null,draws:hist.length,sizes:hist.map(h=>h.n)};r.innerHTML=`<b>População:</b> 200 pessoas, 70 fumantes (vermelhas) = <b>35%</b> (o valor “verdadeiro”, que normalmente NÃO conhecemos).<br>`+(sel.size?`<b>Esta amostra (n = ${sel.size}):</b> ${[...sel].filter(i=>pop[i]).length} fumantes = <b>${fm([...sel].filter(i=>pop[i]).length/sel.size*100,1)}%</b>.<br>`:'')+(hist.length?`<b>Últimas amostras:</b> ${hist.slice(-8).map(h=>h.n+'→'+fm(h.p,0)+'%').join(' · ')}<br><small>Repare: amostras maiores costumam ficar mais perto de 35%. Cada sorteio dá um resultado um pouco diferente.</small>`:'<small>Clique em “Sortear” várias vezes.</small>')}
  [10,30,80].forEach(k=>btn(c,'n = '+k,()=>{n=k;[...c.querySelectorAll('.vb')].forEach(b=>b.classList.toggle('on',b.textContent==='n = '+k))}));
  c.querySelectorAll('.vb')[1].classList.add('on');
  btn(c,'🎲 Sortear amostra',()=>{const idx=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]]}sel=new Set(idx.slice(0,n));hist.push({n,p:[...sel].filter(i=>pop[i]).length/n*100});paint();note()});
  btn(c,'Limpar',()=>{sel=new Set();hist=[];paint();note()});
  paint();note();
};

W.tipos=function(el){
  const {c,s,r}=mk(el,'Clique numa variável e veja onde ela se encaixa');
  const V=[['Sexo do bebê','qual','nom'],['Cor dos olhos','qual','nom'],['Escolaridade da mãe','qual','ord'],['Faixa de renda (baixa/média/alta)','qual','ord'],['Número de filhos','quant','disc'],['Apgar (0 a 10)','quant','disc'],['Peso ao nascer (g)','quant','cont'],['Altura (cm)','quant','cont']];
  s.innerHTML=`<div class="tr"><div class="tn" id="t-root">Variável</div><div class="trk"><div class="tn" id="t-qual">Qualitativa<br><small>(categorias)</small></div><div class="trk2"><div class="tn" id="t-nom">Nominal<br><small>sem ordem</small></div><div class="tn" id="t-ord">Ordinal<br><small>tem ordem</small></div></div></div><div class="trk"><div class="tn" id="t-quant">Quantitativa<br><small>(números)</small></div><div class="trk2"><div class="tn" id="t-disc">Discreta<br><small>contagem (inteiros)</small></div><div class="tn" id="t-cont">Contínua<br><small>medida (qualquer valor)</small></div></div></div></div>`;

  r.innerHTML='<small>Dica: pergunte “faz sentido calcular uma média disso?”. Se sim, é quantitativa.</small>';

W.sigma=function(el){
  const {c,s,r}=mk(el,'Experimente a notação de somatório');
  const inp=X('input','vin','',c);inp.value='3, 6, 5, 7, 9';inp.style.flex='1 1 200px';

W.ogiva=function(el){
  const {c,s,r}=mk(el,'Ogiva: quantos valores há “até aqui”?');
  const svg=mkSvg(s,215),lo=2000,hi=4400,e=evenEdges(lo,hi,6),cn=bins(PESOS.filter(v=>v>=lo&&v<=hi),e),n=sum(cn);let x0=3200;
  const cum=[0];cn.forEach(v=>cum.push(cum[cum.length-1]+v/n*100));
  function at(x){for(let i=0;i<6;i++)if(x<=e[i+1])return cum[i]+(cum[i+1]-cum[i])*(x-e[i])/(e[i+1]-e[i]);return 100}
  sl(c,'Peso (g):',lo,hi,x0,50,v=>{x0=v;go()});
  function go(){svg.innerHTML='';const L=48,R=620,T=14,B=190,px=v=>L+(R-L)*(v-lo)/(hi-lo),py=v=>B-(B-T)*v/100;
    [0,25,50,75,100].forEach(v=>{S('line',{x1:L,x2:R,y1:py(v),y2:py(v),stroke:'#2a2f3d'},svg);const t=S('text',{x:L-6,y:py(v)+4,'text-anchor':'end'},svg);t.textContent=v+'%'});
    e.forEach(v=>{const t=S('text',{x:px(v),y:B+16,'text-anchor':'middle'},svg);t.textContent=v});
    S('polyline',{points:e.map((v,i)=>px(v)+','+py(cum[i])).join(' '),fill:'none',stroke:'#4aa3ff','stroke-width':3},svg);
    e.forEach((v,i)=>S('circle',{cx:px(v),cy:py(cum[i]),r:4,fill:'#4aa3ff'},svg));
    const a=at(x0);el.st={x:x0,pct:a};S('line',{x1:px(x0),x2:px(x0),y1:py(0),y2:py(a),stroke:'#ffd166','stroke-dasharray':'4 3'},svg);S('line',{x1:L,x2:px(x0),y1:py(a),y2:py(a),stroke:'#ffd166','stroke-dasharray':'4 3'},svg);S('circle',{cx:px(x0),cy:py(a),r:6,fill:'#ffd166'},svg);
    r.innerHTML=`Aproximadamente <b>${fm(at(x0),1)}%</b> dos bebês pesam <b>até ${x0} g</b>.<br><small>A ogiva só sobe (nunca desce) e termina em 100%. Ela é a frequência acumulada desenhada como linha: ótima para responder “qual percentual está abaixo de X?”.</small>`}
  go();
};

/* ===== Módulo II: probabilidade e inferência ===== */
function lgam(x){const g=7,c=[0.99999999999980993,676.5203681218851,-1259.1392167224028,771.32342877765313,-176.61502916214059,12.507343278686905,-0.13857109526572012,9.9843695780195716e-6,1.5056327351493116e-7];if(x<0.5)return Math.log(Math.PI/Math.abs(Math.sin(Math.PI*x)))-lgam(1-x);x-=1;let a=c[0];const t=x+g+0.5;for(let i=1;i<9;i++)a+=c[i]/(x+i);return 0.5*Math.log(2*Math.PI)+(x+0.5)*Math.log(t)-t+Math.log(a)}
const dnormJ=(x,m=0,s=1)=>Math.exp(-0.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
const pnormJ=(x,m=0,s=1)=>0.5*(1+erf((x-m)/(s*Math.SQRT2)));
function qnormJ(p,m=0,s=1){let lo=-10,hi=10;for(let i=0;i<80;i++){const md=(lo+hi)/2;if(pnormJ(md)<p)lo=md;else hi=md}return m+s*(lo+hi)/2}
const dtJ=(x,v)=>Math.exp(lgam((v+1)/2)-lgam(v/2)-0.5*Math.log(v*Math.PI)-(v+1)/2*Math.log(1+x*x/v));
const dchiJ=(x,k)=>x<=0?0:Math.exp((k/2-1)*Math.log(x)-x/2-k/2*Math.log(2)-lgam(k/2));
function cdfNum(f,lo,x,n){n=n||600;if(x<=lo)return 0;const h=(x-lo)/n;let s=f(lo)+f(x);for(let i=1;i<n;i++)s+=f(lo+i*h)*(i%2?4:2);return s*h/3}
function qNum(f,lo,hi,p){let a=lo,b=hi;for(let i=0;i<60;i++){const m=(a+b)/2;if(cdfNum(f,lo,m)<p)a=m;else b=m}return (a+b)/2}
const ptJ=(x,v)=>x>=0?0.5+cdfNum(t=>dtJ(t,v),0,x):0.5-cdfNum(t=>dtJ(t,v),0,-x);
const qtJ=(p,v)=>p>=0.5?qNum(t=>dtJ(t,v),0,60,p-0.5):-qNum(t=>dtJ(t,v),0,60,0.5-p);
const pchiJ=(x,k)=>cdfNum(t=>dchiJ(t,k),1e-9,x,1000);
const qchiJ=(p,k)=>qNum(t=>dchiJ(t,k),1e-9,k+12*Math.sqrt(2*k)+20,p);
function lchoose(n,k){return lgam(n+1)-lgam(k+1)-lgam(n-k+1)}
const dbinomJ=(k,n,p)=>(p<=0?(k===0?1:0):p>=1?(k===n?1:0):Math.exp(lchoose(n,k)+k*Math.log(p)+(n-k)*Math.log(1-p)));
const dpoisJ=(k,l)=>Math.exp(-l+k*Math.log(l)-lgam(k+1));
function curveD(f,x0,x1,px,py,n){n=n||200;let d='';for(let i=0;i<=n;i++){const x=x0+(x1-x0)*i/n;d+=(i?' L':'M')+px(x).toFixed(1)+','+py(f(x)).toFixed(1)}return d}
function areaD(f,a,b,px,py,y0,n){n=n||120;let d=`M${px(a).toFixed(1)},${y0}`;for(let i=0;i<=n;i++){const x=a+(b-a)*i/n;d+=` L${px(x).toFixed(1)},${py(f(x)).toFixed(1)}`}return d+` L${px(b).toFixed(1)},${y0} Z`}
function tx(svg,x,y,t,at){const e=S('text',Object.assign({x,y},at||{}),svg);e.textContent=t;return e}
const nf=(x,d)=>fm(x,d===undefined?4:d);

  s.innerHTML='';const ra=row('A',A,'a'),rb=row('B',B,'b');

    el.st={A:[...A].sort(),B:[...B].sort(),nA:A.size,nB:B.size,nU:U.size,nI:I.size,ind:Math.abs(A.size*B.size/36-I.size/6)<1e-9};const P=x=>x.size/6,st=x=>'{'+[...x].sort().join(', ')+'}';
    let h=`A = ${st(A)} · B = ${st(B)}<br>`;

    if(mode==='ind'){const pa=P(A)*P(B),ok=Math.abs(pa-P(I))<1e-9;h+=`P(A ∩ B) = ${fr(I)} = ${fm(P(I),3)}<br>P(A) · P(B) = ${fr(A)} · ${fr(B)} = ${fm(pa,3)}<br>${ok?'✅ Iguais: A e B são <b>independentes</b> (saber que um ocorreu não muda a chance do outro).':'❌ Diferentes: A e B são <b>dependentes</b>.'}${!I.size&&A.size&&B.size?'<br><small>Disjuntos com probabilidade positiva nunca são independentes: se um ocorreu, o outro certamente não ocorreu.</small>':''}`}

/* ---- Teorema de Bayes: teste diagnóstico ---- */
W.bayes=function(el){
  const {c,s,r}=mk(el,'Teste diagnóstico: o resultado deu positivo. E agora?');
  let prev=0.02,sens=0.95,esp=0.90;const svg=mkSvg(s,190);
  sl(c,'Doença na população (%):',0.5,50,2,0.5,v=>{prev=v/100;go()});sl(c,'Sensibilidade P(+|doente) %:',50,100,95,1,v=>{sens=v/100;go()});sl(c,'Especificidade P(−|saudável) %:',50,100,90,1,v=>{esp=v/100;go()});
  function go(){svg.innerHTML='';const N=1000,d=Math.round(N*prev),vp=Math.round(d*sens),fn=d-vp,h=N-d,fp=Math.round(h*(1-esp)),vn=h-fp;
    const cols=[...Array(vp).fill('#ff6b6b'),...Array(fn).fill('#7a2e2e'),...Array(fp).fill('#ffd166'),...Array(vn).fill('#2a3348')];
    cols.forEach((col,i)=>S('rect',{x:10+(i%50)*12.4,y:6+Math.floor(i/50)*8.6,width:10,height:7,fill:col},svg));
    const pp=vp+fp;el.st={prev,sens,esp,post:sens*prev/(sens*prev+(1-esp)*(1-prev))};
    r.innerHTML=`Em 1000 pessoas: <span style="color:#ff6b6b">■</span> ${vp} doentes com teste + · <span style="color:#a55">■</span> ${fn} doentes com teste − · <span style="color:#ffd166">■</span> ${fp} saudáveis com teste + (falso positivo) · <span style="color:#6b7389">■</span> ${vn} saudáveis com teste −<br>Deram positivo: ${vp} + ${fp} = ${pp}. Destes, só ${vp} estão doentes.<br><b>P(doente | +)</b> = P(+|D)·P(D) ÷ [P(+|D)·P(D) + P(+|S)·P(S)] = ${fm(sens,2)}·${fm(prev,3)} ÷ (${fm(sens,2)}·${fm(prev,3)} + ${fm(1-esp,2)}·${fm(1-prev,3)}) = <b>${fm(sens*prev/(sens*prev+(1-esp)*(1-prev))*100,1)}%</b><br><small>Com doença rara, a maioria dos positivos pode ser falso positivo. Aumente a prevalência e veja a chance subir: é o "a priori" mudando o "a posteriori".</small>`}
  go();
};

/* ---- Monty Hall ---- */
W.monty=function(el){
  const {c,s,r}=mk(el,'Jogue: escolha uma porta');
  let carro,esc,aberta,fase,placar={fica:[0,0],troca:[0,0]},manual=0;
  const portas=X('div','vctl','',s);const msg=X('div','',null,s);
  function novo(){carro=1+Math.floor(Math.random()*3);esc=null;aberta=null;fase='escolher';draw()}
  function draw(){portas.innerHTML='';for(let p=1;p<=3;p++){let t='🚪 '+p;if(fase==='fim'||aberta===p)t=(p===carro?'🚗':'🐐')+' '+p;const b=btn(portas,t,()=>clique(p));b.style.fontSize='22px';b.style.padding='12px 22px';if(p===esc)b.classList.add('on');if(aberta===p)b.disabled=true}
    msg.innerHTML=fase==='escolher'?'Escolha uma porta.':fase==='decidir'?`O apresentador abriu a porta ${aberta}: tem um bode. Quer ficar com a ${esc} ou trocar?`:'';
    if(fase==='decidir'){const w=X('div','vctl','',msg);btn(w,'Ficar com a porta '+esc,()=>fim('fica'));btn(w,'Trocar de porta',()=>fim('troca'))}
    if(fase==='fim'){btn(msg,'Jogar de novo',novo)}
    el.st={fica:placar.fica.slice(),troca:placar.troca.slice(),fase,jogos:placar.fica[1]+placar.troca[1],manual};const pc=k=>placar[k][1]?fm(placar[k][0]/placar[k][1]*100,1)+'%':'–';
    r.innerHTML=`<b>Placar</b> · ficando: ${placar.fica[0]} vitórias em ${placar.fica[1]} (${pc('fica')}) · trocando: ${placar.troca[0]} em ${placar.troca[1]} (${pc('troca')})<br><small>Teoria: ficar ganha 1/3 das vezes; trocar ganha 2/3. Jogue várias vezes ou use os botões de simulação.</small>`}
  function clique(p){if(fase!=='escolher')return;esc=p;const op=[1,2,3].filter(x=>x!==esc&&x!==carro);aberta=op[Math.floor(Math.random()*op.length)];fase='decidir';draw()}
  function fim(k){const final=k==='fica'?esc:[1,2,3].find(x=>x!==esc&&x!==aberta);const g=final===carro;manual++;placar[k][1]++;if(g)placar[k][0]++;fase='fim';draw();msg.insertAdjacentHTML('afterbegin',`<b>${g?'🎉 Você ganhou o carro!':'🐐 Você levou um bode.'}</b> `)}
  btn(c,'Simular 1000 jogos ficando',()=>{for(let i=0;i<1000;i++){const ca=1+Math.floor(Math.random()*3),e=1+Math.floor(Math.random()*3);placar.fica[1]++;if(e===ca)placar.fica[0]++}draw()});
  btn(c,'Simular 1000 jogos trocando',()=>{for(let i=0;i<1000;i++){const ca=1+Math.floor(Math.random()*3),e=1+Math.floor(Math.random()*3);placar.troca[1]++;if(e!==ca)placar.troca[0]++}draw()});
  btn(c,'Zerar placar',()=>{placar={fica:[0,0],troca:[0,0]};draw()});
  novo();
};

/* ---- Motor de distribuições discretas (binomial e Poisson) ---- */
function DiscDist(el,o){
  const {c,s,r}=mk(el,o.title);let mode=o.mode||'eq',k=o.k;const P=o.params;
  Object.keys(P).forEach(key=>{const q=P[key];sl(c,q.label,q.min,q.max,q.val,q.step,v=>{q.val=v;go()})});
  const ks=sl(c,'k:',0,o.kmax,k,1,v=>{k=v;go()});
  const mb=X('div','vctl','',c.parentNode);c.parentNode.insertBefore(mb,s);
  [['eq','P(X = k)'],['le','P(X ≤ k)  (acumulada)'],['ge','P(X ≥ k)']].forEach(([m,l])=>btn(mb,l,()=>{mode=m;go()}));
  const svg=mkSvg(s,200);
  function go(){const xmax=o.xmax(P);ks.max=xmax;if(k>xmax){k=xmax}svg.innerHTML='';[...mb.children].forEach((b,i)=>b.classList.toggle('on',['eq','le','ge'][i]===mode));
    const ps=[];for(let x=0;x<=xmax;x++)ps.push(o.pmf(x,P));const mx=Math.max(...ps)*1.15,L=40,R=620,B=170,w=(R-L)/(xmax+1);
    let tot=0;ps.forEach((p,x)=>{const sel=mode==='eq'?x===k:mode==='le'?x<=k:x>=k;if(sel)tot+=p;const h=(B-12)*p/mx;S('rect',{x:L+x*w+w*0.12,y:B-h,width:w*0.76,height:h,fill:sel?'#ffd166':'#2a9d8f'},svg);if(xmax<=25||x%Math.ceil(xmax/25)===0)tx(svg,L+x*w+w/2,B+15,String(x),{'text-anchor':'middle'})});
    if(o.acum&&mode==='le'){let acc=0,d='';ps.forEach((p,x)=>{acc+=p;const y=B-(B-12)*acc;d+=(d?' L':'M')+(L+x*w).toFixed(1)+','+y.toFixed(1)+' L'+(L+(x+1)*w).toFixed(1)+','+y.toFixed(1)});S('path',{d,fill:'none',stroke:'#ff6b6b','stroke-width':2},svg);tx(svg,R,20,'linha vermelha: F(x) = P(X ≤ x), de 0 a 1',{'text-anchor':'end',fill:'#ff6b6b'})}
    el.st={mode,k,tot,par:Object.fromEntries(Object.keys(P).map(q=>[q,P[q].val]))};const lbl={eq:`P(X = ${k})`,le:`P(X ≤ ${k})`,ge:`P(X ≥ ${k})`}[mode];
    r.innerHTML=`<b>${lbl} = ${nf(tot)}</b> · No R: <code>${o.code(mode,k,P)}</code><br>${o.info(P)}`}
  go();
}

  go();
};

W.erros=function(el){
  const {c,s,r}=mk(el,'Erro tipo I (α) e erro tipo II (β): um puxa o outro');
  let alfa=0.05,ef=2;const svg=mkSvg(s,210);

  function go(){svg.innerHTML='';const L=30,R=620,B=165,px=x=>L+(R-L)*(x+3.5)/(ef+7),py=y=>B-140*y/dnormJ(0);const zc=qnormJ(1-alfa),f1=x=>dnormJ(x,ef,1);
    S('path',{d:areaD(dnormJ,zc,ef+3.5,px,py,B),fill:'#ff6b6b99'},svg);S('path',{d:areaD(f1,-3.5,zc,px,py,B),fill:'#ffb34788'},svg);
    S('path',{d:curveD(dnormJ,-3.5,ef+3.5,px,py),fill:'none',stroke:'#cfd5e3','stroke-width':2},svg);S('path',{d:curveD(f1,-3.5,ef+3.5,px,py),fill:'none',stroke:'#2a9d8f','stroke-width':2.5},svg);
    S('line',{x1:px(zc),x2:px(zc),y1:B,y2:14,stroke:'#ffd166','stroke-width':2,'stroke-dasharray':'5 4'},svg);S('line',{x1:L,x2:R,y1:B,y2:B,stroke:'#6b7389'},svg);
    tx(svg,px(0),py(dnormJ(0))-6,'se H0 for verdade',{'text-anchor':'middle'});tx(svg,px(ef),py(dnormJ(0))+14,'se H1 for verdade',{'text-anchor':'middle',fill:'#2a9d8f'});
    const beta=pnormJ(zc,ef,1);el.st={alfa,ef,beta,poder:1-beta};
    r.innerHTML=`<span style="color:#ff6b6b">■</span> <b>α = ${fm(alfa,2)}</b>: rejeitar H0 quando ela é verdadeira (erro tipo I) · <span style="color:#ffb347">■</span> <b>β = ${fm(beta,3)}</b>: não rejeitar H0 quando ela é falsa (erro tipo II) · poder = 1 − β = ${fm(1-beta,3)}<br><small>Diminuir α (ser mais exigente) aumenta β. Com um efeito real maior (ou uma amostra maior), as curvas se separam e β cai. Exemplo: concluir que um remédio funciona quando não funciona é tipo I; deixar de reconhecer um remédio que funciona é tipo II.</small>`}
  go();
};

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const ML=new Set(['e','r','s','x']);
function parse(txt){
  const groups=[];let g=null,e=null,f=null;
  txt.replace(/\r/g,'').split('\n').forEach(line=>{
    if(line.startsWith('@G ')){const [t,c,i]=line.slice(3).split(' | ');g={title:t.trim(),color:(c||'#4aa3ff').trim(),intro:(i||'').trim(),items:[]};groups.push(g);e=null;f=null;return}
    if(line.startsWith('@@ ')){e={name:line.slice(3).trim(),p:[],a:[],v:[]};g.items.push(e);f=null;return}
    if(!e)return;
    const m=line.match(/^::([a-z]+)\s?(.*)$/);
    if(m){f=m[1];const v=m[2];
      if(ML.has(f)){e[f]=v?[v]:[]}
      else if(f==='p'){const k=v.indexOf(' | ');e.p.push(k<0?[v,'']:[v.slice(0,k),v.slice(k+3)])}
      else if(f==='a'){e.a.push(v)}
      else if(f==='v'){e.v=v.split(' | ').map(x=>x.trim()).filter(Boolean)}
      else e[f]=v;
      return}
    if(f&&ML.has(f))e[f].push(line);
  });
  groups.forEach(g=>g.items.forEach(e=>{ML.forEach(k=>{if(e[k]){while(e[k].length&&!e[k][e[k].length-1].trim())e[k].pop();e[k]=e[k].join('\n')}});e._s=norm([e.name,e.o,e.q,e.s,e.e,e.c,e.k,e.p.map(x=>x.join(' ')).join(' '),e.a.join(' '),e.x,e.i,g.title].join(' '))}));
  return groups;
}
const D={R:parse($('d-rcmd').textContent),Q:parse($('d-qcmd').textContent)};
const P={R:parse($('d-rprob').textContent),Q:parse($('d-qprob').textContent)};

let lang='R',mode='D',cur=null;

function L(l){lang=l;$('tR').className=l=='R'?'on':'';$('tQ').className='sql'+(l=='Q'?' on':'');draw();window.scrollTo({top:0,behavior:'instant'})}
function G(x){mode=x;['S','C','D','P','G'].forEach(k=>$('n'+k).className=k==x?'on':'');$('tabs').style.display=(x=='S'||x=='G'||x=='C')?'none':'flex';draw();window.scrollTo({top:0,behavior:'instant'})}
function pkgLabel(p){
  if(!p||p==='base')return 'R base · já vem pronto';
  if(p==='SQL')return 'Linguagem SQL · roda dentro do dbGetQuery()/dbExecute()';
  if(p==='RStudio')return 'Recurso do RStudio';
  if(p==='Markdown')return 'R Markdown (.Rmd)';
  return 'Pacote '+p+' · precisa de library('+p+')';
}
function hl(code){ // destaca comentários # (R) e -- (SQL)
  return esc(code).split('\n').map(l=>{
    let i=-1,inS=false,q='';
    for(let k=0;k<l.length;k++){const ch=l[k];
      if(inS){if(ch===q)inS=false;continue}
      if(ch==='"'||ch==="'"){inS=true;q=ch;continue}
      if(ch==='#'){i=k;break}
      if(ch==='-'&&l[k+1]==='-'&&lang==='Q'){i=k;break}
    }
    return i<0?l:l.slice(0,i)+'<span class="cm">'+l.slice(i)+'</span>';
  }).join('\n');
}
function chips(groups){ $('chips').innerHTML=groups.map((g,i)=>`<a href="#g${i}" style="border-color:${g.color}55">${esc(g.title)}</a>`).join('') }

function draw(){

      if(!ws.every(w=>e._s.includes(w)))return;

      h+=`<div class="row hd"><div>Comando</div><div>Como se escreve</div><div>O que faz</div><div></div></div>`;
      f.forEach(([e,j])=>{h+=`<div class="row" onclick="O(${i},${j})"><div class="n">${esc(e.name)}${e.k&&e.k!=='base'&&e.k!=='SQL'?`<span class="pk">${esc(e.k)}</span>`:''}</div><div><code>${esc((e.s||'').split('\n')[0])}</code></div><div>${esc(e.o)}</div><button>Ver detalhes</button></div>`});
    }else{
      h+=`<div class="row pr hd"><div>Problema</div><div>Comandos usados</div><div></div></div>`;
      f.forEach(([e,j])=>{h+=`<div class="row pr" onclick="OP(${i},${j})"><div>${esc(e.name)}</div><div><code>${esc(e.c)}</code></div><button>Ver solução</button></div>`});
    }
    h+='</section>';

  $('m').innerHTML=h||'<p class="empty">Nada encontrado. Tente outra palavra (ex.: "soma", "texto", "NA", "ordenar").</p>';
}
function drawG(qv){

function cpBtn(id){return `<button class="cp" onclick="copiar('${id}',this)">📋 Copiar</button>`}
function copiar(id,b){const t=$(id).textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='✔ Copiado'},()=>{const r=document.createRange();r.selectNodeContents($(id));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selecionado: Ctrl+C'});setTimeout(()=>b.textContent='📋 Copiar',1800)}
function abrir(html,color){pararTm();LP=null;const b=$('box');b.className='';b.style.setProperty('--a',color);b.style.borderColor=color;b.innerHTML=html;$('modal').style.display='flex';b.scrollTop=0}
function fechar(){const eraL=!!LP;pararTm();LP=null;$('box').className='';$('modal').style.display='none';cur=null;if(eraL&&mode==='C')draw()}
function navBtns(i,j,list,fn){
  const prev=j>0?`${fn}(${i},${j-1})`:(i>0?`${fn}(${i-1},${list[i-1].items.length-1})`:'');
  const next=j<list[i].items.length-1?`${fn}(${i},${j+1})`:(i<list.length-1?`${fn}(${i+1},0)`:'');

}
function wrapSQL(sql){
  const t=sql.trim();if(!t)return '';

  return `${fn}(con, "\n${t.replace(/"/g,"'")}\n")`;
}

function drawC(qv){

function seeBtn(x){const c=x.startsWith('C:');return `<button class="${c?'cl':''}" onclick="ver('${esc(x).replace(/'/g,"\\'")}')">${c?'💡 '+esc(x.slice(2)):esc(x)}</button>`}

  if(e.i)h+=`<div class="lb">${++n} · Como interpretar</div><div class="ia">${esc(e.i)}</div>`;
  if(e.a.length)h+=`<div class="lb">⚠️ Cuidados e erros comuns</div><ul class="warn">${e.a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(e.v.length)h+=`<div class="lb">🔗 Veja também</div><div class="see">${e.v.map(seeBtn).join('')}</div>`;
  h+=`</div>`+navBtns(i,j,CO,'OC');
  const old=lang;lang='R';abrir(h,g.color);lang=old;
  if(e.w){try{W[e.w]($('viz'))}catch(err){$('viz').innerHTML='<p class="empty">Não foi possível carregar a figura ('+esc(err.message)+').</p>';console.error(err)}}
}
/* ===== Lições interativas (aprender fazendo) ===== */
const LES=JSON.parse($('d-les').textContent);
const LSK='guia_conceitos_v1';
let PR={};try{PR=JSON.parse(localStorage.getItem(LSK))||{}}catch(e){PR={}}
PR.done=PR.done||{};PR.xp=PR.xp||0;PR.erros=PR.erros||{};PR.dias=PR.dias||[];
let LP=null;
function salvar(){try{localStorage.setItem(LSK,JSON.stringify(PR))}catch(e){}}
const dk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function marcarDia(){const h=dk(new Date());if(!PR.dias.includes(h)){PR.dias.push(h);PR.dias=PR.dias.slice(-90)}}
function sequencia(){const set=new Set(PR.dias),d=new Date();let n=0;if(!set.has(dk(d)))d.setDate(d.getDate()-1);while(set.has(dk(d))&&n<999){n++;d.setDate(d.getDate()-1)}return n}
const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`(.+?)`/g,'<code>$1</code>');
function mistura(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function ordemC(){const o=[];CO.forEach((g,i)=>g.items.forEach((e,j)=>o.push([i,j])));return o}
function proxima(){return ordemC().find(([i,j])=>LES[CO[i].items[j].name]&&!PR.done[CO[i].items[j].name])}
function proxDepois(i,j){const o=ordemC().filter(([a,b])=>LES[CO[a].items[b].name]),k=o.findIndex(([a,b])=>a===i&&b===j),dep=o.slice(k+1).concat(o.slice(0,k));return dep.find(([a,b])=>!PR.done[CO[a].items[b].name])||o[k+1]||null}
function pararTm(){if(LP&&LP.tm){clearInterval(LP.tm);LP.tm=null}}
function abrirLP(color){const b=$('box');b.className='lp';b.style.setProperty('--a',color);b.style.borderColor=color;$('modal').style.display='flex';passo()}
function LI(i,j){
  const g=CO[i],e=g.items[j],st=LES[e.name];if(!st){OC(i,j);return}
  pararTm();const steps=[];
  st.forEach((s,k)=>{steps.push(Object.assign({key:e.name+'#'+k},s));if(k===0&&s.t==='g')steps.push({t:'idea'})});
  if(st[0].t!=='g')steps.unshift({t:'idea'});
  steps.push({t:'fim'});
  LP={rev:false,i,j,g,e,steps,k:0,xp:0,ok:0,tot:0,viz:null,tm:null};cur={t:'L',i,j};
  abrirLP(g.color);
}
function REV(){
  const pool=[];
  Object.keys(PR.done).forEach(nm=>{(LES[nm]||[]).forEach((s,k)=>{if(s.t==='q'||s.t==='n')pool.push(Object.assign({key:nm+'#'+k,c:nm},s))})});
  if(!pool.length)return;
  const fracos=mistura(pool.filter(s=>PR.erros[s.key]>0)),resto=mistura(pool.filter(s=>!(PR.erros[s.key]>0)));
  const steps=mistura(fracos.concat(resto).slice(0,5));steps.push({t:'fim'});
  pararTm();LP={rev:true,steps,k:0,xp:0,ok:0,tot:0,viz:null,tm:null,e:{name:'Revisão rápida'}};cur={t:'L'};
  abrirLP('#4cc9f0');
}
function ganha(p){if(!LP)return;LP.xp+=p;PR.xp+=p;salvar()}
function errou(key){PR.erros[key]=(PR.erros[key]||0)+1;salvar()}
function acertou(key){if(PR.erros[key]>0){PR.erros[key]--;if(!PR.erros[key])delete PR.erros[key];salvar()}}
function prox(){if(!LP)return;pararTm();LP.k++;passo()}
function rodape(cls,msg,btns){const f=$('lpf');f.className='lpf'+(cls?' '+cls:'');f.innerHTML='';X('div','msg',msg||'',f);
  btns.forEach(([t,fn,c,dis])=>{const b=X('button','bt '+(c||''),t,f);b.onclick=fn;if(dis)b.disabled=true});return f}
function rodVer(s,fn,msg){const f=rodape('',msg||'',[['Verificar',fn,'go',true]]);LP.vb=f.querySelector('.go');if(s.t==='n'&&LP.inp)LP.vb.disabled=!LP.inp.value.trim()}
function passo(){
  pararTm();const L=LP,s=L.steps[L.k],b=$('box');
  const seg=L.steps.map((x,k)=>`<i class="${k<L.k?'d':k===L.k?'c':''}"></i>`).join('');
  b.innerHTML=`<div class="lph"><button class="x" onclick="fechar()" title="Fechar (Esc)">×</button><h3>${L.rev?'🧠 Revisão rápida':'🎓 '+esc(L.e.name)}</h3><div class="seg">${seg}</div></div><div class="lpb" id="lpb"></div><div class="lpf" id="lpf"></div>`;
  const B=$('lpb');L.sel=null;L.tent=0;L.fechado=false;L.inp=null;
  if(L.rev&&s.c)X('div','rvc','💡 '+esc(s.c),B);
  ({g:pQ,q:pQ,n:pN,m:pM,idea:pIdea,i:pI,fim:pFim})[s.t](s,B);
  B.scrollTop=0;
}
function pIdea(s,B){const e=LP.e;X('div','lpk','💡 A ideia central',B);X('div','lpq',esc(e.o),B);if(e.q)X('div','think','🧠 <b>Pense assim:</b> '+esc(e.q),B);rodape('','',[['Continuar',prox,'go']])}
function pI(s,B){X('div','lpk','💡 Repare',B);X('div','lpq',s.q.map(fmt).join('<br>'),B);rodape('','',[['Continuar',prox,'go']])}
function pQ(s,B){
  const L=LP;X('div','lpk',s.t==='g'?'🤔 Antes de começar: dê um palpite':'✏️ Pratique',B);
  X('div','lpq',s.q.map(fmt).join('<br>'),B);
  const box=X('div','ops','',B),ord=s.t==='g'?s.o.map((o,i)=>i):mistura(s.o.map((o,i)=>i));L.btns=[];
  ord.forEach((oi,n)=>{const b=X('button','op',`<span class="k">${n+1}</span><span>${fmt(s.o[oi].x)}</span>`,box);b.dataset.i=oi;
    b.onclick=()=>{if(L.fechado)return;L.sel=oi;L.btns.forEach(x=>x.classList.toggle('sel',x===b));L.vb.disabled=false};L.btns.push(b)});
  rodVer(s,()=>verQ(s),s.t==='g'?'<span class="mut">Não perde pontos: é só para aquecer a cabeça.</span>':'');
}
function verQ(s){
  const L=LP;if(L.sel==null)return;const o=s.o[L.sel],bt=L.btns.find(b=>+b.dataset.i===L.sel);L.tent++;
  const expl=(o.f?fmt(o.f)+' ':'')+(s.x?fmt(s.x):'');
  if(o.ok){L.fechado=true;bt.classList.remove('sel');bt.classList.add('ok');L.btns.forEach(b=>b.disabled=true);
    if(s.t==='g'){ganha(5);rodape('good',`<b>🎯 Boa intuição! +5 XP</b><br>${expl}`,[['Continuar',prox,'go']]);return}
    const p=L.tent===1?10:5;ganha(p);L.tot++;if(L.tent===1){L.ok++;acertou(s.key)}
    rodape('good',`<b>✅ ${L.tent===1?'Correto':'Agora sim'}! +${p} XP</b><br>${expl}`,[['Continuar',prox,'go']]);return}
  bt.classList.remove('sel');bt.classList.add('no');bt.disabled=true;L.sel=null;
  if(s.t==='g'){L.fechado=true;L.btns.forEach(b=>{b.disabled=true;if(s.o[+b.dataset.i].ok)b.classList.add('ok')});
    rodape('meh',`<b>💭 Bom palpite, mas não é isso.</b><br>${expl}`,[['Continuar',prox,'go']]);return}
  if(L.tent===1)errou(s.key);
  rodape('bad',`<b>❌ Ainda não.</b> ${o.f?fmt(o.f):'Pense mais um pouco e tente outra opção.'}`,[['Ver resposta',()=>revQ(s),'s2'],['Tentar de novo',()=>rodVer(s,()=>verQ(s)),'go']]);
}
function revQ(s){const L=LP;L.fechado=true;L.tot++;L.btns.forEach(b=>{b.disabled=true;b.classList.remove('sel');if(s.o[+b.dataset.i].ok)b.classList.add('ok')});
  rodape('meh',`<b>👀 A resposta certa está marcada em verde.</b><br>${fmt(s.x||'')}`,[['Continuar',prox,'go']])}
function lerNum(t){t=String(t).trim().replace(/\s|%|R\$/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/\./g,'');else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))t=t.replace(/\./g,'');t=t.replace(',','.').replace('−','-');return t===''?NaN:Number(t)}
function pN(s,B){
  const L=LP;X('div','lpk','🔢 Calcule',B);X('div','lpq',s.q.map(fmt).join('<br>'),B);
  const w=X('div','nw','',B),inp=X('input','nin','',w);inp.inputMode='decimal';inp.autocomplete='off';inp.placeholder='sua resposta';
  X('div','hint2','Pode usar vírgula ou ponto para decimais. Faça as contas no papel, na calculadora ou no R.',w);
  L.inp=inp;inp.oninput=()=>{inp.classList.remove('no');if(L.vb)L.vb.disabled=!inp.value.trim()};
  rodVer(s,()=>verN(s));setTimeout(()=>{try{inp.focus({preventScroll:true})}catch(e){}},60);
}
function verN(s){
  const L=LP,v=lerNum(L.inp.value);
  if(isNaN(v)){rodVer(s,()=>verN(s),'<b>Digite só o número</b> (por exemplo 0,25 ou 12).');return}
  L.tent++;const tol=s.tol!=null?s.tol:Math.max(0.006,Math.abs(s.a)*0.001),ok=Math.abs(v-s.a)<=tol+1e-12;
  if(ok){L.inp.classList.add('ok');L.inp.disabled=true;const p=L.tent===1?10:5;ganha(p);L.tot++;if(L.tent===1){L.ok++;acertou(s.key)}
    rodape('good',`<b>✅ ${L.tent===1?'Correto':'Agora sim'}! +${p} XP</b><br>${fmt(s.x||'')}`,[['Continuar',prox,'go']]);return}
  L.inp.classList.add('no');if(L.tent===1)errou(s.key);
  let dica='Confira as contas e tente de novo.';
  if(Math.abs(v*100-s.a)<=tol||Math.abs(v/100-s.a)<=tol)dica='Parece a resposta certa, mas em outra escala (proporção × porcentagem). Releia o que o enunciado pede.';
  else if(s.a!==0&&Math.abs(v-s.a)<=Math.abs(s.a)*0.15)dica='Está perto! Confira os arredondamentos e as contas.';
  rodape('bad',`<b>❌ Não é isso.</b> ${dica}`,[['Ver resposta',()=>{L.inp.disabled=true;L.tot++;rodape('meh',`<b>👀 Resposta: ${fm(s.a,4)}</b><br>${fmt(s.x||'')}`,[['Continuar',prox,'go']])},'s2'],['Tentar de novo',()=>{rodVer(s,()=>verN(s));L.inp.focus()},'go']]);
}
function pM(s,B){
  const L=LP;X('div','lpk','🎯 Missão',B);X('div','mis',s.q.map(fmt).join('<br>'),B);
  if(!L.viz){L.viz=X('div','viz','',B);try{W[L.e.w](L.viz)}catch(err){L.viz.innerHTML='<p class="empty">Não foi possível carregar a figura.</p>';console.error(err)}}else B.appendChild(L.viz);
  const stt=X('div','mst','⏳ Mexa na figura para cumprir a missão.',B);
  let fn;try{fn=new Function('s','return ('+s.c+')')}catch(e){fn=()=>false;console.error(e)}
  rodape('','<span class="mut">A missão é conferida sozinha enquanto você mexe.</span>',[['Pular',()=>prox(),'s2'],['Continuar',prox,'go',true]]);
  const chk=()=>{let ok=false;try{ok=!!fn(L.viz.st||{})}catch(e){}
    if(!ok||!LP)return;pararTm();ganha(15);stt.className='mst ok';stt.innerHTML='✅ Missão cumprida!';
    rodape('good',`<b>✅ Missão cumprida! +15 XP</b><br>${fmt(s.x||'')}`,[['Continuar',prox,'go']])};
  L.tm=setInterval(chk,250);
}
function pFim(s,B){
  const L=LP;marcarDia();
  if(L.rev){salvar();B.innerHTML=`<div class="fim"><div class="big">${L.ok===L.tot?'🏆':'💪'}</div><h2>Revisão concluída!</h2><p>${L.ok} de ${L.tot} certas de primeira · +${L.xp} XP</p><p class="mut">As perguntas que você erra voltam com mais frequência nas próximas revisões.</p></div>`;
    rodape('good','',[['Voltar à trilha',()=>fechar(),'s2'],['Nova revisão',()=>REV(),'go']]);return}
  const e=L.e,ja=!!PR.done[e.name];PR.done[e.name]={d:dk(new Date()),xp:L.xp,ac:L.ok,tot:L.tot};salvar();
  let h=`<div class="fim"><div class="big">🎉</div><h2>Lição concluída!</h2><p>+${L.xp} XP${L.tot?` · ${L.ok} de ${L.tot} exercícios certos de primeira`:''}${ja?' · lição refeita':''}</p></div>`;
  h+=`<div class="lb">📌 Resumo para guardar</div><div class="what">${esc(e.o)}</div>`;
  if(e.p.length)h+=`<table class="pp">${e.p.map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${esc(b)}</td></tr>`).join('')}</table>`;
  if(e.i)h+=`<div class="ia" style="margin-top:10px">${esc(e.i)}</div>`;
  B.insertAdjacentHTML('beforeend',h);
  const nx=proxDepois(L.i,L.j),i=L.i,j=L.j;
  rodape('good','',[['📖 Explicação completa',()=>OC(i,j),'s2'],['Voltar à trilha',()=>fechar(),'s2'],nx?['Próxima lição →',()=>LI(nx[0],nx[1]),'go']:['Concluir',()=>fechar(),'go']]);
}
function ver(nome){
  if(nome.startsWith('C:')){const n=norm(nome.slice(2));for(let i=0;i<CO.length;i++)for(let j=0;j<CO[i].items.length;j++)if(norm(CO[i].items[j].name)===n){if(mode!=='C')G('C');OC(i,j);return}return} // procura um comando pelo nome, em R e SQL
  const n=norm(nome).replace(/\(\)$/,'');
  for(const L2 of [lang,lang==='R'?'Q':'R']){
    const src=D[L2];
    for(let i=0;i<src.length;i++)for(let j=0;j<src[i].items.length;j++){
      const nm=norm(src[i].items[j].name);
      const parts=nm.split(/\s*[\/,]\s*|\s+e\s+|\s{2,}/).map(x=>x.replace(/\(\)$/,'').trim());
      if(nm.replace(/\(\)$/,'')===n||parts.includes(n)){if(L2!==lang){lang=L2;$('tR').className=L2=='R'?'on':'';$('tQ').className='sql'+(L2=='Q'?' on':'')}if(mode!=='D')G('D');else draw();O(i,j);return}
    }
  }
  for(const L2 of [lang,lang==='R'?'Q':'R'])for(let i=0;i<D[L2].length;i++)for(let j=0;j<D[L2][i].items.length;j++){if(norm(D[L2][i].items[j].name).includes(n)){if(L2!==lang){lang=L2;$('tR').className=L2=='R'?'on':'';$('tQ').className='sql'+(L2=='Q'?' on':'')}if(mode!=='D')G('D');else draw();O(i,j);return}}
  fechar();if(mode!=='D')G('D');$('q').value=nome.replace(/\(\)$/,'');draw();
}
document.addEventListener('keydown',ev=>{
  if($('modal').style.display!=='flex')return;
  if(ev.key==='Escape'){fechar();return}
  if(LP){const ae=document.activeElement,tag=ae&&ae.tagName;
    if(ev.key==='Enter'&&tag!=='BUTTON'&&!(tag==='INPUT'&&ae.type!=='text'&&!ae.classList.contains('nin'))){const g=document.querySelector('#lpf .go:not(:disabled)');if(g){ev.preventDefault();g.click()}}
    else if(/^[1-6]$/.test(ev.key)&&tag!=='INPUT'){const o=document.querySelectorAll('#lpb .op')[+ev.key-1];if(o&&!o.disabled)o.click()}
    return}
  const bs=[...document.querySelectorAll('.mf button')];
  if(ev.key==='ArrowRight'&&bs[2]&&!bs[2].disabled)bs[2].click();
  if(ev.key==='ArrowLeft'&&bs[0]&&!bs[0].disabled)bs[0].click();
});
draw();
</script>
