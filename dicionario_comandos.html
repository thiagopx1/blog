@G Gráficos (R base) | #ff6b6b | Funções nativas para desenhar gráficos. Eles aparecem na aba Plots do RStudio (ou dentro do relatório, no R Markdown).
@@ plot()
::k base
::f Linguagem R · Aula 14
::o Desenha o gráfico básico: pontos (dispersão), linhas ou os dois.
::q É o "canivete suíço" dos gráficos. Com type = "p" você vê pontos soltos (relação entre duas variáveis); com type = "l" uma linha (evolução no tempo).
::s
plot(x, y, type = "p", main = "Título", xlab = "Eixo X", ylab = "Eixo Y", col = "blue")
::p x, y | os valores dos eixos horizontal e vertical.
::p type | "p" = pontos, "l" = linha, "b" = pontos e linha.
::p main | título do gráfico.
::p xlab / ylab | nomes dos eixos.
::p col | cor ("blue", "red", "darkgreen"…).
::p pch | formato do ponto (16 = círculo cheio, 17 = triângulo, 19 = círculo sólido).
::p lty / lwd | tipo de linha (1 sólida, 2 tracejada, 3 pontilhada) e espessura.
::p xlim / ylim | limites dos eixos: ylim = c(0, 100).
::e
x <- 1:10
y <- x^2
plot(x, y, type = "b", col = "blue", pch = 16,
     main = "Quadrados de 1 a 10", xlab = "x", ylab = "x ao quadrado")
::r
(o gráfico aparece na aba Plots)
::a Erro "figure margins too large": o painel de gráficos está pequeno demais. Aumente o painel Plots e rode de novo.
::a plot() sempre começa um gráfico NOVO. Para acrescentar coisas ao mesmo gráfico use lines(), points(), text(), abline() e legend() logo depois.
::v lines(), points(), text() e abline() | legend() | barplot() | hist()
@@ lines(), points(), text() e abline()
::k base
::f Linguagem R · Aula 14
::o Acrescentam elementos a um gráfico que já está aberto: mais linhas, mais pontos, textos ou uma reta.
::q Funcionam como "camadas" desenhadas por cima do plot(). Rode sempre depois dele.
::s
lines(x, y, col = "red", lty = 2)
points(x, y, col = "red", pch = 17)
text(x, y, labels = "texto", pos = 4)
abline(h = valor)   abline(v = valor)   abline(lm(y ~ x))
::p lines | adiciona uma linha.
::p points | adiciona pontos.
::p text(…, labels, pos) | escreve um texto na posição (x, y). pos = 1 abaixo, 2 esquerda, 3 acima, 4 direita.
::p abline(h=) / abline(v=) | reta horizontal / vertical. abline(lm(y ~ x)) desenha a reta de tendência (regressão).
::e
x <- 1:10
plot(x, x^2, type = "l", col = "blue", ylim = c(0, 1000))
lines(x, x^3, col = "red", lty = 2)
points(5, 25, col = "darkgreen", pch = 19)
text(5, 25, labels = "Ponto de interesse", pos = 4)
abline(h = 500, col = "gray")
::r
(o gráfico com as duas linhas, o ponto e a reta aparece na aba Plots)
::a Se a segunda linha "sumir", é porque saiu dos limites do eixo. Defina ylim no plot() para caber tudo (ex.: ylim = range(c(y1, y2))).
::v plot() | legend()
@@ legend()
::k base
::f Linguagem R · Aula 14
::o Adiciona uma legenda explicando cores, pontos e linhas do gráfico.
::s
legend("topleft", legend = c("nome1", "nome2"), col = c("cor1", "cor2"), lty = c(1, 2), pch = c(16, 17))
::p posição | "topleft", "topright", "bottomleft", "bottomright", "top", "center"…
::p legend | os textos de cada item.
::p col | as cores, na mesma ordem.
::p lty / pch / fill | o símbolo de cada item: tipo de linha, formato de ponto ou caixinha preenchida (use fill para barras e pizza).
::e
x <- 1:10
plot(x, x^2, type = "l", col = "blue")
lines(x, x * 8, col = "red", lty = 2)
legend("topleft", legend = c("x^2", "8x"), col = c("blue", "red"), lty = c(1, 2))
::r
(a legenda aparece no canto superior esquerdo)
::v plot() | lines(), points(), text() e abline()
@@ barplot()
::k base
::f Linguagem R · Aulas 8 e 14
::o Desenha um gráfico de barras, ideal para comparar categorias.
::q Quase sempre é usado com table(): barplot(table(x)) mostra quantas vezes cada categoria aparece.
::s
barplot(alturas, names.arg = nomes, col = cores, main = "Título", beside = FALSE)
::p alturas | vetor (ou tabela) com o tamanho de cada barra. Se for matriz, cada coluna vira uma barra.
::p names.arg | os rótulos embaixo das barras.
::p col | cores das barras.
::p beside = TRUE | (com matriz) barras lado a lado. FALSE = empilhadas.
::p horiz = TRUE | barras deitadas.
::e
valores <- c(4, 7, 9, 12)
bp <- barplot(valores, names.arg = c("A", "B", "C", "D"),
              col = "skyblue", main = "Vendas por loja")
text(bp, valores, labels = valores, pos = 3)   # número em cima de cada barra
barplot(table(mtcars$cyl), main = "Carros por nº de cilindros")
::r
(dois gráficos de barras na aba Plots; use as setas para navegar entre eles)
::v table() | pie() | hist()
@@ pie()
::k base
::f Linguagem R · Aula 14
::o Desenha um gráfico de pizza (setores), mostrando a proporção de cada categoria no total.
::q Funciona bem com poucas categorias (até 5 ou 6). Para muitas categorias, prefira barras.
::s
pie(valores, labels = rotulos, col = cores, main = "Título")
::p valores | vetor ou tabela com as quantidades.
::p labels | o texto de cada fatia.
::p col | as cores das fatias.
::e
t <- table(iris$Species)
pct <- round(prop.table(t) * 100, 1)
pie(t, labels = paste(names(t), pct, "%"), main = "Espécies de íris")
::r
(gráfico de pizza com "setosa 33.3 %", "versicolor 33.3 %" e "virginica 33.3 %")
::v barplot() | prop.table() | paste() e paste0()
@@ hist()
::k base
::f Aula 13 (R Markdown)
::o Desenha um histograma: mostra como os valores de uma variável numérica se distribuem em faixas.
::s
hist(x, breaks = 10, main = "Título", col = "gray")
::p breaks | quantidade aproximada de barras (faixas).
::e
x <- rnorm(100, mean = 100, sd = 5)
hist(x, main = "100 valores simulados", col = "lightblue")
::r
(histograma em formato de "sino" na aba Plots)
::v plot() | summary() | runif(), rnorm() e set.seed()

@G Limpeza de dados e família apply | #a0e547 | Comandos para lidar com NA, duplicatas e tipos errados, e para aplicar uma função em várias linhas, colunas ou elementos de uma vez.
@@ na.omit()
::k base
::f Linguagem R · Aula 17
::o Remove todas as linhas que têm pelo menos um NA, em qualquer coluna.
::q É a "limpeza bruta": rápida, mas pode jogar fora muita informação. Antes, conte os NA para saber quanto vai perder.
::s
tabela_limpa <- na.omit(tabela)
::e
antes <- nrow(airquality)
sem_na <- na.omit(airquality)
depois <- nrow(sem_na)
cat("Antes:", antes, "- Depois:", depois, "\n")
::r
Antes: 153 - Depois: 111
::a Para remover NA só de colunas específicas, use o filtro df[!is.na(df$coluna), ] ou drop_na(df, coluna).
::v is.na() e !is.na() | drop_na() | replace_na()
@@ duplicated() e anyDuplicated()
::k base
::f Linguagem R · Aula 17 · Banco de Dados · Aula 15
::o duplicated() marca com TRUE cada linha (ou valor) que é repetição de uma anterior; anyDuplicated() diz se existe alguma repetição.
::q O 1º aparecimento é FALSE (original) e as cópias seguintes são TRUE. Por isso tabela[!duplicated(tabela), ] mantém só os originais.
::s
duplicated(x)
x[!duplicated(x)]          # remove repetidos
sum(duplicated(tabela))    # quantas linhas duplicadas
anyDuplicated(x)           # 0 = nenhuma repetição
::e
d <- c(1, 2, 2, 3, 1)
duplicated(d)
d[!duplicated(d)]
anyDuplicated(c(10, 20, 30))
::r
[1] FALSE FALSE  TRUE FALSE  TRUE
[1] 1 2 3
[1] 0
::a Antes de juntar tabelas (merge/left_join), confira se a chave não tem repetidos: anyDuplicated(base$id) deve dar 0.
::v unique() | distinct()
@@ suppressWarnings()
::k base
::f Banco de Dados · Aulas 17 e 18
::o Roda um comando escondendo os avisos (warnings) que ele geraria.
::q Usado com as.numeric() quando você SABE que alguns textos vão virar NA e não quer o aviso "NAs introduced by coercion". Depois conte os NA para saber quantos viraram.
::s
suppressWarnings(comando)
::e
idade <- c("59", "58", "abc", "")
idade_num <- suppressWarnings(as.numeric(idade))
idade_num
sum(is.na(idade_num))
::r
[1] 59 58 NA NA
[1] 2
::a Esconder o aviso não resolve o problema; só deixa a saída limpa. Sempre verifique quantos NA surgiram.
::v as.numeric(), as.integer() e outros as.* | tryCatch()
@@ apply()
::k base
::f Linguagem R · Aula 17
::o Aplica uma função em cada linha ou em cada coluna de uma matriz (ou data frame), sem precisar escrever um laço.
::q MARGIN = 1 → "para cada linha"; MARGIN = 2 → "para cada coluna". É um for "embutido".
::s
apply(X, MARGIN, FUN, ...)
::p X | a matriz ou data frame.
::p MARGIN | 1 = linhas, 2 = colunas.
::p FUN | a função a aplicar (mean, sum, max ou uma função sua).
::p ... | argumentos extras repassados à função: apply(m, 2, mean, na.rm = TRUE).
::e
m <- matrix(1:12, nrow = 3)
apply(m, 2, mean)     # média de cada coluna
apply(m, 1, sum)      # soma de cada linha
::r
[1]  2  5  8 11
[1] 22 26 30
::a O resultado do apply() é uma matriz ou vetor, mesmo que a entrada seja um data frame. Para voltar a tabela: as.data.frame(resultado).
::v lapply(), sapply(), tapply() e mapply() | colSums() e rowSums() | function()
@@ lapply(), sapply(), tapply() e mapply()
::k base
::f Linguagem R · Aula 17 · Banco de Dados · Aula 14
::o A "família apply": aplicam uma função a cada elemento de uma lista/vetor (lapply, sapply), a cada grupo (tapply) ou a vários vetores em paralelo (mapply).
::q lapply devolve sempre uma lista; sapply tenta simplificar para vetor; tapply é o "por grupo"; mapply é o "elemento 1 com elemento 1, 2 com 2…".
::s
lapply(lista, FUN)
sapply(lista, FUN)
tapply(valores, grupos, FUN)
mapply(FUN, vetor1, vetor2)
::e
sapply(mtcars[, 1:3], class)          # tipo de cada coluna
lapply(list(a = 1:3, b = 4:6), sum)
tapply(c(10, 20, 30, 40), c("A", "B", "A", "B"), sum)
mapply(function(x, y) x + y, 1:3, 4:6)
::r
      mpg       cyl      disp
"numeric" "numeric" "numeric"
$a
[1] 6

$b
[1] 15

 A  B
40 60
[1] 5 7 9
::a sapply(dados, class) é o jeito mais rápido de ver o tipo de todas as colunas de uma tabela.
::v apply() | aggregate() | group_by()
@@ tryCatch()
::k base
::f Linguagem R · Aula 16
::o Tenta executar um código e, se der erro, faz outra coisa em vez de parar tudo.
::s
tryCatch({
  # código que pode dar erro
}, error = function(e) {
  # o que fazer se der erro
})
::e
resultado <- tryCatch({
  log(-1)
  "deu certo"
}, error = function(e) "deu erro", warning = function(w) "deu aviso")
resultado
::r
[1] "deu aviso"
::v suppressWarnings() | function()

@G Texto (strings) | #c792ea | Funções para medir, cortar, juntar, buscar e trocar pedaços de texto. Primeiro as nativas do R; depois as do pacote stringr (todas começam com str_).
@@ nchar()
::k base
::f Linguagem R · Aula 21
::o Conta quantos caracteres um texto tem (letras, espaços e sinais).
::s
nchar(texto)
::e
nchar("Introdução à Linguagem R")
nchar(c("Ana", "Bruno"))
::r
[1] 24
[1] 3 5
::v str_length() e str_sub() | length()
@@ toupper() e tolower()
::k base
::f Linguagem R · Aula 21
::o Convertem o texto para MAIÚSCULAS (toupper) ou minúsculas (tolower).
::q Muito útil para padronizar respostas digitadas de formas diferentes ("sim", "SIM", "Sim") antes de comparar.
::s
toupper(texto)   tolower(texto)
::e
toupper("Introdução à Linguagem R")
tolower("GOIÂNIA")
::r
[1] "INTRODUÇÃO À LINGUAGEM R"
[1] "goiânia"
::v str_to_upper(), str_to_lower() e str_to_title()
@@ substr()
::k base
::f Linguagem R · Aula 21 · Programação · Aula 8
::o Recorta um pedaço do texto, da posição inicial até a final.
::q Perfeito para separar partes de códigos de tamanho fixo: numa data "300424", os caracteres 1-2 são o dia, 3-4 o mês e 5-6 o ano.
::s
substr(texto, start = inicio, stop = fim)
::p start | posição do 1º caractere desejado (começa em 1).
::p stop | posição do último caractere desejado.
::e
substr("Introdução", 1, 4)
data <- "300424"
substr(data, 1, 2)
substr(data, 3, 4)
::r
[1] "Intr"
[1] "30"
[1] "04"
::a Também troca pedaços: substr(x, 8, 9) <- "ca". O texto novo precisa ter o mesmo tamanho do trecho substituído.
::v str_length() e str_sub() | strsplit()
@@ paste() e paste0()
::k base
::f Linguagem R · Aula 21
::o Juntam (colam) textos e valores num único texto. paste() coloca espaço entre eles; paste0() cola sem espaço.
::q Diferente de cat(), o resultado pode ser guardado numa variável, usado como rótulo de gráfico, nome de coluna etc.
::s
paste(..., sep = " ")
paste0(...)
paste(vetor, collapse = ", ")
::p ... | os pedaços a juntar.
::p sep | o que vai entre os pedaços (padrão: espaço).
::p collapse | transforma um VETOR inteiro num único texto, separando os itens por esse símbolo.
::e
paste("Ciência", "de", "Dados")
paste("Ciência", "de", "Dados", sep = "-")
paste0("A", 1:3)
paste(c("maçã", "uva", "kiwi"), collapse = ", ")
::r
[1] "Ciência de Dados"
[1] "Ciência-de-Dados"
[1] "A1" "A2" "A3"
[1] "maçã, uva, kiwi"
::a sep junta pedaços que estão LADO A LADO nos argumentos; collapse junta os elementos DE UM VETOR. São coisas diferentes.
::v cat() | str_c() | strsplit()
@@ strsplit()
::k base
::f Linguagem R · Aula 21
::o Divide um texto em pedaços sempre que encontra um separador. Devolve uma lista.
::s
strsplit(texto, split = "separador")
::p split | onde cortar: " " (espaço), "," etc. split = "" separa letra por letra.
::p [[1]] ou unlist() | como o resultado vem dentro de uma lista, use um dos dois para obter o vetor.
::e
strsplit("maçã, uva, kiwi", split = ", ")
unlist(strsplit("a-b-c", "-"))
::r
[[1]]
[1] "maçã" "uva"  "kiwi"

[1] "a" "b" "c"
::v str_split() | paste() e paste0()
@@ grep() e grepl()
::k base
::f Linguagem R · Aula 21
::o Procuram um padrão de texto num vetor: grep() devolve as posições onde achou; grepl() devolve TRUE/FALSE para cada elemento.
::q grepl é o "contém?". Ótimo para filtrar: df[grepl("Silva", df$nome), ] pega todos que têm Silva no nome.
::s
grep("padrão", vetor, ignore.case = FALSE)
grepl("padrão", vetor)
::p padrão | o trecho procurado.
::p ignore.case = TRUE | não diferencia maiúsculas de minúsculas.
::e
v <- c("Introdução ao R", "RStudio", "Ciência de Dados")
grep("ia", v)
grepl("ia", v)
grep("r", v, ignore.case = TRUE)
::r
[1] 3
[1] FALSE FALSE  TRUE
[1] 1 2
::v str_detect(), str_locate() e str_count() | gregexpr() | LIKE
@@ gregexpr()
::k base
::f Linguagem R · Aula 21
::o Encontra as posições de TODAS as ocorrências de um padrão dentro de um texto.
::s
unlist(gregexpr("padrão", texto))
::e
unlist(gregexpr("a", "banana"))
::r
[1] 2 4 6
::v grep() e grepl() | str_detect(), str_locate() e str_count()
@@ gsub() e sub()
::k base
::f Linguagem R · Aula 17
::o Substituem um trecho de texto por outro: gsub() troca todas as ocorrências; sub() só a primeira.
::s
gsub("antigo", "novo", texto)
::p "antigo" | o que procurar.
::p "novo" | pelo que trocar ("" apaga).
::p texto | o texto ou vetor (pode ser uma coluna).
::e
gsub("a", "o", "banana")
sub("a", "o", "banana")
gsub(",", ".", "12,5")          # vírgula decimal para ponto
::r
[1] "bonono"
[1] "bonana"
[1] "12.5"
::a A ordem dos argumentos é: o que procurar, pelo que trocar, ONDE. No stringr a ordem muda (o texto vem primeiro).
::a Alguns símbolos têm significado especial no padrão (. * + ? ( ) [ ] $ ^). Para procurar o ponto literal, use fixed = TRUE: gsub(".", ",", x, fixed = TRUE).
::v str_replace() e str_replace_all()
@@ trimws()
::k base
::f Linguagem R · Aula 10
::o Remove os espaços em branco do início e do fim do texto.
::s
trimws(texto)
::e
trimws("   Goiânia  ")
::r
[1] "Goiânia"
::v str_trim()
@@ str_length() e str_sub()
::k stringr
::f Linguagem R · Aula 21
::o Versões do stringr para contar caracteres (str_length) e recortar um pedaço do texto (str_sub).
::s
str_length(texto)
str_sub(texto, inicio, fim)
::e
library(stringr)
str_length("exemplo")
str_sub("exemplo", 1, 3)
str_sub("exemplo", -3)       # os 3 últimos
::r
[1] 7
[1] "exe"
[1] "plo"
::v nchar() | substr()
@@ str_to_upper(), str_to_lower() e str_to_title()
::k stringr
::f Linguagem R · Aula 21
::o Mudam maiúsculas e minúsculas; str_to_title() deixa a primeira letra de cada palavra maiúscula.
::s
str_to_upper(texto)   str_to_lower(texto)   str_to_title(texto)
::e
library(stringr)
str_to_upper("exemplo")
str_to_title("exemplo de string")
::r
[1] "EXEMPLO"
[1] "Exemplo De String"

@@ str_replace() e str_replace_all()
::k stringr
::f Linguagem R · Aula 21
::o Trocam um trecho por outro: str_replace() só a 1ª ocorrência; str_replace_all() todas.
::s
str_replace(texto, "padrão", "novo")
::p texto | vem PRIMEIRO no stringr.
::e
library(stringr)
str_replace("Exemplo de Exemplo", "Exemplo", "Teste")
str_replace_all("Exemplo de Exemplo", "Exemplo", "Teste")

[1] "Teste de Exemplo"
[1] "Teste de Teste"

@@ str_split() e str_c()
::k stringr
::f Linguagem R · Aula 21
::o str_split() divide o texto por um separador (devolve lista); str_c() junta textos.
::s
str_split(texto, "separador")
str_c(..., sep = "")
::e
library(stringr)
unlist(str_split("exemplo,teste,divisão", ","))
str_c("exemplo", "teste", sep = "-")
::r
[1] "exemplo" "teste"   "divisão"
[1] "exemplo-teste"
::v strsplit() | paste() e paste0()
@@ str_dup(), str_pad() e str_trim()
::k stringr
::f Linguagem R · Aula 21
::o str_dup() repete um texto; str_pad() completa com caracteres até um tamanho; str_trim() tira espaços das pontas.
::s
str_dup(texto, vezes)
str_pad(texto, width = n, side = "left", pad = " ")
str_trim(texto)

::k stringr
::f Linguagem R · Aula 21

@G Datas | #5ac8fa | Datas chegam como texto e precisam ser convertidas para o tipo Date antes de qualquer conta. Primeiro as funções nativas; depois as do pacote lubridate.
@@ as.Date()
::k base
::f Linguagem R · Aula 23
::o Converte um texto numa data de verdade (tipo Date), informando em que formato o texto está escrito.
::q O R guarda datas no formato internacional AAAA-MM-DD. Se o seu texto está como "01/07/2026", você explica ao R com o format: "%d/%m/%Y" = dia/mês/ano com 4 dígitos.
::s
as.Date(texto, format = "%d/%m/%Y")
::p %d | dia (01 a 31).
::p %m | mês em número (01 a 12).
::p %Y | ano com 4 dígitos (2026). %y = 2 dígitos (26).
::p %b / %B | nome do mês abreviado / completo (em inglês, como Jul / July).
::p / ou - | os separadores devem ser os mesmos do texto.
::p origin | (para números) a data inicial da contagem; o padrão é "1970-01-01".
::e
as.Date("2026-07-01")                         # formato padrão: não precisa de format
as.Date("01/07/2026", format = "%d/%m/%Y")
as.Date("07-01-2026", format = "%m-%d-%Y")
d <- as.Date("2023-12-31") - as.Date("2023-01-01")
d
as.numeric(d)
::r
[1] "2026-07-01"
[1] "2026-07-01"
[1] "2026-07-01"
Time difference of 364 days
[1] 364
::a Se o texto não bater com o format, o resultado é NA (sem erro). Confira com sum(is.na(x)).
::a read.csv() traz datas como texto (chr). Converta a coluna: dados$data <- as.Date(dados$data, format = "%d/%m/%Y").
::v format() | difftime() | ymd(), dmy() e mdy() | Sys.Date() e Sys.time()
@@ format()
::k base
::f Linguagem R · Aula 23
::o Mostra uma data (que já é do tipo Date) no formato de texto que você quiser.
::q É o caminho inverso do as.Date(): de data para texto bonito, como "01/07/2026", ou para extrair só o mês ou só o ano.
::s
format(data, "%d/%m/%Y")
::e
d <- as.Date("2026-07-01")
format(d, "%d/%m/%Y")
format(d, "%m")
format(d, "%Y")
format(1234567.891, big.mark = ".", decimal.mark = ",")
::r
[1] "01/07/2026"
[1] "07"
[1] "2026"
[1] "1.234.568"
::a O resultado de format() é TEXTO: não dá mais para fazer contas de data com ele.
::v as.Date() | year(), month() e day()
@@ difftime()
::k base
::f Linguagem R · Aula 23
::o Calcula a diferença entre duas datas na unidade que você escolher.
::s
difftime(data_final, data_inicial, units = "days")
::p units | "days", "weeks", "hours", "mins", "secs" ou "auto".
::e
d1 <- as.Date("2026-07-01")
d2 <- as.Date("2026-07-10")
difftime(d2, d1, units = "days")
difftime(d2, d1, units = "weeks")
::r
Time difference of 9 days
Time difference of 1.285714 weeks
::a Subtrair direto (d2 - d1) também funciona e dá a diferença em dias.
::v as.Date() | interval(), duration() e period()
@@ Sys.Date() e Sys.time()
::k base
::f Linguagem R · Aula 23
::o Devolvem a data de hoje e a data-hora atual do computador.
::s
Sys.Date()   Sys.time()
::e
Sys.Date()
Sys.time()
::r
[1] "2026-10-18"
[1] "2026-10-18 11:37:42 -03"
::a Com S maiúsculo. O resultado muda conforme o dia em que você roda.
::v today() | as.Date()
@@ ymd(), dmy() e mdy()
::k lubridate
::f Linguagem R · Aula 23
::o Convertem texto em data sem precisar escrever o format: o nome da função já diz a ordem (y = ano, m = mês, d = dia).
::q Escolha pela ordem em que a data está escrita: "01/07/2026" é dia-mês-ano → dmy(). O separador (/, -, espaço) não importa.
::s
ymd("2026-07-01")
dmy("01/07/2026")
mdy("07-01-2026")
ymd_hms("2026-07-01 14:00:00")
::p ymd / dmy / mdy | a ordem dos elementos no texto.
::p _hms | quando também há hora:minuto:segundo.
::e
library(lubridate)
dmy("01/07/2026")
ymd("20260701")
ymd_hms("2026-07-01 14:00:00")
::r
[1] "2026-07-01"
[1] "2026-07-01"
[1] "2026-07-01 14:00:00 UTC"
::v as.Date() | year(), month() e day() | today()
@@ year(), month() e day()
::k lubridate
::f Linguagem R · Aula 23
::o Extraem partes de uma data: ano, mês, dia (e hour, minute, second para horas).
::s
year(data)  month(data)  day(data)  hour(dh)  minute(dh)  second(dh)
::e
library(lubridate)
d <- ymd("2026-07-18")
year(d)
month(d)
day(d)
month(d, label = TRUE)     # nome do mês
::r
[1] 2026
[1] 7
[1] 18
[1] jul
12 Levels: jan < fev < mar < abr < mai < jun < jul < ago < set < ... < dez
::a O nome do mês sai no idioma do seu computador (em inglês: Jul).
::v format() | days(), months() e years()
@@ days(), months() e years()
::k lubridate
::f Linguagem R · Aula 23
::o Criam períodos de tempo para somar ou subtrair de datas.
::s
data + days(n)   data - months(n)   data + years(n)   dh + hours(n)
::e
library(lubridate)
d <- ymd("2026-07-01")
d + days(10)
d - months(2)
d + years(1)
::r
[1] "2026-07-11"
[1] "2026-05-01"
[1] "2027-07-01"
::v year(), month() e day() | interval(), duration() e period()
@@ interval(), duration() e period()
::k lubridate
::f Linguagem R · Aula 23
::o interval() guarda o intervalo entre duas datas; duration() mede tempo exato em segundos; period() mede em unidades "humanas" (dias, meses).
::s
interval(inicio, fim)
duration(num, units = "days")
period(num, units = "days")
::e
library(lubridate)
interval(ymd("2026-07-01"), ymd("2026-07-10"))
duration(10, units = "days")
period(10, units = "days")
::r
[1] 2026-07-01 UTC--2026-07-10 UTC
[1] "864000s (~1.43 weeks)"
[1] "10d 0H 0M 0S"
::v difftime() | days(), months() e years()
@@ with_tz() e force_tz()
::k lubridate
::f Linguagem R · Aula 23
::o with_tz() converte um horário para outro fuso (o instante é o mesmo, o relógio muda); force_tz() troca só a etiqueta do fuso (o relógio fica igual).
::s
with_tz(datahora, "America/Sao_Paulo")   force_tz(datahora, "America/Sao_Paulo")
::e
library(lubridate)
dh <- ymd_hms("2026-07-01 14:00:00")     # vem em UTC
with_tz(dh, "America/Sao_Paulo")
force_tz(dh, "America/Sao_Paulo")
::r
[1] "2026-07-01 11:00:00 -03"
[1] "2026-07-01 14:00:00 -03"
::v ymd(), dmy() e mdy()
@@ floor_date(), ceiling_date() e round_date()
::k lubridate
::f Linguagem R · Aula 23
::o Arredondam datas para a unidade escolhida: para baixo (floor), para cima (ceiling) ou para a mais próxima (round).
::q floor_date(d, "month") dá o 1º dia do mês: ótimo para agrupar registros por mês.
::s
floor_date(data, "month")
::p unidade | "day", "week", "month", "year", "hour", "minute"…
::e
library(lubridate)
d <- ymd("2026-07-18")
floor_date(d, "month")
ceiling_date(d, "month")
::r
[1] "2026-07-01"
[1] "2026-08-01"
::v year(), month() e day()
@@ today() e leap_year()
::k lubridate
::f Linguagem R · Aula 24
::o today() devolve a data de hoje; leap_year() diz se um ano é bissexto.
::s
today()   leap_year(ano)
::e
library(lubridate)
leap_year(2024)
leap_year(2026)
ymd("2026-12-25") - today()     # dias até o Natal (muda conforme o dia)

[1] TRUE

Time difference of 68 days

@G dplyr: manipulação de tabelas | #ff9f43 | O dplyr (parte do tidyverse) traz "verbos" para filtrar, escolher, criar, ordenar e resumir tabelas. Nos exemplos usamos esta tabela: alunos <- data.frame(nome = c("Ana", "Bruno", "Carla", "Davi"), turma = c("A", "B", "A", "B"), nota = c(8.5, 6.0, 9.2, 7.4))
@@ %>% e |> (pipe)
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o O pipe passa o resultado do que está à esquerda como primeiro argumento da função à direita, permitindo encadear passos.
::q Leia o pipe como "e então…": "pegue alunos, E ENTÃO filtre a turma A, E ENTÃO escolha nome e nota". O código fica na ordem em que você pensa, em vez de funções dentro de funções.
::s
dados %>% funcao1() %>% funcao2()
dados |> funcao1() |> funcao2()
::p %>% | o pipe do pacote magrittr/dplyr (usado nas aulas do Prof. Fabrizzio). Atalho: Ctrl + Shift + M.
::p |> | o pipe nativo do R 4.1 ou mais novo (usado nas aulas da Profª Emília). Funcionam igual no dia a dia.
::e
library(dplyr)
alunos <- data.frame(nome = c("Ana", "Bruno", "Carla", "Davi"),
                     turma = c("A", "B", "A", "B"),
                     nota = c(8.5, 6.0, 9.2, 7.4))
# sem pipe: lê-se de dentro para fora
select(filter(alunos, turma == "A"), nome, nota)
# com pipe: lê-se na ordem
alunos %>%
  filter(turma == "A") %>%
  select(nome, nota)
::r
   nome nota
1   Ana  8.5
2 Carla  9.2
   nome nota
1   Ana  8.5
2 Carla  9.2
::a Coloque o pipe no FIM da linha, nunca no começo da linha seguinte; senão o R acha que o comando terminou.
::a O pipe não salva nada. Para guardar o resultado: novo <- alunos %>% filter(...).
::v filter() | select() | mutate()
@@ filter()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Mantém só as linhas que obedecem a uma ou mais condições.
::q É o WHERE do SQL. Vírgula entre condições significa E (todas precisam ser verdadeiras). Para OU, use |.
::s
filter(tabela, condição1, condição2, ...)
::p tabela | o data frame (some quando você usa o pipe).
::p condição | teste com os nomes das colunas (sem $): nota >= 7, turma == "A", !is.na(idade), sexo %in% c(1, 2).
::p , (vírgula) | E.
::e
library(dplyr)
filter(alunos, nota >= 7)
alunos %>% filter(turma == "B", nota > 7)
alunos %>% filter(turma == "A" | nota < 7)
::r
   nome turma nota
1   Ana     A  8.5
2 Carla     A  9.2
3  Davi     B  7.4
  nome turma nota
1 Davi     B  7.4
   nome turma nota
1   Ana     A  8.5
2 Bruno     B  6.0
3 Carla     A  9.2
::a Use == para comparar (não =). filter(turma = "A") dá erro.
::a Linhas em que a condição dá NA são descartadas. Para manter os NA de propósito: filter(is.na(x) | x > 10).
::a Padrão das aulas de limpeza: filter(!is.na(IDADE), IDADE >= 18, IDADE <= 100).
::v select() | %in% | Acessar partes: df[linha, coluna] | WHERE
@@ select()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Escolhe quais colunas manter (ou remover, com sinal de menos).
::q É o SELECT do SQL. Também serve para reordenar colunas.
::s
select(tabela, col1, col2)
select(tabela, -col)             # remove
select(tabela, col1, everything())
select(tabela, where(is.numeric))
select(tabela, starts_with("vendas"))
::p col1, col2 | os nomes das colunas, sem aspas.
::p -col | tira a coluna.
::p everything() | "todas as outras": útil para trazer colunas para a frente.
::p where(is.numeric) | só as colunas numéricas.
::p starts_with("x") | colunas cujo nome começa com "x".
::e
library(dplyr)
alunos %>% select(nome, nota)
alunos %>% select(-turma) %>% names()
alunos %>% select(nota, everything()) %>% names()
::r
   nome nota
1   Ana  8.5
2 Bruno  6.0
3 Carla  9.2
4  Davi  7.4
[1] "nome" "nota"
[1] "nota"  "nome"  "turma"

@@ mutate()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Cria colunas novas ou altera colunas existentes, geralmente a partir de cálculos com outras colunas.
::q Se o nome já existe, a coluna é substituída; se não existe, é criada no final. Dá para criar várias de uma vez, separando por vírgula.

::p expressão | a conta ou função: nota * 10, round(TEMPO / 30.4, 1), as.numeric(IDADE)…

library(dplyr)
alunos %>% mutate(nota100 = nota * 10, aprovado = nota >= 7)

   nome turma nota nota100 aprovado
1   Ana     A  8.5      85     TRUE
2 Bruno     B  6.0      60    FALSE
3 Carla     A  9.2      92     TRUE
4  Davi     B  7.4      74     TRUE

::a Dentro do mesmo mutate(), uma coluna nova já pode ser usada pelas seguintes, mas as aulas recomendam um segundo mutate() quando há dependência, para ficar mais claro.

arrange(tabela, desc(coluna))
arrange(tabela, col1, desc(col2))

library(dplyr)
alunos %>% arrange(desc(nota))
alunos %>% arrange(turma, desc(nota))

   nome turma nota

3  Davi     B  7.4

3  Davi     B  7.4

@@ group_by() e summarise()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o group_by() separa a tabela em grupos; summarise() resume cada grupo numa linha (média, soma, contagem…).
::q Juntos, são o GROUP BY + COUNT/AVG do SQL. "Média de nota POR turma", "quantos pacientes POR sexo".
::s
tabela %>%
  group_by(coluna_grupo) %>%
  summarise(nome1 = funcao(coluna), n = n(), .groups = "drop")
::p group_by(col) | a coluna que define os grupos (pode ser mais de uma).
::p summarise(…) | (ou summarize) as estatísticas: mean(), sum(), median(), max(), min(), n().
::p n() | conta quantas linhas há em cada grupo.
::p .groups = "drop" | desfaz o agrupamento no final (evita uma mensagem de aviso).
::e
library(dplyr)
alunos %>%
  group_by(turma) %>%
  summarise(media = mean(nota), n = n(), .groups = "drop")
alunos %>% summarise(media = mean(nota), maior = max(nota))

# A tibble: 2 × 3
  turma media     n
  <chr> <dbl> <int>
1 A      8.85     2
2 B      6.7      2
  media maior
1 7.775   9.2
::a O resultado é um tibble: por isso aparece "# A tibble: 2 × 3" e os tipos <chr>, <dbl> e <int> embaixo dos nomes.

@@ if_else()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Cria um valor (ou coluna) com duas possibilidades: uma quando a condição é verdadeira e outra quando é falsa.
::q Use dentro do mutate() para rótulos binários: SEXO 1 → "Masculino", senão "Feminino".
::s
if_else(condição, valor_se_TRUE, valor_se_FALSE, missing = NULL)
::p condição | teste aplicado a cada linha.
::p missing | (opcional) o que colocar quando a condição der NA.
::e
library(dplyr)
alunos %>% mutate(situacao = if_else(nota >= 7, "Aprovado", "Reprovado"))
::r
   nome turma nota  situacao
1   Ana     A  8.5  Aprovado
2 Bruno     B  6.0 Reprovado
3 Carla     A  9.2  Aprovado
4  Davi     B  7.4  Aprovado
::a ARMADILHA vista na Aula 17: if_else(SEXO == 1, "Masculino", "Feminino") transforma qualquer código inválido (0, 3, 9) em "Feminino" sem avisar. Confira os valores com count() e limpe ANTES de rotular.
::a Os dois resultados precisam ser do mesmo tipo (dois textos ou dois números).
::v case_when() | ifelse() | mutate()
@@ case_when()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aulas 17 e 18
::o Cria um valor com várias possibilidades, testando condições em sequência; substitui vários if_else() aninhados.
::q Cada linha é "condição ~ resultado". O R testa de cima para baixo e usa a primeira que der verdadeira. TRUE ~ … no final é o "qualquer outro caso".
::s
case_when(
  condição1 ~ resultado1,
  condição2 ~ resultado2,
  TRUE      ~ resultado_padrão
)
::p ~ | o til: "então".
::p TRUE ~ | (opcional) o "senão" final. Sem ele, quem não cair em nenhuma condição vira NA.
::p NA_character_ | o NA "do tipo texto", usado quando o padrão deve ser ausente.
::e
library(dplyr)
alunos %>% mutate(conceito = case_when(
  nota >= 9 ~ "A",
  nota >= 7 ~ "B",
  TRUE      ~ "C"
))
::r
   nome turma nota conceito
1   Ana     A  8.5        B
2 Bruno     B  6.0        C
3 Carla     A  9.2        A
4  Davi     B  7.4        B
::a A ordem importa: se a linha nota >= 7 viesse antes de nota >= 9, ninguém receberia "A".
::a Ótimo para padronizar texto bagunçado: TABAGISMO %in% c("Sim", "sim", "S") ~ "Sim".
::v if_else() | else if | mutate()

rename(tabela, novo_nome = nome_antigo)

library(dplyr)
alunos %>% rename(aluno = nome, nota_final = nota) %>% names()
::r
[1] "aluno"      "turma"      "nota_final"
::a A ordem é NOVO = ANTIGO (o contrário do que muita gente espera).
::v select() | colnames() e rownames() | AS (apelido)

::k dplyr

::o Remove linhas duplicadas ou mostra os valores únicos de uma coluna.
::s
distinct(tabela)            # remove linhas inteiras repetidas
distinct(tabela, coluna)    # valores únicos da coluna

  turma

::k dplyr
::f Banco de Dados · Aulas 17 e 18 · Linguagem R · Aula 28
::o Escolhem linhas pela posição: slice(n) pega a linha n; slice_head(n = k) as k primeiras; slice_sample(n = k) k linhas sorteadas.
::q slice_head() depois de arrange() responde perguntas do tipo "os 5 mais…". É o LIMIT do SQL.

@@ left_join(), inner_join(), right_join(), full_join()
::k dplyr
::f Linguagem R · Aula 26 · Banco de Dados · Aula 15
::o Juntam duas tabelas por uma coluna-chave em comum, como os JOINs do SQL.
::q inner = só quem tem par nos dois lados. left = todos da tabela da esquerda (a 1ª), com NA onde não há par. right = todos da direita. full = todo mundo.
::s
left_join(x, y, by = "chave")
::p x | a tabela da esquerda (a 1ª).
::p y | a tabela da direita (a 2ª).
::p by = "chave" | a coluna em comum. Nomes diferentes: by = c("id_pac" = "codigo"). Várias chaves: by = c("id", "ano").
::e
library(dplyr)
df1 <- data.frame(id = 1:3, valor1 = c("A", "B", "C"))
df2 <- data.frame(id = 2:4, valor2 = c("X", "Y", "Z"))
inner_join(df1, df2, by = "id")
left_join(df1, df2, by = "id")
full_join(df1, df2, by = "id")
::r
  id valor1 valor2
1  2      B      X
2  3      C      Y
  id valor1 valor2
1  1      A   <NA>
2  2      B      X
3  3      C      Y
  id valor1 valor2
1  1      A   <NA>
2  2      B      X
3  3      C      Y
4  4   <NA>      Z
::a Se a chave se repete, as linhas se multiplicam. Compare nrow() antes e depois e confira anyDuplicated(chave).
::a As chaves precisam ter o mesmo tipo: class(A$id) == class(B$id). Se não, converta antes (as.integer, as.character).
::a right_join(df1, df2) dá o mesmo que left_join(df2, df1), só muda a ordem das colunas.
::v semi_join() e anti_join() | merge() | INNER JOIN | LEFT JOIN
@@ semi_join() e anti_join()
::k dplyr
::f Linguagem R · Aula 26 · Banco de Dados · Aula 15
::o Filtram a tabela da esquerda conforme a da direita, sem trazer colunas: semi_join mantém quem TEM par; anti_join mantém quem NÃO tem.
::q anti_join() é a ferramenta de auditoria: "quais pacientes não têm exame?", "quais ids do laboratório não existem no cadastro?".
::s
semi_join(x, y, by = "chave")
anti_join(x, y, by = "chave")
::e
library(dplyr)
df1 <- data.frame(id = 1:3, valor1 = c("A", "B", "C"))
df2 <- data.frame(id = 2:3)
semi_join(df1, df2, by = "id")
anti_join(df1, df2, by = "id")
::r
  id valor1
1  2      B
2  3      C
  id valor1
1  1      A
::v left_join(), inner_join(), right_join(), full_join() | LEFT JOIN
@@ bind_rows()
::k dplyr
::f Banco de Dados · Aula 15
::o Empilha tabelas uma embaixo da outra (como rbind), mas aceita colunas diferentes, completando com NA.
::q Para juntar arquivos de meses diferentes com as mesmas variáveis. O .id cria uma coluna dizendo de qual tabela veio cada linha.
::s
bind_rows(tab1, tab2, .id = "origem")
::e
library(dplyr)
jan <- data.frame(id = 1:2, valor = c(10, 20))
fev <- data.frame(id = 3, valor = 30, obs = "novo")
bind_rows(jan, fev, .id = "origem")
::r
  origem id valor  obs
1      1  1    10 <NA>
2      1  2    20 <NA>
3      2  3    30 novo
::a Se a mesma coluna for texto numa tabela e número na outra, dá erro. Padronize os tipos antes e confira com str() depois.
::v rbind() e cbind() | left_join(), inner_join(), right_join(), full_join()

@G tibble e tidyr: arrumar tabelas | #f4a261 | Tibbles são data frames "modernos"; o tidyr transforma o formato das tabelas (largo ↔ longo), separa e une colunas e trata NA.
@@ tibble() e tribble()
::k tibble
::f Linguagem R · Aula 27
::o Criam tibbles: tibble() a partir de colunas (como data.frame); tribble() escrevendo linha por linha, como uma tabela.
::q tribble() é ótimo para digitar pequenos exemplos: a primeira linha tem os nomes das colunas com ~ na frente, e as seguintes são os dados.
::s
tibble(col1 = c(...), col2 = c(...))
tribble(
  ~col1, ~col2,
  valor, valor
)
::e
library(tibble)
tib <- tribble(
  ~nome,    ~idade, ~salario,
  "Alice",  23,     50000,

)
tib

# A tibble: 2 × 3
  nome  idade salario
  <chr> <dbl>   <dbl>
1 Alice    23   50000
2 Bob      35   60000
::a Tibbles imprimem só as 10 primeiras linhas e as colunas que cabem na tela, e nunca transformam texto em fator.
::v as_tibble(), add_row() e add_column() | data.frame()

as_tibble(df)
as.data.frame(tib)
add_row(tib, col1 = valor, col2 = valor)
add_column(tib, nova = c(...))
::e
library(tibble)
tib <- tibble(x = 1:2, y = c("a", "b"))
add_row(tib, x = 3, y = "c")

      x y

@@ pivot_longer() e pivot_wider()
::k tidyr
::f Linguagem R · Aula 27
::o Mudam o formato da tabela: pivot_longer() transforma várias colunas em duas (nome e valor), deixando a tabela "longa"; pivot_wider() faz o caminho inverso, deixando-a "larga".
::q Formato largo é como a gente digita no Excel (uma coluna por região). Formato longo é como o R prefere para agrupar e fazer gráficos (uma coluna "regiao" e outra "vendas").
::s
pivot_longer(tabela, cols = colunas, names_to = "nome", values_to = "valor")
pivot_wider(tabela, id_cols = id, names_from = coluna_nomes, values_from = coluna_valores)
::p cols | quais colunas "derreter" (ex.: starts_with("vendas")).
::p names_to | nome da nova coluna que vai receber os NOMES das colunas antigas.
::p values_to | nome da nova coluna que vai receber os VALORES.
::p names_from / values_from | (wider) de onde vêm os nomes e os valores das novas colunas.
::e
library(tidyr)
df <- tibble::tibble(ano = c(2021, 2022),
                     vendas_norte = c(100, 150),
                     vendas_sul   = c(120, 180))
longo <- pivot_longer(df, cols = starts_with("vendas"),
                      names_to = "regiao", values_to = "vendas")
longo
pivot_wider(longo, names_from = regiao, values_from = vendas)
::r
# A tibble: 4 × 3
    ano regiao       vendas
  <dbl> <chr>         <dbl>
1  2021 vendas_norte    100
2  2021 vendas_sul      120
3  2022 vendas_norte    150
4  2022 vendas_sul      180
# A tibble: 2 × 3
    ano vendas_norte vendas_sul
  <dbl>        <dbl>      <dbl>
1  2021          100        120
2  2022          150        180

@@ separate() e unite()
::k tidyr
::f Linguagem R · Aula 27
::o separate() divide uma coluna em várias usando um separador; unite() junta várias colunas numa só.
::s
separate(tabela, coluna, into = c("nova1", "nova2"), sep = " ")
unite(tabela, nova, col1, col2, sep = "_")
::p into | os nomes das novas colunas.
::p sep | o separador (onde cortar ou o que colocar no meio).
::p remove = TRUE | apaga a(s) coluna(s) original(is) (padrão).
::e
library(tidyr)
df <- tibble::tibble(nome_completo = c("Alice Silva", "Carlos Souza"))
sep <- separate(df, nome_completo, into = c("nome", "sobrenome"), sep = " ")
sep
unite(sep, nome_completo, nome, sobrenome, sep = " ")

  nome   sobrenome
  <chr>  <chr>
1 Alice  Silva
2 Carlos Souza

  nome_completo
  <chr>
1 Alice Silva
2 Carlos Souza

<script type="text/plain" id="d-qcmd">@G Conceitos do modelo relacional | #c792ea | Antes dos comandos: como um banco relacional organiza os dados. Os exemplos do curso usam o banco hospital_curso.sqlite, com as tabelas MEDICO, PACIENTE e INTERNACAO.
@@ Tabela, linha e coluna
::k SQL
::f Banco de Dados · Aula 8
::o Num banco relacional os dados ficam em tabelas (relações). Cada coluna é um atributo (nome, idade) e cada linha é um registro (um paciente).
::q É como uma planilha com regras: cada coluna tem um tipo definido e um conjunto de valores aceitos (o "domínio", ex.: sexo só aceita 'F' ou 'M').
::p Tabela (relação) | conjunto de linhas com as mesmas colunas. Ex.: PACIENTE.
::p Coluna (atributo) | uma característica. Ex.: nome, sexo, cidade.
::p Linha (tupla, registro) | uma ocorrência. Ex.: a paciente Ana Silva.
::p Grau | número de colunas da tabela.
::p Cardinalidade | número de linhas da tabela.
::p Domínio | os valores válidos de uma coluna (ex.: idade entre 0 e 150).
::e
SELECT * FROM PACIENTE
::r
  id_paciente          nome  data_nasc sexo   cidade id_medico
1           1     Ana Silva 1981-04-12    F Brasília         1
2           2 Carlos Mendes 1956-09-03    M  Goiânia         2
3           3 Beatriz Costa 1968-07-25    F Brasília         1
4           4  José Almeida 1985-11-30    M Anápolis         3
5           5  Márcia Rocha 1952-03-18    F  Goiânia         2
::a Neste banco PACIENTE tem grau 6 (6 colunas) e cardinalidade 5 (5 linhas).
::v PRIMARY KEY (chave primária) | FOREIGN KEY (chave estrangeira) | Relacionamentos 1:1, 1:N e N:M
@@ PRIMARY KEY (chave primária)
::k SQL
::f Banco de Dados · Aulas 8 e 10
::o A coluna que identifica cada linha de forma única: nunca se repete e nunca fica vazia.
::q É o "CPF" da linha. id_paciente = 1 é sempre e só a Ana Silva. No SQLite, uma coluna INTEGER PRIMARY KEY é numerada sozinha (1, 2, 3…) quando você não informa o valor.
::s
CREATE TABLE TABELA (
  id_tabela INTEGER PRIMARY KEY,
  ...
)
::p INTEGER PRIMARY KEY | define a chave primária e ativa a numeração automática no SQLite.
::p PRIMARY KEY (col1, col2) | chave composta: a COMBINAÇÃO das duas colunas é que não pode se repetir.
::p Chave candidata | outra coluna que também poderia ser a PK (ex.: CPF ou CNS), mas não foi a escolhida.
::e
CREATE TABLE IF NOT EXISTS MEDICO (
  id_medico     INTEGER PRIMARY KEY,
  nome          TEXT NOT NULL,
  especialidade TEXT NOT NULL,
  crm           TEXT UNIQUE NOT NULL
)
::r
[1] 0
::a dbExecute() devolve 0 para CREATE TABLE porque nenhuma linha de dados foi alterada.
::a Tentar inserir um id repetido dá erro "UNIQUE constraint failed".
::v FOREIGN KEY (chave estrangeira) | CREATE TABLE | NOT NULL e UNIQUE
@@ FOREIGN KEY (chave estrangeira)
::k SQL
::f Banco de Dados · Aulas 8 e 10
::o Uma coluna que aponta para a chave primária de OUTRA tabela, criando a ligação entre as duas.
::q Em PACIENTE, a coluna id_medico guarda o número do médico responsável. Ela é FK porque "aponta" para MEDICO.id_medico. O banco impede cadastrar um paciente com um médico que não existe.
::s
FOREIGN KEY (coluna_local) REFERENCES OUTRA_TABELA(coluna_pk)
::p coluna_local | a coluna desta tabela que guarda a referência.
::p REFERENCES | "aponta para".
::p OUTRA_TABELA(coluna_pk) | a tabela e a chave primária de destino.
::e
CREATE TABLE IF NOT EXISTS PACIENTE (
  id_paciente INTEGER PRIMARY KEY,
  nome        TEXT NOT NULL,
  data_nasc   DATE NOT NULL,
  sexo        TEXT NOT NULL CHECK (sexo IN ('M', 'F')),
  cidade      TEXT,
  id_medico   INTEGER NOT NULL,
  FOREIGN KEY (id_medico) REFERENCES MEDICO(id_medico)
)
::r
[1] 0
::a O nome da FK NÃO precisa ser igual ao da PK: codigo_pac pode apontar para id_paciente. O que liga é o REFERENCES.
::a No SQLite, a verificação de FK só funciona depois de dbExecute(con, "PRAGMA foreign_keys = ON"), a cada conexão.
::a A FK pode aceitar NULL quando o vínculo é opcional.
::v PRIMARY KEY (chave primária) | PRAGMA foreign_keys = ON | INNER JOIN
@@ Relacionamentos 1:1, 1:N e N:M
::k SQL
::f Banco de Dados · Aula 8
::o Os três jeitos de duas tabelas se relacionarem: um para um, um para muitos e muitos para muitos.
::q 1:1 → cada paciente tem um prontuário. 1:N → um médico atende muitos pacientes (a FK fica do lado "muitos", em PACIENTE). N:M → um paciente toma vários medicamentos e um medicamento é dado a vários pacientes: precisa de uma TABELA INTERMEDIÁRIA.
::p 1:1 | a FK pode ficar em qualquer um dos lados.
::p 1:N | a FK fica na tabela do lado N (muitos).
::p N:M | cria-se uma tabela intermediária com as duas FKs (e atributos próprios, como dose e data).
::e
CREATE TABLE PRESCRICAO (
  id_paciente    INTEGER,
  id_medicamento TEXT,
  dose           TEXT,
  PRIMARY KEY (id_paciente, id_medicamento),
  FOREIGN KEY (id_paciente)    REFERENCES PACIENTE(id_paciente),
  FOREIGN KEY (id_medicamento) REFERENCES MEDICAMENTO(id_medicamento)
)
::a Esse exemplo é da teoria (Aula 8); as tabelas MEDICAMENTO e PRESCRICAO não existem no banco hospital_curso.sqlite.
::v FOREIGN KEY (chave estrangeira) | INNER JOIN
@@ -- (comentário em SQL)
::k SQL
::f Banco de Dados · Aula 12
::o Dois hífens iniciam um comentário: o resto da linha é ignorado pelo banco.
::s
-- seu comentário
::e
SELECT nome, cidade   -- só duas colunas
FROM PACIENTE
::r
           nome   cidade
1     Ana Silva Brasília
2 Carlos Mendes  Goiânia
3 Beatriz Costa Brasília
4  José Almeida Anápolis
5  Márcia Rocha  Goiânia
::a Dentro do R, o SQL está entre aspas; o # do R não funciona ali dentro, use --.

@G SQL dentro do R (DBI e RSQLite) | #4aa3ff | No curso, o SQL é escrito dentro do R. O pacote DBI dá os comandos de conexão e o RSQLite "traduz" para o SQLite, um banco que é só um arquivo .sqlite. Instale uma vez: install.packages(c("DBI", "RSQLite")).
@@ dbConnect()
::k DBI
::f Banco de Dados · Aula 10
::o Abre a conexão com o banco de dados. No SQLite, se o arquivo não existir, ele é criado vazio.
::q É "abrir a porta" do banco. O objeto con é a chave dessa porta e vai em todos os comandos seguintes.
::s
library(DBI)
library(RSQLite)
con <- dbConnect(SQLite(), dbname = "arquivo.sqlite")
::p SQLite() | o "driver": diz que tipo de banco é.
::p dbname | o nome do arquivo do banco (na pasta de trabalho).
::p con <- | guarda a conexão. Pode ter outro nome, mas o curso usa con.
::e
library(DBI)
library(RSQLite)
con <- dbConnect(SQLite(), dbname = "hospital_curso.sqlite")
dbExecute(con, "PRAGMA foreign_keys = ON")
dbListTables(con)
::r
[1] 0
[1] "INTERNACAO" "MEDICO"     "PACIENTE"
::a Se dbListTables() vier vazio (character(0)), você provavelmente está na pasta errada e o SQLite criou um banco NOVO e vazio. Confira getwd().
::a O ciclo de toda operação: 1) dbConnect, 2) dbExecute/dbGetQuery, 3) dbDisconnect.
::v dbExecute() | dbGetQuery() | dbDisconnect() e dbIsValid() | PRAGMA foreign_keys = ON
@@ PRAGMA foreign_keys = ON
::k DBI
::f Banco de Dados · Aulas 10 e 11
::o Liga, no SQLite, a verificação das chaves estrangeiras (FK). Sem isso, o banco aceita referências inválidas.
::s
dbExecute(con, "PRAGMA foreign_keys = ON")
::r
[1] 0
::a Precisa ser executado toda vez que você abrir uma nova conexão.
::v FOREIGN KEY (chave estrangeira) | dbConnect()
@@ dbExecute()
::k DBI
::f Banco de Dados · Aula 10
::o Envia ao banco um comando que ALTERA algo (CREATE, INSERT, UPDATE, DELETE, PRAGMA) e devolve quantas linhas foram afetadas.
::q Regra simples: comandos que criam/mudam → dbExecute(); comandos que perguntam (SELECT) → dbGetQuery().
::s
dbExecute(con, "comando SQL")
::p con | a conexão aberta.
::p "comando SQL" | o comando, entre aspas duplas. Textos dentro do SQL usam aspas simples: 'Oncologia'.
::e
dbExecute(con, "INSERT INTO MEDICO (nome, especialidade, crm)
                VALUES ('Dra. Carla Lima', 'Oncologia', 'CRM-GO-12345')")
::r
[1] 1
::a O [1] 1 significa "1 linha inserida". Para CREATE TABLE, o retorno é 0.
::a Aspas: duplas por fora (string do R) e simples por dentro (texto do SQL). Misturar dá erro.
::v dbGetQuery() | INSERT INTO | CREATE TABLE
@@ dbGetQuery()
::k DBI
::f Banco de Dados · Aulas 10 a 12
::o Envia uma consulta SELECT ao banco e devolve o resultado como um data frame do R.
::q Depois disso, o resultado é um data frame comum: você pode guardar numa variável e usar head(), nrow(), dplyr, gráficos…
::s
resultado <- dbGetQuery(con, "SELECT ... FROM ...")
::e
medicos <- dbGetQuery(con, "SELECT * FROM MEDICO")
medicos
class(medicos)
::r
  id_medico                nome especialidade          crm
1         1     Dra. Carla Lima     Oncologia CRM-GO-12345
2         2    Dr. Rafael Sousa   Pneumologia CRM-GO-67890
3         3 Dra. Fernanda Neves   Cardiologia CRM-GO-11223
[1] "data.frame"
::a Consultas longas podem ocupar várias linhas dentro das aspas; isso facilita a leitura.
::a Para montar uma consulta com valores de variáveis do R, use paste0(): dbGetQuery(con, paste0("SELECT * FROM PACIENTE WHERE id_paciente IN (", ids, ")")).
::v dbExecute() | SELECT e FROM
@@ dbWriteTable()
::k DBI
::f Banco de Dados · Aulas 10 e 18
::o Grava um data frame do R inteiro como tabela no banco (criando, substituindo ou acrescentando linhas).
::q Em vez de vários INSERT, você manda a tabela pronta de uma vez. É o caminho do "pipeline R → SQL" da Aula 18.
::s
dbWriteTable(con, "NOME_TABELA", data_frame, append = FALSE, overwrite = FALSE, row.names = FALSE)
::p "NOME_TABELA" | o nome da tabela no banco.
::p append = TRUE | acrescenta as linhas numa tabela que já existe.
::p overwrite = TRUE | apaga a tabela antiga e grava de novo.
::p row.names = FALSE | não grava os nomes das linhas do R.
::e
novos <- data.frame(
  nome = c("Pedro", "Sofia"), data_nasc = c("1990-06-20", "2001-12-05"),
  sexo = c("M", "F"), cidade = c("Goiânia", "Brasília"), id_medico = c(1, 3)
)
dbWriteTable(con, "PACIENTE", novos, append = TRUE, row.names = FALSE)
::a Com append = TRUE, os nomes das colunas do data frame precisam bater com os da tabela.
::v dbExecute() | INSERT INTO
@@ dbListTables() e dbListFields()
::k DBI
::f Banco de Dados · Aula 10
::o dbListTables() lista as tabelas do banco; dbListFields() lista as colunas de uma tabela.
::s
dbListTables(con)
dbListFields(con, "NOME_TABELA")
dbGetQuery(con, "PRAGMA table_info(NOME_TABELA)")   # detalhado
::e
dbListTables(con)
dbListFields(con, "MEDICO")
::r
[1] "INTERNACAO" "MEDICO"     "PACIENTE"
[1] "id_medico"     "nome"          "especialidade" "crm"
::v dbConnect()
@@ dbDisconnect() e dbIsValid()
::k DBI
::f Banco de Dados · Aula 10
::o dbDisconnect() fecha a conexão com o banco; dbIsValid() diz se ela ainda está aberta.

::e

dbDisconnect(con)

@G Criar tabelas e inserir dados | #ff9f43 | CREATE TABLE define a estrutura (colunas, tipos e regras); INSERT INTO coloca os dados. No R, os dois são enviados com dbExecute().
@@ CREATE TABLE
::k SQL
::f Banco de Dados · Aula 10
::o Cria uma tabela nova, dizendo o nome, o tipo e as regras de cada coluna.
::q É o "molde" da tabela. IF NOT EXISTS evita erro se você rodar o código de novo.
::s
CREATE TABLE IF NOT EXISTS NOME (
  coluna1 TIPO REGRAS,
  coluna2 TIPO REGRAS,
  ...
)
::p IF NOT EXISTS | só cria se a tabela ainda não existir.
::p INTEGER | números inteiros (1, 42, 2024).
::p REAL | números decimais (1.75).
::p TEXT | texto de qualquer tamanho ('Ana Silva', 'J18.1').
::p DATE | datas (guardadas como texto 'AAAA-MM-DD').
::p BLOB | dados binários (arquivos, imagens).
::p , | separa as colunas. A última coluna (ou regra) NÃO leva vírgula.
::e
CREATE TABLE IF NOT EXISTS INTERNACAO (
  id_internacao   INTEGER PRIMARY KEY,
  data_entrada    DATE NOT NULL,
  data_saida      DATE,
  cid10_principal TEXT NOT NULL,
  id_paciente     INTEGER NOT NULL,
  FOREIGN KEY (id_paciente) REFERENCES PACIENTE(id_paciente)
)
::r
[1] 0
::a data_saida sem NOT NULL é proposital: fica vazia (NULL) enquanto o paciente está internado.
::a Erro clássico: vírgula sobrando depois da última coluna, antes do ")".
::v PRIMARY KEY (chave primária) | NOT NULL e UNIQUE | CHECK | INSERT INTO
@@ NOT NULL e UNIQUE
::k SQL
::f Banco de Dados · Aula 10
::o Regras de coluna: NOT NULL proíbe deixar vazio; UNIQUE proíbe valores repetidos.
::s
coluna TIPO NOT NULL   coluna TIPO UNIQUE   coluna TIPO UNIQUE NOT NULL
::e
crm TEXT UNIQUE NOT NULL
::a Inserir NULL numa coluna NOT NULL dá "NOT NULL constraint failed"; repetir um valor UNIQUE dá "UNIQUE constraint failed".
::v CHECK | CREATE TABLE
@@ CHECK
::k SQL
::f Banco de Dados · Aula 10
::o Restringe os valores aceitos numa coluna a uma condição (restrição de domínio).
::s
coluna TIPO CHECK (condição)
::e
sexo TEXT NOT NULL CHECK (sexo IN ('M', 'F'))
::a Inserir 'X' em sexo dá erro "CHECK constraint failed".
::v NOT NULL e UNIQUE | IN e NOT IN
@@ INSERT INTO
::k SQL
::f Banco de Dados · Aula 10
::o Insere uma (ou mais) linha(s) numa tabela.
::q Você lista as colunas e, na mesma ordem, os valores. A chave primária INTEGER pode ser omitida: o SQLite numera sozinho.
::s
INSERT INTO TABELA (col1, col2, ...) VALUES (valor1, valor2, ...)
::p (col1, col2) | as colunas que você vai preencher.
::p VALUES (…) | os valores, na mesma ordem. Textos e datas entre aspas simples.
::p coluna omitida | fica NULL (ou numerada, se for a PK).
::e
INSERT INTO PACIENTE (nome, data_nasc, sexo, cidade, id_medico)
VALUES ('Ana Silva', '1981-04-12', 'F', 'Brasília', 1)
::r
[1] 1
::a Para deixar um campo vazio, simplesmente não coloque a coluna na lista (ex.: internação em aberto, sem data_saida).
::a Com PRAGMA foreign_keys = ON, inserir id_medico = 999 (que não existe) dá "FOREIGN KEY constraint failed".
::v dbExecute() | dbWriteTable() | CREATE TABLE

@G Consultar dados | #6bd66b | SELECT é a pergunta; WHERE é o filtro; ORDER BY ordena; LIMIT limita. A ordem de escrita é sempre SELECT → FROM → WHERE → ORDER BY → LIMIT.
@@ SELECT e FROM
::k SQL
::f Banco de Dados · Aula 10
::o SELECT escolhe as colunas que você quer ver; FROM diz de qual tabela.
::q "Mostre o nome e a cidade, da tabela PACIENTE". O asterisco * significa "todas as colunas".
::s
SELECT coluna1, coluna2 FROM TABELA
SELECT * FROM TABELA
::p SELECT | quais colunas, separadas por vírgula.
::p * | todas as colunas.
::p FROM | de qual tabela.
::e
SELECT nome, especialidade
FROM MEDICO
::r
                 nome especialidade
1     Dra. Carla Lima     Oncologia
2    Dr. Rafael Sousa   Pneumologia
3 Dra. Fernanda Neves   Cardiologia
::a Em bases reais (DATASUS) com dezenas de colunas, evite SELECT *: escolha só as colunas necessárias.
::a Não há vírgula depois da última coluna, antes do FROM.
::v WHERE | AS (apelido) | dbGetQuery()
@@ AS (apelido)
::k SQL
::f Banco de Dados · Aulas 11 e 12
::o Dá um apelido temporário a uma coluna ou tabela no resultado da consulta.
::q Não muda nada no banco, só o nome que aparece no data frame. Em JOINs, apelidos curtos para tabelas (p, m, i) deixam o código bem mais legível.
::s
SELECT coluna AS apelido FROM TABELA
FROM TABELA AS t
::e
SELECT nome AS nome_paciente, cidade AS municipio
FROM PACIENTE
::r
  nome_paciente municipio
1     Ana Silva  Brasília
2 Carlos Mendes   Goiânia
3 Beatriz Costa  Brasília
4  José Almeida  Anápolis
5  Márcia Rocha   Goiânia
::v SELECT e FROM | INNER JOIN | rename()
@@ WHERE
::k SQL
::f Banco de Dados · Aula 11
::o Filtra as linhas: só aparecem as que satisfazem a condição.
::q O banco testa a condição em cada linha e devolve só as verdadeiras. Equivale ao filter() do dplyr.
::s
SELECT colunas
FROM TABELA
WHERE condição
::p condição | comparações com =, <>, >, <, IN, LIKE, IS NULL, BETWEEN… combinadas com AND e OR.
::e
SELECT nome, data_nasc, cidade
FROM PACIENTE
WHERE sexo = 'F'
::r
           nome  data_nasc   cidade
1     Ana Silva 1981-04-12 Brasília
2 Beatriz Costa 1968-07-25 Brasília
3  Márcia Rocha 1952-03-18  Goiânia
::a Em SQL a igualdade é com UM sinal: sexo = 'F' (no R seria ==).
::a Textos entre aspas simples. Dependendo de como o banco foi criado, 'Brasilia' e 'Brasília' são valores diferentes.
::v = <> != > < >= <= | AND, OR e parênteses | filter()
@@ = <> != > < >= <=
::k SQL
::f Banco de Dados · Aula 11
::o Operadores de comparação usados no WHERE e no HAVING.
::p = | igual (só um sinal).
::p <> ou != | diferente.
::p > < >= <= | maior, menor, maior ou igual, menor ou igual.
::e
SELECT nome, cidade
FROM PACIENTE
WHERE cidade <> 'Brasília'
::r
           nome   cidade
1 Carlos Mendes  Goiânia
2  José Almeida Anápolis
3  Márcia Rocha  Goiânia
::v WHERE | == != > < >= <= (comparação)
@@ AND, OR e parênteses
::k SQL
::f Banco de Dados · Aula 11
::o Combinam condições: AND exige todas verdadeiras; OR exige pelo menos uma.
::q Ao misturar AND e OR, use parênteses: assim como na matemática, o AND é avaliado antes do OR e pode gerar resultados inesperados.
::s
WHERE cond1 AND (cond2 OR cond3)
::e
SELECT nome, sexo, cidade
FROM PACIENTE
WHERE sexo = 'F'
  AND (cidade = 'Brasília' OR cidade = 'Goiânia')
::r
           nome sexo   cidade
1     Ana Silva    F Brasília
2 Beatriz Costa    F Brasília
3  Márcia Rocha    F  Goiânia
::v IN e NOT IN | & | ! (lógicos E, OU, NÃO)
@@ IN e NOT IN
::k SQL
::f Banco de Dados · Aula 11
::o Testa se o valor pertence (IN) ou não pertence (NOT IN) a uma lista.
::q Mais legível que encadear vários OR. É o %in% do R.
::s
WHERE coluna IN ('valor1', 'valor2')
::e
SELECT id_internacao, cid10_principal
FROM INTERNACAO
WHERE cid10_principal NOT IN ('J18.1', 'J45', 'I10', 'I21')
::r
  id_internacao cid10_principal
1             2             E11
::v %in% | AND, OR e parênteses
@@ LIKE
::k SQL
::f Banco de Dados · Aula 11
::o Busca parcial em texto usando curingas: % significa "qualquer coisa" e _ significa "exatamente um caractere".
::q 'J%' = começa com J. '%Silva%' = contém Silva em qualquer posição. 'J1_' = J1 seguido de um caractere qualquer.
::s
WHERE coluna LIKE 'padrão'
::p % | qualquer sequência de caracteres (inclusive nenhuma).
::p _ | exatamente um caractere.
::e
SELECT id_internacao, cid10_principal, data_entrada
FROM INTERNACAO
WHERE cid10_principal LIKE 'J%'
::r
  id_internacao cid10_principal data_entrada
1             1           J18.1   2024-01-10
2             4             J45   2024-03-01
::a No SQLite, LIKE não diferencia maiúsculas de minúsculas em letras sem acento, mas diferencia nas acentuadas.
::v grep() e grepl() | str_detect(), str_locate() e str_count()
@@ IS NULL e IS NOT NULL
::k SQL
::f Banco de Dados · Aula 11
::o Testam se um campo está vazio (IS NULL) ou preenchido (IS NOT NULL).
::q NULL é a ausência de valor (o NA do R). Comparar com = NULL nunca funciona: o resultado é "desconhecido" e a linha não aparece.
::s
WHERE coluna IS NULL
::e
SELECT id_internacao, data_entrada, cid10_principal, id_paciente
FROM INTERNACAO
WHERE data_saida IS NULL
::r
  id_internacao data_entrada cid10_principal id_paciente
1             4   2024-03-01             J45           1
::a WHERE data_saida = NULL não dá erro, mas devolve zero linhas. Sempre use IS NULL.
::v is.na() e !is.na() | LEFT JOIN
@@ BETWEEN
::k SQL
::f Banco de Dados · Aula 11
::o Filtra valores dentro de um intervalo, incluindo os dois extremos.
::s
WHERE coluna BETWEEN inicio AND fim
::e
SELECT id_internacao, data_entrada, cid10_principal
FROM INTERNACAO
WHERE data_entrada BETWEEN '2024-01-01' AND '2024-02-28'
::r
  id_internacao data_entrada cid10_principal
1             1   2024-01-10           J18.1
2             2   2024-01-12             E11
3             3   2024-02-03             I10
::a Datas funcionam porque o SQLite as guarda como texto 'AAAA-MM-DD', e nesse formato a ordem alfabética coincide com a cronológica.
::v WHERE | AND, OR e parênteses
@@ ORDER BY ASC / DESC
::k SQL
::f Banco de Dados · Aula 11
::o Ordena o resultado por uma ou mais colunas: ASC crescente (padrão) ou DESC decrescente.
::q Sem ORDER BY o banco não garante ordem nenhuma. Com várias colunas, a segunda só desempata a primeira.
::s
ORDER BY coluna1 ASC, coluna2 DESC
::e
SELECT nome, sexo, cidade
FROM PACIENTE
ORDER BY cidade ASC, nome ASC
::r
           nome sexo   cidade
1  José Almeida    M Anápolis
2     Ana Silva    F Brasília
3 Beatriz Costa    F Brasília
4 Carlos Mendes    M  Goiânia
5  Márcia Rocha    F  Goiânia
::v LIMIT e OFFSET | arrange() e desc() | sort() e order()
@@ LIMIT e OFFSET
::k SQL
::f Banco de Dados · Aula 11
::o LIMIT devolve só as n primeiras linhas; OFFSET pula algumas linhas antes de começar.
::q Combinado com ORDER BY responde "qual a internação mais recente?" (ORDER BY data DESC LIMIT 1). Sem ORDER BY, as linhas escolhidas podem variar.
::s
ORDER BY coluna LIMIT n OFFSET m
::e
SELECT id_internacao, data_entrada, cid10_principal
FROM INTERNACAO
ORDER BY data_entrada DESC
LIMIT 2 OFFSET 1
::r
  id_internacao data_entrada cid10_principal
1             4   2024-03-01             J45
2             3   2024-02-03             I10
::a LIMIT 2 OFFSET 1 = "pule a 1ª e traga as 2 seguintes" (a 2ª e a 3ª mais recentes).
::v ORDER BY ASC / DESC | slice(), slice_head() e slice_sample()
@@ DISTINCT
::k SQL
::f Banco de Dados · Aula 17 (tabela dplyr ↔ SQL)
::o Remove repetições do resultado, mostrando cada combinação de valores uma vez só.
::s
SELECT DISTINCT coluna FROM TABELA
::e
SELECT DISTINCT cidade
FROM PACIENTE
ORDER BY cidade
::r
    cidade
1 Anápolis
2 Brasília
3  Goiânia
::v distinct() | unique()

@G Juntar, agrupar e resumir | #e056a0 | JOIN junta tabelas pelas chaves; funções de agregação resumem; GROUP BY faz o resumo por grupo; HAVING filtra grupos.
@@ INNER JOIN
::k SQL
::f Banco de Dados · Aula 12
::o Junta duas tabelas pela coluna em comum e mostra só as linhas que têm par nos DOIS lados.
::q Leia como uma frase: "da tabela PACIENTE, una com MEDICO onde o id_medico coincide". Paciente sem médico válido ou médico sem paciente não aparecem.
::s
SELECT a.coluna, b.coluna
FROM TABELA_A AS a
INNER JOIN TABELA_B AS b ON a.chave = b.chave
::p FROM … AS a | a tabela da esquerda e seu apelido.
::p INNER JOIN … AS b | a tabela que será unida (JOIN sozinho também significa INNER JOIN).
::p ON a.chave = b.chave | a regra de ligação: normalmente FK = PK.
::p a.coluna | "a coluna da tabela a": obrigatório quando as duas tabelas têm colunas com o mesmo nome (ex.: nome).
::e
SELECT p.nome AS paciente, p.cidade, m.nome AS medico, m.especialidade
FROM PACIENTE AS p
INNER JOIN MEDICO AS m ON p.id_medico = m.id_medico
::r
       paciente   cidade              medico especialidade
1     Ana Silva Brasília     Dra. Carla Lima     Oncologia
2 Carlos Mendes  Goiânia    Dr. Rafael Sousa   Pneumologia
3 Beatriz Costa Brasília     Dra. Carla Lima     Oncologia
4  José Almeida Anápolis Dra. Fernanda Neves   Cardiologia
5  Márcia Rocha  Goiânia    Dr. Rafael Sousa   Pneumologia
::a Erro "ambiguous column name: nome" = as duas tabelas têm a coluna nome. Use o prefixo p.nome ou m.nome.
::v LEFT JOIN | JOIN com 3 tabelas | left_join(), inner_join(), right_join(), full_join()
@@ LEFT JOIN
::k SQL
::f Banco de Dados · Aula 12
::o Junta duas tabelas mantendo TODAS as linhas da tabela da esquerda; onde não há par, as colunas da direita ficam NULL.
::q "Todos os pacientes, internados ou não." Truque: LEFT JOIN + WHERE coluna_da_direita IS NULL encontra quem NUNCA teve par (pacientes nunca internados).
::s
SELECT ...
FROM ESQUERDA AS a
LEFT JOIN DIREITA AS b ON a.chave = b.chave
::e
SELECT p.nome AS paciente, p.cidade, i.id_internacao
FROM PACIENTE AS p
LEFT JOIN INTERNACAO AS i ON p.id_paciente = i.id_paciente
ORDER BY p.nome
::r
       paciente   cidade id_internacao
1     Ana Silva Brasília             1
2     Ana Silva Brasília             4
3 Beatriz Costa Brasília             3
4 Carlos Mendes  Goiânia             2
5  José Almeida Anápolis            NA
6  Márcia Rocha  Goiânia             5
::a José Almeida aparece com NA porque não tem internação. No INNER JOIN ele sumiria.
::a Ana Silva aparece duas vezes porque tem duas internações: o JOIN repete a linha da esquerda para cada par encontrado.
::v INNER JOIN | IS NULL e IS NOT NULL | semi_join() e anti_join()
@@ JOIN com 3 tabelas
::k SQL
::f Banco de Dados · Aula 12
::o Encadeia vários JOINs: cada novo JOIN acrescenta uma tabela usando a chave em comum.
::q INTERNACAO → PACIENTE (por id_paciente) → MEDICO (por id_medico). Assim você vê cada internação com o nome do paciente e do médico.
::s
FROM A AS a
INNER JOIN B AS b ON a.chave_ab = b.chave_ab
INNER JOIN C AS c ON b.chave_bc = c.chave_bc
::e
SELECT i.id_internacao, i.data_entrada, p.nome AS paciente, m.nome AS medico
FROM INTERNACAO AS i
INNER JOIN PACIENTE AS p ON i.id_paciente = p.id_paciente
INNER JOIN MEDICO   AS m ON p.id_medico   = m.id_medico
ORDER BY i.data_entrada DESC
::r
  id_internacao data_entrada      paciente           medico
1             5   2024-03-15  Márcia Rocha Dr. Rafael Sousa
2             4   2024-03-01     Ana Silva  Dra. Carla Lima
3             3   2024-02-03 Beatriz Costa  Dra. Carla Lima
4             2   2024-01-12 Carlos Mendes Dr. Rafael Sousa
5             1   2024-01-10     Ana Silva  Dra. Carla Lima
::v INNER JOIN | GROUP BY
@@ COUNT, SUM, AVG, MIN e MAX
::k SQL
::f Banco de Dados · Aula 12
::o Funções de agregação: resumem várias linhas num único valor (contagem, soma, média, mínimo, máximo).
::q COUNT(*) conta TODAS as linhas; COUNT(coluna) conta só as linhas em que aquela coluna está preenchida. A diferença entre os dois mostra quantos NULL existem.
::s
SELECT COUNT(*), COUNT(col), SUM(col), AVG(col), MIN(col), MAX(col)
FROM TABELA
::p COUNT(*) | número de linhas (inclui as que têm NULL).
::p COUNT(coluna) | linhas com valor não nulo naquela coluna.
::p SUM / AVG | soma e média.
::p MIN / MAX | menor e maior (também funcionam com datas e textos).
::e
SELECT COUNT(*)                    AS total_internacoes,
       COUNT(data_saida)           AS encerradas,
       COUNT(*) - COUNT(data_saida) AS em_aberto,
       MIN(data_entrada)           AS mais_antiga,
       MAX(data_entrada)           AS mais_recente
FROM INTERNACAO
::r
  total_internacoes encerradas em_aberto mais_antiga mais_recente
1                 5          4         1  2024-01-10   2024-03-15
::v GROUP BY | ROUND() | group_by() e summarise()
@@ GROUP BY
::k SQL
::f Banco de Dados · Aula 12
::o Agrupa as linhas que têm o mesmo valor numa coluna, para calcular as agregações (COUNT, AVG…) por grupo.
::q Sem GROUP BY, COUNT(*) conta a tabela inteira; com GROUP BY cidade, conta POR cidade. É o group_by() + summarise() do dplyr.
::s
SELECT coluna_grupo, COUNT(*) AS n
FROM TABELA
GROUP BY coluna_grupo
::p Regra de ouro | toda coluna do SELECT que NÃO for uma agregação precisa estar no GROUP BY.
::e
SELECT cidade, COUNT(*) AS qtd
FROM PACIENTE
GROUP BY cidade
ORDER BY qtd DESC, cidade
::r
    cidade qtd
1 Brasília   2
2  Goiânia   2
3 Anápolis   1
::a O ORDER BY pode usar o apelido criado no SELECT (qtd).
::a Para agrupar por médico, inclua o id e o nome no GROUP BY (GROUP BY m.id_medico, m.nome): dois médicos podem ter o mesmo nome.
::v HAVING | COUNT, SUM, AVG, MIN e MAX | group_by() e summarise()
@@ HAVING
::k SQL
::f Banco de Dados · Aula 12
::o Filtra GRUPOS depois do GROUP BY, usando o resultado das agregações.
::q Analogia da aula: o WHERE é o porteiro que decide quem entra na festa (filtra linhas antes); o HAVING é o segurança que, com todo mundo sentado, decide quais MESAS ficam (filtra grupos depois).
::s
SELECT coluna, COUNT(*)
FROM TABELA
WHERE condição_das_linhas      -- antes de agrupar
GROUP BY coluna
HAVING condição_dos_grupos     -- depois de agrupar
::e
SELECT cidade, COUNT(*) AS qtd
FROM PACIENTE
GROUP BY cidade
HAVING COUNT(*) > 1
ORDER BY cidade
::r
    cidade qtd
1 Brasília   2
2  Goiânia   2
::a WHERE COUNT(*) > 1 dá erro: o WHERE roda antes das agregações existirem. Agregação no filtro → HAVING.
::v GROUP BY | WHERE | Ordem das cláusulas
@@ ROUND()
::k SQL
::f Banco de Dados · Aulas 12 e 18
::o Arredonda um número com a quantidade de casas decimais que você escolher.
::s
ROUND(valor, casas)
::e
SELECT cidade, COUNT(*) AS n, ROUND(COUNT(*) * 100.0 / 5, 1) AS pct
FROM PACIENTE
GROUP BY cidade
::r
    cidade n pct
1 Anápolis 1  20
2 Brasília 2  40
3  Goiânia 2  40
::a Divisão de inteiros no SQLite descarta as casas decimais: 3 / 5 = 0. Multiplique por 100.0 (com ponto) para forçar decimal.
::v COUNT, SUM, AVG, MIN e MAX | round(), ceiling() e floor()
@@ Ordem das cláusulas
::k SQL
::f Banco de Dados · Aula 12
::o A ordem em que as partes de uma consulta precisam ser ESCRITAS, e a ordem em que o banco as EXECUTA.
::q Escrita: SELECT → FROM → JOIN → WHERE → GROUP BY → HAVING → ORDER BY → LIMIT. Execução: FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY → LIMIT. Por isso o WHERE não enxerga agregações e o ORDER BY enxerga os apelidos do SELECT.
::s
SELECT    o que mostrar
FROM      de onde vem
JOIN      unir tabelas
WHERE     filtrar linhas
GROUP BY  agrupar
HAVING    filtrar grupos
ORDER BY  ordenar
LIMIT     limitar
::e
SELECT m.especialidade, COUNT(i.id_internacao) AS total
FROM INTERNACAO AS i
INNER JOIN PACIENTE AS p ON i.id_paciente = p.id_paciente
INNER JOIN MEDICO   AS m ON p.id_medico   = m.id_medico
WHERE i.data_saida IS NOT NULL
GROUP BY m.especialidade
HAVING COUNT(i.id_internacao) >= 1
ORDER BY total DESC, m.especialidade
LIMIT 3
::r
  especialidade total
1     Oncologia     2
2   Pneumologia     2
::a Inverter a ordem (ex.: WHERE depois do GROUP BY) dá erro de sintaxe ("syntax error").
::v dplyr ↔ SQL (equivalências)
@@ dplyr ↔ SQL (equivalências)
::k SQL
::f Banco de Dados · Aulas 17 e 18
::o Tabela de tradução entre os verbos do dplyr e as cláusulas do SQL: a lógica é a mesma.
::q Quem entende um, entende o outro. A Aula 18 faz a mesma análise nas duas linguagens e obtém o mesmo resultado.
::p filter(cond) | WHERE cond
::p select(cols) | SELECT cols
::p arrange(col) / arrange(desc(col)) | ORDER BY col / ORDER BY col DESC
::p slice_head(n = k) | LIMIT k
::p group_by(col) | GROUP BY col
::p summarise(n = n(), m = mean(x)) | COUNT(*), AVG(x)
::p filter() depois do summarise() | HAVING
::p inner_join(b, by = "k") | INNER JOIN b ON a.k = b.k
::p left_join(b, by = "k") | LEFT JOIN b ON a.k = b.k
::p rename(novo = antigo) | antigo AS novo
::p distinct(col) | SELECT DISTINCT col
::p count(col) | SELECT col, COUNT(*) … GROUP BY col
::e
# dplyr
pacientes |>
  group_by(cidade) |>
  summarise(qtd = n()) |>
  filter(qtd > 1) |>
  arrange(desc(qtd))
# SQL equivalente
dbGetQuery(con, "
  SELECT cidade, COUNT(*) AS qtd
  FROM PACIENTE
  GROUP BY cidade
  HAVING COUNT(*) > 1
  ORDER BY qtd DESC")
::v filter() | group_by() e summarise() | GROUP BY | HAVING
</script>
<script type="text/plain" id="d-rprob">@G Básico: entrada, saída e contas | #4aa3ff | Exercícios da Lista de Fixação I (Programação · Aula 8) e dos slides de vetores.
@@ Peça o nome do usuário e mostre uma saudação.
::f Programação · Aula 8
::c readline, cat, <- (atribuição)
::o Preciso (1) perguntar e guardar a resposta numa variável e (2) mostrar uma frase juntando texto fixo com a variável.
::p readline("…") | mostra a pergunta e espera a pessoa digitar.
::p nome <- | guarda o que foi digitado.
::p cat(…) | junta os pedaços com espaço entre eles.
::p "\n" | pula para a linha de baixo no final.
::e
nome <- readline("Digite seu nome: ")
cat("Olá,", nome, "! Seja bem-vindo(a).\n")
::r
Digite seu nome: Thiago
Olá, Thiago ! Seja bem-vindo(a).
::a Para não sobrar o espaço antes do "!", use paste0: cat(paste0("Olá, ", nome, "! Seja bem-vindo(a).\n")).
@@ Troque o conteúdo de a = 10 e b = 5 e mostre antes e depois.
::f Programação · Aula 8
::c <- (atribuição), cat
::o Se eu fizer a <- b direto, o 10 se perde. Preciso de uma terceira "caixa" (temp) para segurar o valor de a durante a troca.
::p temp <- a | cópia de segurança do valor de a.
::p a <- b | agora a vale 5 (o 10 só existe em temp).
::p b <- temp | b recebe o 10.
::e
a <- 10
b <- 5
cat("Antes: a =", a, "e b =", b, "\n")
temp <- a     # guarda o 10
a <- b        # a recebe 5
b <- temp     # b recebe o 10 guardado
cat("Depois: a =", a, "e b =", b, "\n")
::r
Antes: a = 10 e b = 5
Depois: a = 5 e b = 10
@@ Leia o peso em kg e mostre em libras (1 kg = 2,20462 lb).
::f Programação · Aula 8
::c readline, as.numeric, cat
::o O readline traz texto; preciso converter para número antes de multiplicar.
::p as.numeric(readline(…)) | lê e já converte para número numa linha só.
::p 2.20462 | no R o decimal é ponto, não vírgula.
::e
peso_kg <- as.numeric(readline("Digite o seu peso em kg: "))   # digite 60
peso_lb <- peso_kg * 2.20462
cat(peso_kg, "kg equivalem a", peso_lb, "libras\n")
::r
Digite o seu peso em kg: 60
60 kg equivalem a 132.2772 libras
@@ Leia um saldo e mostre o novo saldo com reajuste de 1%.
::f Programação · Aula 8
::c readline, as.numeric, cat
::o Aumentar 1% é multiplicar por 1,01 (100% + 1%).
::p saldo * 1.01 | o mesmo que saldo + saldo * 0.01.

@@ (Atividade avaliativa) Monte a matriz de casos de Chikungunya em Goiás (anos × faixas etárias), some por ano e por faixa e descubra a faixa e o ano com mais casos.
::f Atividade avaliativa (RMD)
::c matrix, Acessar matriz: m[linha, coluna], colSums() e rowSums(), rbind() e cbind(), colnames() e rownames(), min(), max(), which.min() e which.max()
::o O vetor tem, para cada ano, 13 valores: o ano, uma coluna de ignorados e as 11 faixas. Dobro o vetor numa matriz de 13 colunas (byrow = TRUE) e fico só com as colunas 3 a 13. Depois uso rowSums/colSums e which.max para responder.
::p matrix(…, ncol = 13, byrow = TRUE) | cada linha da matriz é um ano (13 valores por ano).
::p completa[, 3:13] | descarta a coluna do ano (1) e a de ignorados (2).

::p cbind(…, "Total Ano" = …) | coluna de totais à direita.
::p rbind(…, "Total Idade" = …) | linha de totais embaixo (com o total geral no canto).
::e
dados_goias <- c(2017,NA,23,15,27,35,55,269,238,29,17,18,5,
                 2018,NA,8,6,24,30,46,221,165,19,12,12,3,
                 2019,NA,4,11,14,30,29,148,106,13,7,17,3,
                 2020,NA,18,6,16,11,16,115,71,13,6,5,3,
                 2021,3,22,15,32,38,51,367,372,50,34,37,14,
                 2022,NA,60,107,180,258,289,1929,2476,389,332,342,101,
                 2023,1,35,80,130,187,269,1445,1369,222,170,181,61,
                 2024,1,43,125,240,328,491,2477,2799,508,429,535,244)
completa <- matrix(dados_goias, ncol = 13, byrow = TRUE)
goias <- completa[, 3:13]                       # só as faixas etárias

                     "40-59","60-64","65-69","70-79","80 e +")
total_ano <- rowSums(goias)
total_faixa <- colSums(goias)
total_ano
names(which.max(total_faixa))     # faixa com mais casos
names(which.max(total_ano))       # ano com mais casos
goias_final <- rbind(cbind(goias, "Total Ano" = total_ano),

@@ (Aula 17) Crie a faixa etária (< 50, 50-64, 65+) e o tempo em meses, e resuma a sobrevida por sexo.
::f Banco de Dados · Aula 17
::c case_when(), mutate(), group_by() e summarise(), n() e ungroup()
::p TEMPO / 30.4 | converte dias em meses.
::p mean(CENSURA) * 100 | CENSURA é 0/1: a média vezes 100 é o % de óbitos.
::e
library(dplyr)
dados_tratados <- dados |>
  mutate(
    SEXO_LABEL = if_else(SEXO == 1, "Masculino", "Feminino"),
    TEMPO_MESES = round(TEMPO / 30.4, 1),
    FAIXA_ETARIA = case_when(
      IDADE < 50 ~ "Menos de 50",
      IDADE >= 50 & IDADE < 65 ~ "50 a 64",
      IDADE >= 65 ~ "65 ou mais"
    )
  )
dados_tratados |>
  group_by(SEXO_LABEL) |>
  summarise(n = n(),
            idade_media = round(mean(IDADE), 1),
            sobrevida_mediana = median(TEMPO_MESES),
            pct_obito = round(mean(CENSURA) * 100, 1),
            .groups = "drop")

@@ (Aula 15) Una dados clínicos (CSV), laboratoriais (Excel) e internações (SQLite) e audite quem ficou sem par.
::f Banco de Dados · Aula 15
::c left_join(), inner_join(), right_join(), full_join(), semi_join() e anti_join(), dbGetQuery(), anyDuplicated()
::o Antes de juntar: (1) a chave é única? (2) tem o mesmo tipo nas duas bases? (3) quem não tem par? Depois: conferir nrow() e NA.
::p anyDuplicated(…) | se não for 0, as linhas vão se multiplicar no join.
::p anti_join(A, B) | quem está em A e não está em B.
::p left_join encadeado | parte das internações e vai acrescentando informações.

library(dplyr)
anyDuplicated(dados_lab$id_paciente)                 # 0 = ok
class(dados_clinicos$id_paciente) == class(dados_lab$id_paciente)
anti_join(dados_clinicos, dados_lab, by = "id_paciente")   # clínicos sem exame

analise <- internacoes |>
  left_join(dados_clinicos, by = "id_paciente") |>
  left_join(dados_lab, by = "id_paciente")
nrow(internacoes) == nrow(analise)                   # o join não multiplicou linhas?

@@ Explique a diferença entre PK e FK e identifique-as na tabela CONSULTA (id_consulta, data_consulta, cid10, id_paciente, id_medico).
::f Banco de Dados · Aula 9
::c PRIMARY KEY (chave primária), FOREIGN KEY (chave estrangeira)
::o A PK identifica cada linha da própria tabela; a FK aponta para a PK de outra tabela. Em CONSULTA, id_consulta é única (PK); id_paciente e id_medico repetem e apontam para PACIENTE e MEDICO (FKs).
::p id_consulta PRIMARY KEY | não se repete nem fica vazia: cada consulta tem a sua.
::p id_medico (FK) | o mesmo médico (501) pode aparecer em várias consultas: é o lado "muitos" de um 1:N.
::e
CREATE TABLE CONSULTA (
  id_consulta   INTEGER PRIMARY KEY,
  data_consulta DATE,
  cid10         TEXT,
  id_paciente   INTEGER NOT NULL,
  id_medico     INTEGER NOT NULL,
  FOREIGN KEY (id_paciente) REFERENCES PACIENTE(id_paciente),
  FOREIGN KEY (id_medico)   REFERENCES MEDICO(id_medico)
)
::r
[1] 0
@@ "A FK precisa ter o mesmo nome da PK que ela referencia." A afirmação está correta?
::f Banco de Dados · Aula 9
::c FOREIGN KEY (chave estrangeira)
::o Não. O que cria a ligação é o REFERENCES, não o nome. Nomes iguais só facilitam a leitura.
::p codigo_pac | nome diferente de id_paciente, mas funciona como FK.
::p REFERENCES PACIENTE(id_paciente) | é isso que liga as duas tabelas.
::e
CREATE TABLE CONSULTA2 (
  id_cons    INTEGER PRIMARY KEY,
  data       TEXT,
  codigo_pac INTEGER NOT NULL,
  FOREIGN KEY (codigo_pac) REFERENCES PACIENTE(id_paciente)
)
::r
[1] 0
@@ Represente o relacionamento N:M entre PACIENTE e MEDICAMENTO.
::f Banco de Dados · Aula 8
::c Relacionamentos 1:1, 1:N e N:M, PRIMARY KEY (chave primária), FOREIGN KEY (chave estrangeira)
::o N:M sempre precisa de uma tabela intermediária com as duas chaves; ela também guarda os dados próprios da relação (dose, data).
::p PRIMARY KEY (id_paciente, id_medicamento) | chave composta: o PAR não pode se repetir.
::p dose, data | atributos que pertencem à prescrição, não ao paciente nem ao remédio.
::e
CREATE TABLE PRESCRICAO (
  id_paciente    INTEGER,
  id_medicamento TEXT,
  dose           TEXT,
  data           TEXT,
  PRIMARY KEY (id_paciente, id_medicamento),
  FOREIGN KEY (id_paciente)    REFERENCES PACIENTE(id_paciente),
  FOREIGN KEY (id_medicamento) REFERENCES MEDICAMENTO(id_medicamento)
)

::f Banco de Dados · Aula 13

::o CREATE define a estrutura e as regras; INSERT coloca os dados. Não informo id_leito: a PK INTEGER é numerada automaticamente.
::p CHECK (disponivel IN ('S','N')) | o banco recusa qualquer outro valor.
::p [1] 1 | cada INSERT afetou 1 linha.

dbExecute(con, "
  CREATE TABLE IF NOT EXISTS LEITO (
    id_leito   INTEGER PRIMARY KEY,
    codigo     TEXT NOT NULL,
    tipo       TEXT NOT NULL,
    disponivel TEXT NOT NULL CHECK (disponivel IN ('S', 'N'))

dbExecute(con, "INSERT INTO LEITO (codigo, tipo, disponivel) VALUES ('L-103', 'UTI', 'N')")
