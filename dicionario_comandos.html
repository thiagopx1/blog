            medico total_encerradas
1 Dr. Rafael Sousa                2
2  Dra. Carla Lima                2
@@ Entre as internações ENCERRADAS, quais CIDs aparecem? (WHERE e HAVING juntos)
::f Banco de Dados · Aula 12
::c WHERE, GROUP BY, HAVING
::p WHERE | o porteiro: só internações encerradas entram.
::p HAVING | o segurança: só ficam os grupos com pelo menos 1 ocorrência.
::e
SELECT cid10_principal, COUNT(*) AS ocorrencias
FROM INTERNACAO
WHERE data_saida IS NOT NULL
GROUP BY cid10_principal
HAVING COUNT(*) >= 1
ORDER BY ocorrencias DESC, cid10_principal
::r
  cid10_principal ocorrencias
1             E11           1
2             I10           1
3             I21           1
4           J18.1           1
@@ (Aula 18) Grave uma tabela tratada no SQLite e responda com SQL e com dplyr: % de óbito por grupo de CID com mais de 3000 internações.
::f Banco de Dados · Aula 18
::c dbWriteTable(), GROUP BY, HAVING, ROUND(), group_by() e summarise(), dplyr ↔ SQL (equivalências)
::o É o "pipeline SQL → R": limpo no R, gravo no banco e consulto em SQL. Depois confiro que o dplyr dá o mesmo resultado.
::p AVG(DESFECHO) * 100 | DESFECHO é 0/1: a média é a proporção de óbitos.
::p HAVING COUNT(*) > 3000 | equivale ao filter(n > 3000) depois do summarise().
::p overwrite = TRUE | recria a tabela se ela já existir.
::e
con <- dbConnect(RSQLite::SQLite(), "internacoes.sqlite")
dbWriteTable(con, "internacoes", internacoes_tratadas, overwrite = TRUE)
dbGetQuery(con, "
  SELECT GRUPO_CID, COUNT(*) AS n,
         ROUND(AVG(DESFECHO) * 100, 1) AS pct_obito
  FROM internacoes
  GROUP BY GRUPO_CID
  HAVING COUNT(*) > 3000
  ORDER BY pct_obito DESC")
# mesmo resultado em dplyr
internacoes_tratadas |>
  group_by(GRUPO_CID) |>
  summarise(n = n(), pct_obito = round(mean(DESFECHO) * 100, 1)) |>
  filter(n > 3000) |>
  arrange(desc(pct_obito))
dbDisconnect(con)
::r
             GRUPO_CID     n pct_obito
1    Cerebrovasculares 12587      17.3
2           Coronarias 16513      11.4
3 Outras circulatorias 15743      11.1
</script>
<script type="text/plain" id="d-glos">@G Palavras do R que aparecem o tempo todo | #ffd166 | Se alguma palavra das aulas parecer "grego", procure aqui.
@@ Console
::o O painel do RStudio onde os comandos são executados e as respostas aparecem. O sinal > significa "pode digitar"; o sinal + significa "o comando anterior não terminou" (falta fechar parêntese ou aspas). Para cancelar, aperte Esc.
@@ Script (.R)
::o Arquivo de texto onde você escreve e guarda os comandos. Nada roda sozinho: coloque o cursor na linha e aperte Ctrl + Enter (roda a linha ou a seleção) ou Ctrl + Shift + Enter (roda tudo).
@@ Variável (objeto)
::o Um nome que guarda um valor. Tudo o que você guarda no R (número, vetor, tabela, função) é um "objeto" e aparece no painel Environment.
::e
idade <- 30
@@ Função
::o Um comando pronto que recebe algo entre parênteses e devolve um resultado. Sempre tem a forma nome(…).
::e
round(3.14159, 2)
::r
[1] 3.14
@@ Argumento (parâmetro)
::o Cada informação que você passa para a função, separadas por vírgula. Podem ir na ordem certa ou com o nome: round(x = 3.14159, digits = 2). Os que têm valor padrão podem ser omitidos.
@@ Vetor
::o Uma fila de valores do mesmo tipo, acessados pela posição (começando em 1). É a estrutura básica do R.
::e
notas <- c(7, 8.5, 9)
@@ Matriz
::o Tabela de valores do mesmo tipo, com linhas e colunas. Acesso: m[linha, coluna].
@@ Data frame
::o A "planilha" do R: tabela em que cada coluna pode ter um tipo diferente. Linhas = observações; colunas = variáveis.
@@ Tibble
::o Um data frame "moderno" (do tidyverse). Imprime de forma mais compacta e mostra o tipo embaixo do nome de cada coluna (<chr>, <dbl>, <int>).
@@ Lista
::o Uma "caixa de caixas": guarda elementos de tipos diferentes, até tabelas e outras listas.
@@ Fator
::o Variável de categorias com níveis definidos (ex.: sexo, tamanho P/M/G). Pode ser ordenado.
@@ Tipos: numeric, integer, character, logical
::o numeric (num/dbl) = número com ou sem decimal; integer (int) = inteiro, escrito com L (10L); character (chr) = texto entre aspas; logical (logi) = TRUE ou FALSE.
@@ NA, NULL e NaN
::o NA = dado ausente (célula vazia); NULL = "nada", objeto vazio (usado para apagar colunas ou itens); NaN = resultado matemático indefinido (0/0). No SQL, o equivalente do NA chama-se NULL.
@@ TRUE e FALSE
::o Os valores lógicos (verdadeiro e falso). Em contas valem 1 e 0. Podem ser abreviados T e F, mas evite: T e F podem ser sobrescritos.
@@ Índice / posição
::o O número da "gaveta" de um vetor. No R começa em 1.
@@ Vetorização
::o O R aplica contas a todos os elementos de um vetor de uma vez: c(1, 2, 3) * 2 dá 2 4 6, sem precisar de laço.
@@ Pacote (biblioteca)
::o Um conjunto de funções extras feito pela comunidade (dplyr, readxl, lubridate…). Instala uma vez com install.packages("nome") e carrega a cada sessão com library(nome).
@@ CRAN
::o O repositório oficial de pacotes do R, de onde o install.packages() baixa.
@@ tidyverse
::o Família de pacotes que trabalham juntos para ciência de dados: dplyr, tidyr, tibble, stringr, lubridate, ggplot2…
@@ Pipe (%>% ou |>)
::o Operador que passa o resultado da esquerda para a função da direita. Leia como "e então".
@@ Diretório de trabalho (working directory)
::o A pasta onde o R procura e salva arquivos. getwd() mostra; setwd() muda.
@@ Caminho absoluto e relativo
::o Absoluto: o endereço completo (C:/Users/thiago/dados.csv). Relativo: a partir da pasta de trabalho (só dados.csv). No R use barras normais /.
@@ Aviso (warning) x Erro (error)
::o Warning: o R executou, mas está avisando de algo (ex.: NAs introduzidos por coerção). Error: o R parou e não executou. Leia sempre a mensagem: ela diz a linha e o motivo.
@@ Coerção
::o Conversão de um tipo para outro, feita por você (as.numeric) ou automaticamente pelo R (c(1, "a") vira tudo texto).
@@ Expressão regular (regex)
::o Uma "linguagem de padrões" para buscar texto: "^A" = começa com A; "\\S+" = uma palavra; "." = qualquer caractere.

@G Palavras de banco de dados e análise | #c792ea | Termos das aulas de Banco de Dados e de limpeza/diagnóstico.
@@ Banco de dados e SGBD
::o Banco de dados é o conjunto organizado de dados; SGBD (Sistema Gerenciador de Banco de Dados) é o programa que o administra (SQLite, MySQL, PostgreSQL).
@@ SQL
::o Structured Query Language: a linguagem para criar tabelas e consultar dados em bancos relacionais.
@@ SQLite
::o Banco relacional que fica todo num único arquivo .sqlite, sem servidor. É o usado no curso, via pacotes DBI e RSQLite.
@@ Relacional x não relacional (NoSQL)
::o Relacional: dados em tabelas ligadas por chaves (bom para dados estruturados, como prontuários). Não relacional: documentos, chave-valor, grafos… (flexível para dados sem estrutura fixa).
@@ Chave primária (PK)
::o Coluna que identifica cada linha de forma única e nunca fica vazia.
@@ Chave estrangeira (FK)
::o Coluna que aponta para a PK de outra tabela, criando o relacionamento.
@@ Chave candidata
::o Coluna que também poderia ser PK por ser única e não nula (ex.: CPF), mas não foi a escolhida.
@@ Cardinalidade e grau
::o Cardinalidade = número de linhas de uma tabela; grau = número de colunas. (Em relacionamentos, "cardinalidade" também indica 1:1, 1:N ou N:M.)
@@ Restrição de domínio
::o Regra sobre os valores aceitos numa coluna, como CHECK (sexo IN ('M','F')).
@@ Integridade referencial
::o Garantia de que toda FK aponta para algo que existe (não dá para cadastrar paciente com médico 999 inexistente).
@@ Consulta (query)
::o Uma pergunta feita ao banco com SELECT. No R, enviada com dbGetQuery().
@@ JOIN
::o Operação que junta tabelas pela coluna em comum (chave).
@@ Agregação
::o Resumir várias linhas num valor: contagem, soma, média, mínimo, máximo.
@@ Dado, informação e metadado
::o Dado = registro bruto (38); informação = dado com contexto e significado (paciente tem 38 anos); metadado = dado sobre o dado (a coluna IDADE é inteira, em anos).
@@ Ciclo de vida dos dados
::o As etapas pelas quais o dado passa: coleta → armazenamento → processamento/limpeza → análise → compartilhamento → arquivamento ou descarte.
@@ Limpeza de dados
::o Corrigir ou remover problemas antes de analisar: NA, duplicatas, tipos errados, códigos inválidos, valores impossíveis, grafias diferentes para a mesma coisa.
@@ Outlier
::o Valor muito diferente dos outros. Pode ser erro (idade 999) ou real e plausível (idade 99). A decisão de manter ou excluir deve ser documentada.
@@ Imputação
::o Preencher um NA com um valor estimado (ex.: a mediana da coluna).
@@ Formato largo x longo
::o Largo: uma coluna para cada categoria (vendas_norte, vendas_sul). Longo: uma coluna com a categoria e outra com o valor. pivot_longer() e pivot_wider() convertem.
@@ Reprodutibilidade
::o Qualquer pessoa rodando seu script (ou Knit do .Rmd) chega ao mesmo resultado. Por isso tudo deve estar no código, inclusive as decisões de limpeza, comentadas.
@@ Mediana, quartis e média
::o Média = soma ÷ quantidade (sensível a extremos). Mediana = valor do meio. 1º e 3º quartis = valores abaixo dos quais estão 25% e 75% dos dados.

@G Probabilidade e inferência (Módulo II) | #9d4edd | Palavras e símbolos de Análise Estatística para Data Science.
@@ Ω (ômega)
::o Espaço amostral: o conjunto de todos os resultados possíveis de um experimento aleatório. Ex.: Ω = {1, 2, 3, 4, 5, 6} para um dado.
@@ P(A | B)
::o Probabilidade condicional: probabilidade de A sabendo que B aconteceu. Lê-se "A dado B". P(A | B) = P(A ∩ B) / P(B).
@@ ∪, ∩ e Ā
::o União (A ou B), interseção (A e B) e complementar (não A) de eventos.
@@ v.a.
::o Abreviação de variável aleatória: regra que transforma cada resultado de um experimento num número (X = nº de caras, X = peso do bebê).
@@ f.d.p. e f.p.
::o Função densidade de probabilidade (variáveis contínuas: a área sob ela é a probabilidade) e função de probabilidade (discretas: P(X = x)).
@@ X ~ b(n, p)
::o O símbolo ~ lê-se "tem distribuição". X ~ b(n, p) = binomial; X ~ P(λ) = Poisson; X ~ U(α, β) = uniforme; X ~ N(μ, σ²) = normal (com a VARIÂNCIA no segundo lugar).
@@ μ, σ, p (parâmetros) × x̄, s, p̂ (estatísticas)
::o Letras gregas (ou p) descrevem a população e quase nunca são conhecidas; letras com barra ou chapéu são calculadas na amostra e servem para estimar os parâmetros.
@@ Graus de liberdade (gl, df)
::o Número que define o formato das distribuições t e qui-quadrado. Nos testes e intervalos da disciplina, gl = n − 1. No R aparece como df.
@@ Erro padrão
::o Desvio padrão de uma estatística: o quanto ela varia de amostra para amostra. Para a média: σ/√n (ou s/√n).
@@ IC (intervalo de confiança)
::o Faixa de valores que estima um parâmetro com um nível de confiança (ex.: 95%). Formato: estimativa ± margem de erro.
@@ α (nível de significância)
::o Probabilidade de cometer o erro tipo I (rejeitar H0 verdadeira). Valores comuns: 0,01; 0,05; 0,10. Nível de confiança = 1 − α.
@@ H0 e H1
::o Hipótese nula (sempre com igualdade: parâmetro = valor) e hipótese alternativa (com <, > ou ≠). O teste decide se os dados permitem rejeitar H0.
@@ Valor-p (p-value)
::o Probabilidade de um resultado tão ou mais extremo que o observado, supondo H0 verdadeira. Rejeita-se H0 quando valor-p ≤ α. No R: "p-value".
@@ alternative = "two.sided" / "less" / "greater"
::o Argumento de t.test(), prop.test() e sigma.test() que diz o tipo do teste: bilateral (≠), unilateral à esquerda (<) ou à direita (>).
@@ Correção de continuidade (Yates)
::o Ajuste que o prop.test() faz por padrão ao aproximar a binomial (discreta) pela normal (contínua). Para reproduzir as contas dos slides, use correct = FALSE.
</script>
<script type="text/plain" id="d-conc">@G Fundamentos: dados e tabelas | #4cc9f0 | Os "tijolos" da estatística: de onde vêm os dados, de que tipo eles são e como resumi-los em tabelas. (Estatística Descritiva, Aulas 3 e 4)
@@ População e amostra
::f Aula 3 · Introdução à estatística
::o População é o conjunto de TODOS os elementos que você quer estudar; amostra é uma parte dela, escolhida para estudar. Número que descreve a população = parâmetro; número calculado na amostra = estatística.
::q Para saber se a sopa está boa você não bebe a panela inteira: prova uma colherada (amostra) e conclui algo sobre a panela (população). Mas a sopa precisa estar bem mexida: a colherada tem que representar a panela.
::w amostra
::i Uma boa amostra é representativa: sorteada de forma aleatória, para cada elemento ter chance de entrar. Amostras maiores costumam dar resultados mais próximos do valor verdadeiro.
::p População | todos os elementos de interesse (todos os nascimentos do Brasil em 2025, por exemplo).
::p Amostra | subconjunto da população, usado para estudá-la.
::p Parâmetro (μ, σ) | número que descreve a população inteira. Em geral é desconhecido. Usa letras gregas.
::p Estatística (x̄, s) | número calculado na amostra. É o que a gente realmente consegue obter. Usa letras latinas.
::x
Exemplo: a base SINASC 2025 reúne (praticamente) todos os nascimentos registrados no ano: aqui ela funciona como POPULAÇÃO de nascimentos de 2025. Se você pegasse só 1.000 linhas dela, teria uma AMOSTRA.
Estatística descritiva = resumir e descrever os dados que você TEM (tabelas, gráficos, médias). Inferência = usar a amostra para tirar conclusões sobre a população (é assunto de outras disciplinas).
::a Amostra "de conveniência" (só quem está por perto) costuma ser enviesada.
::a Resultados de duas amostras diferentes quase nunca são iguais: isso é normal (variação amostral).
::v C:Tipos de variável | C:Média
@@ Tipos de variável
::f Aula 3 · Introdução à estatística
::o O tipo da variável decide quais tabelas, gráficos e medidas fazem sentido. Qualitativa = categorias (nominal ou ordinal). Quantitativa = números (discreta ou contínua).
::q Antes de cozinhar, veja o ingrediente: não se bate gelatina como se bate um bolo. Antes de calcular, veja o tipo da variável: não se calcula média de "cor dos olhos".
::w tipos
::s
Pergunta 1: faz sentido somar e tirar média?  Sim → quantitativa. Não → qualitativa.
Pergunta 2 (qualitativa): as categorias têm ordem?  Sim → ordinal. Não → nominal.
Pergunta 3 (quantitativa): é contagem (inteiros) ou medida?  Contagem → discreta. Medida → contínua.
::p Qualitativa nominal | categorias sem ordem: sexo, cor dos olhos, estado civil.
::p Qualitativa ordinal | categorias com ordem natural: escolaridade, grau de satisfação, faixa etária.
::p Quantitativa discreta | resulta de CONTAR: número de filhos, de consultas, Apgar. Valores inteiros.
::p Quantitativa contínua | resulta de MEDIR: peso, altura, tempo. Qualquer valor num intervalo.
::x
"Número de consultas pré-natal" (0, 1, 2, ... 12): faz sentido média? Sim → quantitativa. Foi contado → discreta.
"Escolaridade da mãe" (fundamental, médio, superior): média? Não → qualitativa. Tem ordem → ordinal.
::e
class(dados$PESO)        # numeric: quantitativa
class(dados$SEXO)        # factor ou character: qualitativa
str(dados)               # mostra o tipo de todas as colunas
::r
[1] "numeric"
[1] "factor"
(str() lista cada coluna com seu tipo)
::a Códigos numéricos podem enganar: SEXO = 1 ou 2 é QUALITATIVA (o 1 e o 2 são rótulos), mesmo escrita com números. Converta com factor().
::a Idade em anos inteiros costuma ser tratada como quantitativa mesmo sendo arredondada.
::v C:Frequências: absoluta, relativa e acumulada | C:Escolha do gráfico | factor() | str()
@@ Notação de somatório (Σ)
::f Aula 7 · Medidas descritivas
::o Σ (sigma maiúsculo) significa "some tudo o que vem depois". Aparece em quase toda fórmula da estatística.
::q É a instrução "some todos os x, do primeiro ao último". Σx lê-se "soma dos x".
::w sigma
::s
Σx    = x₁ + x₂ + ... + xₙ
x̄     = Σx ÷ n
Σx²   = x₁² + x₂² + ... + xₙ²      (eleva cada um ao quadrado e depois soma)
(Σx)² = (x₁ + ... + xₙ)²           (soma e depois eleva ao quadrado)
::p Σ | some.
::p xᵢ | o i-ésimo valor (x₁ é o primeiro, x₂ o segundo...).
::p n | quantos valores há.
::p x̄ (x barra) | a média: Σx ÷ n.
::x
x = 3, 6, 5, 7, 9
Σx = 3 + 6 + 5 + 7 + 9 = 30    n = 5    x̄ = 30 ÷ 5 = 6
Σx² = 9 + 36 + 25 + 49 + 81 = 200     (Σx)² = 30² = 900
::e
x <- c(3, 6, 5, 7, 9)
sum(x)       # Σx
sum(x^2)     # Σx²
sum(x)^2     # (Σx)²
::r
[1] 30
[1] 200
[1] 900
::a Σx² e (Σx)² NÃO são iguais. Preste atenção em onde está o quadrado.
::v C:Média | C:Variância e desvio padrão | sum(), mean(), prod() e cumsum()
@@ Valores ignorados (NA e o código 99)
::f Aulas 4 e 8 · Rmd
::o Em bases reais, "não informado" costuma vir como um código (99, 9, 999). O R não sabe disso: você precisa trocar o código por NA antes de calcular.
::q Se na caixa de "idade" alguém escrever 99 para dizer "não sei", o computador acredita que a pessoa tem 99 anos e estraga a média.
::w na99
::s
1) Descubra o código de "ignorado" no dicionário de dados da base.
2) Troque por NA:  x[x == 99] <- NA
3) Calcule com na.rm = TRUE (para o R ignorar os NA).
::x
Idades: 25, 31, 99, 28, 22, 99, 34, 27
Com 99: soma 365 ÷ 8 = 45,6 anos (absurdo).
Sem os 99: soma 167 ÷ 6 = 27,8 anos.
::e
idade <- c(25, 31, 99, 28, 22, 99, 34, 27)
mean(idade)
idade[idade == 99] <- NA
mean(idade, na.rm = TRUE)
::r
[1] 45.625
[1] 27.83333
::a Alguns "ignorados" fazem parte do intervalo válido (Apgar vai até 10, então 99 é código; mas 99 anos de idade da mãe também seria suspeito). Sempre confira o dicionário de dados.
::a Sem na.rm = TRUE, um único NA faz mean() devolver NA.
::v is.na() e !is.na() | sum(), mean(), prod() e cumsum() | C:Média
@@ Frequências: absoluta, relativa e acumulada
::f Aulas 3 e 4 · Tabelas
::o Frequência absoluta (f) = contagem; relativa (fr) = f ÷ n (ou em %); acumulada (F) = soma corrida: "quantos até aqui".
::q Numa sala de 40 alunos: 10 de óculos (f = 10), um quarto da turma (fr = 0,25 = 25%). Se você conta "quantos têm até 1,60 m", está fazendo a frequência acumulada.
::w freq
::s
f      = contagem
fr     = f ÷ n
fr %   = fr × 100
F      = f₁, f₁+f₂, f₁+f₂+f₃, ...
Fr %   = F ÷ n × 100      (a última linha é sempre 100%)
::p f | frequência absoluta: quantas vezes cada valor ou categoria aparece.
::p fr | frequência relativa: f ÷ n (de 0 a 1).
::p fr % | frequência relativa percentual: fr × 100.
::p F | frequência acumulada: soma das f até a linha atual.
::p Fr % | acumulada em percentual.
::x
Nº de filhos de 10 mulheres: 0, 1, 1, 2, 2, 2, 3, 3, 4, 0
Valor  f   fr    F   Fr%
0      2   0,2   2   20%
1      2   0,2   4   40%
2      3   0,3   7   70%
3      2   0,2   9   90%
4      1   0,1  10  100%
"70% das mulheres têm até 2 filhos" lê-se na linha do 2, coluna Fr%.
::e
f <- table(filhos)
fr <- prop.table(f)
cumsum(f)
::r
 0  1  2  3  4
 2  4  7  9 10
::a Frequência acumulada só faz sentido se os valores têm ordem (ordinal ou quantitativa).
::a Confira: soma das f = n; soma das fr = 1; última F = n.
::v table() | prop.table() | Tabela de frequências feita à mão | C:Classes (intervalos de classe)
@@ Classes (intervalos de classe)
::f Aulas 3 e 4 · Tabelas
::o Para variável quantitativa contínua (ou com muitos valores), agrupa-se em faixas chamadas classes e conta-se quantos valores caem em cada uma.
::q Em vez de uma fila de 2 milhões de pesos diferentes, você cria "gavetas" (2000 a 2500 g, 2500 a 3000 g...) e conta quantos bebês há em cada gaveta.
::w classes
::s
1) n = quantidade de dados.
2) k = √n, arredondando para cima.
3) amplitude total = máximo − mínimo.
4) h = amplitude total ÷ k (arredonde para um número "redondo").
5) comece do mínimo (ou de um valor redondo abaixo dele) e some h para achar cada limite.
6) conte quantos valores caem em cada classe.
::p k | número de classes. Critério da raiz: k ≈ √n (arredondado para cima).
::p h | amplitude da classe (tamanho da faixa) = (máx − mín) ÷ k.
::p [a, b) | fechada à esquerda: inclui a, não inclui b.
::p (a, b] | fechada à direita: inclui b, não inclui a.
::x
n = 10 salários (de 1200 a 7900). k = √10 = 3,16 → 4 classes.
Amplitude = 7900 − 1200 = 6700. h = 6700 ÷ 4 = 1675 → usamos 2000 (redondo).
Classes: [1000, 3000) [3000, 5000) [5000, 7000) [7000, 9000). Contagens: 5, 3, 1, 1.
::e
cut(salarios, breaks = seq(1000, 9000, 2000), right = FALSE)
library(fdth)
fdt(salarios, start = 1000, end = 9000, h = 2000)
::a Cada valor tem que cair em UMA classe só: use sempre o mesmo tipo de intervalo ([a, b) ou (a, b]).
::a Poucas classes escondem a forma dos dados; muitas deixam o gráfico "serrilhado".
::v cut() | fdt() (pacote fdth) | Número de classes e amplitude (h) | C:Histograma
@@ Escolha do gráfico
::f Aula 5 · Visualização de dados
::o O tipo da variável (e quantas variáveis você quer mostrar) decide o gráfico certo.
::q É como escolher a ferramenta: martelo para prego, chave para parafuso. Pizza para dados contínuos é chave de fenda para pregar prego.
::w grafico
::s
Qualitativa                   → barras, colunas, pizza
Quantitativa discreta         → dispersão unidimensional, colunas
Quantitativa contínua         → histograma, polígono, ogiva, box-plot
Duas qualitativas             → colunas agrupadas/empilhadas (tabela cruzada)
Qualitativa × quantitativa    → box-plots ou histogramas comparativos
Duas quantitativas            → gráfico de dispersão
::a Pizza só com poucas categorias (até 5) e quando as partes somam um todo.
::a Todo gráfico precisa de título, rótulos nos eixos e unidade.
::v barplot() | pie() | hist() | boxplot() | Gráficos de dispersão (plot)
@@ Histograma
::f Aulas 5 e 6 · Gráficos
::o Gráfico de barras COLADAS para variável quantitativa: cada barra é uma classe, e a altura mostra a frequência (ou a densidade).
::q Se a tabela de classes é uma lista de gavetas, o histograma é o desenho das gavetas, lado a lado, com altura proporcional ao que tem dentro.
::w histograma
::i Veja o formato: simétrico (sino)? cauda para um lado (assimétrico)? dois montes (bimodal)? Onde está o centro? Há valores isolados?
::s
densidade da classe = (f ÷ n) ÷ largura da classe
área da barra = densidade × largura = f ÷ n
::p Eixo x | os valores da variável, divididos em classes.
::p Altura (frequência) | quantos valores há na classe.
::p Altura (densidade) | proporção ÷ largura da classe. Assim a ÁREA da barra = proporção dos dados.
::e
hist(peso, freq = FALSE, breaks = seq(1000, 5000, 500),
     right = FALSE, col = "lightblue",
     main = "Peso ao nascer", xlab = "Peso (g)", ylab = "Densidade")
::a Barras SEPARADAS (barplot) são para categorias; COLADAS (hist) são para números contínuos.
::a Com classes de larguras diferentes, o gráfico de frequência engana: use densidade.
::v hist(): densidade, classes e quebras | hist() | C:Classes (intervalos de classe) | C:Assimetria
@@ Ogiva (frequência acumulada)
::f Aulas 5 e 6 · Gráficos
::o Gráfico de linha da frequência acumulada. Só sobe, e termina no total (n ou 100%). Responde "quantos (ou qual %) ficam abaixo de X?".
::q É o "contador de pessoas que já passaram pela porta": nunca diminui. Quanto mais inclinado um trecho, mais gente passou naquela faixa.
::w ogiva
::s
1) Monte a tabela de frequências por classe.
2) Calcule a frequência acumulada (F).
3) Marque os pontos (limite SUPERIOR da classe, F).
4) Ligue os pontos com retas, começando em 0 no limite inferior da primeira classe.
::x
Salários em classes: [1000,3000) 5 · [3000,5000) 3 · [5000,7000) 1 · [7000,9000) 1. Acumuladas: 5, 8, 9, 10.
A ogiva começa em 0 no limite 1000, passa por 5 em 3000, 8 em 5000, 9 em 7000 e chega a 10 (100%) em 9000.
Leitura: "80% dos salários são menores que 5000" (8 ÷ 10).
::e
library(fdth)
tab <- fdt(salarios, start = 1000, end = 9000, h = 2000)
plot(tab, type = "cfp", col = 4, lwd = 2)       # em frequência
plot(tab, type = "cfpp", col = 4, lwd = 2)      # em porcentagem
::a A ogiva usa o limite SUPERIOR de cada classe (é onde o acumulado "fecha").
::v Ogiva e polígono de frequências | C:Percentil | C:Frequências: absoluta, relativa e acumulada

@G Medidas de posição (onde está o "centro") | #f72585 | Números que dizem em torno de que valor os dados se concentram. (Estatística Descritiva, Aulas 7 e 8)
@@ Média
::f Aulas 7 e 8 · Medidas descritivas
::o Soma de todos os valores dividida pela quantidade deles. É o ponto de equilíbrio dos dados.
::q Imagine uma gangorra com os valores como pesos sobre uma régua: a média é o ponto onde ela fica em equilíbrio. Se você aumenta um valor, o ponto de equilíbrio se desloca para o lado dele.
::w media
::i "Se todos tivessem o mesmo valor, qual seria?" A média usa TODOS os valores, por isso é sensível a valores extremos.
::s
x̄ = Σx ÷ n = (x₁ + x₂ + ... + xₙ) ÷ n
::p Σx | soma de todos os valores.
::p n | quantos valores há.
::p x̄ | símbolo da média amostral (lê-se "x barra").
::x
Idades: 3, 6, 5, 7, 9
Soma = 3 + 6 + 5 + 7 + 9 = 30     n = 5
Média = 30 ÷ 5 = 6
::e
x <- c(3, 6, 5, 7, 9)
mean(x)
mean(c(4, NA, 8), na.rm = TRUE)
::r
[1] 6
[1] 6
::a Média de uma variável com outlier pode enganar: use C:Média × Mediana para escolher.
::a Média de variável qualitativa não existe. E códigos (1 = masculino, 2 = feminino) não podem entrar em média.
::a Com NA, use na.rm = TRUE.
::v sum(), mean(), prod() e cumsum() | C:Mediana | C:Média × Mediana: qual usar? | C:Notação de somatório (Σ)
@@ Mediana
::f Aulas 7 e 8 · Medidas descritivas
::o Valor que fica no meio dos dados ordenados: metade dos valores está abaixo dela e metade acima.
::q Alinhe todo mundo por ordem de altura; a pessoa do meio da fila é a mediana. Não importa se a última pessoa é um gigante de 2,30 m: o meio continua o mesmo.
::w mediana
::i Metade dos casos é menor ou igual à mediana, metade é maior ou igual. É uma medida RESISTENTE: valores extremos mexem pouco nela.
::s
1) Ordene do menor para o maior.
2) Conte n.
3) n ímpar: pegue o valor do meio.   n par: faça a média dos dois do meio.
::p n ímpar | mediana = valor na posição (n + 1) ÷ 2.
::p n par | mediana = média dos dois valores centrais (posições n/2 e n/2 + 1).
::x
Ímpar: 7, 2, 9, 4, 5 → ordenado: 2, 4, 5, 7, 9 → n = 5 → posição 3 → mediana = 5.
Par: 2, 4, 5, 7, 9, 12 → n = 6 → dois do meio: 5 e 7 → (5 + 7) ÷ 2 = 6.
::e
median(c(7, 2, 9, 4, 5))
median(c(2, 4, 5, 7, 9, 12))
::r
[1] 5
[1] 6
::a Esquecer de ORDENAR antes de pegar o do meio.
::a A mediana nem sempre é um valor que existe nos dados (com n par, pode ser a média de dois).
::v median() | C:Média × Mediana: qual usar? | C:Quartis | C:Percentil
@@ Moda
::f Aulas 7 e 8 · Medidas descritivas
::o Valor (ou categoria) que mais se repete. Única medida de posição que serve para variáveis qualitativas.
::q O "campeão de votos". Se duas opções empatam em primeiro, há duas modas (bimodal). Se ninguém se repete, não há moda (amodal).
::w moda
::s
1) Conte quantas vezes cada valor aparece (table()).
2) A moda é o valor com a maior contagem.
::x
2, 3, 3, 3, 5, 5, 7 → o 3 aparece 3 vezes → moda = 3 (unimodal).
1, 1, 2, 2, 3 → o 1 e o 2 aparecem 2 vezes → bimodal (modas 1 e 2).
"solteira", "casada", "casada", "viúva" → moda = "casada".
::e
library(modeest)
mfv(c(2, 3, 3, 3, 5, 5, 7))
mfv(c("A", "B", "B", "C"))
table(c(2, 3, 3, 3, 5, 5, 7))
::r
[1] 3
[1] "B"

2 3 5 7
1 3 2 1
::a A moda é o VALOR (3), não a frequência (3 vezes).
::a Em variável contínua com valores todos diferentes, a moda perde sentido: use a classe modal do histograma.
::v mfv() (moda) | table() | C:Média | C:Mediana
@@ Média × Mediana: qual usar?
::f Aula 7 · Medidas descritivas
::o A média é puxada por valores extremos; a mediana, não. Com outliers ou distribuição assimétrica, prefira a mediana.
::q Numa sala de 10 pessoas com renda de 2 a 10 mil, entra um bilionário: a renda MÉDIA da sala vira "milionária", mas a pessoa do meio da fila continua ganhando o mesmo.
::w mediaMediana
::i Renda, preço de imóveis, tempo de internação: costumam ter cauda longa à direita. Nesses casos, relatar a mediana é mais honesto.
::s
Simétrica, sem outliers      → média ≈ mediana: pode usar a média.
Assimétrica ou com outliers  → mediana descreve melhor o "típico".
::x
Dados: 2, 3, 4, 5, 6, 7, 8, 9, 10 → média = 6 e mediana = 6.
Entra o 40: média = 94 ÷ 10 = 9,4; mediana = (6 + 7) ÷ 2 = 6,5.
Um único valor mudou a média em 3,4 e a mediana em só 0,5.
::e
d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40)
mean(d)
median(d)
::r
[1] 9.4
[1] 6.5
::a Dizer "o salário médio é X" quando a distribuição é muito assimétrica passa uma imagem irreal.
::v C:Assimetria | C:Outliers (valores atípicos) | median() | sum(), mean(), prod() e cumsum()
@@ Assimetria
::f Aulas 7 e 8 · Medidas descritivas
::o Descreve o formato da distribuição: simétrica (os dois lados iguais) ou assimétrica (uma cauda mais longa). A relação entre média e mediana mostra o lado.
::q Pense numa praia: simétrica = nivelada; assimétrica à direita = uma "rampa" longa subindo para a direita (poucos valores muito altos).
::w assimetria
::i Olhe o histograma: onde está a cauda longa? A média vai para o lado da cauda.
::s
média > mediana  →  cauda à direita (assimetria positiva)
média ≈ mediana  →  simétrica
média < mediana  →  cauda à esquerda (assimetria negativa)
::p Simétrica | média ≈ mediana ≈ moda.
::p Assimétrica à direita (positiva) | cauda à direita; média > mediana.
::p Assimétrica à esquerda (negativa) | cauda à esquerda; média < mediana.
::x
Salários: 1200, 1500, 1800, 2100, 2500, 3000, 3200, 4100, 5200, 7900.
Média = 32 500 ÷ 10 = 3 250. Mediana = (2500 + 3000) ÷ 2 = 2 750.
Média > mediana → cauda à direita: poucos salários muito altos puxam a média.
::a A cauda aponta para o lado da assimetria (não para onde estão os dados mais comuns).
::v C:Média × Mediana: qual usar? | C:Histograma | hist()
@@ Quartis
::f Aula 7 · Separatrizes
::o Dividem os dados ordenados em 4 partes de igual quantidade: Q1 (25%), Q2 = mediana (50%) e Q3 (75%).
::q Se a mediana corta a fila no meio, os quartis cortam cada metade de novo: ficam 4 grupos com o mesmo número de pessoas.
::w quartis
::i 25% dos valores são ≤ Q1; 75% são ≤ Q3. A caixa do box-plot vai de Q1 a Q3.
::s
Método do curso (à mão), para o quartil p (p = 0,25; 0,5; 0,75):
1) Ordene e calcule n · p.
2) Se n · p NÃO é inteiro: arredonde para cima e pegue o valor dessa posição.
3) Se n · p É inteiro: faça a média do valor nessa posição e do seguinte.
::p Q1 | 25% dos dados estão abaixo (e 75% acima).
::p Q2 | 50%: a mediana.
::p Q3 | 75% dos dados estão abaixo.
::p DI = Q3 − Q1 | distância interquartílica: onde estão os 50% do meio.
::x
n = 10: 2, 3, 4, 5, 6, 7, 8, 9, 10, 40
Q1: 10 · 0,25 = 2,5 (não inteiro) → posição 3 → Q1 = 4
Q2: 10 · 0,5 = 5 (inteiro) → média das posições 5 e 6 = (6 + 7) ÷ 2 = 6,5
Q3: 10 · 0,75 = 7,5 → posição 8 → Q3 = 9
::e
d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40)
quantile(d, type = 2)     # método do curso
quantile(d)               # padrão do R (type = 7)
::r
  0%  25%  50%  75% 100%
 2.0  4.0  6.5  9.0 40.0
   0%   25%   50%   75%  100%
 2.00  4.25  6.50  8.75 40.00
::a O R tem 9 métodos de calcular quartis. O padrão (type = 7) pode dar valores diferentes dos slides: use type = 2 para conferir contas à mão. summary() usa o padrão.
::a Não confunda "quartil" (um ponto: Q1, Q2, Q3) com "quarto" (cada pedaço entre dois pontos).
::v quantile() | summary() | C:Percentil | C:Box-plot | IQR() e limites dos outliers
@@ Percentil
::f Aula 7 · Separatrizes
::o O percentil Pk é o valor abaixo do qual ficam k% dos dados. Quartis são percentis especiais: Q1 = P25, mediana = P50, Q3 = P75.
::q Quando o pediatra diz "seu bebê está no percentil 90 de peso", significa que 90% dos bebês da mesma idade pesam menos ou o mesmo que ele.
::w percentil
::s
Para Pk: use o mesmo método dos quartis com p = k ÷ 100.
n · p inteiro → média do valor nessa posição e do seguinte.
n · p quebrado → arredonde para cima.
::x
n = 60 pesos ordenados; P90: 60 · 0,9 = 54 (inteiro) → média do 54º e do 55º valores.
P10: 60 · 0,1 = 6 → média do 6º e do 7º.
::e
quantile(peso, probs = c(0.10, 0.90), type = 2)
::a "Estar no percentil 90" NÃO é "ter 90 pontos": é estar acima de 90% dos outros.
::v quantile() | C:Quartis | C:Ogiva (frequência acumulada)

@G Medidas de dispersão (o quanto os dados "espalham") | #ffd166 | Duas turmas podem ter a mesma média e serem completamente diferentes: uma toda parecida, outra muito heterogênea. A dispersão mede isso. (Estatística Descritiva, Aulas 7 a 9)
@@ Amplitude total
::f Aula 7 · Medidas de dispersão
::o Maior valor menos menor valor. A medida de dispersão mais simples.
::q A "largura" do conjunto: da ponta esquerda à ponta direita.
::w amplitude
::i Quanto maior, mais espalhados os extremos. Mas só dois valores contam.
::s
A = máximo − mínimo
::x
Dados: 3, 6, 5, 7, 9 → máximo 9, mínimo 3 → A = 9 − 3 = 6.
::e
range(x)
diff(range(x))
::r
[1] 3 9
[1] 6
::a Muito sensível a outliers: um valor extremo estoura a amplitude.
::a range() devolve os dois extremos; para a amplitude (um número) use diff(range(x)).
::v range() | diff() (amplitude total) | C:Variância e desvio padrão
@@ Variância e desvio padrão
::f Aulas 7 e 8 · Medidas de dispersão
::o Medem, em média, o quanto os valores se afastam da média. A variância é a média dos desvios ao quadrado; o desvio padrão (dp) é a raiz da variância e tem a mesma unidade dos dados.
::q O desvio padrão é a "distância típica" entre cada valor e a média. Dp pequeno: dados colados na média. Dp grande: dados bem espalhados.
::w variancia
::i "Em média, os valores ficam a cerca de 2,2 unidades da média." Compare sempre com o tamanho da média (veja o CV).
::s
s² = Σ(xᵢ − x̄)² ÷ (n − 1)
s  = √s²
::p xᵢ − x̄ | desvio: o quanto o valor i se afasta da média (positivo se acima, negativo se abaixo).
::p (xᵢ − x̄)² | desvio ao quadrado: tira o sinal (senão a soma dos desvios daria sempre 0).
::p n − 1 | divisor da variância AMOSTRAL (o R usa este).
::p s | desvio padrão = √(variância).
::x
x = 3, 6, 5, 7, 9      x̄ = 6
Desvios:           −3, 0, −1, 1, 3     (soma = 0)
Desvios ao quadrado: 9, 0, 1, 1, 9     (soma = 20)
Variância = 20 ÷ (5 − 1) = 5
Desvio padrão = √5 = 2,236
::e
x <- c(3, 6, 5, 7, 9)
var(x)
sd(x)
::r
[1] 5
[1] 2.236068
::a Variância está em unidade ao QUADRADO (kg², anos²): por isso se usa o desvio padrão para interpretar.
::a O R divide por n − 1. Dividir por n daria outro valor (população).
::v var() e sd() | C:Coeficiente de variação (CV) | C:Regra empírica (68-95-99,7) | C:Média
@@ Coeficiente de variação (CV)
::f Aula 7 · Medidas de dispersão
::o Desvio padrão dividido pela média, em %. É uma dispersão RELATIVA: permite comparar variáveis de unidades ou tamanhos diferentes.
::q Errar 10 minutos numa viagem de 20 minutos é muito; errar 10 minutos numa viagem de 10 horas é pouco. O CV diz o tamanho do erro em relação ao tamanho do que se mede.
::w cv
::i Regra prática (varia conforme a área): CV < 15% baixa dispersão; 15 a 30% média; > 30% alta.
::s
CV = (s ÷ x̄) × 100
::x
Peso do bebê: média 3200 g, dp 450 g → CV = 450 ÷ 3200 × 100 = 14,1%.
Idade da mãe: média 27 anos, dp 6,5 anos → CV = 6,5 ÷ 27 × 100 = 24,1%.
Apesar de 450 ser muito maior que 6,5, a idade varia MAIS em termos relativos.
::e
CV <- sd(x) / mean(x) * 100
::a Só vale para variáveis com zero verdadeiro e valores positivos (peso, idade, salário), não para temperatura em °C.
::a Se a média é perto de 0, o CV explode e perde sentido.
::v Coeficiente de variação (CV) | var() e sd() | C:Variância e desvio padrão
@@ Regra empírica (68-95-99,7)
::f Aula 7 · Medidas de dispersão
::o Para dados em forma de sino (simétricos), cerca de 68% ficam em x̄ ± 1 dp, 95% em x̄ ± 2 dp e 99,7% em x̄ ± 3 dp.
::q É um "mapa de onde estão as pessoas": a grande maioria perto da média; muito poucos a mais de 3 dp. Quem está a mais de 3 dp é raro.
::w empirica
::i Serve para ter uma noção rápida e para detectar valores muito incomuns.
::s
x̄ ± 1·dp  → ~68% dos dados
x̄ ± 2·dp  → ~95% dos dados
x̄ ± 3·dp  → ~99,7% dos dados
::x
Peso ao nascer: média 3200 g, dp 450 g (distribuição em sino).
x̄ ± 1 dp: 2750 a 3650 g → ~68% dos bebês.
x̄ ± 2 dp: 2300 a 4100 g → ~95%.
x̄ ± 3 dp: 1850 a 4550 g → ~99,7%.
Um bebê de 1500 g está a mais de 3 dp abaixo: é raro.
::e
m <- mean(peso); s <- sd(peso)
mean(peso >= m - 2*s & peso <= m + 2*s)   # proporção real dentro de ±2 dp
::a Só vale se o histograma tiver forma de sino. Distribuições assimétricas não seguem a regra.
::v C:Variância e desvio padrão | C:Outliers (valores atípicos) | C:Assimetria
@@ Distância interquartílica (DI)
::f Aula 7 · Medidas de dispersão
::o DI = Q3 − Q1. Mede a dispersão dos 50% do meio dos dados e quase não é afetada por outliers.
::q Ignore os 25% menores e os 25% maiores. A DI é a largura do "miolo".
::w boxplot
::i É a medida de dispersão que acompanha a mediana (as duas resistem a outliers), assim como o desvio padrão acompanha a média.
::s
DI = Q3 − Q1
::x
d = 2, 3, 4, 5, 6, 7, 8, 9, 10, 40 → Q1 = 4, Q3 = 9 → DI = 9 − 4 = 5.
(A amplitude seria 38 por causa do 40; a DI continua 5.)
::e
IQR(d, type = 2)
::r
[1] 5
::v IQR() e limites dos outliers | C:Quartis | C:Box-plot | C:Outliers (valores atípicos)
@@ Box-plot
::f Aulas 7 e 9 · Medidas descritivas
::o Desenho que resume a variável em 5 números: mínimo, Q1, mediana, Q3 e máximo, e destaca os outliers.
::q A caixa guarda os 50% do meio; o traço dentro é a mediana; os "bigodes" mostram até onde vão os valores normais; pontinhos são os atípicos.
::w boxplot
::i Caixa longa = muita dispersão. Mediana descentralizada na caixa = assimetria. Pontos = valores a investigar.
::s
Limite inferior = Q1 − 1,5 · DI
Limite superior = Q3 + 1,5 · DI
Bigodes: do menor ao maior valor dentro dos limites.
::p Caixa | de Q1 a Q3 (comprimento = DI).
::p Traço dentro | mediana.
::p Bigodes | vão até o menor e o maior valor que NÃO são outliers.
::p Pontos | outliers.
::x
d = 2, 3, 4, 5, 6, 7, 8, 9, 10, 40 → Q1 = 4, Q3 = 9, DI = 5.
Limites: 4 − 7,5 = −3,5 e 9 + 7,5 = 16,5. O 40 está fora → outlier (ponto).
Bigode inferior até 2; bigode superior até 10.
::e
boxplot(d, horizontal = TRUE)
boxplot(peso ~ sexo, data = dados)
::a O R desenha o box-plot com seu próprio método de quartis (dobradiças de Tukey), que pode diferir um pouco do cálculo à mão em amostras pequenas.
::v boxplot() | C:Quartis | C:Outliers (valores atípicos) | C:Comparar grupos com box-plots
@@ Outliers (valores atípicos)
::f Aula 9 · Medidas descritivas
::o Valores muito distantes do restante. Regra prática: fora do intervalo [Q1 − 1,5·DI ; Q3 + 1,5·DI].
::q O gigante numa fila de pessoas comuns. Pode ser um erro de digitação (altura 17 m) ou um caso real e raro; descobrir qual é o seu trabalho.
::w boxplot
::i Primeiro investigue: erro de digitação? código de "ignorado" (99)? Ou valor real? Só remova se for erro comprovado.
::s
1) Calcule Q1, Q3 e DI = Q3 − Q1.
2) Limite inferior = Q1 − 1,5 · DI; limite superior = Q3 + 1,5 · DI.
3) Tudo que está fora dos limites é outlier.
::x
Q1 = 4, Q3 = 9, DI = 5 → limites −3,5 e 16,5 → o valor 40 é outlier.
Se incluir o 40: média 9,4 e dp 11,06. Sem ele: média 6 e dp 2,74. Veja como um único valor distorce.
::e
q <- quantile(d, c(0.25, 0.75), type = 2)
di <- q[2] - q[1]
d[d < q[1] - 1.5*di | d > q[2] + 1.5*di]
::r
[1] 40
::a Remover outlier só porque "atrapalha" é manipular os dados.
::v IQR() e limites dos outliers | C:Box-plot | C:Média × Mediana: qual usar? | C:Valores ignorados (NA e o código 99)

@G Duas variáveis (análise bidimensional) | #7ee07e | Como duas variáveis se relacionam? A técnica depende dos tipos: duas qualitativas (tabela cruzada), uma de cada (comparar grupos) ou duas quantitativas (dispersão). (Estatística Descritiva, Aulas 10 a 12)
@@ Tabela cruzada
::f Aulas 10, 11 e 12 · Análise bidimensional
::o Tabela de dupla entrada: as categorias de uma variável nas linhas, as da outra nas colunas, e em cada célula a contagem de casos que têm aquela combinação.
::q É o quadro de presença de uma festa com duas perguntas: quantas mulheres fumantes, quantos homens não fumantes... cada casinha responde a uma combinação.
::w cruzada
::i Primeiro leia as margens (quantos de cada categoria), depois compare as células. Para comparar grupos de tamanhos diferentes, use percentuais.
::p Célula | combinação (ex.: mulher e fuma).
::p Total da linha / da coluna | margens: contagem de cada categoria sozinha.
::p Total geral | n.
::x
Sexo × fuma, 8 pessoas:
          Fuma   Não fuma   Total
Feminino    3        2        5
Masculino   1        2        3
Total       4        4        8
::e
tab <- table(sexo, fuma)
addmargins(tab)
::a Comparar contagens entre grupos de tamanhos diferentes engana: use percentuais.
::v table() | addmargins() | tabyl() e adorn_*() (janitor) | C:Percentual por linha, coluna ou total
@@ Percentual por linha, coluna ou total
::f Aulas 11 e 12 · Análise bidimensional
::o Em tabela cruzada você pode calcular percentuais de 3 formas, e cada uma responde uma pergunta diferente.
::q Muda o "denominador": dividir pelo total da linha, da coluna ou da tabela inteira. Antes de calcular, escreva a pergunta.
::w cruzada2
::s
% linha  = célula ÷ total da linha × 100
% coluna = célula ÷ total da coluna × 100
% total  = célula ÷ total geral × 100
::p % da linha | cada linha soma 100%: "ENTRE os de cada linha, qual parte...?" (ex.: entre as mulheres, quantas fumam?)
::p % da coluna | cada coluna soma 100%: "ENTRE os de cada coluna, qual parte...?" (ex.: entre os fumantes, quantos são mulheres?)
::p % do total | tudo soma 100%: "do conjunto todo, qual parte...?"
::x
Mulheres que fumam: 3.  Total de mulheres: 5.  Fumantes: 4.  Total geral: 8.
% linha:  3 ÷ 5 = 60%    (entre as mulheres, 60% fumam)
% coluna: 3 ÷ 4 = 75%    (entre os fumantes, 75% são mulheres)
% total:  3 ÷ 8 = 37,5%  (37,5% de TODOS são mulheres fumantes)
::e
round(prop.table(tab, 1) * 100, 1)   # por linha
round(prop.table(tab, 2) * 100, 1)   # por coluna
round(prop.table(tab) * 100, 1)      # do total
::a Trocar linha por coluna muda completamente a conclusão. Escolha o percentual pela pergunta.
::a Em prop.table(): 1 = linha, 2 = coluna, sem número = total.
::v prop.table() | addmargins() | tabyl() e adorn_*() (janitor) | C:Tabela cruzada
@@ Comparar grupos com box-plots
::f Aulas 11 e 12 · Qualitativa × quantitativa
::o Para ver se uma variável numérica difere entre categorias (peso por sexo), desenhe um box-plot para cada categoria na mesma escala, ou calcule medidas por grupo.
::q Colocar os grupos lado a lado, na mesma régua, para dar para ver quem é maior, quem varia mais e quem tem valores estranhos.
::w comparativo
::i Se as caixas quase não se sobrepõem, os grupos tendem a ser realmente diferentes. Se se sobrepõem muito, a diferença é pequena perto da variação.
::s
1) Calcule média/mediana/dp por grupo (tapply).
2) Desenhe boxplot(numerica ~ categorica).
3) Compare: posição (mediana), dispersão (largura da caixa), forma e outliers.
::x
Peso por sexo: mediana F = 3,1 kg e M = 3,4 kg: M tem pesos um pouco maiores. Caixas de largura parecida: dispersão parecida.
::e
tapply(dados$peso, dados$sexo, median)
boxplot(peso ~ sexo, data = dados, col = c(6, 4))
::a Compare na MESMA escala vertical, senão o gráfico engana.
::v boxplot() | tapply() | C:Box-plot
@@ Gráfico de dispersão
::f Aulas 10 e 12 · Quantitativa × quantitativa
::o Cada observação vira um ponto (x, y). A nuvem mostra se as variáveis andam juntas (subindo ou descendo) ou se não têm relação.
::q Cada ponto é uma pessoa no mapa "altura × peso". Se os pontos formam uma faixa subindo, quem é mais alto tende a ser mais pesado.
::w dispersao
::i Procure: direção (sobe/desce), força (faixa estreita ou larga), forma (reta ou curva) e pontos isolados.
::s
plot(x, y)   # x no eixo horizontal, y no vertical
::x
Salário (x) e idade (y) de 8 funcionários: pontos subindo da esquerda para a direita → relação positiva: mais idade, salário maior.
::e
plot(x, y, pch = 19, xlab = "x", ylab = "y")
::a Com milhões de pontos, vira borrão: use amostra ou transparência.
::a Associação não significa que uma causa a outra.
::v Gráficos de dispersão (plot) | C:Correlação | cor()
@@ Correlação
::f Extra · complementa a Aula 10 (não aparece nos slides)
::o Número de −1 a +1 que mede a força e a direção da relação em LINHA RETA entre duas variáveis quantitativas.
::q +1: sobem juntas em linha reta. −1: uma sobe quando a outra desce. 0: nenhuma relação em linha reta.
::w correlacao
::i Regra prática: |r| ≥ 0,7 forte; entre 0,4 e 0,7 moderada; < 0,4 fraca.
::s
r = Σ(x − x̄)(y − ȳ) ÷ √[ Σ(x − x̄)² · Σ(y − ȳ)² ]
::p r = +1 | reta ascendente perfeita.
::p r = −1 | reta descendente perfeita.
::p r ≈ 0 | sem relação linear.
::x
x = 1, 2, 3, 4, 5 → x̄ = 3      y = 2, 4, 5, 4, 5 → ȳ = 4
(x − x̄) = −2, −1, 0, 1, 2      (y − ȳ) = −2, 0, 1, 0, 1
Produtos: 4, 0, 0, 0, 2 → soma = 6
Σ(x − x̄)² = 10      Σ(y − ȳ)² = 6
r = 6 ÷ √(10 · 6) = 6 ÷ 7,746 = 0,775
::e
cor(x, y)
::r
[1] 0.7745967
::a Correlação NÃO é causalidade.
::a Só mede relação em linha reta: relação em "U" pode dar r perto de 0 mesmo sendo forte.
::a Muito sensível a outliers.
::a Este tema não está nos slides: é um complemento natural do gráfico de dispersão.
::v cor() | C:Gráfico de dispersão | C:Outliers (valores atípicos)

@G Probabilidade | #e76f51 | A matemática da incerteza: como medir a chance de algo acontecer, combinar eventos e atualizar probabilidades com novas informações. (Análise Estatística para Data Science, Aula 1)
@@ Espaço amostral e eventos
::f Análise Estatística · Aula 1
::o Num experimento aleatório (resultado imprevisível), o espaço amostral Ω é a lista de TODOS os resultados possíveis, e um evento é qualquer pedaço dessa lista.
::q Jogar um dado: Ω = {1, 2, 3, 4, 5, 6} é o "cardápio completo". O evento "sair par" é o prato {2, 4, 6}, escolhido de dentro do cardápio.
::w eventos
::i Antes de calcular qualquer probabilidade, escreva Ω e o evento. Metade dos erros em probabilidade vem de um espaço amostral mal montado.
::p Fenômeno determinístico | sempre dá o mesmo resultado (água a 100 °C ao nível do mar ferve).
::p Fenômeno aleatório | o resultado não é previsível (moeda, tempo de espera numa fila).
::p Ω (ômega) | espaço amostral: conjunto de todos os resultados possíveis.
::p Evento (A, B...) | subconjunto de Ω.
::x
Moeda: Ω = {K, C}.   Dado: Ω = {1, 2, 3, 4, 5, 6}.
Dado até sair face ≥ 5 (S = sucesso, F = fracasso): Ω = {S, FS, FFS, FFFS, ...} (infinito!).
Tempo de vida de uma lâmpada: Ω = {t > 0} (contínuo).
Evento A: "nº par" = {2, 4, 6}.   Evento B: "nº ≥ 2" = {2, 3, 4, 5, 6}.
::e
omega <- 1:6
A <- omega[omega %% 2 == 0]
A
B <- omega[omega >= 2]
B
::r
[1] 2 4 6
[1] 2 3 4 5 6
::v C:Probabilidade: clássica e frequentista | C:União, interseção e complementar | expand.grid() | sample()
@@ Probabilidade: clássica e frequentista
::f Análise Estatística · Aula 1
::o Duas formas de dar um número à chance de um evento: contando casos (clássica: favoráveis ÷ possíveis, se todos são igualmente prováveis) ou observando repetições (frequentista: proporção de vezes em que ocorreu).
::q Clássica: "o dado tem 6 faces iguais, então par tem 3/6". Frequentista: "joguei 100 vezes a moeda e saíram 52 caras, então P(cara) ≈ 0,52".
::w lgn
::s
Clássica:      P(A) = m / N         (m casos favoráveis, N casos possíveis igualmente prováveis)
Frequentista:  P(A) ≈ n(A) / n      (n(A) ocorrências em n repetições, com n grande)
Sempre:        0 ≤ P(A) ≤ 1;  P(evento impossível) = 0;  P(evento certo) = 1
::x
Dado honesto, B = "nº ≥ 2" = {2, 3, 4, 5, 6}: P(B) = 5/6 = 0,833.
Basquete: 5.915 acertos em 6.679 lances: P(acerto) ≈ 5915/6679 = 0,886.
::e
5 / 6
5915 / 6679
set.seed(1)
mean(sample(1:6, 10000, replace = TRUE) >= 2)   # simulação: perto de 0,833
::r
[1] 0.8333333
[1] 0.8856116
[1] 0.8314
::a A definição clássica só vale se os resultados forem igualmente prováveis. Numa moeda viciada, P(cara) não é 1/2.
::v C:Lei dos Grandes Números | Simulação: frequência relativa com mean() | C:Espaço amostral e eventos
@@ Lei dos Grandes Números
::f Análise Estatística · Aula 1
::o Quando um experimento é repetido muitas vezes, a frequência relativa de um evento tende a se aproximar da sua probabilidade verdadeira.
::q No começo a média "pula" muito; com milhares de repetições, cada novo resultado mexe quase nada nela. É por isso que cassinos e seguradoras não perdem dinheiro no longo prazo.
::w lgn
::x
Primeiros lançamentos: coroa, cara, coroa, cara.
Frequência de caras: 0/1 = 0,00 → 1/2 = 0,50 → 1/3 = 0,33 → 2/4 = 0,50.
Depois de 1.000 lançamentos, a frequência fica perto de 0,5 (mas não precisa ser exatamente 0,5).
::e
set.seed(1)
x <- sample(c(0, 1), 1000, replace = TRUE)
round(cumsum(x)[c(1, 4, 10, 100, 1000)] / c(1, 4, 10, 100, 1000), 3)
::r
[1] 0.000 0.250 0.400 0.510 0.498
::a "Falácia do jogador": depois de 5 coroas seguidas, a chance de cara continua 1/2. A moeda não "compensa"; os resultados antigos é que vão ficando diluídos.
::v Lei dos Grandes Números (simulação) | C:Probabilidade: clássica e frequentista | C:Teorema do Limite Central
@@ União, interseção e complementar
::f Análise Estatística · Aula 1
::o União (A ∪ B) = "A ou B (ou ambos)"; interseção (A ∩ B) = "A e B ao mesmo tempo"; complementar (Ā) = "não A". Eventos disjuntos não podem acontecer juntos (A ∩ B = ∅).
::q Na sala de aula: "usa óculos OU é canhoto" junta os dois grupos (sem contar duas vezes quem é as duas coisas); "usa óculos E é canhoto" é só quem está nos dois.
::w eventos
::s
P(A ∪ B) = P(A) + P(B) − P(A ∩ B)
Disjuntos: P(A ∩ B) = 0  →  P(A ∪ B) = P(A) + P(B)
Complementar: P(Ā) = 1 − P(A)
::p − P(A ∩ B) | tira o que foi contado duas vezes (quem está em A e em B).
::x
Dado: A = par = {2, 4, 6}, C = {5, 6}. A ∩ C = {6}.
P(A ∪ C) = 3/6 + 2/6 − 1/6 = 4/6 = 2/3   (A ∪ C = {2, 4, 5, 6}).
B = {5}: A ∩ B = ∅ (disjuntos) → P(A ∪ B) = 3/6 + 1/6 = 2/3.
Complementar de "nº ≥ 2": {1} → P = 1 − 5/6 = 1/6.
::e
A <- c(2, 4, 6); C <- c(5, 6)
union(A, C)
intersect(A, C)
length(union(A, C)) / 6
::r
[1] 2 4 6 5
[1] 6
[1] 0.6666667
::a Somar P(A) + P(B) sem descontar a interseção dá probabilidade maior que a certa (pode até passar de 1).
::v union(), intersect() e setdiff() | C:Probabilidade condicional | C:Espaço amostral e eventos
@@ Probabilidade condicional
::f Análise Estatística · Aula 1
::o P(B|A) ("B dado A") é a probabilidade de B sabendo que A já aconteceu: o espaço amostral "encolhe" para A.
::q Chance de um aluno ser aprovado é uma coisa; chance de ser aprovado DADO que estudou todos os dias é outra. A informação nova muda a probabilidade.
::w eventosCond
::i Pense em "entre os casos em que A aconteceu, em quantos B também aconteceu?".
::s
P(B | A) = P(A ∩ B) / P(A)
::x
Dado: A = {3, 4}, B = ímpar = {1, 3, 5}. A ∩ B = {3}.
P(A | B) = (1/6) / (3/6) = 1/3   → entre os 3 ímpares, só o 3 está em A.
P(B | A) = (1/6) / (2/6) = 1/2   → entre {3, 4}, só o 3 é ímpar.
::a P(A | B) e P(B | A) quase sempre são diferentes. Confundir as duas é um erro clássico (por exemplo, em exames médicos).
::v C:Eventos independentes | C:Teorema de Bayes | Teorema de Bayes com vetores
@@ Eventos independentes
::f Análise Estatística · Aula 1
::o A e B são independentes quando saber que um aconteceu não muda a probabilidade do outro: P(A ∩ B) = P(A)·P(B).
::q Duas moedas diferentes são independentes: o resultado da primeira não "avisa" nada sobre a segunda.
::w eventosInd
::s
Independentes ⇔ P(A ∩ B) = P(A) · P(B)
            ⇔ P(B | A) = P(B)  e  P(A | B) = P(A)
::x
A = {1, 2, 3}, B = {3, 4}: P(A ∩ B) = 1/6 e P(A)·P(B) = 1/2 · 1/3 = 1/6 → independentes.
C = ímpares, D = pares: P(C ∩ D) = 0, mas P(C)·P(D) = 1/4 → dependentes.
::a Disjunto não é a mesma coisa que independente! Eventos disjuntos (com probabilidade positiva) são sempre DEPENDENTES: se um aconteceu, o outro com certeza não aconteceu.
::v C:Probabilidade condicional | C:União, interseção e complementar
@@ Teorema de Bayes
::f Análise Estatística · Aula 1
::o Fórmula para "inverter" uma probabilidade condicional: a partir de P(A|Ci) e P(Ci), calcula P(Ci|A), a probabilidade da causa depois de observar o efeito.
::q Você sabe a chance de um exame dar positivo em quem está doente. Bayes responde a pergunta que importa: dado que deu positivo, qual a chance de estar doente?
::w bayes
::i Um diagrama em árvore (primeiro os grupos, depois aprovado/reprovado) ajuda muito a organizar a conta.
::s
P(Ci | A) = P(A | Ci) · P(Ci) / Σ P(A | Cj) · P(Cj)
denominador = P(A) = probabilidade total de A
::p P(Ci) | probabilidade a priori (antes da informação).
::p P(A | Ci) | chance de observar A em cada caso.
::p P(Ci | A) | probabilidade a posteriori (depois de saber que A ocorreu).
::x
Empresa: 25% bons, 50% médios, 25% fracos; aprovação no teste: 80%, 50%, 20%.
P(aprovado) = 0,80·0,25 + 0,50·0,50 + 0,20·0,25 = 0,20 + 0,25 + 0,05 = 0,50
P(fraco | aprovado) = 0,05 / 0,50 = 0,10 → só 10% dos aprovados seriam fracos.
Urnas: P(C3 | branca) = (1 · 1/5) / (8/15) = 3/8.
::e
prior <- c(B = 0.25, M = 0.50, F = 0.25)
aprov <- c(0.80, 0.50, 0.20)
prior * aprov / sum(prior * aprov)
::r
  B   M   F 
0.4 0.5 0.1 
::a Esquecer a probabilidade a priori: um teste muito preciso para uma doença rara ainda gera muitos falsos positivos.
::v Teorema de Bayes com vetores | C:Probabilidade condicional
@@ Métodos de contagem
::f Análise Estatística · Aula 1
::o Técnicas para contar resultados sem listar um por um. A pergunta-chave: a ordem importa? Pode repetir?
::q Senha (ordem importa, pode repetir), pódio de corrida (ordem importa, não repete), Mega-Sena (ordem não importa, não repete) e dominó (ordem não importa, repete).
::w contagem
::s
Princípio fundamental: m maneiras e depois n maneiras → m · n maneiras
Permutação de N itens: N!
Ordenada sem reposição: N! / (N − n)!          → factorial(N) / factorial(N - n)
Ordenada com reposição: N^n                    → N^n
Não ordenada sem reposição: C(N, n)            → choose(N, n)
Não ordenada com reposição: C(N + n − 1, n)    → choose(N + n - 1, n)
::x
Roteiro de 4 atrações: 4! = 24.
Código de 4 dígitos distintos: 10·9·8·7 = 5.040.   Podendo repetir: 10^4 = 10.000.
Mega-Sena: C(60, 6) = 50.063.860.   Dominó: C(7 + 2 − 1, 2) = C(8, 2) = 28 peças.
::e
factorial(4); prod(10:7); 10^4; choose(60, 6); choose(8, 2)
::r
[1] 24
[1] 5040
[1] 10000
[1] 50063860
[1] 28
::a Use contagem para a definição clássica: P(ganhar na Mega-Sena com 1 aposta) = 1 / choose(60, 6).
::v choose() | Arranjo e permutação com factorial() | log(), log10(), log2() e factorial()
@@ Problema de Monty Hall
::f Análise Estatística · Aula 1 (desafio)
::o Três portas, um carro e dois bodes. Você escolhe uma; o apresentador, que sabe onde está o carro, abre outra com bode. Trocar de porta ganha com probabilidade 2/3; ficar, só 1/3.
::q Na primeira escolha você acerta em 1/3 das vezes. Em 2/3 você escolheu um bode, e aí o apresentador é obrigado a deixar fechada exatamente a porta do carro. Trocar = apostar que você errou no começo.
::w monty
::x
Você escolhe a porta 1.
Carro na 1 → trocando perde; ficando ganha.
Carro na 2 → apresentador abre a 3; trocando ganha.
Carro na 3 → apresentador abre a 2; trocando ganha.
Trocar ganha em 2 de 3 cenários.
::e
set.seed(42)
carro <- sample(1:3, 10000, replace = TRUE)
escolha <- sample(1:3, 10000, replace = TRUE)
c(ficar = mean(escolha == carro), trocar = mean(escolha != carro))
::r
 ficar trocar 
0.3454 0.6546 
::a A intuição "sobraram 2 portas, então é 50%" falha porque o apresentador NÃO abre uma porta ao acaso: ele usa a informação de onde está o carro.
::v sample() | C:Probabilidade condicional

@G Variáveis aleatórias e distribuições | #2a9d8f | Como transformar resultados em números e descrever suas probabilidades com modelos prontos: Bernoulli, binomial, Poisson, uniforme e normal. (Análise Estatística, Aula 2)
@@ Variável aleatória
::f Análise Estatística · Aula 2
::o Uma regra que associa um número a cada resultado do experimento. Discreta: valores contáveis (0, 1, 2...). Contínua: qualquer valor num intervalo.
::q Retirar 3 peças gera resultados como BDB; a variável X "conta as defeituosas" e transforma BDB em 1. Assim dá para fazer contas com resultados que eram letras.
::w va
::p X, Y, Z | letras maiúsculas para a variável (antes de observar).
::p x | letra minúscula para um valor observado.
::p Discreta | número de filhos, de defeitos, de acertos.
::p Contínua | peso, tempo, pressão arterial.
::x
P(D) = 1/3. Ω = {BBB, BBD, BDB, DBB, BDD, DBD, DDB, DDD}.
P(BBB) = (2/3)³ = 8/27 → X = 0
BBD, BDB, DBB: 4/27 cada → X = 1 → P(X = 1) = 12/27
BDD, DBD, DDB: 2/27 cada → X = 2 → P(X = 2) = 6/27
DDD: 1/27 → X = 3
::e
round(dbinom(0:3, size = 3, prob = 1/3) * 27)
::r
[1]  8 12  6  1
::v C:Função de probabilidade e função acumulada | C:Distribuições de Bernoulli e binomial | dbinom()
@@ Função de probabilidade e função acumulada
::f Análise Estatística · Aula 2
::o A função de probabilidade p(x) = P(X = x) dá a chance de cada valor (barras que somam 1). A função de distribuição acumulada F(x) = P(X ≤ x) soma tudo até x.
::q p(x) é "quantos chegaram em cada posição"; F(x) é "quantos já chegaram até essa posição". F só sobe, em degraus, de 0 até 1.
::w binomAcum
::i No R, as funções que começam com d dão p(x) e as que começam com p dão F(x).
::s
p(x) = P(X = x),  com p(x) ≥ 0 e Σ p(x) = 1
F(x) = P(X ≤ x) = soma de p(t) para t ≤ x
::x
Peças: p(0) = 8/27, p(1) = 12/27, p(2) = 6/27, p(3) = 1/27.
F(−1) = 0 · F(0) = 8/27 · F(0,5) = 8/27 · F(1) = 20/27 · F(2) = 26/27 · F(3) = F(10) = 1.
::e
cumsum(dbinom(0:3, 3, 1/3)) * 27
pbinom(1, 3, 1/3)      # F(1) = 20/27
::r
[1]  8 20 26 27
[1] 0.7407407
::v pbinom() | dbinom() | C:Variável aleatória | C:Funções d, p, q e r do R
@@ Esperança e variância de uma variável aleatória
::f Análise Estatística · Aula 2
::o A esperança E(X) é a média "de longo prazo" da variável (soma de valor × probabilidade). A variância mede o quanto os valores se espalham em torno dela.
::q Seguradora: em 97% dos carros ganha R$ 1.000, em 3% perde R$ 29.000. Em média, por carro: 0,97 × 1.000 − 0,03 × 29.000 = R$ 100.
::w esperanca
::s
E(X) = Σ x · p(x)
Var(X) = Σ (x − E(X))² · p(x) = E(X²) − [E(X)]²
desvio padrão = √Var(X)
::x
Dado honesto: E(X) = (1 + 2 + 3 + 4 + 5 + 6) / 6 = 3,5
Var(X) = [(−2,5)² + (−1,5)² + (−0,5)² + 0,5² + 1,5² + 2,5²] / 6 = 17,5 / 6 ≈ 2,92
::e
x <- 1:6; p <- rep(1/6, 6)
sum(x * p)
sum((x - sum(x * p))^2 * p)
::r
[1] 3.5
[1] 2.916667
::a A esperança não precisa ser um valor possível (ninguém tira 3,5 num dado).
::v Esperança e variância de uma v.a. discreta | C:Variável aleatória
@@ Distribuições de Bernoulli e binomial
::f Análise Estatística · Aula 2
::o Bernoulli: um único ensaio com dois resultados (sucesso = 1, fracasso = 0). Binomial: conta os sucessos em n ensaios de Bernoulli independentes, todos com a mesma probabilidade p.
::q Bernoulli é jogar uma moeda uma vez. Binomial é jogar a moeda n vezes e contar as caras. Serve para "quantos de n" (aprovados, defeituosos, curados...).
::w binom
::s
Bernoulli X ~ b(1, p):  P(X = x) = p^x (1 − p)^(1 − x),  x ∈ {0, 1};  E = p,  Var = p(1 − p)
Binomial X ~ b(n, p):   P(X = x) = C(n, x) p^x (1 − p)^(n − x);  E = np,  Var = np(1 − p)
::p C(n, x) | de quantas maneiras os x sucessos podem se distribuir entre os n ensaios.
::x
Comprimidos: 8 de 10 dentro da especificação → p = 0,8; 5 verificações com reposição → X ~ b(5; 0,8).
P(X = 3) = C(5, 3) · 0,8³ · 0,2² = 10 · 0,512 · 0,04 = 0,2048.
E(X) = 5 · 0,8 = 4;  Var(X) = 5 · 0,8 · 0,2 = 0,8.
::e
dbinom(3, size = 5, prob = 0.8)
::r
[1] 0.2048
::a Requisitos: número fixo de tentativas, independentes, só dois resultados e p constante. Sorteio SEM reposição numa população pequena não é binomial (é hipergeométrica).
::v dbinom() | pbinom() | rbinom() | C:Função de probabilidade e função acumulada
@@ Distribuição de Poisson
::f Análise Estatística · Aula 2
::o Modela a CONTAGEM de ocorrências de um evento num intervalo (de tempo, área, volume), quando elas acontecem a uma taxa média λ. É o limite da binomial com n grande e p pequeno.
::q Defeitos por m² de tecido, chamadas por hora numa central, pacientes por dia num pronto-socorro: você sabe a média, e quer a chance de um número específico.
::w poisson
::s
X ~ P(λ):  P(X = x) = e^(−λ) λ^x / x!,  x = 0, 1, 2, ...
E(X) = Var(X) = λ
::x
Tecido com 2 defeitos/m² em média: X ~ P(2).
P(X = 4) = e^(−2) · 2⁴ / 4! = 0,135 · 16 / 24 = 0,09.
P(X ≥ 2) = 1 − [P(0) + P(1)] = 1 − (0,135 + 0,271) = 0,594.
::e
dpois(4, 2)
1 - ppois(1, 2)
::r
[1] 0.09022352
[1] 0.5939942
::a A taxa tem que estar na unidade da pergunta: 2 defeitos por m² viram λ = 6 para 3 m².
::v dpois() e ppois() | qpois() e rpois() | C:Distribuições de Bernoulli e binomial
@@ Variável contínua e densidade
::f Análise Estatística · Aula 2
::o Numa variável contínua, a probabilidade de um intervalo é a ÁREA sob a curva de densidade f(x). A área total é 1 e a probabilidade de um valor exato é 0.
::q Pense numa mangueira de 2 metros: a chance de cortar exatamente no milímetro 1.500,000... é zero, mas a chance de cortar entre 1,5 m e 2 m é 25%. Só intervalos têm probabilidade.
::w uniforme
::s
P(a ≤ X ≤ b) = área sob f(x) entre a e b
Uniforme U(α, β): f(x) = 1 / (β − α) em [α, β]
P(a ≤ X ≤ b) = (b − a) / (β − α);  E(X) = (α + β)/2;  Var(X) = (β − α)²/12
::x
Aula com duração U(50, 52) minutos: altura da densidade = 1/2.
P(aula > 51,5 min) = (52 − 51,5) × 0,5 = 0,25.
::e
1 - punif(51.5, min = 50, max = 52)
dunif(51.5, 50, 52)     # altura, não probabilidade
::r
[1] 0.25
[1] 0.5
::a Em variáveis contínuas, P(X > 51,5) = P(X ≥ 51,5): incluir ou não a ponta não muda nada.
::v dunif(), punif() e qunif() | C:Distribuição normal e escore z
@@ Distribuição normal e escore z
::f Análise Estatística · Aula 2
::o A curva em sino, simétrica em torno da média μ (média = mediana = moda), com espalhamento dado por σ. Toda normal vira a normal padrão N(0, 1) pela padronização Z = (X − μ)/σ.
::q O escore z diz "quantos desvios padrão acima (ou abaixo) da média" um valor está. QI 130 com média 100 e σ = 15 é z = 2: bem acima da média.
::w normal
::s
X ~ N(μ, σ²)
Z = (X − μ) / σ ~ N(0, 1)
P(a ≤ X ≤ b) = P((a − μ)/σ ≤ Z ≤ (b − μ)/σ) = pnorm(b, μ, σ) − pnorm(a, μ, σ)
::x
X ~ N(3, 16) (σ = 4): P(2 ≤ X ≤ 5) = P(−0,25 ≤ Z ≤ 0,5) = 0,6915 − 0,4013 = 0,2902.
PAS ~ N(120, 25) (σ = 5): P(X ≤ 129) = P(Z ≤ 1,8) = 0,9641.
QI ~ N(100, 15²): 68,26% entre 85 e 115; 95,44% entre 70 e 130.
::e
pnorm(5, 3, 4) - pnorm(2, 3, 4)
pnorm(129, 120, 5)
pnorm(115, 100, 15) - pnorm(85, 100, 15)
::r
[1] 0.2901688
[1] 0.9640697
[1] 0.6826895
::a A notação N(μ, σ²) usa a VARIÂNCIA, mas o R usa o DESVIO PADRÃO: N(3, 16) → pnorm(..., mean = 3, sd = 4).
::v pnorm() | qnorm() | Padronização: escore z | C:Regra empírica (68-95-99,7) | C:Funções d, p, q e r do R
@@ Funções d, p, q e r do R
::f Análise Estatística · Aula 2 · Atividade 4
::o Para cada distribuição, o R tem 4 funções com o mesmo padrão de nome: d (probabilidade/densidade), p (acumulada), q (quantil) e r (sorteio).
::q d = "qual a altura/chance neste ponto?", p = "qual a área até aqui?", q = "até onde preciso ir para juntar essa área?", r = "me dê valores sorteados".
::w dpqr
::i p e q são inversas: qnorm(pnorm(1.5)) devolve 1,5.
::s
d<dist>(x, ...)   P(X = x) ou densidade f(x)      dbinom, dpois, dunif, dnorm, dt, dchisq
p<dist>(q, ...)   P(X ≤ q)                         pbinom, ppois, punif, pnorm, pt, pchisq
q<dist>(p, ...)   valor com área p à esquerda      qbinom, qpois, qunif, qnorm, qt, qchisq
r<dist>(n, ...)   n valores sorteados              rbinom, rpois, runif, rnorm, rt, rchisq
::e
dnorm(0); pnorm(1.96); qnorm(0.975); set.seed(1); rnorm(3)
::r
[1] 0.3989423
[1] 0.9750021
[1] 1.959964
[1] -0.6264538  0.1836433 -0.8356286
::v dbinom() | pnorm() | qnorm() | runif(), rnorm() e set.seed()

@G Inferência estatística | #9d4edd | Usar uma amostra para tirar conclusões sobre a população: distribuições amostrais, intervalos de confiança e testes de hipóteses. (Análise Estatística, Aulas 3 e 4)
@@ Parâmetro, estatística e inferência
::f Análise Estatística · Aula 3
::o Parâmetro é um número que descreve a população (μ, σ, p), quase sempre desconhecido. Estatística é o número calculado na amostra (x̄, s, p̂). Inferência é usar a estatística para estimar e testar o parâmetro.
::q O parâmetro é o "gabarito" que ninguém viu. A estatística é a sua resposta, feita com uma amostra. A inferência diz o quanto você pode confiar nela.
::w amostra
::p População / censo | todos os elementos / dados de todos eles.
::p Amostra / amostragem | parte da população / processo de escolher essa parte.
::p Estimativa pontual | um único número (x̄ = 20,8 anos).
::p Estimativa intervalar | uma faixa com nível de confiança (IC).
::x
Idades de 10 alunos: 20, 18, 21, 18, 19, 27, 25, 18, 19, 23.
x̄ = 208/10 = 20,8 anos · s² = 91,6/9 = 10,17 anos² · s = 3,19 anos · amplitude w = 27 − 18 = 9.
São estatísticas: estimam μ e σ da população de alunos.
::e
x <- c(20, 18, 21, 18, 19, 27, 25, 18, 19, 23)
c(media = mean(x), var = var(x), dp = sd(x), amplitude = max(x) - min(x))
::r
    media       var        dp amplitude 
20.800000 10.177778  3.190263  9.000000 
::a A base SINASC tem todos os nascimentos do ano: é praticamente a POPULAÇÃO. Por isso, na Atividade 9, o professor tira uma amostra de 200 para treinar e depois compara com o valor populacional.
::v C:População e amostra | C:Teorema do Limite Central | sample()
@@ Teorema do Limite Central
::f Análise Estatística · Aula 3 · Atividade 6
::o Para amostras grandes, a média amostral X̄ tem distribuição aproximadamente normal, com média μ e variância σ²/n, qualquer que seja o formato da população.
::q Uma pessoa sozinha pode ter qualquer altura; a média de 30 pessoas sorteadas quase sempre fica perto da média geral. E se você repetir o sorteio mil vezes, essas médias formam um sino.
::w tlc
::s
X̄ ≈ N(μ, σ²/n)  para n grande (regra prática: n ≥ 30)
Z = (X̄ − μ) / (σ / √n) ≈ N(0, 1)
Proporção: p̂ ≈ N(p, p(1 − p)/n)
σ desconhecido: T = (X̄ − μ) / (s / √n) ~ t com n − 1 gl
::p σ / √n | erro padrão da média: diminui quando n aumenta.
::x
Poisson com λ = 10 e amostras de n = 30: as médias seguem aproximadamente N(10, 10/30), ou seja, desvio √10/√30 ≈ 0,577.
Se a população já é normal, X̄ é exatamente normal para qualquer n.
::e
set.seed(12345)
medias <- replicate(1000, mean(rpois(30, 10)))
round(c(media = mean(medias), dp = sd(medias)), 3)
::r
 media     dp 
10.031  0.558 
::a O TLC fala da distribuição da MÉDIA, não dos dados: os dados continuam com o formato que tinham.
::v Simulação do Teorema do Limite Central | C:Intervalo de confiança | C:Distribuição t de Student
@@ Distribuição t de Student
::f Análise Estatística · Aulas 3 e 4
::o Distribuição parecida com a normal, porém com caudas mais pesadas, usada quando trocamos σ (desconhecido) por s. Tem n − 1 graus de liberdade e se aproxima da normal quando n cresce.
::q Como s é só uma estimativa de σ, há uma incerteza a mais. A t "paga" por isso deixando as caudas mais gordas: os valores críticos ficam maiores que 1,96.
::w tdist
::s
T = (X̄ − μ) / (s / √n) ~ t(n − 1)
valor crítico: t_(α/2) = qt(1 − α/2, df = n − 1)
::x
n = 23 → 22 gl: t_(0,025) = 2,07 (contra 1,96 da normal).
n = 13 → 12 gl: valor crítico unilateral com α = 5%: 1,782.
::e
qt(0.975, df = c(5, 22, 100))
::r
[1] 2.570582 2.073873 1.983972
::v qt() e pt() | t.test() | IC para a média (z e t) | C:Teorema do Limite Central
@@ Intervalo de confiança
::f Análise Estatística · Aula 3
::o Uma faixa de valores, calculada com a amostra, que deve conter o parâmetro. O nível de confiança (90%, 95%, 99%) é a proporção de intervalos que acertam o parâmetro quando o processo é repetido muitas vezes.
::q Em vez de "chutar" um número (estimativa pontual), você joga uma rede (o intervalo). 95% de confiança quer dizer que essa rede, lançada muitas vezes, pega o peixe em 95% delas.
::w icsim
::s
Proporção (Wald):          p̂ ± z_(α/2) · √(p̂ q̂ / n)
Média (σ conhecido):       x̄ ± z_(α/2) · σ / √n
Média (σ desconhecido):    x̄ ± t_(α/2; n−1) · s / √n
z_(α/2): 90% → 1,645 · 95% → 1,96 · 99% → 2,575
::x
Satisfação: n = 280, p̂ = 123/280 = 0,439 → E = 1,96·√(0,439·0,561/280) = 0,058 → IC: 0,381 a 0,497.
Pulsação: x̄ = 76,3, σ = 12,5, n = 40 → E = 1,96·12,5/√40 = 3,87 → IC: 72,43 a 80,17.
Idades (σ desconhecido): x̄ = 46,96, s = 7,22, n = 23 → E = 2,07·7,22/√23 = 3,12 → IC: 43,83 a 50,08.
::e
idades <- c(34, 37, 37, 38, 41, 42, 43, 44, 44, 45, 45, 45, 46, 48, 49,
            53, 53, 54, 54, 55, 56, 57, 60)
round(t.test(idades)$conf.int, 2)
::r
[1] 43.83 50.08
attr(,"conf.level")
[1] 0.95
::a Errado: "há 95% de probabilidade de μ estar entre 43,83 e 50,08". Depois de calculado, o intervalo contém μ ou não. O 95% se refere ao método.
::v IC para a proporção (fórmula de Wald) | IC para a média (z e t) | prop.test() | t.test() | C:Margem de erro e tamanho da amostra
@@ Margem de erro e tamanho da amostra
::f Análise Estatística · Aula 3
::o Erro amostral é a diferença entre a estimativa e o parâmetro. A margem de erro E é o "±" do intervalo: depende da confiança (z), da variabilidade e do tamanho da amostra (√n no denominador).
::q Pesquisa eleitoral com "margem de 2 pontos" e candidato com 20%: o valor na população deve estar entre 18% e 22% (com 95% de confiança).
::w margem
::s
Proporção: E = z_(α/2) · √(p̂ (1 − p̂) / n)
Tamanho para uma margem E (pior caso p = 0,5): n = z² · 0,25 / E²
::x
n = 280, p̂ = 0,439, 95%: E = 1,96·√(0,439·0,561/280) = 0,058 (5,8 pontos).
Para E = 2 pontos com 95%: n = 1,96² · 0,25 / 0,02² ≈ 2.401 entrevistas.
::e
1.96 * sqrt(0.439 * 0.561 / 280)
ceiling(1.96^2 * 0.25 / 0.02^2)
::r
[1] 0.05812872
[1] 2401
::a Dobrar a amostra NÃO corta a margem pela metade: reduz por √2. Para cortar pela metade, é preciso quadruplicar n.
::v IC para a proporção (fórmula de Wald) | C:Intervalo de confiança
@@ Distribuição qui-quadrado e IC da variância
::f Análise Estatística · Aulas 3 e 4
::o A estatística (n − 1)s²/σ² segue uma qui-quadrado com n − 1 graus de liberdade (se a população for normal). Ela é assimétrica e só positiva, por isso o IC da variância usa dois valores críticos diferentes.
::q Variância nunca é negativa; a qui-quadrado também não. O intervalo fica "torto": mais comprido para o lado dos valores grandes.
::w chi
::s
IC para σ²:  ( (n − 1)s² / χ²_D ;  (n − 1)s² / χ²_E )
χ²_E = qchisq(α/2, n − 1)     χ²_D = qchisq(1 − α/2, n − 1)
IC para σ: raiz dos dois limites
Teste: χ² = (n − 1)s² / σ0²
::x
Pulsação: n = 22, s² = 98,398 → χ²_E = 10,283 e χ²_D = 35,479.
IC σ²: 21·98,398/35,479 = 58,24 a 21·98,398/10,283 = 200,95.   IC σ: 7,63 a 14,18.
::e
qchisq(c(0.025, 0.975), df = 21)
::r
[1] 10.28290 35.47888
::a Exige população normal mesmo com amostra grande (o TLC não socorre aqui).
::v qchisq() e pchisq() | IC para a variância (qui-quadrado) | sigma.test() (TeachingDemos)
@@ Hipóteses nula e alternativa
::f Análise Estatística · Aula 4
::o Hipótese é uma afirmação sobre um parâmetro. H0 (nula) diz que o parâmetro é IGUAL a um valor; H1 (alternativa) diz que ele é menor, maior ou diferente. O teste supõe H0 verdadeira e verifica se os dados a contradizem.
::q É como um julgamento: H0 é "inocente até que se prove o contrário". Só rejeitamos H0 se as evidências (dados) forem fortes o bastante.
::w hipoteses
::s
1. Escreva a afirmação em símbolos (p > 0,5).
2. Escreva o que vale se ela for falsa (p ≤ 0,5).
3. H1 = a expressão SEM igualdade (<, > ou ≠). H0 = "parâmetro = valor".
H1 com ≠ → bilateral · com < → unilateral à esquerda · com > → unilateral à direita
::x
"A maioria consegue emprego por amigos": H0: p = 0,5 vs H1: p > 0,5 (unilateral à direita).
"Peso médio é no máximo 195 lb": H0: μ = 195 vs H1: μ > 195.
"Temperatura média não é 37 °C": H0: μ = 37 vs H1: μ ≠ 37 (bilateral).
::a "Não rejeitar H0" não é o mesmo que "provar H0": pode faltar evidência (amostra pequena, por exemplo).
::v C:Estatística de teste, região crítica e valor crítico | C:Valor-p | Teste de hipóteses à mão (estatística e valor-p)
@@ Estatística de teste, região crítica e valor crítico
::f Análise Estatística · Aula 4
::o A estatística de teste (z, t ou χ²) mede o quão longe a amostra está de H0. A região crítica é o conjunto de valores dessa estatística que levam a rejeitar H0; o valor crítico é a fronteira dela, definida pelo nível de significância α.
::q α é o tamanho da "zona de rejeição" que você aceita: com α = 5%, você só rejeita H0 se o resultado estiver entre os 5% mais extremos que H0 permitiria.
::w regiao
::s
proporção:  z = (p̂ − p0) / √(p0 q0 / n)
média:      t = (x̄ − μ0) / (s / √n),  gl = n − 1
variância:  χ² = (n − 1)s² / σ0²,      gl = n − 1
Rejeite H0 se a estatística cair na região crítica.
::x
Trabalhadores: z = (0,61 − 0,5)/√(0,25/703) = 5,83; unilateral à direita com α = 5%: valor crítico 1,645. Como 5,83 > 1,645, rejeitamos H0.
Balas M&M: t = 0,626 < 1,782 (t com 12 gl) → não rejeitamos H0.
Latas: χ² = 13,45 > 13,091 (cauda esquerda, 23 gl) → não rejeitamos H0.
::e
qnorm(0.95); qt(0.95, 12); qchisq(0.05, 23)
::r
[1] 1.644854
[1] 1.782288
[1] 13.09051
::v Teste de hipóteses à mão (estatística e valor-p) | qnorm() | C:Valor-p | C:Hipóteses nula e alternativa
@@ Valor-p
::f Análise Estatística · Aula 4
::o Probabilidade de obter um resultado tão ou mais extremo que o observado, SUPONDO H0 verdadeira. Valor-p pequeno (≤ α) indica que os dados são raros sob H0, então rejeitamos H0.
::q Se a moeda fosse honesta (H0), qual a chance de sair 9 caras ou mais em 10? Se essa chance é minúscula, você desconfia da moeda.
::w valorp
::s
unilateral à direita:  valor-p = P(Z ≥ z) = 1 − pnorm(z)
unilateral à esquerda: valor-p = P(Z ≤ z) = pnorm(z)
bilateral:             valor-p = 2 · (1 − pnorm(|z|))
Decisão: valor-p ≤ α → rejeita H0;  valor-p > α → não rejeita H0
::x
Trabalhadores: z = 5,83 → valor-p < 0,0001 → rejeita H0.
Balas M&M: P(t12 > 0,626) = 0,272 → não rejeita.
Latas: P(χ²23 < 13,45) = 0,058 → não rejeita (por pouco!).
::e
1 - pnorm(5.83); 1 - pt(0.626, 12); pchisq(13.45, 23)
::r
[1] 2.771369e-09
[1] 0.2715193
[1] 0.05845285
::a O valor-p NÃO é a probabilidade de H0 ser verdadeira. É a probabilidade dos dados (ou mais extremos) caso H0 fosse verdadeira.
::v pnorm() | prop.test() | t.test() | $conf.int, $p.value e $estimate | C:Estatística de teste, região crítica e valor crítico
@@ Erros tipo I e II
::f Análise Estatística · Aula 4
::o Erro tipo I: rejeitar H0 quando ela é verdadeira (probabilidade α). Erro tipo II: não rejeitar H0 quando ela é falsa (probabilidade β). Diminuir um tende a aumentar o outro.
::q Alarme de incêndio: tipo I é o alarme tocar sem fogo (falso alarme); tipo II é haver fogo e o alarme ficar quieto. Um alarme muito sensível dispara à toa; um pouco sensível deixa passar incêndio.
::w erros
::s

B.join()!=='3,4'","x":"Um B com uma face dentro de A e outra fora mantém a proporção: P(A | B) = P(A) = 0,5."},{"t":"n","q":["A e B independentes, com P(A) = 0,5 e P(B) = 0,2. Quanto vale P(A ∩ B)?"],"a":0.1,"x":"Independentes: P(A ∩ B) = P(A)·P(B) = 0,5 × 0,2 = **0,1**."},{"t":"q","q":["A e B são disjuntos, com P(A) = 0,3 e P(B) = 0,4. Eles são independentes?"],"o":[{"ok":true,"x":"Não: P(A ∩ B) = 0, mas P(A)·P(B) = 0,12"},{"ok":false,"x":"Sim, porque não se misturam"},{"ok":false,"x":"Sim, sempre"},{"ok":false,"x":"Impossível saber"}],"x":"Disjuntos com probabilidade positiva nunca são independentes: se um ocorreu, o outro com certeza não ocorreu."}],"Teorema de Bayes":[{"t":"g","q":["Uma doença atinge 2% das pessoas. O teste acerta 95% dos doentes e 90% dos saudáveis. Seu teste deu positivo. Qual a chance de você estar doente?"],"o":[{"ok":false,"x":"95%"},{"ok":false,"x":"90%"},{"ok":true,"x":"Cerca de 16%"},{"ok":false,"x":"2%"}],"x":"Dos 1000: 19 doentes positivos e 98 saudáveis positivos. Só 19 de 117 positivos estão doentes: cerca de **16%**."},{"t":"m","q":["Aumente a **prevalência da doença** até P(doente | +) passar de **50%**."],"c":"s.post>0.5","x":"Quanto mais comum a doença, mais confiável é um positivo. A \"chance antes\" (a priori) muda a \"chance depois\" (a posteriori)."},{"t":"m","q":["Volte a prevalência para **2%** e aumente a **especificidade** até P(doente | +) passar de 50%."],"c":"Math.abs(s.prev-0.02)<1e-9&&s.post>0.5","x":"Com 99% de especificidade, os falsos positivos caem muito. Para doença rara, a especificidade é decisiva."},{"t":"n","q":["Em 1000 pessoas, 20 estão doentes. O teste dá positivo em 19 doentes e em 98 saudáveis. P(doente | +), em %? (uma casa decimal)"],"a":16.24,"tol":0.2,"x":"19 ÷ (19 + 98) = 19 ÷ 117 ≈ **16,2%**."}],"Métodos de contagem":[{"t":"g","q":["Uma senha tem 4 dígitos (0 a 9) e pode repetir dígito. Quantas senhas são possíveis?"],"o":[{"ok":false,"x":"40"},{"ok":false,"x":"5.040"},{"ok":true,"x":"10.000"},{"
