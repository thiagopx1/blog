@@ (Aula 18) Grave uma tabela tratada no SQLite e responda com SQL e com dplyr: % de óbito por grupo de CID com mais de 3000 internações.
::f Banco de Dados · Aula 18
::c dbWriteTable(), GROUP BY, HAVING, ROUND(), group_by() e summarise(), dplyr ↔ SQL (equivalências)
::o É o "pipeline SQL → R": limpo no R, gravo no banco e consulto em SQL. Depois confiro que o dplyr dá o mesmo resultado.
::p AVG(DESFECHO) * 100 | DESFECHO é 0/1: a média é a proporção de óbitos.
::p HAVING COUNT(*) > 3000 | equivale ao filter(n > 3000) depois do summarise().
::p overwrite = TRUE | recria a tabela se ela já existir.
::e
con <- dbConnect(RSQLite::SQLite(), "internacoes.sqlite")
dbWriteTable(con, "internacoes", internacoes_tratadas, overwrite = TRUE)
dbGetQuery(con, "
  SELECT GRUPO_CID, COUNT(*) AS n,
         ROUND(AVG(DESFECHO) * 100, 1) AS pct_obito
  FROM internacoes
  GROUP BY GRUPO_CID
  HAVING COUNT(*) > 3000
  ORDER BY pct_obito DESC")
# mesmo resultado em dplyr
internacoes_tratadas |>
  group_by(GRUPO_CID) |>
  summarise(n = n(), pct_obito = round(mean(DESFECHO) * 100, 1)) |>
  filter(n > 3000) |>
  arrange(desc(pct_obito))
dbDisconnect(con)
::r
             GRUPO_CID     n pct_obito
1    Cerebrovasculares 12587      17.3
2           Coronarias 16513      11.4
3 Outras circulatorias 15743      11.1
</script>
<script type="text/plain" id="d-glos">@G Palavras do R que aparecem o tempo todo | #ffd166 | Se alguma palavra das aulas parecer "grego", procure aqui.
@@ Console
::o O painel do RStudio onde os comandos são executados e as respostas aparecem. O sinal > significa "pode digitar"; o sinal + significa "o comando anterior não terminou" (falta fechar parêntese ou aspas). Para cancelar, aperte Esc.
@@ Script (.R)
::o Arquivo de texto onde você escreve e guarda os comandos. Nada roda sozinho: coloque o cursor na linha e aperte Ctrl + Enter (roda a linha ou a seleção) ou Ctrl + Shift + Enter (roda tudo).
@@ Variável (objeto)
::o Um nome que guarda um valor. Tudo o que você guarda no R (número, vetor, tabela, função) é um "objeto" e aparece no painel Environment.
::e
idade <- 30
@@ Função
::o Um comando pronto que recebe algo entre parênteses e devolve um resultado. Sempre tem a forma nome(…).
::e
round(3.14159, 2)
::r
[1] 3.14
@@ Argumento (parâmetro)
::o Cada informação que você passa para a função, separadas por vírgula. Podem ir na ordem certa ou com o nome: round(x = 3.14159, digits = 2). Os que têm valor padrão podem ser omitidos.
@@ Vetor
::o Uma fila de valores do mesmo tipo, acessados pela posição (começando em 1). É a estrutura básica do R.
::e
notas <- c(7, 8.5, 9)
@@ Matriz
::o Tabela de valores do mesmo tipo, com linhas e colunas. Acesso: m[linha, coluna].
@@ Data frame
::o A "planilha" do R: tabela em que cada coluna pode ter um tipo diferente. Linhas = observações; colunas = variáveis.
@@ Tibble
::o Um data frame "moderno" (do tidyverse). Imprime de forma mais compacta e mostra o tipo embaixo do nome de cada coluna (<chr>, <dbl>, <int>).
@@ Lista
::o Uma "caixa de caixas": guarda elementos de tipos diferentes, até tabelas e outras listas.
@@ Fator
::o Variável de categorias com níveis definidos (ex.: sexo, tamanho P/M/G). Pode ser ordenado.
@@ Tipos: numeric, integer, character, logical
::o numeric (num/dbl) = número com ou sem decimal; integer (int) = inteiro, escrito com L (10L); character (chr) = texto entre aspas; logical (logi) = TRUE ou FALSE.
@@ NA, NULL e NaN
::o NA = dado ausente (célula vazia); NULL = "nada", objeto vazio (usado para apagar colunas ou itens); NaN = resultado matemático indefinido (0/0). No SQL, o equivalente do NA chama-se NULL.
@@ TRUE e FALSE
::o Os valores lógicos (verdadeiro e falso). Em contas valem 1 e 0. Podem ser abreviados T e F, mas evite: T e F podem ser sobrescritos.
@@ Índice / posição
::o O número da "gaveta" de um vetor. No R começa em 1.
@@ Vetorização
::o O R aplica contas a todos os elementos de um vetor de uma vez: c(1, 2, 3) * 2 dá 2 4 6, sem precisar de laço.
@@ Pacote (biblioteca)
::o Um conjunto de funções extras feito pela comunidade (dplyr, readxl, lubridate…). Instala uma vez com install.packages("nome") e carrega a cada sessão com library(nome).
@@ CRAN
::o O repositório oficial de pacotes do R, de onde o install.packages() baixa.
@@ tidyverse
::o Família de pacotes que trabalham juntos para ciência de dados: dplyr, tidyr, tibble, stringr, lubridate, ggplot2…
@@ Pipe (%>% ou |>)
::o Operador que passa o resultado da esquerda para a função da direita. Leia como "e então".
@@ Diretório de trabalho (working directory)
::o A pasta onde o R procura e salva arquivos. getwd() mostra; setwd() muda.
@@ Caminho absoluto e relativo
::o Absoluto: o endereço completo (C:/Users/thiago/dados.csv). Relativo: a partir da pasta de trabalho (só dados.csv). No R use barras normais /.
@@ Aviso (warning) x Erro (error)
::o Warning: o R executou, mas está avisando de algo (ex.: NAs introduzidos por coerção). Error: o R parou e não executou. Leia sempre a mensagem: ela diz a linha e o motivo.
@@ Coerção
::o Conversão de um tipo para outro, feita por você (as.numeric) ou automaticamente pelo R (c(1, "a") vira tudo texto).
@@ Expressão regular (regex)
::o Uma "linguagem de padrões" para buscar texto: "^A" = começa com A; "\\S+" = uma palavra; "." = qualquer caractere.

@G Palavras de banco de dados e análise | #c792ea | Termos das aulas de Banco de Dados e de limpeza/diagnóstico.
@@ Banco de dados e SGBD
::o Banco de dados é o conjunto organizado de dados; SGBD (Sistema Gerenciador de Banco de Dados) é o programa que o administra (SQLite, MySQL, PostgreSQL).
@@ SQL
::o Structured Query Language: a linguagem para criar tabelas e consultar dados em bancos relacionais.
@@ SQLite
::o Banco relacional que fica todo num único arquivo .sqlite, sem servidor. É o usado no curso, via pacotes DBI e RSQLite.
@@ Relacional x não relacional (NoSQL)
::o Relacional: dados em tabelas ligadas por chaves (bom para dados estruturados, como prontuários). Não relacional: documentos, chave-valor, grafos… (flexível para dados sem estrutura fixa).
@@ Chave primária (PK)
::o Coluna que identifica cada linha de forma única e nunca fica vazia.
@@ Chave estrangeira (FK)
::o Coluna que aponta para a PK de outra tabela, criando o relacionamento.
@@ Chave candidata
::o Coluna que também poderia ser PK por ser única e não nula (ex.: CPF), mas não foi a escolhida.
@@ Cardinalidade e grau
::o Cardinalidade = número de linhas de uma tabela; grau = número de colunas. (Em relacionamentos, "cardinalidade" também indica 1:1, 1:N ou N:M.)
@@ Restrição de domínio
::o Regra sobre os valores aceitos numa coluna, como CHECK (sexo IN ('M','F')).
@@ Integridade referencial
::o Garantia de que toda FK aponta para algo que existe (não dá para cadastrar paciente com médico 999 inexistente).
@@ Consulta (query)
::o Uma pergunta feita ao banco com SELECT. No R, enviada com dbGetQuery().
@@ JOIN
::o Operação que junta tabelas pela coluna em comum (chave).
@@ Agregação
::o Resumir várias linhas num valor: contagem, soma, média, mínimo, máximo.
@@ Dado, informação e metadado
::o Dado = registro bruto (38); informação = dado com contexto e significado (paciente tem 38 anos); metadado = dado sobre o dado (a coluna IDADE é inteira, em anos).
@@ Ciclo de vida dos dados
::o As etapas pelas quais o dado passa: coleta → armazenamento → processamento/limpeza → análise → compartilhamento → arquivamento ou descarte.
@@ Limpeza de dados
::o Corrigir ou remover problemas antes de analisar: NA, duplicatas, tipos errados, códigos inválidos, valores impossíveis, grafias diferentes para a mesma coisa.
@@ Outlier
::o Valor muito diferente dos outros. Pode ser erro (idade 999) ou real e plausível (idade 99). A decisão de manter ou excluir deve ser documentada.
@@ Imputação
::o Preencher um NA com um valor estimado (ex.: a mediana da coluna).
@@ Formato largo x longo
::o Largo: uma coluna para cada categoria (vendas_norte, vendas_sul). Longo: uma coluna com a categoria e outra com o valor. pivot_longer() e pivot_wider() convertem.
@@ Reprodutibilidade
::o Qualquer pessoa rodando seu script (ou Knit do .Rmd) chega ao mesmo resultado. Por isso tudo deve estar no código, inclusive as decisões de limpeza, comentadas.
@@ Mediana, quartis e média
::o Média = soma ÷ quantidade (sensível a extremos). Mediana = valor do meio. 1º e 3º quartis = valores abaixo dos quais estão 25% e 75% dos dados.

<h2>O RStudio em 1 minuto</h2>
<div class="card">
<h3>Os quatro painéis</h3>
<ul>
<li><b>Script</b> (em cima, à esquerda): onde você escreve e salva o código (.R ou .Rmd). Nada roda sozinho aqui.</li>
<li><b>Console</b> (embaixo, à esquerda): onde o código roda e as respostas aparecem.</li>
<li><b>Environment</b> (em cima, à direita): as variáveis e tabelas que existem na memória.</li>
<li><b>Files / Plots / Packages / Help</b> (embaixo, à direita): arquivos da pasta, gráficos, pacotes e a ajuda.</li>

<h3>Atalhos que valem ouro</h3>
<ul>
<li><span class="kbd">Ctrl</span> + <span class="kbd">Enter</span>: roda a linha onde está o cursor (ou o trecho selecionado).</li>
<li><span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">Enter</span>: roda o script inteiro.</li>
<li><span class="kbd">Alt</span> + <span class="kbd">-</span>: escreve a seta <code>&lt;-</code>. &nbsp; <span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">M</span>: escreve o pipe <code>%&gt;%</code>.</li>
<li><span class="kbd">Ctrl</span> + <span class="kbd">Shift</span> + <span class="kbd">C</span>: comenta/descomenta as linhas selecionadas. &nbsp; <span class="kbd">Ctrl</span> + <span class="kbd">Alt</span> + <span class="kbd">I</span>: novo chunk no .Rmd.</li>
<li><span class="kbd">Tab</span>: completa nomes de funções, variáveis e arquivos. &nbsp; <span class="kbd">Esc</span>: cancela um comando travado ou incompleto.</li>

<ul>

<h2>Anatomia de um comando</h2>

<ol>
<li><b>media_turma</b>: o nome da variável que vai guardar o resultado (opcional; sem ele, o resultado só aparece no Console).</li>

<li><b>notas</b>: o primeiro argumento, o dado em que a função vai trabalhar.</li>

</ol>
<p>Parênteses sempre abrem e fecham em pares; vírgulas separam argumentos; textos ficam entre aspas; nomes de variáveis e colunas, não.</p>
</div>

<h2>As mensagens de erro mais comuns</h2>
<div class="card">
<ul>
<li><code>Error: object 'x' not found</code>: a variável não existe. Você rodou a linha que a cria? O nome está escrito igual (maiúsculas importam)?</li>
<li><code>could not find function "filter"</code>: faltou carregar o pacote (<code>library(dplyr)</code>) ou o nome da função está errado.</li>
<li><code>there is no package called 'xxx'</code>: o pacote não está instalado. Rode <code>install.packages("xxx")</code>.</li>
<li><code>unexpected symbol</code> / <code>unexpected ','</code> / <code>unexpected ')'</code>: erro de digitação: vírgula sobrando ou faltando, parêntese ou aspas sem par.</li>
<li><code>non-numeric argument to binary operator</code>: tentou fazer conta com texto. Converta com <code>as.numeric()</code>.</li>
<li><code>cannot open file 'x.csv': No such file or directory</code>: o R não achou o arquivo. Confira <code>getwd()</code> e <code>list.files()</code>.</li>
<li><code>Warning: NAs introduced by coercion</code>: <b>aviso</b>, não erro. Alguns textos não viraram número e se tornaram NA.</li>
<li>SQL: <code>no such table</code> (nome da tabela errado ou banco errado), <code>no such column</code> (coluna digitada errada), <code>ambiguous column name</code> (coluna existe nas duas tabelas do JOIN: use o apelido, ex.: <code>p.nome</code>).</li>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const ML=new Set(['e','r','s']);
function parse(txt){
  const groups=[];let g=null,e=null,f=null;
  txt.replace(/\r/g,'').split('\n').forEach(line=>{
    if(line.startsWith('@G ')){const [t,c,i]=line.slice(3).split(' | ');g={title:t.trim(),color:(c||'#4aa3ff').trim(),intro:(i||'').trim(),items:[]};groups.push(g);e=null;f=null;return}
    if(line.startsWith('@@ ')){e={name:line.slice(3).trim(),p:[],a:[],v:[]};g.items.push(e);f=null;return}
    if(!e)return;
    const m=line.match(/^::([a-z]+)\s?(.*)$/);
    if(m){f=m[1];const v=m[2];
      if(ML.has(f)){e[f]=v?[v]:[]}
      else if(f==='p'){const k=v.indexOf(' | ');e.p.push(k<0?[v,'']:[v.slice(0,k),v.slice(k+3)])}
      else if(f==='a'){e.a.push(v)}
      else if(f==='v'){e.v=v.split(' | ').map(x=>x.trim()).filter(Boolean)}
      else e[f]=v;
      return}
    if(f&&ML.has(f))e[f].push(line);
  });
  groups.forEach(g=>g.items.forEach(e=>{ML.forEach(k=>{if(e[k]){while(e[k].length&&!e[k][e[k].length-1].trim())e[k].pop();e[k]=e[k].join('\n')}});e._s=norm([e.name,e.o,e.q,e.s,e.e,e.c,e.k,e.p.map(x=>x.join(' ')).join(' '),e.a.join(' '),g.title].join(' '))}));
  return groups;
}
const D={R:parse($('d-rcmd').textContent),Q:parse($('d-qcmd').textContent)};
const P={R:parse($('d-rprob').textContent),Q:parse($('d-qprob').textContent)};
const GL=parse($('d-glos').textContent);
let lang='R',mode='D',cur=null;

function L(l){lang=l;$('tR').className=l=='R'?'on':'';$('tQ').className='sql'+(l=='Q'?' on':'');draw();window.scrollTo({top:0,behavior:'instant'})}
function G(x){mode=x;['S','D','P','G'].forEach(k=>$('n'+k).className=k==x?'on':'');$('tabs').style.display=(x=='S'||x=='G')?'none':'flex';draw();window.scrollTo({top:0,behavior:'instant'})}
function pkgLabel(p){
  if(!p||p==='base')return 'R base · já vem pronto';
  if(p==='SQL')return 'Linguagem SQL · roda dentro do dbGetQuery()/dbExecute()';
  if(p==='RStudio')return 'Recurso do RStudio';
  if(p==='Markdown')return 'R Markdown (.Rmd)';
  return 'Pacote '+p+' · precisa de library('+p+')';
}
function hl(code){ // destaca comentários # (R) e -- (SQL)
  return esc(code).split('\n').map(l=>{
    let i=-1,inS=false,q='';
    for(let k=0;k<l.length;k++){const ch=l[k];
      if(inS){if(ch===q)inS=false;continue}
      if(ch==='"'||ch==="'"){inS=true;q=ch;continue}
      if(ch==='#'){i=k;break}
      if(ch==='-'&&l[k+1]==='-'&&lang==='Q'){i=k;break}
    }
    return i<0?l:l.slice(0,i)+'<span class="cm">'+l.slice(i)+'</span>';
  }).join('\n');
}
function chips(groups){ $('chips').innerHTML=groups.map((g,i)=>`<a href="#g${i}" style="border-color:${g.color}55">${esc(g.title)}</a>`).join('') }

function draw(){
  const qv=norm($('q').value.trim());$('qx').style.display=qv?'block':'none';
  if(mode==='S'){$('chips').innerHTML='';$('m').innerHTML='<div class="st">'+$('t-start').innerHTML+'</div>';return}
  if(mode==='G'){$('chips').innerHTML='';drawG(qv);return}
  const src=mode==='D'?D[lang]:P[lang];chips(src);
  let h='';
  if(qv){ // busca: lista única, melhores resultados primeiro
    const ws=qv.split(/\s+/),res=[];
    src.forEach((g,i)=>g.items.forEach((e,j)=>{
      if(!ws.every(w=>e._s.includes(w)))return;
      const nm=norm(e.name),o=norm(e.o||'');let sc=0;
      ws.forEach(w=>{if(nm.replace(/\(\)/g,'')===w||nm.startsWith(w))sc+=10;else if(nm.includes(w))sc+=6;else if(o.includes(w))sc+=3;else sc+=1});
      res.push([sc,i,j,g,e])}));
    res.sort((a,b)=>b[0]-a[0]||a[1]-b[1]||a[2]-b[2]);
    $('chips').innerHTML='';
    if(!res.length){$('m').innerHTML='<p class="empty">Nada encontrado. Tente outra palavra (ex.: "soma", "texto", "NA", "ordenar").</p>';return}
    h=`<section style="--a:var(--s)"><h2>${res.length} resultado(s) para "${esc($('q').value.trim())}"</h2>`;
    res.forEach(([sc,i,j,g,e])=>{
      if(mode==='D')h+=`<div class="row" style="--a:${g.color}" onclick="O(${i},${j})"><div class="n">${esc(e.name)}${e.k&&e.k!=='base'&&e.k!=='SQL'?`<span class="pk">${esc(e.k)}</span>`:''}</div><div><code>${esc((e.s||'').split('\n')[0])}</code></div><div>${esc(e.o)} <span class="pk">${esc(g.title)}</span></div><button>Ver detalhes</button></div>`;
      else h+=`<div class="row pr" style="--a:${g.color}" onclick="OP(${i},${j})"><div>${esc(e.name)} <span class="pk">${esc(g.title)}</span></div><div><code>${esc(e.c)}</code></div><button>Ver solução</button></div>`;
    });
    $('m').innerHTML=h+'</section>';return;
  }
  src.forEach((g,i)=>{
    const f=g.items.map((e,j)=>[e,j]).filter(([e])=>!qv||qv.split(/\s+/).every(w=>e._s.includes(w)));
    if(!f.length)return;
    h+=`<section id="g${i}" style="--a:${g.color}"><h2>${esc(g.title)}</h2>${g.intro?`<p class="gi">${esc(g.intro)}</p>`:''}`;
    if(mode==='D'){
      h+=`<div class="row hd"><div>Comando</div><div>Como se escreve</div><div>O que faz</div><div></div></div>`;
      f.forEach(([e,j])=>{h+=`<div class="row" onclick="O(${i},${j})"><div class="n">${esc(e.name)}${e.k&&e.k!=='base'&&e.k!=='SQL'?`<span class="pk">${esc(e.k)}</span>`:''}</div><div><code>${esc((e.s||'').split('\n')[0])}</code></div><div>${esc(e.o)}</div><button>Ver detalhes</button></div>`});
    }else{
      h+=`<div class="row pr hd"><div>Problema</div><div>Comandos usados</div><div></div></div>`;
      f.forEach(([e,j])=>{h+=`<div class="row pr" onclick="OP(${i},${j})"><div>${esc(e.name)}</div><div><code>${esc(e.c)}</code></div><button>Ver solução</button></div>`});
    }
    h+='</section>';
  });
  $('m').innerHTML=h||'<p class="empty">Nada encontrado. Tente outra palavra (ex.: "soma", "texto", "NA", "ordenar").</p>';
}
function drawG(qv){
  let h='';
  GL.forEach(g=>{const f=g.items.filter(e=>!qv||qv.split(/\s+/).every(w=>e._s.includes(w)));if(!f.length)return;
    h+=`<section style="--a:${g.color}"><h2>${esc(g.title)}</h2>${g.intro?`<p class="gi">${esc(g.intro)}</p>`:''}<div class="gl">`;
    f.forEach(e=>{h+=`<div class="gc"><h4>${esc(e.name)}</h4><p>${esc(e.o)}</p>${e.e?`<pre>${hl(e.e)}</pre>`:''}${e.r?`<pre class="out" style="margin-top:6px">${esc(e.r)}</pre>`:''}</div>`});
    h+='</div></section>'});
  $('m').innerHTML=h||'<p class="empty">Nada encontrado.</p>';
}
function cpBtn(id){return `<button class="cp" onclick="copiar('${id}',this)">📋 Copiar</button>`}
function copiar(id,b){const t=$(id).textContent;(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='✔ Copiado'},()=>{const r=document.createRange();r.selectNodeContents($(id));const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='Selecionado: Ctrl+C'});setTimeout(()=>b.textContent='📋 Copiar',1800)}
function abrir(html,color){const b=$('box');b.style.setProperty('--a',color);b.style.borderColor=color;b.innerHTML=html;$('modal').style.display='flex';b.scrollTop=0}
function fechar(){$('modal').style.display='none';cur=null}
function navBtns(i,j,list,fn){
  const prev=j>0?`${fn}(${i},${j-1})`:(i>0?`${fn}(${i-1},${list[i-1].items.length-1})`:'');
  const next=j<list[i].items.length-1?`${fn}(${i},${j+1})`:(i<list.length-1?`${fn}(${i+1},0)`:'');
  return `<div class="mf"><button ${prev?`onclick="${prev}"`:'disabled'}>← Anterior</button><button onclick="fechar()">Fechar</button><button ${next?`onclick="${next}"`:'disabled'}>Próximo →</button></div>`;
}
function wrapSQL(sql){
  const t=sql.trim();if(!t)return '';
  const fn=/^\s*(SELECT|PRAGMA table_info)/i.test(t.replace(/^--.*\n/gm,''))?'dbGetQuery':'dbExecute';
  return `${fn}(con, "\n${t.replace(/"/g,"'")}\n")`;
}
function O(i,j){
  const g=D[lang][i],e=g.items[j];cur={t:'D',i,j};
  let h=`<div class="mh"><button class="x" onclick="fechar()" title="Fechar (Esc)">×</button><h3>${esc(e.name)}</h3><div class="mtags"><span class="tag">${esc(g.title)}</span><span class="tag pkg">${esc(pkgLabel(e.k))}</span>${e.f?`<span class="tag">📚 ${esc(e.f)}</span>`:''}</div></div><div class="mb">`;
  h+=`<div class="what">${esc(e.o)}</div>`;
  if(e.q)h+=`<div class="think">💡 ${esc(e.q)}</div>`;
  let n=0;
  if(e.s)h+=`<div class="lb">${++n} · Como se escreve (o "molde")</div><pre>${hl(e.s)}</pre>`;
  if(e.p.length)h+=`<div class="lb">${++n} · Peça por peça</div><table class="pp">${e.p.map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${esc(b)}</td></tr>`).join('')}</table>`;
  if(e.e){h+=`<div class="lb">${++n} · Exemplo para copiar e testar ${cpBtn('ex')}</div><pre id="ex">${hl(e.e)}</pre>`;
    if(e.k==='SQL'&&!/dbGetQuery|dbExecute/.test(e.e))h+=`<div class="lb">Como rodar esse SQL dentro do R ${cpBtn('exr')}</div><pre id="exr">${hl(wrapSQL(e.e))}</pre>`;}
  if(e.r)h+=`<div class="lb">${++n} · O que aparece no Console</div><pre class="out">${esc(e.r)}</pre>`;
  if(e.a.length)h+=`<div class="lb">⚠️ Atenção, erros comuns e dicas</div><ul class="warn">${e.a.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  if(e.v.length)h+=`<div class="lb">🔗 Veja também</div><div class="see">${e.v.map(x=>`<button onclick="ver('${esc(x).replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')}</div>`;
  h+=`</div>`+navBtns(i,j,D[lang],'O');
  abrir(h,g.color);
}
function OP(i,j){
  const g=P[lang][i],e=g.items[j];cur={t:'P',i,j};
  let h=`<div class="mh"><button class="x" onclick="fechar()" title="Fechar (Esc)">×</button><h3 style="font:800 18px system-ui">${esc(e.name)}</h3><div class="mtags"><span class="tag">${esc(g.title)}</span>${e.f?`<span class="tag">📚 ${esc(e.f)}</span>`:''}</div></div><div class="mb">`;
  if(e.o)h+=`<div class="think">🎯 <b>Raciocínio:</b> ${esc(e.o)}</div>`;
  if(e.c)h+=`<div class="lb">Comandos usados (clique para ver no dicionário)</div><div class="see">${e.c.split(',').map(x=>x.trim()).filter(Boolean).map(x=>`<button onclick="ver('${esc(x).replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')}</div>`;
  h+=`<div class="lb">Solução completa ${cpBtn('sol')}</div><pre id="sol">${hl(e.e||'')}</pre>`;
  if(lang==='Q'&&e.e&&!/dbGetQuery|dbExecute/.test(e.e))h+=`<div class="lb">Como rodar no R ${cpBtn('solr')}</div><pre id="solr">${hl(wrapSQL(e.e))}</pre>`;
  if(e.r)h+=`<div class="lb">Resultado esperado</div><pre class="out">${esc(e.r)}</pre>`;
  if(e.p.length)h+=`<div class="lb">Como funciona, linha a linha</div><table class="pp">${e.p.map(([a,b])=>`<tr><td><code>${esc(a)}</code></td><td>${esc(b)}</td></tr>`).join('')}</table>`;
  if(e.a.length)h+=`<div class="lb">Dica</div>${e.a.map(x=>`<div class="tip" style="margin:6px 0">${esc(x)}</div>`).join('')}`;
  h+=`</div>`+navBtns(i,j,P[lang],'OP');
  abrir(h,g.color);
}
function ver(nome){ // procura um comando pelo nome, em R e SQL
  const n=norm(nome).replace(/\(\)$/,'');
  for(const L2 of [lang,lang==='R'?'Q':'R']){
    const src=D[L2];
    for(let i=0;i<src.length;i++)for(let j=0;j<src[i].items.length;j++){
      const nm=norm(src[i].items[j].name);
      const parts=nm.split(/\s*[\/,]\s*|\s+e\s+|\s{2,}/).map(x=>x.replace(/\(\)$/,'').trim());
      if(nm.replace(/\(\)$/,'')===n||parts.includes(n)){if(L2!==lang){lang=L2;$('tR').className=L2=='R'?'on':'';$('tQ').className='sql'+(L2=='Q'?' on':'')}if(mode!=='D')G('D');else draw();O(i,j);return}
    }
  }
  for(const L2 of [lang,lang==='R'?'Q':'R'])for(let i=0;i<D[L2].length;i++)for(let j=0;j<D[L2][i].items.length;j++){if(norm(D[L2][i].items[j].name).includes(n)){if(L2!==lang){lang=L2;$('tR').className=L2=='R'?'on':'';$('tQ').className='sql'+(L2=='Q'?' on':'')}if(mode!=='D')G('D');else draw();O(i,j);return}}
  fechar();if(mode!=='D')G('D');$('q').value=nome.replace(/\(\)$/,'');draw();
}
document.addEventListener('keydown',ev=>{
  if($('modal').style.display!=='flex')return;
  if(ev.key==='Escape')fechar();
  const bs=[...document.querySelectorAll('.mf button')];
  if(ev.key==='ArrowRight'&&bs[2]&&!bs[2].disabled)bs[2].click();
  if(ev.key==='ArrowLeft'&&bs[0]&&!bs[0].disabled)bs[0].click();
});
draw();
</script>
</body>
