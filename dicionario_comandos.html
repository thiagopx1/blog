@G Gráficos (R base) | #ff6b6b | Funções nativas para desenhar gráficos. Eles aparecem na aba Plots do RStudio (ou dentro do relatório, no R Markdown).
@@ plot()
::k base
::f Linguagem R · Aula 14
::o Desenha o gráfico básico: pontos (dispersão), linhas ou os dois.
::q É o "canivete suíço" dos gráficos. Com type = "p" você vê pontos soltos (relação entre duas variáveis); com type = "l" uma linha (evolução no tempo).
::s
plot(x, y, type = "p", main = "Título", xlab = "Eixo X", ylab = "Eixo Y", col = "blue")
::p x, y | os valores dos eixos horizontal e vertical.
::p type | "p" = pontos, "l" = linha, "b" = pontos e linha.
::p main | título do gráfico.
::p xlab / ylab | nomes dos eixos.
::p col | cor ("blue", "red", "darkgreen"…).
::p pch | formato do ponto (16 = círculo cheio, 17 = triângulo, 19 = círculo sólido).
::p lty / lwd | tipo de linha (1 sólida, 2 tracejada, 3 pontilhada) e espessura.
::p xlim / ylim | limites dos eixos: ylim = c(0, 100).
::e
x <- 1:10
y <- x^2
plot(x, y, type = "b", col = "blue", pch = 16,
     main = "Quadrados de 1 a 10", xlab = "x", ylab = "x ao quadrado")
::r
(o gráfico aparece na aba Plots)
::a Erro "figure margins too large": o painel de gráficos está pequeno demais. Aumente o painel Plots e rode de novo.
::a plot() sempre começa um gráfico NOVO. Para acrescentar coisas ao mesmo gráfico use lines(), points(), text(), abline() e legend() logo depois.
::v lines(), points(), text() e abline() | legend() | barplot() | hist()
@@ lines(), points(), text() e abline()
::k base
::f Linguagem R · Aula 14
::o Acrescentam elementos a um gráfico que já está aberto: mais linhas, mais pontos, textos ou uma reta.
::q Funcionam como "camadas" desenhadas por cima do plot(). Rode sempre depois dele.
::s
lines(x, y, col = "red", lty = 2)
points(x, y, col = "red", pch = 17)
text(x, y, labels = "texto", pos = 4)
abline(h = valor)   abline(v = valor)   abline(lm(y ~ x))
::p lines | adiciona uma linha.
::p points | adiciona pontos.
::p text(…, labels, pos) | escreve um texto na posição (x, y). pos = 1 abaixo, 2 esquerda, 3 acima, 4 direita.
::p abline(h=) / abline(v=) | reta horizontal / vertical. abline(lm(y ~ x)) desenha a reta de tendência (regressão).
::e
x <- 1:10
plot(x, x^2, type = "l", col = "blue", ylim = c(0, 1000))
lines(x, x^3, col = "red", lty = 2)
points(5, 25, col = "darkgreen", pch = 19)
text(5, 25, labels = "Ponto de interesse", pos = 4)
abline(h = 500, col = "gray")
::r
(o gráfico com as duas linhas, o ponto e a reta aparece na aba Plots)
::a Se a segunda linha "sumir", é porque saiu dos limites do eixo. Defina ylim no plot() para caber tudo (ex.: ylim = range(c(y1, y2))).
::v plot() | legend()
@@ legend()
::k base
::f Linguagem R · Aula 14
::o Adiciona uma legenda explicando cores, pontos e linhas do gráfico.
::s
legend("topleft", legend = c("nome1", "nome2"), col = c("cor1", "cor2"), lty = c(1, 2), pch = c(16, 17))
::p posição | "topleft", "topright", "bottomleft", "bottomright", "top", "center"…
::p legend | os textos de cada item.
::p col | as cores, na mesma ordem.
::p lty / pch / fill | o símbolo de cada item: tipo de linha, formato de ponto ou caixinha preenchida (use fill para barras e pizza).
::e
x <- 1:10
plot(x, x^2, type = "l", col = "blue")
lines(x, x * 8, col = "red", lty = 2)
legend("topleft", legend = c("x^2", "8x"), col = c("blue", "red"), lty = c(1, 2))
::r
(a legenda aparece no canto superior esquerdo)
::v plot() | lines(), points(), text() e abline()
@@ barplot()
::k base
::f Linguagem R · Aulas 8 e 14
::o Desenha um gráfico de barras, ideal para comparar categorias.
::q Quase sempre é usado com table(): barplot(table(x)) mostra quantas vezes cada categoria aparece.
::s
barplot(alturas, names.arg = nomes, col = cores, main = "Título", beside = FALSE)
::p alturas | vetor (ou tabela) com o tamanho de cada barra. Se for matriz, cada coluna vira uma barra.
::p names.arg | os rótulos embaixo das barras.
::p col | cores das barras.
::p beside = TRUE | (com matriz) barras lado a lado. FALSE = empilhadas.
::p horiz = TRUE | barras deitadas.
::e
valores <- c(4, 7, 9, 12)
bp <- barplot(valores, names.arg = c("A", "B", "C", "D"),
              col = "skyblue", main = "Vendas por loja")
text(bp, valores, labels = valores, pos = 3)   # número em cima de cada barra
barplot(table(mtcars$cyl), main = "Carros por nº de cilindros")
::r
(dois gráficos de barras na aba Plots; use as setas para navegar entre eles)
::v table() | pie() | hist()
@@ pie()
::k base
::f Linguagem R · Aula 14
::o Desenha um gráfico de pizza (setores), mostrando a proporção de cada categoria no total.
::q Funciona bem com poucas categorias (até 5 ou 6). Para muitas categorias, prefira barras.
::s
pie(valores, labels = rotulos, col = cores, main = "Título")
::p valores | vetor ou tabela com as quantidades.
::p labels | o texto de cada fatia.
::p col | as cores das fatias.
::e
t <- table(iris$Species)
pct <- round(prop.table(t) * 100, 1)
pie(t, labels = paste(names(t), pct, "%"), main = "Espécies de íris")
::r
(gráfico de pizza com "setosa 33.3 %", "versicolor 33.3 %" e "virginica 33.3 %")
::v barplot() | prop.table() | paste() e paste0()
@@ hist()
::k base
::f Aula 13 (R Markdown)
::o Desenha um histograma: mostra como os valores de uma variável numérica se distribuem em faixas.
::s
hist(x, breaks = 10, main = "Título", col = "gray")
::p breaks | quantidade aproximada de barras (faixas).
::e
x <- rnorm(100, mean = 100, sd = 5)
hist(x, main = "100 valores simulados", col = "lightblue")
::r
(histograma em formato de "sino" na aba Plots)
::v plot() | summary() | runif(), rnorm() e set.seed()

@G Limpeza de dados e família apply | #a0e547 | Comandos para lidar com NA, duplicatas e tipos errados, e para aplicar uma função em várias linhas, colunas ou elementos de uma vez.
@@ na.omit()
::k base
::f Linguagem R · Aula 17
::o Remove todas as linhas que têm pelo menos um NA, em qualquer coluna.
::q É a "limpeza bruta": rápida, mas pode jogar fora muita informação. Antes, conte os NA para saber quanto vai perder.
::s
tabela_limpa <- na.omit(tabela)
::e
antes <- nrow(airquality)
sem_na <- na.omit(airquality)
depois <- nrow(sem_na)
cat("Antes:", antes, "- Depois:", depois, "\n")
::r
Antes: 153 - Depois: 111
::a Para remover NA só de colunas específicas, use o filtro df[!is.na(df$coluna), ] ou drop_na(df, coluna).
::v is.na() e !is.na() | drop_na() | replace_na()
@@ duplicated() e anyDuplicated()
::k base
::f Linguagem R · Aula 17 · Banco de Dados · Aula 15
::o duplicated() marca com TRUE cada linha (ou valor) que é repetição de uma anterior; anyDuplicated() diz se existe alguma repetição.
::q O 1º aparecimento é FALSE (original) e as cópias seguintes são TRUE. Por isso tabela[!duplicated(tabela), ] mantém só os originais.
::s
duplicated(x)
x[!duplicated(x)]          # remove repetidos
sum(duplicated(tabela))    # quantas linhas duplicadas
anyDuplicated(x)           # 0 = nenhuma repetição
::e
d <- c(1, 2, 2, 3, 1)
duplicated(d)
d[!duplicated(d)]
anyDuplicated(c(10, 20, 30))
::r
[1] FALSE FALSE  TRUE FALSE  TRUE
[1] 1 2 3
[1] 0
::a Antes de juntar tabelas (merge/left_join), confira se a chave não tem repetidos: anyDuplicated(base$id) deve dar 0.
::v unique() | distinct()
@@ suppressWarnings()
::k base
::f Banco de Dados · Aulas 17 e 18
::o Roda um comando escondendo os avisos (warnings) que ele geraria.
::q Usado com as.numeric() quando você SABE que alguns textos vão virar NA e não quer o aviso "NAs introduced by coercion". Depois conte os NA para saber quantos viraram.
::s
suppressWarnings(comando)
::e
idade <- c("59", "58", "abc", "")
idade_num <- suppressWarnings(as.numeric(idade))
idade_num
sum(is.na(idade_num))
::r
[1] 59 58 NA NA
[1] 2
::a Esconder o aviso não resolve o problema; só deixa a saída limpa. Sempre verifique quantos NA surgiram.
::v as.numeric(), as.integer() e outros as.* | tryCatch()
@@ apply()
::k base
::f Linguagem R · Aula 17
::o Aplica uma função em cada linha ou em cada coluna de uma matriz (ou data frame), sem precisar escrever um laço.
::q MARGIN = 1 → "para cada linha"; MARGIN = 2 → "para cada coluna". É um for "embutido".
::s
apply(X, MARGIN, FUN, ...)
::p X | a matriz ou data frame.
::p MARGIN | 1 = linhas, 2 = colunas.
::p FUN | a função a aplicar (mean, sum, max ou uma função sua).
::p ... | argumentos extras repassados à função: apply(m, 2, mean, na.rm = TRUE).
::e
m <- matrix(1:12, nrow = 3)
apply(m, 2, mean)     # média de cada coluna
apply(m, 1, sum)      # soma de cada linha
::r
[1]  2  5  8 11
[1] 22 26 30
::a O resultado do apply() é uma matriz ou vetor, mesmo que a entrada seja um data frame. Para voltar a tabela: as.data.frame(resultado).
::v lapply(), sapply(), tapply() e mapply() | colSums() e rowSums() | function()
@@ lapply(), sapply(), tapply() e mapply()
::k base
::f Linguagem R · Aula 17 · Banco de Dados · Aula 14
::o A "família apply": aplicam uma função a cada elemento de uma lista/vetor (lapply, sapply), a cada grupo (tapply) ou a vários vetores em paralelo (mapply).
::q lapply devolve sempre uma lista; sapply tenta simplificar para vetor; tapply é o "por grupo"; mapply é o "elemento 1 com elemento 1, 2 com 2…".
::s
lapply(lista, FUN)
sapply(lista, FUN)
tapply(valores, grupos, FUN)
mapply(FUN, vetor1, vetor2)
::e
sapply(mtcars[, 1:3], class)          # tipo de cada coluna
lapply(list(a = 1:3, b = 4:6), sum)
tapply(c(10, 20, 30, 40), c("A", "B", "A", "B"), sum)
mapply(function(x, y) x + y, 1:3, 4:6)
::r
      mpg       cyl      disp
"numeric" "numeric" "numeric"
$a
[1] 6

$b
[1] 15

 A  B
40 60
[1] 5 7 9
::a sapply(dados, class) é o jeito mais rápido de ver o tipo de todas as colunas de uma tabela.
::v apply() | aggregate() | group_by()
@@ tryCatch()
::k base
::f Linguagem R · Aula 16
::o Tenta executar um código e, se der erro, faz outra coisa em vez de parar tudo.
::s
tryCatch({
  # código que pode dar erro
}, error = function(e) {
  # o que fazer se der erro
})
::e
resultado <- tryCatch({
  log(-1)
  "deu certo"
}, error = function(e) "deu erro", warning = function(w) "deu aviso")
resultado
::r
[1] "deu aviso"
::v suppressWarnings() | function()

@G Texto (strings) | #c792ea | Funções para medir, cortar, juntar, buscar e trocar pedaços de texto. Primeiro as nativas do R; depois as do pacote stringr (todas começam com str_).
@@ nchar()
::k base
::f Linguagem R · Aula 21
::o Conta quantos caracteres um texto tem (letras, espaços e sinais).
::s
nchar(texto)
::e
nchar("Introdução à Linguagem R")
nchar(c("Ana", "Bruno"))
::r
[1] 24
[1] 3 5
::v str_length() e str_sub() | length()
@@ toupper() e tolower()
::k base
::f Linguagem R · Aula 21
::o Convertem o texto para MAIÚSCULAS (toupper) ou minúsculas (tolower).
::q Muito útil para padronizar respostas digitadas de formas diferentes ("sim", "SIM", "Sim") antes de comparar.
::s
toupper(texto)   tolower(texto)
::e
toupper("Introdução à Linguagem R")
tolower("GOIÂNIA")
::r
[1] "INTRODUÇÃO À LINGUAGEM R"
[1] "goiânia"
::v str_to_upper(), str_to_lower() e str_to_title()
@@ substr()
::k base
::f Linguagem R · Aula 21 · Programação · Aula 8
::o Recorta um pedaço do texto, da posição inicial até a final.
::q Perfeito para separar partes de códigos de tamanho fixo: numa data "300424", os caracteres 1-2 são o dia, 3-4 o mês e 5-6 o ano.
::s
substr(texto, start = inicio, stop = fim)
::p start | posição do 1º caractere desejado (começa em 1).
::p stop | posição do último caractere desejado.
::e
substr("Introdução", 1, 4)
data <- "300424"
substr(data, 1, 2)
substr(data, 3, 4)
::r
[1] "Intr"
[1] "30"
[1] "04"
::a Também troca pedaços: substr(x, 8, 9) <- "ca". O texto novo precisa ter o mesmo tamanho do trecho substituído.
::v str_length() e str_sub() | strsplit()
@@ paste() e paste0()
::k base
::f Linguagem R · Aula 21
::o Juntam (colam) textos e valores num único texto. paste() coloca espaço entre eles; paste0() cola sem espaço.
::q Diferente de cat(), o resultado pode ser guardado numa variável, usado como rótulo de gráfico, nome de coluna etc.
::s
paste(..., sep = " ")
paste0(...)
paste(vetor, collapse = ", ")
::p ... | os pedaços a juntar.
::p sep | o que vai entre os pedaços (padrão: espaço).
::p collapse | transforma um VETOR inteiro num único texto, separando os itens por esse símbolo.
::e
paste("Ciência", "de", "Dados")
paste("Ciência", "de", "Dados", sep = "-")
paste0("A", 1:3)
paste(c("maçã", "uva", "kiwi"), collapse = ", ")
::r
[1] "Ciência de Dados"
[1] "Ciência-de-Dados"
[1] "A1" "A2" "A3"
[1] "maçã, uva, kiwi"
::a sep junta pedaços que estão LADO A LADO nos argumentos; collapse junta os elementos DE UM VETOR. São coisas diferentes.
::v cat() | str_c() | strsplit()
@@ strsplit()
::k base
::f Linguagem R · Aula 21
::o Divide um texto em pedaços sempre que encontra um separador. Devolve uma lista.
::s
strsplit(texto, split = "separador")
::p split | onde cortar: " " (espaço), "," etc. split = "" separa letra por letra.
::p [[1]] ou unlist() | como o resultado vem dentro de uma lista, use um dos dois para obter o vetor.
::e
strsplit("maçã, uva, kiwi", split = ", ")
unlist(strsplit("a-b-c", "-"))
::r
[[1]]
[1] "maçã" "uva"  "kiwi"

[1] "a" "b" "c"
::v str_split() | paste() e paste0()
@@ grep() e grepl()
::k base
::f Linguagem R · Aula 21
::o Procuram um padrão de texto num vetor: grep() devolve as posições onde achou; grepl() devolve TRUE/FALSE para cada elemento.
::q grepl é o "contém?". Ótimo para filtrar: df[grepl("Silva", df$nome), ] pega todos que têm Silva no nome.
::s
grep("padrão", vetor, ignore.case = FALSE)
grepl("padrão", vetor)
::p padrão | o trecho procurado.
::p ignore.case = TRUE | não diferencia maiúsculas de minúsculas.
::e
v <- c("Introdução ao R", "RStudio", "Ciência de Dados")
grep("ia", v)
grepl("ia", v)
grep("r", v, ignore.case = TRUE)
::r
[1] 3
[1] FALSE FALSE  TRUE
[1] 1 2
::v str_detect(), str_locate() e str_count() | gregexpr() | LIKE
@@ gregexpr()
::k base
::f Linguagem R · Aula 21
::o Encontra as posições de TODAS as ocorrências de um padrão dentro de um texto.
::s
unlist(gregexpr("padrão", texto))
::e
unlist(gregexpr("a", "banana"))
::r
[1] 2 4 6
::v grep() e grepl() | str_detect(), str_locate() e str_count()
@@ gsub() e sub()
::k base
::f Linguagem R · Aula 17
::o Substituem um trecho de texto por outro: gsub() troca todas as ocorrências; sub() só a primeira.
::s
gsub("antigo", "novo", texto)
::p "antigo" | o que procurar.
::p "novo" | pelo que trocar ("" apaga).
::p texto | o texto ou vetor (pode ser uma coluna).
::e
gsub("a", "o", "banana")
sub("a", "o", "banana")
gsub(",", ".", "12,5")          # vírgula decimal para ponto
::r
[1] "bonono"
[1] "bonana"
[1] "12.5"
::a A ordem dos argumentos é: o que procurar, pelo que trocar, ONDE. No stringr a ordem muda (o texto vem primeiro).
::a Alguns símbolos têm significado especial no padrão (. * + ? ( ) [ ] $ ^). Para procurar o ponto literal, use fixed = TRUE: gsub(".", ",", x, fixed = TRUE).
::v str_replace() e str_replace_all()
@@ trimws()
::k base
::f Linguagem R · Aula 10
::o Remove os espaços em branco do início e do fim do texto.
::s
trimws(texto)
::e
trimws("   Goiânia  ")
::r
[1] "Goiânia"
::v str_trim()
@@ str_length() e str_sub()
::k stringr
::f Linguagem R · Aula 21
::o Versões do stringr para contar caracteres (str_length) e recortar um pedaço do texto (str_sub).
::s
str_length(texto)
str_sub(texto, inicio, fim)
::e
library(stringr)
str_length("exemplo")
str_sub("exemplo", 1, 3)
str_sub("exemplo", -3)       # os 3 últimos
::r
[1] 7
[1] "exe"
[1] "plo"
::v nchar() | substr()
@@ str_to_upper(), str_to_lower() e str_to_title()
::k stringr
::f Linguagem R · Aula 21
::o Mudam maiúsculas e minúsculas; str_to_title() deixa a primeira letra de cada palavra maiúscula.
::s
str_to_upper(texto)   str_to_lower(texto)   str_to_title(texto)
::e
library(stringr)
str_to_upper("exemplo")
str_to_title("exemplo de string")
::r
[1] "EXEMPLO"
[1] "Exemplo De String"
::v toupper() e tolower()
@@ str_replace() e str_replace_all()
::k stringr
::f Linguagem R · Aula 21
::o Trocam um trecho por outro: str_replace() só a 1ª ocorrência; str_replace_all() todas.
::s
str_replace(texto, "padrão", "novo")
::p texto | vem PRIMEIRO no stringr.
::e
library(stringr)
str_replace("Exemplo de Exemplo", "Exemplo", "Teste")
str_replace_all("Exemplo de Exemplo", "Exemplo", "Teste")
::r
[1] "Teste de Exemplo"
[1] "Teste de Teste"
::v gsub() e sub()
@@ str_split() e str_c()
::k stringr
::f Linguagem R · Aula 21
::o str_split() divide o texto por um separador (devolve lista); str_c() junta textos.
::s
str_split(texto, "separador")
str_c(..., sep = "")
::e
library(stringr)
unlist(str_split("exemplo,teste,divisão", ","))
str_c("exemplo", "teste", sep = "-")
::r
[1] "exemplo" "teste"   "divisão"
[1] "exemplo-teste"
::v strsplit() | paste() e paste0()
@@ str_dup(), str_pad() e str_trim()
::k stringr
::f Linguagem R · Aula 21
::o str_dup() repete um texto; str_pad() completa com caracteres até um tamanho; str_trim() tira espaços das pontas.
::s
str_dup(texto, vezes)
str_pad(texto, width = n, side = "left", pad = " ")
str_trim(texto)
::p width | o tamanho final desejado.
::p side | onde completar: "left", "right" ou "both".
::p pad | o caractere usado para completar.
::e
library(stringr)

str_pad("Olá", width = 10, side = "both", pad = "-")

@G Datas | #5ac8fa | Datas chegam como texto e precisam ser convertidas para o tipo Date antes de qualquer conta. Primeiro as funções nativas; depois as do pacote lubridate.
@@ as.Date()
::k base
::f Linguagem R · Aula 23
::o Converte um texto numa data de verdade (tipo Date), informando em que formato o texto está escrito.
::q O R guarda datas no formato internacional AAAA-MM-DD. Se o seu texto está como "01/07/2026", você explica ao R com o format: "%d/%m/%Y" = dia/mês/ano com 4 dígitos.
::s
as.Date(texto, format = "%d/%m/%Y")
::p %d | dia (01 a 31).
::p %m | mês em número (01 a 12).
::p %Y | ano com 4 dígitos (2026). %y = 2 dígitos (26).
::p %b / %B | nome do mês abreviado / completo (em inglês, como Jul / July).
::p / ou - | os separadores devem ser os mesmos do texto.
::p origin | (para números) a data inicial da contagem; o padrão é "1970-01-01".
::e
as.Date("2026-07-01")                         # formato padrão: não precisa de format
as.Date("01/07/2026", format = "%d/%m/%Y")
as.Date("07-01-2026", format = "%m-%d-%Y")
d <- as.Date("2023-12-31") - as.Date("2023-01-01")
d
as.numeric(d)
::r
[1] "2026-07-01"
[1] "2026-07-01"
[1] "2026-07-01"
Time difference of 364 days
[1] 364
::a Se o texto não bater com o format, o resultado é NA (sem erro). Confira com sum(is.na(x)).
::a read.csv() traz datas como texto (chr). Converta a coluna: dados$data <- as.Date(dados$data, format = "%d/%m/%Y").
::v format() | difftime() | ymd(), dmy() e mdy() | Sys.Date() e Sys.time()
@@ format()
::k base
::f Linguagem R · Aula 23
::o Mostra uma data (que já é do tipo Date) no formato de texto que você quiser.
::q É o caminho inverso do as.Date(): de data para texto bonito, como "01/07/2026", ou para extrair só o mês ou só o ano.
::s
format(data, "%d/%m/%Y")
::e
d <- as.Date("2026-07-01")
format(d, "%d/%m/%Y")
format(d, "%m")
format(d, "%Y")
format(1234567.891, big.mark = ".", decimal.mark = ",")
::r
[1] "01/07/2026"
[1] "07"
[1] "2026"
[1] "1.234.568"
::a O resultado de format() é TEXTO: não dá mais para fazer contas de data com ele.
::v as.Date() | year(), month() e day()
@@ difftime()
::k base
::f Linguagem R · Aula 23
::o Calcula a diferença entre duas datas na unidade que você escolher.
::s
difftime(data_final, data_inicial, units = "days")
::p units | "days", "weeks", "hours", "mins", "secs" ou "auto".
::e
d1 <- as.Date("2026-07-01")
d2 <- as.Date("2026-07-10")
difftime(d2, d1, units = "days")
difftime(d2, d1, units = "weeks")
::r
Time difference of 9 days
Time difference of 1.285714 weeks
::a Subtrair direto (d2 - d1) também funciona e dá a diferença em dias.
::v as.Date() | interval(), duration() e period()
@@ Sys.Date() e Sys.time()
::k base
::f Linguagem R · Aula 23
::o Devolvem a data de hoje e a data-hora atual do computador.
::s
Sys.Date()   Sys.time()
::e
Sys.Date()
Sys.time()
::r
[1] "2026-10-18"
[1] "2026-10-18 11:37:42 -03"
::a Com S maiúsculo. O resultado muda conforme o dia em que você roda.
::v today() | as.Date()
@@ ymd(), dmy() e mdy()
::k lubridate
::f Linguagem R · Aula 23
::o Convertem texto em data sem precisar escrever o format: o nome da função já diz a ordem (y = ano, m = mês, d = dia).
::q Escolha pela ordem em que a data está escrita: "01/07/2026" é dia-mês-ano → dmy(). O separador (/, -, espaço) não importa.
::s
ymd("2026-07-01")
dmy("01/07/2026")
mdy("07-01-2026")
ymd_hms("2026-07-01 14:00:00")
::p ymd / dmy / mdy | a ordem dos elementos no texto.
::p _hms | quando também há hora:minuto:segundo.
::e
library(lubridate)
dmy("01/07/2026")
ymd("20260701")
ymd_hms("2026-07-01 14:00:00")
::r
[1] "2026-07-01"
[1] "2026-07-01"
[1] "2026-07-01 14:00:00 UTC"
::v as.Date() | year(), month() e day() | today()
@@ year(), month() e day()
::k lubridate
::f Linguagem R · Aula 23
::o Extraem partes de uma data: ano, mês, dia (e hour, minute, second para horas).
::s
year(data)  month(data)  day(data)  hour(dh)  minute(dh)  second(dh)
::e
library(lubridate)
d <- ymd("2026-07-18")
year(d)
month(d)
day(d)
month(d, label = TRUE)     # nome do mês

[1] 2026
[1] 7
[1] 18
[1] jul
12 Levels: jan < fev < mar < abr < mai < jun < jul < ago < set < ... < dez

@@ days(), months() e years()
::k lubridate
::f Linguagem R · Aula 23
::o Criam períodos de tempo para somar ou subtrair de datas.
::s
data + days(n)   data - months(n)   data + years(n)   dh + hours(n)
::e
library(lubridate)
d <- ymd("2026-07-01")
d + days(10)
d - months(2)
d + years(1)

[1] "2026-07-11"
[1] "2026-05-01"
[1] "2027-07-01"

@@ interval(), duration() e period()
::k lubridate
::f Linguagem R · Aula 23
::o interval() guarda o intervalo entre duas datas; duration() mede tempo exato em segundos; period() mede em unidades "humanas" (dias, meses).
::s
interval(inicio, fim)
duration(num, units = "days")
period(num, units = "days")
::e
library(lubridate)
interval(ymd("2026-07-01"), ymd("2026-07-10"))
duration(10, units = "days")

::r
[1] 2026-07-01 UTC--2026-07-10 UTC
[1] "864000s (~1.43 weeks)"
[1] "10d 0H 0M 0S"

@@ with_tz() e force_tz()
::k lubridate
::f Linguagem R · Aula 23
::o with_tz() converte um horário para outro fuso (o instante é o mesmo, o relógio muda); force_tz() troca só a etiqueta do fuso (o relógio fica igual).

with_tz(datahora, "America/Sao_Paulo")   force_tz(datahora, "America/Sao_Paulo")

library(lubridate)
dh <- ymd_hms("2026-07-01 14:00:00")     # vem em UTC

::k lubridate

::o Arredondam datas para a unidade escolhida: para baixo (floor), para cima (ceiling) ou para a mais próxima (round).

library(lubridate)

@G dplyr: manipulação de tabelas | #ff9f43 | O dplyr (parte do tidyverse) traz "verbos" para filtrar, escolher, criar, ordenar e resumir tabelas. Nos exemplos usamos esta tabela: alunos <- data.frame(nome = c("Ana", "Bruno", "Carla", "Davi"), turma = c("A", "B", "A", "B"), nota = c(8.5, 6.0, 9.2, 7.4))
@@ %>% e |> (pipe)
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o O pipe passa o resultado do que está à esquerda como primeiro argumento da função à direita, permitindo encadear passos.
::q Leia o pipe como "e então…": "pegue alunos, E ENTÃO filtre a turma A, E ENTÃO escolha nome e nota". O código fica na ordem em que você pensa, em vez de funções dentro de funções.
::s
dados %>% funcao1() %>% funcao2()
dados |> funcao1() |> funcao2()
::p %>% | o pipe do pacote magrittr/dplyr (usado nas aulas do Prof. Fabrizzio). Atalho: Ctrl + Shift + M.
::p |> | o pipe nativo do R 4.1 ou mais novo (usado nas aulas da Profª Emília). Funcionam igual no dia a dia.
::e
library(dplyr)
alunos <- data.frame(nome = c("Ana", "Bruno", "Carla", "Davi"),
                     turma = c("A", "B", "A", "B"),
                     nota = c(8.5, 6.0, 9.2, 7.4))
# sem pipe: lê-se de dentro para fora
select(filter(alunos, turma == "A"), nome, nota)
# com pipe: lê-se na ordem
alunos %>%
  filter(turma == "A") %>%
  select(nome, nota)
::r
   nome nota
1   Ana  8.5
2 Carla  9.2
   nome nota
1   Ana  8.5
2 Carla  9.2
::a Coloque o pipe no FIM da linha, nunca no começo da linha seguinte; senão o R acha que o comando terminou.
::a O pipe não salva nada. Para guardar o resultado: novo <- alunos %>% filter(...).
::v filter() | select() | mutate()
@@ filter()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Mantém só as linhas que obedecem a uma ou mais condições.
::q É o WHERE do SQL. Vírgula entre condições significa E (todas precisam ser verdadeiras). Para OU, use |.
::s
filter(tabela, condição1, condição2, ...)
::p tabela | o data frame (some quando você usa o pipe).
::p condição | teste com os nomes das colunas (sem $): nota >= 7, turma == "A", !is.na(idade), sexo %in% c(1, 2).
::p , (vírgula) | E.
::e
library(dplyr)
filter(alunos, nota >= 7)
alunos %>% filter(turma == "B", nota > 7)
alunos %>% filter(turma == "A" | nota < 7)
::r
   nome turma nota
1   Ana     A  8.5
2 Carla     A  9.2
3  Davi     B  7.4
  nome turma nota
1 Davi     B  7.4
   nome turma nota
1   Ana     A  8.5
2 Bruno     B  6.0
3 Carla     A  9.2
::a Use == para comparar (não =). filter(turma = "A") dá erro.
::a Linhas em que a condição dá NA são descartadas. Para manter os NA de propósito: filter(is.na(x) | x > 10).
::a Padrão das aulas de limpeza: filter(!is.na(IDADE), IDADE >= 18, IDADE <= 100).
::v select() | %in% | Acessar partes: df[linha, coluna] | WHERE
@@ select()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Escolhe quais colunas manter (ou remover, com sinal de menos).
::q É o SELECT do SQL. Também serve para reordenar colunas.
::s
select(tabela, col1, col2)
select(tabela, -col)             # remove
select(tabela, col1, everything())
select(tabela, where(is.numeric))
select(tabela, starts_with("vendas"))
::p col1, col2 | os nomes das colunas, sem aspas.
::p -col | tira a coluna.
::p everything() | "todas as outras": útil para trazer colunas para a frente.
::p where(is.numeric) | só as colunas numéricas.
::p starts_with("x") | colunas cujo nome começa com "x".
::e
library(dplyr)
alunos %>% select(nome, nota)
alunos %>% select(-turma) %>% names()
alunos %>% select(nota, everything()) %>% names()
::r
   nome nota
1   Ana  8.5
2 Bruno  6.0
3 Carla  9.2
4  Davi  7.4
[1] "nome" "nota"
[1] "nota"  "nome"  "turma"
::v filter() | rename() | SELECT e FROM
@@ mutate()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Cria colunas novas ou altera colunas existentes, geralmente a partir de cálculos com outras colunas.
::q Se o nome já existe, a coluna é substituída; se não existe, é criada no final. Dá para criar várias de uma vez, separando por vírgula.
::s
mutate(tabela, nova = expressão, outra = expressão)
::p nova = | o nome da coluna (nova ou existente).
::p expressão | a conta ou função: nota * 10, round(TEMPO / 30.4, 1), as.numeric(IDADE)…
::e
library(dplyr)
alunos %>% mutate(nota100 = nota * 10, aprovado = nota >= 7)
::r
   nome turma nota nota100 aprovado
1   Ana     A  8.5      85     TRUE
2 Bruno     B  6.0      60    FALSE
3 Carla     A  9.2      92     TRUE
4  Davi     B  7.4      74     TRUE
::a mutate() não altera a tabela original. Para guardar: alunos <- alunos %>% mutate(...).
::a Dentro do mesmo mutate(), uma coluna nova já pode ser usada pelas seguintes, mas as aulas recomendam um segundo mutate() quando há dependência, para ficar mais claro.
::v if_else() | case_when() | Criar e remover colunas
@@ arrange() e desc()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Ordena as linhas por uma ou mais colunas; desc() inverte para ordem decrescente.
::q É o ORDER BY do SQL. Com várias colunas, a segunda só desempata a primeira.
::s
arrange(tabela, coluna)
arrange(tabela, desc(coluna))
arrange(tabela, col1, desc(col2))
::e
library(dplyr)
alunos %>% arrange(desc(nota))
alunos %>% arrange(turma, desc(nota))
::r
   nome turma nota
1 Carla     A  9.2
2   Ana     A  8.5
3  Davi     B  7.4
4 Bruno     B  6.0
   nome turma nota
1 Carla     A  9.2
2   Ana     A  8.5
3  Davi     B  7.4
4 Bruno     B  6.0
::v sort() e order() | slice(), slice_head() e slice_sample() | ORDER BY ASC / DESC
@@ group_by() e summarise()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o group_by() separa a tabela em grupos; summarise() resume cada grupo numa linha (média, soma, contagem…).
::q Juntos, são o GROUP BY + COUNT/AVG do SQL. "Média de nota POR turma", "quantos pacientes POR sexo".
::s
tabela %>%
  group_by(coluna_grupo) %>%
  summarise(nome1 = funcao(coluna), n = n(), .groups = "drop")
::p group_by(col) | a coluna que define os grupos (pode ser mais de uma).
::p summarise(…) | (ou summarize) as estatísticas: mean(), sum(), median(), max(), min(), n().
::p n() | conta quantas linhas há em cada grupo.
::p .groups = "drop" | desfaz o agrupamento no final (evita uma mensagem de aviso).
::e
library(dplyr)
alunos %>%
  group_by(turma) %>%
  summarise(media = mean(nota), n = n(), .groups = "drop")
alunos %>% summarise(media = mean(nota), maior = max(nota))
::r
# A tibble: 2 × 3
  turma media     n
  <chr> <dbl> <int>
1 A      8.85     2
2 B      6.7      2
  media maior
1 7.775   9.2
::a O resultado é um tibble: por isso aparece "# A tibble: 2 × 3" e os tipos <chr>, <dbl> e <int> embaixo dos nomes.
::a Com NA na coluna, mean() dá NA: use mean(nota, na.rm = TRUE).
::a summarise() sem group_by() resume a tabela inteira numa linha só.
::v count() | n() e ungroup() | aggregate() | GROUP BY | COUNT, SUM, AVG, MIN e MAX
@@ n() e ungroup()
::k dplyr
::f Banco de Dados · Aula 17
::o n() conta linhas dentro de summarise() ou mutate(); ungroup() remove o agrupamento ativo.
::s
summarise(n = n())
tabela %>% group_by(x) %>% mutate(...) %>% ungroup()
::e
library(dplyr)
alunos %>% group_by(turma) %>% summarise(qtd = n())
::r
# A tibble: 2 × 2
  turma   qtd
  <chr> <int>
1 A         2
2 B         2
::v group_by() e summarise() | count()
@@ count()
::k dplyr
::f Banco de Dados · Aula 17 · Linguagem R · Aula 28
::o Conta quantas linhas há para cada valor de uma coluna. É um atalho para group_by() + summarise(n = n()).
::q A ferramenta nº 1 de diagnóstico: count(SEXO) mostra na hora se apareceu algum código inválido.
::s
count(tabela, coluna, sort = FALSE)
::p sort = TRUE | ordena do mais frequente para o menos frequente.
::e
library(dplyr)
alunos %>% count(turma)
mtcars %>% count(cyl, sort = TRUE)
::r
  turma n
1     A 2
2     B 2
  cyl  n
1   8 14
2   4 11
3   6  7
::v table() | group_by() e summarise() | distinct()
@@ if_else()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aula 17
::o Cria um valor (ou coluna) com duas possibilidades: uma quando a condição é verdadeira e outra quando é falsa.
::q Use dentro do mutate() para rótulos binários: SEXO 1 → "Masculino", senão "Feminino".
::s
if_else(condição, valor_se_TRUE, valor_se_FALSE, missing = NULL)
::p condição | teste aplicado a cada linha.
::p missing | (opcional) o que colocar quando a condição der NA.
::e
library(dplyr)
alunos %>% mutate(situacao = if_else(nota >= 7, "Aprovado", "Reprovado"))
::r
   nome turma nota  situacao
1   Ana     A  8.5  Aprovado
2 Bruno     B  6.0 Reprovado
3 Carla     A  9.2  Aprovado
4  Davi     B  7.4  Aprovado
::a ARMADILHA vista na Aula 17: if_else(SEXO == 1, "Masculino", "Feminino") transforma qualquer código inválido (0, 3, 9) em "Feminino" sem avisar. Confira os valores com count() e limpe ANTES de rotular.
::a Os dois resultados precisam ser do mesmo tipo (dois textos ou dois números).
::v case_when() | ifelse() | mutate()
@@ case_when()
::k dplyr
::f Linguagem R · Aula 25 · Banco de Dados · Aulas 17 e 18
::o Cria um valor com várias possibilidades, testando condições em sequência; substitui vários if_else() aninhados.
::q Cada linha é "condição ~ resultado". O R testa de cima para baixo e usa a primeira que der verdadeira. TRUE ~ … no final é o "qualquer outro caso".
::s
case_when(
  condição1 ~ resultado1,
  condição2 ~ resultado2,
  TRUE      ~ resultado_padrão
)
::p ~ | o til: "então".
::p TRUE ~ | (opcional) o "senão" final. Sem ele, quem não cair em nenhuma condição vira NA.
::p NA_character_ | o NA "do tipo texto", usado quando o padrão deve ser ausente.
::e
library(dplyr)
alunos %>% mutate(conceito = case_when(
  nota >= 9 ~ "A",
  nota >= 7 ~ "B",
  TRUE      ~ "C"
))
::r
   nome turma nota conceito
1   Ana     A  8.5        B
2 Bruno     B  6.0        C
3 Carla     A  9.2        A
4  Davi     B  7.4        B
::a A ordem importa: se a linha nota >= 7 viesse antes de nota >= 9, ninguém receberia "A".
::a Ótimo para padronizar texto bagunçado: TABAGISMO %in% c("Sim", "sim", "S") ~ "Sim".
::v if_else() | else if | mutate()
@@ rename()
::k dplyr
::f Banco de Dados · Aula 17
::o Troca o nome de colunas: novo = antigo.
::s
rename(tabela, novo_nome = nome_antigo)
::e
library(dplyr)
alunos %>% rename(aluno = nome, nota_final = nota) %>% names()
::r
[1] "aluno"      "turma"      "nota_final"
::a A ordem é NOVO = ANTIGO (o contrário do que muita gente espera).
::v select() | colnames() e rownames() | AS (apelido)
@@ distinct()
::k dplyr
::f Banco de Dados · Aula 18
::o Remove linhas duplicadas ou mostra os valores únicos de uma coluna.
::s
distinct(tabela)            # remove linhas inteiras repetidas
distinct(tabela, coluna)    # valores únicos da coluna
::e
library(dplyr)
alunos %>% distinct(turma)
::r

@G Estatística: tabelas de frequência | #4cc9f0 | Como resumir uma variável em tabelas: contar, calcular percentuais, agrupar números em faixas (classes) e montar tabelas cruzadas. Material: Estatística Descritiva, Aulas 3, 4, 11 e 12 (base de nascidos vivos SINASC).
@@ Número de classes e amplitude (h)
::k base
::f Estatística Descritiva · Aulas 3 e 4
::o Receita para decidir em quantas faixas (classes) dividir uma variável numérica e qual o tamanho (h) de cada faixa.
::q Imagine agrupar salários em faixas. Se fizer faixas demais, a tabela fica enorme; se fizer de menos, esconde tudo. O critério da raiz diz: número de classes (k) ≈ raiz quadrada do número de observações (n). Depois, o tamanho de cada faixa é a amplitude total dividida por k.
::s
n <- length(x)                 # quantas observações
k <- ceiling(sqrt(n))          # número de classes (critério da raiz)
h <- (max(x) - min(x)) / k     # amplitude (tamanho) de cada classe
::p length(x) | n = quantidade de valores.
::p ceiling(sqrt(n)) | raiz quadrada de n, arredondada PARA CIMA (ceiling).
::p max(x) - min(x) | amplitude total: do menor ao maior valor.
::p / k | divide a amplitude total pelo número de classes. Se der quebrado, arredonde para cima para as faixas cobrirem todos os dados.
::e
salarios <- c(1200, 1500, 1800, 2100, 2500, 3000, 3200, 4100, 5200, 7900)
n <- length(salarios)
n
k <- ceiling(sqrt(n))
k
max(salarios) - min(salarios)
h <- (max(salarios) - min(salarios)) / k
h
::r
[1] 10
[1] 4
[1] 6700
[1] 1675
::a Não existe número "certo" de classes: é uma regra prática. Na aula, o fdt() escolhe sozinho, mas você pode impor suas faixas com start, end e h (veja fdt()).
::a Prefira limites "redondos" (1000, 3000, 5000...) em vez de 1675 quebrado: a tabela fica mais fácil de ler.
::v fdt() (pacote fdth) | cut() | sqrt(), abs() e exp() | min(), max(), which.min() e which.max()
@@ cut()
::k base
::f Estatística Descritiva · Aula 4
::o Transforma uma variável numérica em faixas (categorias), como "0 a 18 anos", "19 a 40 anos".
::q É a tesoura do R: você diz onde cortar (breaks) e ele cola em cada número a etiqueta da faixa a que pertence. Depois, table() conta quantos caíram em cada faixa.
::s
cut(x, breaks = c(...), labels = c(...), right = TRUE, include.lowest = FALSE)
::p x | vetor numérico (ou coluna: df$idade).
::p breaks | os pontos de corte, em ordem crescente. Com 5 pontos você cria 4 faixas.
::p labels | nomes das faixas (opcional). Sem isso, o R usa "(0,18]", "(18,40]"...
::p right = TRUE | faixas FECHADAS À DIREITA: (0,18] inclui o 18, mas não o 0. Use right = FALSE para [0,18): inclui o 0 e não inclui o 18.
::p include.lowest = TRUE | inclui o menor valor também na primeira faixa.
::e
idade <- c(5, 12, 17, 23, 34, 41, 58, 66)
faixas <- cut(idade, breaks = c(0, 18, 40, 60, 100))
faixas
table(faixas)

# onde o 18 e o 40 caem em cada tipo de faixa?
cut(c(18, 40), breaks = c(0, 18, 40, 60))
cut(c(18, 40), breaks = c(0, 18, 40, 60), right = FALSE)
::r
[1] (0,18]   (0,18]   (0,18]   (18,40]  (18,40]  (40,60]  (40,60]  (60,100]
Levels: (0,18] (18,40] (40,60] (60,100]
faixas
  (0,18]  (18,40]  (40,60] (60,100]
       3        2        2        1
[1] (0,18]  (18,40]
Levels: (0,18] (18,40] (40,60]
[1] [18,40) [40,60)
Levels: [0,18) [18,40) [40,60)
::a Valor fora dos cortes vira NA. Se a variável tem zero e o primeiro corte é 0, o zero fica de fora com right = TRUE! Na aula, para o número de consultas pré-natal usou-se breaks = c(-0.01, 0, 3, 6, 98, 99) para o 0 ter a sua própria faixa.
::a Colchete [ ou ] = o número ENTRA na faixa. Parêntese ( ou ) = NÃO entra.
::a O resultado é um fator (veja factor()). Com labels = c(...) o número de nomes tem que ser igual ao número de faixas (um a menos que os cortes).
::v table() | prop.table() | factor() | fdt() (pacote fdth)
@@ fdt() (pacote fdth)
::k fdth
::f Estatística Descritiva · Aula 4
::o Monta, de uma vez, a tabela de frequências de uma variável numérica: classes, frequência absoluta (f), relativa (rf), percentual (rf%) e acumuladas (cf).
::q É um "faça tudo": em vez de usar cut() + table() + prop.table() + cumsum(), o fdt() entrega a tabela completa. Sem argumentos ele escolhe as classes sozinho (às vezes com limites quebrados); com start, end e h você manda.
::s
library(fdth)
fdt(x, na.rm = TRUE)
fdt(x, start = inicio, end = fim, h = amplitude)
::p x | o vetor numérico (df$coluna).
::p na.rm = TRUE | ignora os NA.
::p start | início da primeira classe.
::p end | fim da última classe.
::p h | amplitude (tamanho) de cada classe.
::e
library(fdth)
salarios <- c(1200, 1500, 1800, 2100, 2500, 3000, 3200, 4100, 5200, 7900)
tab <- fdt(salarios, start = 1000, end = 9000, h = 2000)
tab
::r
 Class limits  f   rf rf(%) cf cf(%)
 [1000,3000)   5 0.50 50.00  5 50.00
 [3000,5000)   3 0.30 30.00  8 80.00
 [5000,7000)   1 0.10 10.00  9 90.00
 [7000,9000)   1 0.10 10.00 10 100.00
::a As classes do fdt() são fechadas à esquerda: [1000,3000) inclui 1000 e não inclui 3000.
::a O alinhamento exato das colunas pode variar um pouco no seu Console.
::a Guarde o resultado (tab <- fdt(...)) para reutilizar em plot(tab, type = "cfp") e fazer ogiva e polígono de frequências.
::a Antes de usar: install.packages("fdth") (só na primeira vez) e library(fdth).
::v cut() | Ogiva e polígono de frequências | Número de classes e amplitude (h) | table()
@@ Tabela de frequências feita à mão
::k base
::f Estatística Descritiva · Aula 4
::o Receita para montar a tabela completa (f, fr, fr%, F, Fr%) de uma variável com table(), prop.table() e cumsum().
::q Frequência = contagem. Frequência relativa = contagem ÷ total. Frequência acumulada = soma corrida (o "até aqui").
::s
f <- table(x)                      # frequência absoluta
fr <- prop.table(f)                # frequência relativa
F <- cumsum(f)                     # frequência acumulada
::p table(x) | conta cada valor.
::p prop.table() | divide cada contagem pelo total.
::p cumsum() | soma acumulada: 2, 2+2, 2+2+3...
::p as.vector() | tira os nomes, para a coluna do data.frame ficar limpa.
::e
filhos <- c(0, 1, 1, 2, 2, 2, 3, 3, 4, 0)
f  <- table(filhos)
fr <- prop.table(f)
tab <- data.frame(filhos = names(f),
                  f      = as.vector(f),
                  fr     = as.vector(fr),
                  fr_pct = as.vector(fr) * 100,
                  F      = as.vector(cumsum(f)),
                  Fr_pct = as.vector(cumsum(fr)) * 100)
tab
::r
  filhos f  fr fr_pct  F Fr_pct
1      0 2 0.2     20  2     20
2      1 2 0.2     20  4     40
3      2 3 0.3     30  7     70
4      3 2 0.2     20  9     90
5      4 1 0.1     10 10    100
::a A última linha da acumulada (F) tem que ser igual a n, e a de Fr% tem que ser 100. É um bom teste para achar erros.
::a Variável QUALITATIVA nominal (cor, sexo): a acumulada não faz sentido. Ela é para variáveis ordenáveis (ordinais ou quantitativas).
::v table() | prop.table() | sum(), mean(), prod() e cumsum() | fdt() (pacote fdth) | data.frame()
@@ addmargins()
::k base
::f Estatística Descritiva · Aulas 11 e 12
::o Acrescenta os TOTAIS (linha "Sum" e/ou coluna "Sum") a uma tabela feita com table().
::q Na tabela cruzada, os totais das linhas e das colunas (chamados "marginais") dizem quantos casos há em cada categoria sozinha, ignorando a outra variável.
::s
addmargins(tabela)
addmargins(tabela, margin = 1)
addmargins(tabela, margin = 2)
::p tabela | resultado de table(x, y) (ou de prop.table()).
::p margin = 1 | só a linha de totais (soma para baixo, por coluna).
::p margin = 2 | só a coluna de totais (soma para o lado, por linha).
::p sem margin | as duas.
::e
sexo <- c("F", "M", "F", "M", "F", "M", "F", "F")
fuma <- c("sim", "não", "não", "não", "sim", "sim", "sim", "não")
tab <- table(sexo, fuma)
tab
addmargins(tab)
::r
    fuma
sexo não sim
   F   2   3
   M   2   1
     fuma
sexo  não sim Sum
  F     2   3   5
  M     2   1   3
  Sum   4   4   8
::a Para percentuais: round(prop.table(tab, 1) * 100, 1) divide pela LINHA; prop.table(tab, 2) divide pela COLUNA; prop.table(tab) divide pelo TOTAL GERAL. Depois, addmargins(..., margin = 2) soma a coluna de totais (100% em cada linha).
::a O alinhamento dos espaços no seu Console pode ser um pouco diferente do mostrado aqui.
::v table() | prop.table() | tabyl() e adorn_*() (janitor)
@@ tabyl() e adorn_*() (janitor)
::k janitor
::f Estatística Descritiva · Aulas 11 e 12
::o Faz tabelas de frequência e tabelas cruzadas já "bonitas", com totais e percentuais, em formato de data.frame.
::q É a versão turbinada do table() + addmargins() + prop.table(): você encadeia com |> os enfeites que quer: totais (adorn_totals), proporções (adorn_percentages), arredondamento (adorn_rounding) e formato % (adorn_pct_formatting).
::s
library(janitor)
tabyl(dados, var1, var2, show_na = FALSE)
tabela |> adorn_totals(c("row", "col"))
tabela |> adorn_percentages("all")
tabela |> adorn_pct_formatting(digits = 1)
::p tabyl(dados, var1, var2) | cruza var1 (linhas) com var2 (colunas). Só com var1 faz tabela de uma variável.
::p show_na = FALSE | não mostra a categoria NA.
::p adorn_totals("row") / ("col") / c("row", "col") | totais na linha, na coluna ou nas duas.
::p adorn_percentages("all" / "row" / "col") | proporções em relação ao total geral, ao total de cada linha ou de cada coluna.
::p adorn_rounding(digits = 3) | arredonda as proporções.
::p adorn_pct_formatting(digits = 1) | transforma em texto com % (25.0%).
::e
library(janitor)
dados <- data.frame(
  sexo = c("F", "M", "F", "M", "F", "M", "F", "F"),
  fuma = c("sim", "não", "não", "não", "sim", "sim", "sim", "não"))
tabyl(dados, sexo, fuma) |>
  adorn_totals(c("row", "col"))
tabyl(dados, sexo, fuma) |>
  adorn_percentages("all") |>
  adorn_rounding(digits = 3) |>
  adorn_totals(c("row", "col"))
::r
  sexo não sim Total
     F   2   3     5
     M   2   1     3
 Total   4   4     8
  sexo  não   sim Total
     F 0.25 0.375 0.625
     M 0.25 0.125 0.375
 Total 0.50 0.500 1.000
::a A ORDEM importa: percentuais "all" primeiro e totais depois dá a soma 1,0 (100%). Totais antes de percentuais pode contar o total duas vezes, dependendo do argumento.
::a O resultado é um data.frame: dá para exportar direto com write.xlsx().
::a Antes de usar: install.packages("janitor") (só na primeira vez).
::v addmargins() | table() | write.xlsx() (pacote openxlsx) | prop.table()
@@ write.xlsx() (pacote openxlsx)
::k openxlsx
::f Estatística Descritiva · Aula 11
::o Salva um data.frame (ou tabela) em um arquivo Excel .xlsx.
::q Parecido com write_xlsx() (pacote writexl) que você já viu: muda o pacote, e o write.xlsx() é o usado nas aulas de estatística para exportar tabelas prontas.
::s
library(openxlsx)
write.xlsx(tabela, "nome_do_arquivo.xlsx")
::p tabela | data.frame, tabyl ou resultado de tabela já convertido em data.frame.
::p "nome_do_arquivo.xlsx" | nome (e caminho) do arquivo a criar.
::e
library(openxlsx)
tab <- data.frame(sexo = c("F", "M"), n = c(5, 3))
write.xlsx(tab, "Tabela_sexo.xlsx")
::r
(nada aparece no Console; o arquivo Tabela_sexo.xlsx surge na pasta de trabalho, veja getwd())
::a Sem o caminho completo, o arquivo vai para a pasta de trabalho atual (getwd()).
::a Se o Excel estiver com o arquivo aberto, o R não consegue sobrescrevê-lo: feche-o antes.
::v write_xlsx() | getwd() e setwd() | tabyl() e adorn_*() (janitor)

@G Estatística: medidas resumo | #f72585 | Média, mediana, moda, variância, desvio padrão, quartis e outliers: os números que "resumem" uma variável. Material: Estatística Descritiva, Aulas 7, 8 e 9.
@@ mfv() (moda)
::k modeest
::f Estatística Descritiva · Aula 8
::o Devolve a MODA: o valor que mais se repete (most frequent value).
::q É o "campeão de audiência". Em dados qualitativos (estado civil, sexo) é a única medida de posição que faz sentido. Pode haver mais de uma moda (bimodal).
::s
library(modeest)
mfv(x, na_rm = TRUE)
::p x | vetor numérico OU de texto.
::p na_rm = TRUE | ignora os NA (repare: com underline, ao contrário de na.rm).
::e
library(modeest)
mfv(c(2, 3, 3, 3, 5, 5, 7))
mfv(c(1, 1, 2, 2, 3))
mfv(c("A", "B", "B", "C"))
::r
[1] 3
[1] 1 2
[1] "B"
::a Se vários valores empatam, devolve TODOS (no segundo exemplo, 1 e 2).
::a O R base não tem função de moda (mode() é outra coisa: tipo do objeto). Por isso o pacote modeest.
::v median() | sum(), mean(), prod() e cumsum() | table()
@@ var() e sd()
::k base
::f Estatística Descritiva · Aula 8
::o var() calcula a variância e sd() o desvio padrão: medidas de quanto os dados se espalham em torno da média.
::q Desvio padrão = "distância típica" entre cada valor e a média, na mesma unidade dos dados. A variância é esse número ao quadrado (por isso o desvio padrão é mais fácil de interpretar).
::s
var(x, na.rm = FALSE)
sd(x, na.rm = FALSE)
::p x | vetor numérico.
::p na.rm = TRUE | ignora os NA. Sem isso, um único NA faz o resultado ser NA.
::p x - mean(x) | desvio de cada valor em relação à média.
::p sum((x - mean(x))^2) | soma dos desvios ao quadrado: 9 + 0 + 1 + 1 + 9 = 20.
::p var(x) | 20 ÷ (n − 1) = 20 ÷ 4 = 5.
::p sd(x) | raiz quadrada da variância: √5 = 2,236068.
::e
x <- c(3, 6, 5, 7, 9)
mean(x)
x - mean(x)
sum((x - mean(x))^2)
var(x)
sd(x)
sqrt(var(x))
::r
[1] 6
[1] -3  0 -1  1  3
[1] 20
[1] 5
[1] 2.236068
[1] 2.236068
::a O R divide por n − 1 (variância AMOSTRAL), como na aula. Dividir por n daria a variância populacional (4 neste exemplo).
::a Desvio padrão pequeno: valores colados na média. Grande: espalhados.
::v Coeficiente de variação (CV) | sqrt(), abs() e exp() | sum(), mean(), prod() e cumsum()
@@ Coeficiente de variação (CV)
::k base
::f Estatística Descritiva · Aula 8
::o Receita para calcular o CV: o desvio padrão como percentual da média. Serve para comparar a dispersão de variáveis em unidades diferentes.
::q Um desvio padrão de 5 é grande para quem tem média 10, e minúsculo para quem tem média 1000. O CV (desvio ÷ média) tira a unidade e permite comparar "peso em gramas" com "idade em anos".
::s
CV <- sd(x, na.rm = TRUE) / mean(x, na.rm = TRUE) * 100
::e
x <- c(3, 6, 5, 7, 9)
CV <- sd(x) / mean(x) * 100
CV
::r
[1] 37.2678
::a Regra prática comum: CV abaixo de ~15% = dados pouco dispersos; entre 15% e 30% = média dispersão; acima de ~30% = alta dispersão. Os limites variam por área.
::a Só faz sentido com variáveis de valores positivos e com zero verdadeiro (peso, salário, idade). Não use em temperatura em °C.
::v var() e sd() | sum(), mean(), prod() e cumsum()
@@ diff() (amplitude total)
::k base
::f Estatística Descritiva · Aula 8
::o diff() calcula a diferença entre valores vizinhos. Aplicada a range(), dá a AMPLITUDE TOTAL (maior − menor).
::s
diff(x)
diff(range(x))
::p range(x) | devolve c(mínimo, máximo).
::p diff() | subtrai o primeiro do segundo: máximo − mínimo.
::e
x <- c(3, 6, 5, 7, 9)
range(x)
diff(range(x))
max(x) - min(x)
diff(c(1, 4, 9))
::r
[1] 3 9
[1] 6
[1] 6
[1] 3 5
::a Sozinha, diff(x) devolve a diferença entre cada valor e o anterior: (4−1) e (9−4).
::v range() | min(), max(), which.min() e which.max()
@@ IQR() e limites dos outliers
::k base
::f Estatística Descritiva · Aula 9
::o Calcula a distância interquartílica (DI = Q3 − Q1) e, com ela, os limites para identificar outliers (valores muito fora do padrão).
::q A "caixa" do box-plot guarda os 50% do meio dos dados: o tamanho dela é a DI. Valores além de 1,5 caixas para fora são suspeitos (outliers).
::s
IQR(x, type = 2)
limite_inf <- Q1 - 1.5 * DI
limite_sup <- Q3 + 1.5 * DI
::p IQR(x, type = 2) | Q3 − Q1 pelo método (type = 2) que reproduz a conta à mão das aulas.
::p Q1 − 1,5 · DI | abaixo disso é outlier inferior.
::p Q3 + 1,5 · DI | acima disso é outlier superior.
::e
d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40)
q <- unname(quantile(d, probs = c(0.25, 0.75), type = 2))
q
di <- q[2] - q[1]
di
limites <- c(q[1] - 1.5 * di, q[2] + 1.5 * di)
limites
d[d < limites[1] | d > limites[2]]
IQR(d, type = 2)
::r
[1] 4 9
[1] 5
[1] -3.5 16.5
[1] 40
[1] 5
::a O padrão do R (type = 7) calcula quartis de outro jeito e pode dar valores um pouco diferentes dos slides. Aqui, type = 2 reproduz a conta à mão (veja quantile()).
::a Outlier não é necessariamente erro: pode ser um valor real extremo. Investigue antes de apagar.
::v quantile() | boxplot() | summary()
@@ tapply()
::k base
::f Estatística Descritiva · Aula 12
::o Aplica uma função (mean, sd, length, summary...) a uma variável NUMÉRICA, separadamente para cada categoria de outra variável.
::q "Qual o peso médio dos bebês por sexo?" Divide em grupos (F, M) e calcula a média de cada um. É a base da análise bidimensional qualitativa × quantitativa.
::s
tapply(variavel_numerica, variavel_categorica, funcao)
::p variavel_numerica | o que será calculado (df$peso).
::p variavel_categorica | como separar os grupos (df$sexo).
::p funcao | mean, sd, var, median, length, summary...
::e
dados <- data.frame(sexo = c("F", "M", "F", "M", "F", "M"),
                    peso = c(3.1, 3.4, 2.9, 3.6, 3.3, 3.2))
tapply(dados$peso, dados$sexo, mean)
tapply(dados$peso, dados$sexo, length)
::r
  F   M
3.1 3.4
F M
3 3
::a length dá o n de cada grupo, útil para saber se os grupos têm tamanhos parecidos.
::a Com summary dá um resumo completo por grupo (retorna uma lista).
::v apply() | summary() | group_by() e summarise() | boxplot()
@@ cor()
::k base
::f Extra (além do curso) · relaciona-se com a Aula 10
::o Calcula o coeficiente de correlação (de Pearson) entre duas variáveis numéricas: um número de −1 a +1 que mede a força da relação linear.
::q +1: quando uma sobe, a outra sobe sempre, em linha reta. −1: quando uma sobe, a outra desce. 0: nenhuma relação em linha reta.
::s
cor(x, y, use = "complete.obs")
::p x, y | dois vetores numéricos do mesmo tamanho.
::p use = "complete.obs" | ignora as linhas com NA em qualquer uma das duas.
::e
x <- c(1, 2, 3, 4, 5)
y <- c(2, 4, 5, 4, 5)
cor(x, y)
cor(x, 2 * x)
cor(x, rev(x))
::r
[1] 0.7745967
[1] 1
[1] -1
::a Correlação NÃO é causalidade: duas coisas podem andar juntas sem uma causar a outra.
::a Só enxerga relação em LINHA RETA: uma relação em "U" pode dar correlação perto de 0. Sempre olhe o gráfico de dispersão (plot(x, y)) junto.
::a Este assunto não aparece nos slides da disciplina: é um complemento (a Aula 10 apresenta o gráfico de dispersão, que é o "irmão visual" da correlação).
::v Gráficos de dispersão (plot) | var() e sd()

@G Estatística: gráficos | #fca311 | Gráficos para variáveis numéricas e para cruzar variáveis: histograma, dispersão, ogiva, polígono, box-plot, além de cores e como salvar a imagem. Material: Estatística Descritiva, Aulas 5, 6, 9, 11 e 12.
@@ hist(): densidade, classes e quebras
::k base
::f Estatística Descritiva · Aula 6
::o Versão "de estatística" do histograma: altura em DENSIDADE (freq = FALSE) e com você escolhendo o número de classes ou os cortes.
::q Em um histograma de densidade, a ÁREA de cada barra é a proporção de dados naquela faixa (e a área total é 1). Por isso a altura não é uma contagem.
::s
hist(x, freq = FALSE, main = "", xlab = "", ylab = "", col = "")
hist(x, nclass = 6)
hist(x, breaks = seq(0, 7000, 1000), right = FALSE)
::p freq = FALSE | eixo y em densidade (em vez de contagem).
::p nclass = 6 | número aproximado de classes.
::p breaks = seq(0, 7000, 1000) | os cortes exatos: de 0 a 7000, de 1000 em 1000.
::p right = FALSE | classes fechadas à esquerda: [0,1000), [1000,2000)...
::p col | cor das barras (nome, número ou hexadecimal).
::e
set.seed(1)
peso <- rnorm(500, mean = 3200, sd = 450)
hist(peso, freq = FALSE,
     breaks = seq(1000, 5000, 500), right = FALSE,
     main = "Peso ao nascer", xlab = "Peso (g)",
     ylab = "Densidade", col = "lightblue")
::r
(histograma em forma de sino, com o eixo vertical em densidade)
::a Sem freq = FALSE e com classes de larguras iguais, o formato é o mesmo; a diferença é só a escala do eixo y. Com classes de larguras DIFERENTES, só a densidade é correta.
::v hist() | rnorm() | seq() e :
@@ boxplot()
::k base
::f Estatística Descritiva · Aulas 9 e 12
::o Desenha o box-plot (diagrama de caixa), que resume uma variável em cinco números e mostra os outliers como pontinhos.
::q A caixa vai de Q1 a Q3 (50% dos dados do meio); o traço dentro é a mediana; os "bigodes" vão até os valores normais mais extremos; pontinhos fora são outliers.
::s
boxplot(x, horizontal = FALSE, main = "", col = "")
boxplot(numerica ~ categorica, data = dados)
::p x | vetor numérico.
::p horizontal = TRUE | deita o gráfico.
::p numerica ~ categorica | box-plot COMPARATIVO: uma caixa para cada categoria (ex.: peso ~ sexo).
::p col | cores das caixas, em ordem (col = c(6, 4)).
::e
d <- c(2, 3, 4, 5, 6, 7, 8, 9, 10, 40)
boxplot(d, main = "Com um outlier", col = "lightblue")
b <- boxplot(d, plot = FALSE)
b$out
dados <- data.frame(sexo = c("F", "M", "F", "M", "F", "M"),
                    peso = c(3.1, 3.4, 2.9, 3.6, 3.3, 3.2))
boxplot(peso ~ sexo, data = dados, col = c(6, 4))
::r
[1] 40
(dois gráficos: o primeiro com um ponto isolado lá em cima; o segundo com duas caixas, F e M)
::a Para tirar códigos de "valor ignorado" (como 99 no SINASC) antes de desenhar: boxplot(dados$IDADEMAE[dados$IDADEMAE < 99]).
::a O R calcula os quartis do box-plot pelo seu próprio método (dobradiças de Tukey); em amostras pequenas pode diferir um pouco de quantile().
::v quantile() | IQR() e limites dos outliers | tapply() | hist()
@@ Gráficos de dispersão (plot)
::k base
::f Estatística Descritiva · Aulas 6 e 12
::o Usa plot() de dois jeitos: (1) dispersão unidimensional, com uma variável quantitativa discreta; (2) dispersão entre duas variáveis quantitativas.
::q (1) Mostra, para cada valor possível (Apgar 0 a 10), uma haste ou ponto na altura da frequência. (2) Cada observação vira um ponto (x, y): a nuvem de pontos revela se uma variável cresce, cai ou nada tem a ver com a outra.
::s
plot(table(x))                       # dispersão unidimensional (segmentos)
plot(valores, frequencias, pch = 19) # só os pontos
plot(x, y, main = "", xlab = "", ylab = "")   # duas variáveis
::p plot(table(x)) | hastes na altura de cada frequência.
::p pch = 19 | pontos cheios.
::p plot(x, y) | x no eixo horizontal, y no vertical; os dois vetores com o mesmo tamanho.
::e
apgar <- c(7, 8, 8, 9, 9, 9, 10, 10, 10, 10)
plot(table(apgar), xlab = "Apgar", ylab = "Frequência")
x <- c(1, 2, 3, 4, 5)
y <- c(2, 4, 5, 4, 5)
plot(x, y, pch = 19, xlab = "x", ylab = "y")
::r
(dois gráficos: hastes verticais nos valores 7 a 10 e uma nuvem de 5 pontos subindo da esquerda para a direita)
::a Com milhões de pontos o gráfico fica um borrão e pesado. Na aula, usou-se uma amostra.
::a Para ver só a força da relação em um número, use cor().

@G Probabilidade e contagem | #e76f51 | Sortear, contar resultados possíveis e calcular probabilidades (também por simulação). Material: Análise Estatística para Data Science, Aula 1.
@@ sample()
::k base
::f Análise Estatística · Aula 1 · Atividade 9
::o Sorteia elementos de um vetor: simula dados, moedas, urnas e também tira uma amostra aleatória das linhas de uma base.
::q É a "urna" do R: você coloca os itens, diz quantos quer tirar e se pode devolver a bolinha à urna (reposição) antes do próximo sorteio.
::s
sample(x, size, replace = FALSE, prob = NULL)
::p x | os itens da urna (ex.: 1:6 para um dado, c("K", "C") para uma moeda).
::p size | quantos sorteios fazer.
::p replace = TRUE | com reposição: o mesmo item pode sair de novo (dado jogado várias vezes). Padrão FALSE (sem reposição).
::p prob | probabilidades de cada item, se não forem iguais (moeda viciada).
::p df[sample(nrow(df), 200), ] | sorteia 200 linhas de uma tabela: é a amostra aleatória simples da aula.
::e
set.seed(123)
sample(1:6, 10, replace = TRUE)          # 10 lançamentos de um dado
sample(c("K", "C"), 5, replace = TRUE)   # 5 lançamentos de uma moeda
sample(1:60, 6)                          # um jogo da Mega-Sena (sem repetir)
sample(c("cara", "coroa"), 8, replace = TRUE, prob = c(0.8, 0.2))
::r
 [1] 3 6 3 2 2 6 3 5 4 6
[1] "C" "K" "C" "K" "C"
[1]  5 51 27 57 28  9
[1] "cara"  "cara"  "cara"  "cara"  "cara"  "cara"  "coroa" "coroa"
::a Sem set.seed(), cada execução dá um sorteio diferente. Com o mesmo set.seed(), o resultado se repete (no RStudio também).
::a Sem replace = TRUE, size não pode ser maior que o número de itens (não dá para tirar 10 bolas de uma urna com 6 sem devolver).
::v runif(), rnorm() e set.seed() | Simulação: frequência relativa com mean() | C:Probabilidade: clássica e frequentista
@@ choose()
::k base
::f Análise Estatística · Aula 1
::o Calcula a combinação C(N, n): de quantas maneiras dá para escolher n itens entre N, sem importar a ordem e sem repetir.
::q Quantos grupos diferentes de 6 números existem na Mega-Sena? A ordem em que você marca os números não muda a aposta: isso é combinação.
::s
choose(N, n)
::p N | total de itens disponíveis.
::p n | quantos itens são escolhidos.
::p Fórmula | C(N, n) = N! / (n! (N - n)!).
::e
choose(60, 6)          # apostas possíveis na Mega-Sena
1 / choose(60, 6)      # chance de ganhar com uma aposta simples
choose(8, 2)           # dominó: combinação COM reposição = choose(7 + 2 - 1, 2)
choose(5, 3)           # do exemplo da binomial: 5 verificações, 3 sucessos
::r
[1] 50063860
[1] 1.997449e-08
[1] 28
[1] 10
::a Para combinação COM reposição (como as peças do dominó) use choose(N + n - 1, n).
::a 1 / choose(60, 6) aparece em notação científica (2e-08 = 0,00000002). Use format(x, scientific = FALSE) para ver por extenso.
::v Arranjo e permutação com factorial() | log(), log10(), log2() e factorial() | C:Métodos de contagem
@@ Arranjo e permutação com factorial()
::k base
::f Análise Estatística · Aula 1
::o Receita para os casos de contagem em que a ORDEM importa: permutação (N!), arranjo sem reposição (N!/(N−n)!) e arranjo com reposição (N^n).
::q Senha, código de produto e ordem de chegada numa corrida: trocar a ordem gera um resultado diferente. Por isso a conta é maior do que a da combinação.
::s
factorial(N)                       # permutação: N itens em fila
factorial(N) / factorial(N - n)    # ordenada SEM reposição (arranjo)
N^n                                # ordenada COM reposição
::p factorial(4) | 4! = 4 · 3 · 2 · 1 = 24 roteiros para visitar 4 atrações.
::p factorial(10) / factorial(6) | 10 · 9 · 8 · 7: códigos com 4 dígitos distintos.
::p 10^4 | 4 dígitos que podem se repetir.
::e
factorial(4)                       # roteiros com 4 atrações
factorial(10) / factorial(10 - 4)  # códigos com 4 dígitos distintos
prod(10:7)                         # a mesma conta, multiplicando 10*9*8*7
10^4                               # 4 dígitos, podendo repetir
::r
[1] 24
[1] 5040
[1] 5040
[1] 10000
::a Resumo das 4 contagens da aula: ordenada sem reposição = N!/(N−n)!; ordenada com reposição = N^n; não ordenada sem reposição = choose(N, n); não ordenada com reposição = choose(N + n − 1, n).
::a Por definição, 0! = 1: factorial(0) devolve 1.
::v choose() | log(), log10(), log2() e factorial() | sum(), mean(), prod() e cumsum() | C:Métodos de contagem
@@ union(), intersect() e setdiff()
::k base
::f Análise Estatística · Aula 1 (eventos como conjuntos)
::o Operações de conjuntos: union() é a união (A ∪ B), intersect() a interseção (A ∩ B) e setdiff() a diferença (o que está em A e não em B, usada para o complementar).
::q Eventos são conjuntos de resultados. "A ou B" = união; "A e B" = interseção; "não A" = tudo do espaço amostral menos A.
::s
union(A, B)        # A ∪ B
intersect(A, B)    # A ∩ B
setdiff(omega, A)  # complementar de A
::p A, B | vetores com os resultados de cada evento.
::p omega | o espaço amostral inteiro (ex.: 1:6).
::e
omega <- 1:6
A <- c(2, 4, 6)          # par
C <- c(5, 6)             # >= 5
union(A, C)
intersect(A, C)
setdiff(omega, A)        # complementar de A
length(union(A, C)) / length(omega)   # P(A ∪ C) = 4/6
::r
[1] 2 4 6 5
[1] 6
[1] 1 3 5
[1] 0.6666667
::a length(intersect(A, B)) == 0 indica eventos disjuntos (não podem ocorrer juntos).
::v %in% | length() | C:União, interseção e complementar
@@ expand.grid()
::k base
::f Extra (além dos slides) · ajuda na Aula 1
::o Cria uma tabela com TODAS as combinações de valores: ótimo para listar o espaço amostral de dois ou mais experimentos e contar casos favoráveis.
::q Jogar dois dados tem 36 resultados. Em vez de escrever um por um, expand.grid() monta a lista inteira, e você filtra os que interessam.
::s
expand.grid(nome1 = valores1, nome2 = valores2)
::p nome1 = valores1 | cada argumento vira uma coluna.
::p Resultado | um data frame com uma linha para cada combinação possível.
::e
dados <- expand.grid(d1 = 1:6, d2 = 1:6)
nrow(dados)                              # tamanho do espaço amostral
head(dados, 3)
mean(dados$d1 + dados$d2 == 7)           # P(soma = 7)
mean(dados$d1 == dados$d2)               # P(os dois iguais)
::r
[1] 36
  d1 d2
1  1  1
2  2  1
3  3  1
[1] 0.1666667
[1] 0.1666667
::a mean() de uma condição dá a proporção de linhas em que ela é verdadeira, que é P(A) = casos favoráveis ÷ casos possíveis (definição clássica).
::a Não aparece nos slides da disciplina; é um atalho útil para conferir contas de probabilidade.
::v Simulação: frequência relativa com mean() | C:Espaço amostral e eventos | data.frame()
@@ Simulação: frequência relativa com mean()
::k base
::f Análise Estatística · Aula 1 (definição frequentista)
::o Receita para estimar uma probabilidade repetindo o experimento muitas vezes no computador e calculando a proporção de vezes em que o evento ocorreu.
::q Em vez de fazer a conta, você "joga o dado" 10.000 vezes e conta quantas deu par. É a definição frequentista: P(A) ≈ n(A) / n.
::s
x <- sample(..., size = n_grande, replace = TRUE)   # repete o experimento
mean(condição sobre x)                              # proporção de vezes em que A ocorreu
::p mean(x %% 2 == 0) | TRUE conta como 1 e FALSE como 0, então a média é a proporção de TRUE.
::p n grande | quanto mais repetições, mais perto da probabilidade verdadeira (Lei dos Grandes Números).
::e
set.seed(2026)
dado <- sample(1:6, 10000, replace = TRUE)
mean(dado %% 2 == 0)        # P(par): teórico 0,5
mean(dado >= 2)             # P(nº >= 2): teórico 5/6 = 0,833
moeda <- sample(c("K", "C"), 100, replace = TRUE)
mean(moeda == "K")          # proporção de caras em 100 lançamentos
::r
[1] 0.5044
[1] 0.8279
[1] 0.53
::a Com poucas repetições o resultado oscila bastante; com muitas, chega perto do valor teórico, mas raramente é exatamente igual.
::v sample() | Lei dos Grandes Números (simulação) | C:Probabilidade: clássica e frequentista
@@ Lei dos Grandes Números (simulação)
::k base
::f Análise Estatística · Aula 1
::o Receita para ver a frequência relativa "se acalmar" e se aproximar da probabilidade verdadeira à medida que o número de repetições cresce.
::q A cada lançamento, recalculamos "caras até agora ÷ lançamentos até agora". No começo a linha pula muito; depois fica quase reta perto de 0,5.
::s
x <- sample(c(0, 1), n, replace = TRUE)     # 1 = cara
freq <- cumsum(x) / (1:n)                    # frequência relativa acumulada
plot(freq, type = "l"); abline(h = 0.5, lty = 2)
::p cumsum(x) | número de caras até cada lançamento.
::p 1:n | número de lançamentos até cada momento.
::p abline(h = 0.5) | a probabilidade teórica, para comparar.
::e
set.seed(1)
x <- sample(c(0, 1), 1000, replace = TRUE)
freq <- cumsum(x) / (1:1000)
round(freq[c(1, 2, 3, 4, 10, 100, 1000)], 3)
plot(freq, type = "l", ylim = c(0, 1), xlab = "Lançamentos", ylab = "Frequência de caras")
abline(h = 0.5, lty = 2, col = "red")
::r
[1] 0.000 0.500 0.333 0.250 0.400 0.510 0.498
(e o gráfico aparece na aba Plots)
::a A LGN não diz que "depois de muitas coroas vem cara para compensar": cada lançamento continua com 50%. O que acontece é que os primeiros resultados passam a pesar cada vez menos na média.
::v Simulação: frequência relativa com mean() | sum(), mean(), prod() e cumsum() | plot() | C:Lei dos Grandes Números
@@ Teorema de Bayes com vetores
::k base
::f Análise Estatística · Aula 1
::o Receita para aplicar o Teorema de Bayes no R: guarde as probabilidades a priori P(Ci) e as condicionais P(A|Ci) em vetores e faça a conta para todos os casos de uma vez.
::q Primeiro multiplica (prior × chance de A em cada caso), depois divide pela soma (probabilidade total de A). O resultado são as probabilidades "atualizadas" depois de saber que A aconteceu.
::s
prior <- c(...)            # P(C1), P(C2), ...
verossim <- c(...)         # P(A | C1), P(A | C2), ...
conjunta <- prior * verossim
posterior <- conjunta / sum(conjunta)   # P(Ci | A)
::p prior * verossim | P(A ∩ Ci) para cada i.
::p sum(conjunta) | P(A): probabilidade total.
::p conjunta / sum(conjunta) | Bayes: P(Ci | A).
::e
# exemplo da empresa: bons, médios e fracos
prior <- c(B = 0.25, M = 0.50, F = 0.25)
aprov <- c(B = 0.80, M = 0.50, F = 0.20)   # P(aprovado | grupo)
sum(prior * aprov)                          # P(aprovado)
prior * aprov / sum(prior * aprov)          # P(grupo | aprovado)
# exemplo das urnas
p_urna <- c(C1 = 2/5, C2 = 2/5, C3 = 1/5)
p_branca <- c(C1 = 1/2, C2 = 1/3, C3 = 1)
round(p_urna * p_branca / sum(p_urna * p_branca), 3)
::r
[1] 0.5
  B   M   F 
0.4 0.5 0.1 
   C1    C2    C3 
0.375 0.250 0.375 
::a Os resultados (posteriores) sempre somam 1.
::a Confira com os slides: P(F | aprovado) = 0,10 e P(C3 | branca) = 3/8 = 0,375.
::v sum(), mean(), prod() e cumsum() | names() | C:Teorema de Bayes
@@ numeric() (vetor vazio para guardar resultados)
::k base
::f Análise Estatística · Atividade 6 (simulação do TLC)
::o Cria um vetor numérico vazio (ou de zeros) para ir guardando os resultados de cada volta de um laço for.
::q É a "planilha em branco": a cada repetição você escreve o resultado numa nova posição: media[i] <- mean(amostra).
::s
resultados <- numeric()        # vazio
resultados <- numeric(1000)    # já com 1000 zeros (mais rápido)
for (i in 1:1000) { resultados[i] <- ... }
::p numeric() | vetor de tamanho 0, que cresce conforme você preenche.
::p numeric(n) | vetor com n zeros já reservados.
::p resultados[i] <- valor | guarda o valor da volta i.
::e
numeric(3)
set.seed(10)
medias <- numeric(5)
for (i in 1:5) {
  medias[i] <- mean(sample(1:6, 10, replace = TRUE))
}
medias
::r
[1] 0 0 0
[1] 3.0 4.3 2.8 3.1 3.0
::a Esquecer de criar o vetor antes do laço dá erro "objeto não encontrado" na primeira volta.
::v for | Simulação do Teorema do Limite Central | rep()

@G Distribuições de probabilidade | #2a9d8f | As funções d, p, q e r do R para as distribuições da aula: binomial, Poisson, uniforme e normal. d = probabilidade (densidade), p = acumulada, q = quantil, r = sorteio. Material: Análise Estatística, Aula 2 e Atividade 4.
@@ dbinom()
::k base (stats)
::f Análise Estatística · Aula 2 · Atividade 4
::o Calcula P(X = x) numa distribuição binomial: a probabilidade de EXATAMENTE x sucessos em n tentativas independentes, com probabilidade de sucesso p em cada uma.
::q 5 comprimidos verificados, cada um com 80% de chance de estar dentro da especificação. Qual a chance de exatamente 3 estarem ok? dbinom(3, 5, 0.8).
::s
dbinom(x, size, prob)
::p x | número de sucessos que você quer (pode ser um vetor: 0:5).
::p size | n, o número de tentativas.
::p prob | p, a probabilidade de sucesso em cada tentativa.
::p Fórmula | P(X = x) = C(n, x) p^x (1 − p)^(n − x).
::e
dbinom(3, size = 5, prob = 0.8)          # exemplo do slide 24
choose(5, 3) * 0.8^3 * 0.2^2             # a mesma conta pela fórmula
round(dbinom(0:5, size = 5, prob = 0.8), 4)
sum(dbinom(0:5, size = 5, prob = 0.8))   # soma de todas = 1
::r
[1] 0.2048
[1] 0.2048
[1] 0.0003 0.0064 0.0512 0.2048 0.4096 0.3277
[1] 1
::a dbinom(x, 1, p) é a distribuição de Bernoulli (uma tentativa só).
::a "Pelo menos", "no máximo" e "entre" pedem soma de várias probabilidades: use pbinom() ou sum(dbinom(...)).
::v pbinom() | qbinom() | rbinom() | choose() | C:Distribuições de Bernoulli e binomial
@@ pbinom()
::k base (stats)
::f Análise Estatística · Atividade 4
::o Calcula a probabilidade acumulada P(X ≤ q) da binomial: a chance de NO MÁXIMO q sucessos.
::q pbinom(2, 5, 0.8) soma P(X=0) + P(X=1) + P(X=2) de uma vez.
::s
pbinom(q, size, prob)                       # P(X <= q)
pbinom(q, size, prob, lower.tail = FALSE)   # P(X > q)
::p q | o valor até onde acumular.
::p lower.tail = FALSE | devolve a cauda de cima: P(X > q). É o mesmo que 1 − pbinom(q, ...).
::e
pbinom(2, size = 5, prob = 0.8)                       # P(X <= 2)
sum(dbinom(0:2, size = 5, prob = 0.8))                # conferindo
1 - pbinom(2, size = 5, prob = 0.8)                   # P(X >= 3)
pbinom(2, size = 5, prob = 0.8, lower.tail = FALSE)   # o mesmo
::r
[1] 0.05792
[1] 0.05792
[1] 0.94208
[1] 0.94208
::a Em variáveis discretas, cuidado com < e ≤: P(X < 3) = P(X ≤ 2) = pbinom(2, ...). P(X ≥ 3) = 1 − pbinom(2, ...).
::v dbinom() | qbinom() | C:Função de probabilidade e função acumulada
@@ qbinom()
::k base (stats)
::f Análise Estatística · Atividade 4
::o Faz o caminho inverso do pbinom(): dada uma probabilidade acumulada p, devolve o MENOR valor x tal que P(X ≤ x) ≥ p (o quantil).
::q "Até quantos sucessos eu acumulo pelo menos 50% de chance?" Para b(5; 0,8), a resposta é 4.
::s
qbinom(p, size, prob)
::p p | a probabilidade acumulada desejada (entre 0 e 1).
::p Resultado | min{x : P(X ≤ x) ≥ p}.
::e
qbinom(0.5, size = 5, prob = 0.8)
round(pbinom(0:5, size = 5, prob = 0.8), 4)   # conferindo: o primeiro valor >= 0,5 é o do x = 4
qbinom(c(0.1, 0.9), size = 20, prob = 0.5)
::r
[1] 4
[1] 0.0003 0.0067 0.0579 0.2627 0.6723 1.0000
[1]  7 13
::a Em distribuições discretas o quantil "pula" de um valor inteiro para o outro; por isso o resultado é sempre um número inteiro de sucessos.
::v pbinom() | dbinom() | qnorm()
@@ rbinom()
::k base (stats)
::f Análise Estatística · Atividade 4
::o Sorteia valores de uma distribuição binomial: cada número sorteado é a quantidade de sucessos em n tentativas.
::q rbinom(10, 5, 0.8) simula 10 vezes a inspeção de 5 comprimidos e mostra quantos estavam ok em cada inspeção.
::s
rbinom(n, size, prob)
::p n | quantos valores sortear (atenção: aqui n NÃO é o número de tentativas).
::p size | número de tentativas de cada sorteio.
::p prob | probabilidade de sucesso.
::e
set.seed(123)
rbinom(10, size = 5, prob = 0.8)
x <- rbinom(10000, size = 5, prob = 0.8)
mean(x)          # perto de E(X) = n p = 4
var(x)           # perto de Var(X) = n p (1 - p) = 0,8
::r
 [1] 5 3 4 3 3 5 4 3 4 4
[1] 4.0101
[1] 0.7868767
::a Cuidado com os nomes: em rbinom(n, size, prob), n é a quantidade de sorteios e size é o número de tentativas.

::q A aula dura entre 50 e 52 minutos, todos os tempos igualmente prováveis. Qual a chance de durar mais de 51,5 min? 1 − punif(51.5, 50, 52) = 0,25.

(52 - 51.5) / (52 - 50)               # pela fórmula
qunif(0.7, min = 50, max = 52)        # 70% das aulas duram até...

@@ Padronização: escore z
::k base
::f Análise Estatística · Aula 2
::o Receita para transformar um valor de X ~ N(μ, σ²) no escore z = (x − μ)/σ: quantos desvios padrão ele está acima ou abaixo da média. Assim se usa a tabela da normal padrão.
::q z = 1,8 significa "1,8 desvio padrão acima da média". Qualquer normal vira a mesma normal padrão N(0, 1) depois dessa conta.
::s
z <- (x - mu) / sigma
pnorm(z)          # = pnorm(x, mean = mu, sd = sigma)
::p x − μ | distância até a média.
::p ÷ σ | mede essa distância em "desvios padrão".
::e
mu <- 120; sigma <- 5
z <- (129 - mu) / sigma
z
pnorm(z)                          # P(Z <= 1,8): tabela 0,9641
pnorm(129, mean = 120, sd = 5)    # sem padronizar: dá igual
round((c(85, 100, 130) - 100) / 15, 2)   # QI 85, 100 e 130 em escore z

[1] 1.8
[1] 0.9640697
[1] 0.9640697
[1] -1  0  2
::a A função scale(x) faz essa conta para um vetor inteiro usando a média e o desvio padrão da própria amostra.

@@ Esperança e variância de uma v.a. discreta
::k base
::f Análise Estatística · Aula 2
::o Receita para calcular E(X) = Σ x·p(x) e Var(X) = Σ (x − E(X))²·p(x) a partir da tabela de valores e probabilidades de uma variável aleatória discreta.
::q A seguradora ganha R$ 1.000 em 97% dos carros e perde R$ 29.000 em 3%. O lucro médio por carro é a soma "valor × chance": E(X) = R$ 100.
::s
x <- c(...)          # valores possíveis
p <- c(...)          # probabilidades (somam 1)
E <- sum(x * p)
V <- sum((x - E)^2 * p)
::p sum(x * p) | esperança (média "teórica").
::p sum((x − E)^2 * p) | variância; sqrt() dá o desvio padrão.
::e
lucro <- c(1000, -29000); p <- c(0.97, 0.03)
sum(lucro * p)                    # seguradora: E(X)
face <- 1:6; pf <- rep(1/6, 6)
E <- sum(face * pf); E            # dado honesto: 3,5
V <- sum((face - E)^2 * pf); V    # 2,9167
sum(face^2 * pf) - E^2            # Var = E(X^2) - E(X)^2
::r
[1] 100
[1] 3.5
[1] 2.916667
[1] 2.916667
::a Confira sempre que sum(p) == 1 antes de calcular.
::a Para as distribuições prontas há atalhos: binomial E = np e Var = np(1 − p); Poisson E = Var = λ.
::v sum(), mean(), prod() e cumsum() | var() e sd() | C:Esperança e variância de uma variável aleatória
